<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenFox</title>
    <link rel="stylesheet" href="./offline.css" />
  </head>
  <body>
    <div class="drag" aria-hidden="true"></div>
    <main>
      <h1 id="title"></h1>
      <p id="message"></p>
      <p class="url" id="url" hidden></p>
      <div class="hint" id="hint-box">
        <p id="hint"></p>
        <code id="settings"></code>
        <pre id="example"></pre>
      </div>
      <button type="button" id="retry"></button>
    </main>
    <script src="./offline.js"></script>
  </body>
</html>
