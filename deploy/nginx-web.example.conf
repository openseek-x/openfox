# OpenFox web workbench behind nginx (example). The desktop app loads this same
# URL (OPENFOX_DESKTOP_WEB_URL or web_url in desktop-settings.json).
#
# - Serves the static build of apps/web (pnpm --filter @openfox/web build).
# - Proxies /api/ to openfox-server unchanged (the server mounts its API at /api/).
# - Production must terminate HTTPS here or in front of it; this example
#   listens on loopback only.
# WebSocket upgrades get "Connection: upgrade"; everything else keeps the
# upstream connection alive (empty Connection header).
map $http_upgrade $openfox_connection {
    default upgrade;
    ""      "";
}

server {
    listen 127.0.0.1:18081;
    server_name _;

    root /srv/openfox/web/current;
    index index.html;

    # Document and avatar uploads are capped at 20 MiB by the server.
    client_max_body_size 21m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The daemon device channel (/api/v1/device/connect) is a WebSocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $openfox_connection;
        # Realtime events use Server-Sent Events: no buffering, long reads.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Hashed build assets never change.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # nginx does not inherit server-level add_header once a location sets its own; repeat the security headers.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        try_files $uri =404;
    }

    # Client-side routes fall back to index.html, which must not be cached.
    location / {
        add_header Cache-Control "no-cache" always;
        # Same as above: repeat the security headers.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        try_files $uri /index.html;
    }
}
