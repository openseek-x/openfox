services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: openfox
      POSTGRES_USER: openfox_migrate
      POSTGRES_PASSWORD: change-me-for-local-use-only
    volumes:
      - openfox-postgres:/var/lib/postgresql/data

  openfox:
    image: openfox:dev
    depends_on:
      - postgres
    environment:
      OPENFOX_ENV: development
      OPENFOX_SERVER_LISTEN: 0.0.0.0:8080
      OPENFOX_SERVER_PUBLIC_URL: http://127.0.0.1:8080
      OPENFOX_DATABASE_URL_FILE: /run/secrets/openfox_database_url
      OPENFOX_STORAGE_ROOT: /var/lib/openfox
    volumes:
      - openfox-artifacts:/var/lib/openfox
    ports:
      - "127.0.0.1:8080:8080"
    secrets:
      - openfox_database_url

secrets:
  openfox_database_url:
    file: ./secrets/database.url

volumes:
  openfox-postgres:
  openfox-artifacts:
