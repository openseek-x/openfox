                    items: { $ref: '#/components/schemas/SpaceMemberDetail' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  # ===== /任务 =====

  # ===== Agent 与小队 =====
  # 说明：Agent 相关错误码（409 除特别说明外）：NAME_CONFLICT（名称重复）、VERSION_CONFLICT（乐观锁）、ARCHIVED（已归档不能修改）、
  # DEVICE_SCOPE_MISMATCH（电脑授权不允许目标空间 / 所有者）、SECRETS_UNAVAILABLE（未配置主密钥）、LIMIT_REACHED（数量上限）、
  # AGENT_CREW_MEMBERSHIP_CONFLICT（已是其他小队的专属成员）、CREW_LEADER_REQUIRED（不能移除队长）、
  # CREW_LEADER_SPACE_MISMATCH（换空间时队长不在新空间）、REPO_CONFLICT（仓库地址重复）；403 ACTION_FORBIDDEN；不可见一律 404 NOT_FOUND。
  /v1/organizations/{organizationID}/spaces/{spaceID}/agents:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
    get:
      operationId: listSpaceAgents
      summary: 空间内对当前成员可见的 Agent（共享的，或自己的私有 Agent；不含内置小助手）
      parameters:
        - { name: include_archived, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Agent 列表
          content:
            application/json:
              schema:
                type: object
                required: [agents]
                properties:
                  agents:
                    type: array
                    items: { $ref: '#/components/schemas/SpaceAgent' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createAgent
      summary: 新建 Agent（需空间管理权限）；配置为版本 1
      description: 默认可见性由前端决定（设置页 SHARED，其他入口 PRIVATE）。电脑授权必须 ACTIVE 且允许该空间与所有者。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentCreateRequest' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceAgent' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/agents/{agentID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - &agentIDParam { name: agentID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAgent
      summary: Agent 详情（含当前配置）；他人的私有 Agent 返回 404
      responses:
        '200':
          description: Agent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceAgent' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateAgent
      summary: 旧的修改接口（名称、说明、类型、可见性、归档），乐观锁用 version；资料类修改请用 /profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentUpdateRequest' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceAgent' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/agents/{agentID}/profile:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *agentIDParam
    patch:
      operationId: updateAgentProfile
      summary: 修改资料、触发开关与访问权限（乐观锁 profile_version，与配置版本链的 version 互不影响）
      description: |
        权限：共享 Agent = 空间管理权限或所有者；私有 Agent = 仅所有者（他人 404）；内置小助手 403。
        space_id：操作人还须能管理新空间；Agent 当前电脑授权须允许新空间（否则 409 DEVICE_SCOPE_MISMATCH）；
        会从其他空间的小队里移除该 Agent（若它是那些小队的指定队长则 409 CREW_LEADER_REQUIRED）。
        owner_user_id：须为组织 ACTIVE 成员且能读目标空间；PERSONAL 电脑授权须属于新所有者（否则 409 DEVICE_SCOPE_MISMATCH）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentProfilePatch' }
      responses:
        '200':
          description: 已更新（space_id 变化时响应里的 space_id 为新空间）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceAgent' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/agents/{agentID}/config-versions:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *agentIDParam
    get:
      operationId: listAgentConfigVersions
      summary: 配置版本历史（新到旧）
      responses:
        '200':
          description: 配置版本
          content:
            application/json:
              schema:
                type: object
                required: [config_versions]
                properties:
                  config_versions:
                    type: array
                    items: { $ref: '#/components/schemas/AgentConfigVersion' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createAgentConfigVersion
      summary: 新建配置版本（运行设置、电脑与 Runtime、Git 提交人都走这里；需传完整配置）
      description: |
        权限同 profile。expected_agent_version 是 Agent 的 version（不是 profile_version）。
        env_digest 由服务端计算：当前环境变量的 sha256(按名称排序的 name=sha256(value))，没有环境变量或无法解密时为空串；仅用于审计。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentConfigCreateRequest' }
      responses:
        '201':
          description: 已创建，返回 Agent（config 为新版本）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceAgent' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/agents/{agentID}/copy:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *agentIDParam
    post:
      operationId: copyAgent
      summary: 复制 Agent（Idempotency-Key 可选，操作名 agent.copy）
      description: |
        复制资料、当前配置（新 Agent 的配置版本 1）、环境变量（重新加密）与 Git 仓库；所有者为操作人，可见性 PRIVATE。
        需要能读源 Agent 并能管理该空间。名称缺省为「{name} 副本」，重名时自动加序号（指定名称重名则 409 NAME_CONFLICT）。
        源 Agent 有环境变量而未配置主密钥时 409 SECRETS_UNAVAILABLE。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 255 }
      responses:
        '201':
          description: 已复制
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceAgent' }
        '200':
          description: 幂等重放
          headers:
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceAgent' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/agents/{agentID}/stats:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *agentIDParam
    get:
      operationId: getAgentStats
      summary: 统计（任务数 = 该 Agent 为处理人或执行者的未删除任务；token 用量 2b 起才有数据）
      responses:
        '200':
          description: 统计
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentStats' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/agents/{agentID}/runs:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *agentIDParam
    get:
      operationId: listAgentRuns
      summary: 运行历史（created_at desc, id desc；只含当前成员能看到的会话里的运行）
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - *cursorParam
      responses:
        '200':
          description: 运行
          content:
            application/json:
              schema:
                type: object
                required: [runs, next_cursor]
                properties:
                  runs:
                    type: array
                    items: { $ref: '#/components/schemas/AgentRunSummary' }
                  next_cursor: { type: [string, 'null'], description: null 表示没有下一页 }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/agents/{agentID}/mcp-servers/{serverID}/oauth/start:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *agentIDParam
      - { name: serverID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: startAgentMCPOAuth
      summary: 启动当前管理者的十分钟 PKCE 授权；同一连接的新授权替换旧尝试
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id: { type: string, maxLength: 1024 }
                client_secret: { type: string, maxLength: 2048, writeOnly: true }
      responses:
        '200':
          description: 由服务商发现元数据提供的 HTTPS 授权页
          content:
            application/json:
              schema:
                type: object
                required: [authorize_url]
                properties: { authorize_url: { type: string, format: uri } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/agents/{agentID}/mcp-servers/{serverID}/oauth/status:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *agentIDParam
      - { name: serverID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAgentMCPOAuthStatus
      summary: 仅当前授权发起人可读，不返回凭据
      responses:
        '200':
          description: 授权尝试的状态
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [pending, exchanging, failed, connected, expired, missing] }
  /v1/mcp/oauth/wait:
    get:
      operationId: waitForAgentMCPOAuth
      summary: 等待授权地址时的同源弹窗
      responses:
        '200': { description: 等待页面, content: { text/plain: { schema: { type: string } } } }
  /v1/mcp/oauth/callback:
    get:
      operationId: completeAgentMCPOAuth
      summary: 校验授权人、一次性 state、PKCE、目标及版本；发现工具后保存绑定
      parameters:
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code, in: query, schema: { type: string, maxLength: 4096 } }
        - { name: iss, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '200': { description: 授权完成, content: { text/plain: { schema: { type: string } } } }
        '400': { description: 被拒绝、过期、重复或不属于当前用户的回调 }
  /v1/organizations/{organizationID}/spaces/{spaceID}/agents/{agentID}/mcp-servers:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *agentIDParam
    get:
      operationId: listAgentMCPServers
      summary: 查看已绑定的连接与可用操作
      responses:
        '200':
          description: 查看已绑定的连接与可用操作
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentMCPList' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/agents/{agentID}/mcp-servers/{serverID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *agentIDParam
      - { name: serverID, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: putAgentMCPServer
      summary: 校验并保存连接，公网地址保存前完成发现
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentMCPSave' }
      responses:
        '200':
          description: 校验并保存连接，公网地址保存前完成发现
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentMCPServer' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteAgentMCPServer
      summary: 移除连接及凭据
      parameters:
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '204':
          description: 移除连接及凭据
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/agents/{agentID}/mcp-servers/discover:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *agentIDParam
    post:
      operationId: discoverAgentMCPServer
      summary: 使用提交的配置读取公网 HTTPS 工具与资源清单
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentMCPConfig' }
      responses:
        '200':
          description: 使用提交的配置读取公网 HTTPS 工具与资源清单
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentMCPManifest' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/agents/{agentID}/mcp-servers/inventory:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *agentIDParam
    get:
      operationId: getAgentMCPInventory
      summary: 查看本人设备最近心跳上报的 Runtime MCP
      responses:
        '200':
          description: 查看本人设备最近心跳上报的 Runtime MCP
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentMCPInventory' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/agents/{agentID}/mcp-servers/inventory/refresh:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *agentIDParam
    post:
      operationId: refreshAgentMCPInventory
      summary: 重新读取本人设备最近的 Runtime MCP 清单
      responses:
        '200':
          description: 重新读取本人设备最近的 Runtime MCP 清单
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentMCPInventory' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/agents/{agentID}/mcp-servers/inherited/{name}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *agentIDParam
      - { name: name, in: path, required: true, schema: { type: string, pattern: '^[a-zA-Z0-9_-]{1,64}$' } }
    put:
      operationId: setAgentInheritedMCP
      summary: 绑定或取消本人设备上指定的 Runtime MCP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentMCPInheritedChange' }
      responses:
        '200':
          description: 绑定或取消本人设备上指定的 Runtime MCP
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentMCPInventory' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/agents/{agentID}/env-vars:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *agentIDParam
    get:
      operationId: listAgentEnvVars
      summary: 环境变量（Agent 所有者与组织 OWNER / ADMIN 可看原值，其他人 value 为 null，界面显示遮盖值）
      description: 未配置主密钥时不报错：secrets_available=false，所有 value 为 null。
      responses:
        '200':
          description: 环境变量（按名称排序）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentEnvVarList' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/agents/{agentID}/env-vars/{name}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *agentIDParam
      - { name: name, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]{0,127}$' } }
    put:
      operationId: putAgentEnvVar
      summary: 新建或修改环境变量（权限同 profile）
      description: |
        不带 version = 新建（已存在 409 NAME_CONFLICT）；带 version = 修改（不存在 404，版本不一致 409 VERSION_CONFLICT）。
        每个 Agent 最多 100 个（409 LIMIT_REACHED），值最长 8 KiB（400）。值加密落库，审计不记录值。未配置主密钥 409 SECRETS_UNAVAILABLE。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string, maxLength: 8192 }
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 已保存（value 为保存的原值）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentEnvVar' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteAgentEnvVar
      summary: 删除环境变量（权限同 profile）
      responses:
        '204': { description: 已删除 }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/agents/{agentID}/repos:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *agentIDParam
    get:
      operationId: listAgentRepos
      summary: Git 仓库（position, created_at 排序；为空表示继承空间设置）
      responses:
        '200':
          description: 仓库
          content:
            application/json:
              schema:
                type: object
                required: [repos]
                properties:
                  repos:
                    type: array
                    items: { $ref: '#/components/schemas/AgentRepo' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createAgentRepo
      summary: 添加仓库（权限同 profile；最多 20 个；Idempotency-Key 可选，操作名 agent_repo.create）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentRepoCreateRequest' }
      responses:
        '201':
          description: 已添加
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRepo' }
        '200':
          description: 幂等重放
          headers:
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRepo' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/agents/{agentID}/repos/{repoID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *agentIDParam
      - { name: repoID, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateAgentRepo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentRepoPatch' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRepo' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteAgentRepo
      responses:
        '204': { description: 已删除 }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/agent-favorites:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    put:
      operationId: addAgentFavorite
      summary: 收藏到侧栏（个人偏好，幂等）；目标须可见（否则 404），已归档 409 ARCHIVED
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentFavoriteTarget' }
      responses:
        '204': { description: 已收藏 }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: removeAgentFavorite
      summary: 取消收藏（幂等；agent_id 与 crew_id 只能传一个）
      parameters:
        - { name: agent_id, in: query, schema: { type: string, format: uuid } }
        - { name: crew_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '204': { description: 已取消 }
        '400': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/agent-directory:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listAgentDirectory
      summary: 组织级 Agent 与小队目录；Agent 与小队各最多 500 条，超出 truncated=true；小队的专属 Agent 不单独出现
      parameters:
        - { name: archived, in: query, description: true 只看已归档, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: 目录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentDirectory' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/agent-directory/pins:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    put:
      operationId: setAgentDirectoryPin
      summary: 目录置顶 / 取消置顶（个人偏好，幂等；与侧栏收藏是两个概念）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pinned]
              properties:
                agent_id: { type: string, format: uuid }
                crew_id: { type: string, format: uuid }
                pinned: { type: boolean }
      responses:
        '200':
          description: 结果
          content:
            application/json:
              schema:
                type: object
                required: [pinned]
                properties:
                  pinned: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/crews:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
    post:
      operationId: createCrew
      summary: 新建小队（需空间管理权限；名称 + 队长 + 空间）
      description: |
        队长自动排第一；总人数（含队长与真人成员）≤ 32。Agent 成员须是同一空间、当前成员可见、未归档的非内置 Agent；
        真人成员须是组织 ACTIVE 成员且能读该空间。兼容旧请求：不传 leader_agent_id 时取 agent_ids[0]。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrewCreateRequest' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Crew' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/crews/{crewID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - &crewIDParam { name: crewID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getCrew
      summary: 小队详情（他人的私有小队 404）
      responses:
        '200':
          description: 小队
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Crew' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateCrew
      summary: 修改小队（需空间管理权限；乐观锁 version）
      description: |
        leader_agent_id 须是该小队的 Agent 成员（否则 400），设置后队长排第一。
        space_id：操作人须能管理新空间；队长须在新空间（否则 409 CREW_LEADER_SPACE_MISMATCH）；不在新空间的 Agent 成员被移除。
        owner_user_id：须为组织 ACTIVE 成员且能读（新）空间。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrewPatch' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Crew' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/crews/{crewID}/members:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *crewIDParam
    post:
      operationId: addCrewMembers
      summary: 添加成员（幂等：已是成员的忽略；总人数 ≤ 32，超出 409 LIMIT_REACHED）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrewMembersRequest' }
      responses:
        '200':
          description: 小队
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Crew' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/crews/{crewID}/members/agents/{agentID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *crewIDParam
      - *agentIDParam
    patch:
      operationId: updateCrewAgentMember
      summary: 设置专属成员（一个 Agent 至多是一个小队的专属成员，冲突 409 AGENT_CREW_MEMBERSHIP_CONFLICT）
      description: 专属 Agent 不出现在目录与成员页签、不能单聊、不能被单独指派为任务处理人（指派小队不受影响）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [exclusive]
              properties:
                exclusive: { type: boolean }
      responses:
        '200':
          description: 小队
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Crew' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/crews/{crewID}/members/{kind}/{memberID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *crewIDParam
      - { name: kind, in: path, required: true, schema: { type: string, enum: [agent, human] } }
      - { name: memberID, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: removeCrewMember
      summary: 移除成员（幂等：不是成员也返回 204；队长 409 CREW_LEADER_REQUIRED）
      responses:
        '204': { description: 已移除 }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/contacts:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listContacts
      summary: 成员页签：Agent 与小队按可读空间分组，真人为组织 ACTIVE 成员；总条目上限 1000，超出 truncated=true
      description: |
        分组顺序：SPACE（按空间名称）→ UNASSIGNED（未归属空间的 Agent，目前恒为空，空组不输出）→ HUMANS。
        组内先小队后 Agent；我创建的优先 → 我与它最近会话时间 → 名称。不含已归档、内置小助手与小队专属 Agent。
      responses:
        '200':
          description: 分组
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contacts' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/assistant:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: getAssistant
      summary: 本人的小助手（还没创建时 assistant 为 null）
      responses:
        '200':
          description: 小助手
          content:
            application/json:
              schema:
                type: object
                required: [assistant]
                properties:
                  assistant:
                    oneOf:
                      - { $ref: '#/components/schemas/SpaceAgent' }
                      - { type: 'null' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      operationId: ensureAssistant
      summary: 确保小助手存在并运行在指定电脑与 Runtime 上（幂等；无可放置空间 409 NO_ASSISTANT_SPACE）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [computer_id, grant_id]
              properties:
                computer_id: { type: string, format: uuid }
                grant_id: { type: string, format: uuid }
                runtime: { type: string, description: 缺省 codex }
                model: { type: string, description: 缺省 default }
      responses:
        '200':
          description: 小助手
          content:
            application/json:
              schema:
                type: object
                required: [assistant]
                properties:
                  assistant: { $ref: '#/components/schemas/SpaceAgent' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/conversation-workspace-options:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: getConversationWorkspaceOptions
      parameters:
        - { in: query, name: agent_id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: source_conversation_id, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 会话工作目录选项, content: { application/json: { schema: { $ref: '#/components/schemas/ConversationWorkspaceOptions' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/conversation-workspace-recents:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    delete:
      operationId: forgetConversationDirectory
      parameters:
        - { in: query, name: agent_id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: device_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [directory]
              properties:
                directory: { type: string, maxLength: 1024 }
      responses:
        '204': { description: 移除本人的最近目录 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '400': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/assistant/work-directory:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: getAssistantDirectory
      responses:
        '200': { description: 仅本人电脑的已登记目录, content: { application/json: { schema: { $ref: '#/components/schemas/AssistantDirectorySettings' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      operationId: setAssistantDirectory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, device_id, directory]
              properties:
                version: { type: integer, minimum: 1 }
                device_id: { type: string, format: uuid }
                directory: { type: string }
      responses:
        '200': { description: 已保存小助手默认目录, content: { application/json: { schema: { $ref: '#/components/schemas/AssistantDirectorySettings' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/assistant/sessions:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listAssistantSessions
      summary: 小助手会话选择器（含已归档）
      responses:
        '200':
          description: 会话
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/AssistantSession' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/conversations/{conversationID}/session:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: conversationID, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateAssistantSession
      summary: 小助手会话重命名 / 归档（title 为空串表示清除标题）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200 }
                archived: { type: boolean }
      responses:
        '200':
          description: 会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantSession' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/conversations/{conversationID}/runs/{runID}/retry:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: conversationID, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: runID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: retryAssistantRun
      summary: 本人在自己小助手的会话中重试由本人及当前 Agent 执行的失败运行，复用原消息和附件
      description: 使用与发送消息相同的登录、组织和 CSRF 校验。原运行 ID 是幂等键；重复请求不重复入队。不新增用户消息。
      responses:
        '204': { description: 已入队或此前已受理 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/conversations/{conversationID}/messages/{messageID}/confirm:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: conversationID, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: messageID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: confirmAssistantProposal
      summary: 确认小助手草稿（创建 Agent 或任务；重复确认 409 PROPOSAL_RESOLVED）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssistantProposalConfirmRequest' }
      responses:
        '200':
          description: 草稿消息与执行结果消息
          content:
            application/json:
              schema:
                type: object
                required: [proposal, executed]
                properties:
                  proposal: { type: object, additionalProperties: true }
                  executed: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/conversations/{conversationID}/messages/{messageID}/proposal:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: conversationID, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: messageID, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: cancelAssistantProposal
      summary: 取消小助手草稿
      responses:
        '200':
          description: 草稿消息
          content:
            application/json:
              schema:
                type: object
                required: [proposal]
                properties:
                  proposal: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/invites:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listInvitations
      summary: 邀请列表（需组织管理权限）
      responses:
        '200':
          description: 邀请
          content:
            application/json:
              schema:
                type: object
                required: [invitations]
                properties:
                  invitations:
                    type: array
                    items: { $ref: '#/components/schemas/Invitation' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createInvitation
      summary: 邀请成员（需组织管理权限；响应不含邀请令牌，令牌经独立渠道投递）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string }
                role: { $ref: '#/components/schemas/OrganizationRole' }
                space_ids: { type: array, maxItems: 50, items: { type: string, format: uuid }, description: 接受后加入的活跃空间（必须是邀请人能读到的空间） }
      responses:
        '201':
          description: 已创建；邀请邮件在响应前发送，结果见 delivery_status（ALREADY_MEMBER 409 = 该邮箱已是成员）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/invites/{inviteID}/revoke:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: inviteID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: revokeInvitation
      responses:
        '200':
          description: 已撤销
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/invites/{inviteID}/resend:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: inviteID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: resendInvitation
      summary: 重新发送邀请（换新令牌，旧邮件里的链接失效，有效期顺延 7 天）；1 分钟内重复返回 429 RESEND_COOLDOWN
      responses:
        '200':
          description: 已重新发送；结果见 delivery_status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/invite-link:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: getInviteLink
      summary: 组织邀请链接（需组织管理权限；没有密钥配置时 503 SECRETS_UNAVAILABLE）
      responses:
        '200':
          description: 邀请链接
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteLink' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    put:
      operationId: putInviteLink
      summary: 保存启用状态、角色与加入空间；首次保存时生成链接（version 传 0）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, role, space_ids, version]
              properties:
                enabled: { type: boolean }
                role: { type: string, enum: [MEMBER, GUEST] }
                space_ids: { type: array, maxItems: 50, items: { type: string, format: uuid } }
                version: { type: integer, minimum: 0 }
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteLink' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/invite-link/reset:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    post:
      operationId: resetInviteLink
      summary: 重置邀请链接（旧链接立即失效）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 已重置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteLink' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/invite-links/preview:
    post:
      operationId: previewInviteLink
      summary: 加入页预览（需登录；链接无效、已停用或组织已删除时 404）。令牌放在请求体里
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: 预览
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteLinkPreview' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/invite-links/join:
    post:
      operationId: joinInviteLink
      summary: 凭邀请链接加入组织（需登录）；已是成员时 status = ALREADY_MEMBER、不做改动
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: 已加入
          content:
            application/json:
              schema:
                type: object
                required: [organization_id, role, status]
                properties:
                  organization_id: { type: string, format: uuid }
                  role: { type: string, enum: [MEMBER, GUEST, OWNER, ADMIN] }
                  status: { type: string, enum: [JOINED, ALREADY_MEMBER] }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/get-started:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: getGetStartedProgress
      summary: 开始使用进度（按组织计算，所有成员可读；步骤完成状态由服务端根据现有数据判断）
      responses:
        '200':
          description: 进度
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GetStartedProgress' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/organizations/{organizationID}/settings:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: getOrganizationSettings
      summary: 组织设置（所有成员可读；leave_blocked 用于「离开组织」的禁用说明）
      responses:
        '200':
          description: 组织设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationSettings' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateOrganizationSettings
      summary: 修改组织设置（OWNER / ADMIN；乐观锁 version）
      description: 错误码：SLUG_INVALID / SLUG_RESERVED（400）、SLUG_TAKEN（409）、VERSION_CONFLICT（409）、ACTION_FORBIDDEN（403）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationSettingsPatch' }
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationSettings' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/settings/lowest-priority-count:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: getLowestPriorityCount
      summary: 「最低」优先级的任务数（切换为 4 级前确认用；OWNER / ADMIN）
      responses:
        '200':
          description: 任务数
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: { type: integer }
        '403': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/leave:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    post:
      operationId: leaveOrganization
      summary: 离开组织（再次访问需要重新邀请）；唯一所有者 409 OWNER_REQUIRED，只剩自己 409 SOLE_MEMBER
      responses:
        '204': { description: 已离开 }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    delete:
      operationId: deleteOrganization
      summary: 删除组织（只有 OWNER；软删除，立即对所有人不可见；连带取消全部活跃 Run、归档 Agent、吊销电脑授权）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm_name]
              properties:
                confirm_name: { type: string, description: 必须与组织名完全一致（区分大小写、不去空白），否则 400 CONFIRM_MISMATCH }
      responses:
        '204': { description: 已删除 }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/invites/{inviteID}/accept:
    parameters:
      - { name: inviteID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: acceptInvitation
      summary: 接受邀请（已登录时以当前账号接受；未登录且是新账号时须提供 password）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                password: { type: string }
      responses:
        '200':
          description: 已接受
          content:
            application/json:
              schema:
                type: object
                required: [user_id, organization_id, role, status]
                properties:
                  user_id: { type: string, format: uuid }
                  organization_id: { type: string, format: uuid }
                  role: { $ref: '#/components/schemas/OrganizationRole' }
                  status: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  # ===== /Agent 与小队 =====

  # ===== 电脑与事件 =====
  # 电脑（设备）管理。电脑是跨组织的物理机器，组织通过授权（grant）使用它。
  # 可见性（列表、详情及其子资源）：只列当前组织 ACTIVE 授权的电脑；
  #   ORGANIZATION 授权 = 非访客成员可见；SPACE 授权 = 该空间可读者可见（私有空间需有效空间成员，SHARED 空间对非访客可读）；
  #   PERSONAL 授权 = 仅授权对象本人可见；电脑所有者始终可见自己的电脑。不可见、跨租户、已移除一律 404 NOT_FOUND。
  # 在线（online）= 电脑 ACTIVE、授权 ACTIVE、且 90 秒内有心跳（与派发判定一致）。
  /v1/organizations/{organizationID}/devices:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listDevices
      summary: 电脑列表（按注册时间升序，keyset 游标）
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
        - { name: cursor, in: query, description: 上一页的 next_cursor，原样回传, schema: { type: string } }
      responses:
        '200':
          description: 电脑列表
          content:
            application/json:
              schema:
                type: object
                required: [devices, next_cursor]
                properties:
                  devices:
                    type: array
                    items: { $ref: '#/components/schemas/Device' }
                  next_cursor: { type: [string, 'null'], description: null 表示没有下一页 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/devices/center:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: getDeviceCenter
      summary: 当前中心地址（与签发安装令牌时写进令牌的地址一致）
      description: |
        桌面端据此判断本机注册的中心地址是否已过期。组织成员即可读取（与电脑列表一致）；
        非成员 404（含跨租户）。center_url 已归一化（http(s) 绝对地址，无末尾 /）。
      responses:
        '200':
          description: 当前中心地址
          content:
            application/json:
              schema:
                type: object
                required: [center_url]
                properties:
                  center_url: { type: string }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  # 签发注册令牌已移到「连接电脑与 Runtime」分区（新增 scope / install_token / command）。
  /v1/organizations/{organizationID}/devices/{deviceID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - &deviceIDParam { name: deviceID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getDevice
      summary: 电脑详情（含绑定的 Agent）
      responses:
        '200':
          description: 电脑详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceDetail' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateDevice
      summary: 修改电脑名称与并发上限（仅电脑所有者；settings_version 乐观锁）
      description: |
        非所有者、电脑不在当前组织的有效授权内，一律 404 NOT_FOUND。settings_version 不一致返回 409 VERSION_CONFLICT。
        并发上限低于当前已占用数时允许保存，只影响后续派发。心跳不改变 settings_version。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceUpdateRequest' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: removeDevice
      summary: 移除机器（仅电脑所有者；吊销电脑在所有组织的授权与会话）
      description: |
        当前组织仍有绑定这台电脑的未归档 Agent 时返回 409 DEVICE_HAS_ACTIVE_AGENTS（先调用 removal-blockers 查看，
        解绑或归档后再移除）。可见但不是所有者返回 403 FORBIDDEN。
      responses:
        '204': { description: 已移除 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/devices/{deviceID}/scope:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *deviceIDParam
    post:
      operationId: updateDeviceScope
      summary: 修改电脑在本组织的可见范围（仅电脑所有者；version = permission_version）
      description: PERSONAL 只能授权给自己（user_id 必须是本人）；SPACE 需传 space_id（ACTIVE 空间）；ORGANIZATION 两者都不传。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, version]
              properties:
                scope: { $ref: '#/components/schemas/DeviceGrantScope' }
                user_id: { type: string, format: uuid }
                space_id: { type: string, format: uuid }
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/devices/{deviceID}/removal-blockers:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *deviceIDParam
    get:
      operationId: getDeviceRemovalBlockers
      summary: 阻止移除机器的 Agent（当前组织绑定这台电脑的未归档 Agent，最多返回 200 个）
      responses:
        '200':
          description: 阻断项
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceRemovalBlockers' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/devices/{deviceID}/remove-from-organization:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *deviceIDParam
    post:
      operationId: removeDeviceFromOrganization
      summary: 从组织移除电脑（电脑所有者或组织 OWNER / ADMIN）
      description: |
        同一事务内：归档本组织绑定这台电脑的 Agent；取消这些 Agent 的活跃 Run（QUEUED 直接结束为 CANCELED，
        PREPARING / RUNNING 置为 CANCEL_REQUESTED 并通知电脑）；吊销本组织对这台电脑的授权。电脑在其他组织的授权不受影响。
        可见但无权限返回 403 FORBIDDEN。
      responses:
        '200':
          description: 已移除
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceRemovalResult' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/devices/{deviceID}/replace:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *deviceIDParam
    post:
      operationId: replaceDevice
      summary: 把旧电脑记录上的 Agent 迁到这台电脑（替换电脑，仅两台电脑的所有者）
      description: |
        {deviceID} 是替换后的新电脑记录；请求体 replaced_device_id 是旧记录。重新连接会产生新的电脑记录，
        旧记录上的 Agent 仍指向旧记录，本接口把它们迁过来。同一事务内：取消旧记录上 Agent 的活跃 Run；
        为每个 Agent（含内置小助手）写入新配置版本（除电脑与授权外完整复制）；把 Agent 指向新记录；吊销旧记录在本组织的授权
        （旧记录在其他组织的授权不动）；写审计 device.replaced。调用者必须是两台电脑的所有者（组织 OWNER / ADMIN 也不行，返回 403 FORBIDDEN）。
        任一电脑在本组织没有有效授权或不可见返回 404（重复调用时旧授权已吊销，也是 404）；两个 ID 相同或请求体不合法返回 400。
        409：DEVICE_ONLINE 旧记录目前在线；GRANT_SCOPE_MISMATCH 两条授权的范围不完全相同；TOO_MANY_AGENTS 待迁移的 Agent 超过 200；
        VERSION_CONFLICT 迁移过程中 Agent 集合变化，重试即可。Agent 的目录映射名称在新电脑上是否存在不检查。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [replaced_device_id]
              properties:
                replaced_device_id: { type: string, format: uuid }
      responses:
        '200':
          description: 已迁移
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceReplacementResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/devices/{deviceID}/unbind-agents:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *deviceIDParam
    post:
      operationId: unbindDeviceAgents
      summary: 解绑 Agent（仅电脑所有者）
      description: |
        Agent 的配置版本必须指向一台电脑，因此「解绑」实现为归档这些 Agent 并取消它们的活跃 Run（规则同 remove-from-organization），
        电脑本身保留在组织内。agent_ids 缺省或为空数组 = 全部绑定这台电脑的未归档 Agent；
        列表中已归档或不绑定这台电脑的 Agent 被忽略（幂等）。可见但不是所有者返回 403 FORBIDDEN。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                agent_ids:
                  type: array
                  maxItems: 200
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: 已解绑
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceRemovalResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/devices/{deviceID}/revoke:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *deviceIDParam
    post:
      operationId: revokeDeviceGrant
      summary: 吊销本组织对电脑的授权（旧接口，仅组织 OWNER / ADMIN；不归档 Agent、不取消 Run，新前端请用 remove-from-organization）
      responses:
        '204': { description: 已吊销 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/devices/{deviceID}/keys/{keyID}/rotate:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *deviceIDParam
      - { name: keyID, in: path, required: true, schema: { type: string } }
    post:
      operationId: rotateDeviceKey
      summary: 轮换电脑密钥（仅电脑所有者；version = 电脑 version）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_key_id, new_key_id, public_key, version]
              properties:
                old_key_id: { type: string }
                new_key_id: { type: string }
                public_key: { type: string, description: base64url 编码的 32 字节 Ed25519 公钥 }
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 已轮换
          content:
            application/json:
              schema:
                type: object
                required: [device_id, key_id, key_generation, device_version]
                properties:
                  device_id: { type: string, format: uuid }
                  key_id: { type: string }
                  key_generation: { type: integer }
                  device_version: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  # 统一实时事件流（SSE）。一条连接同时推送 Run 执行事件与组织事件。
  /v1/organizations/{organizationID}/events:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: streamOrganizationEvents
      summary: 统一事件流（text/event-stream）
      description: |
        每帧格式：`id: <游标>` + `event: <类型>` + `data: <JSON>`；另有 15 秒一次的注释心跳 `: keep-alive`，
        出错时推送 `event: error`（data = {code}）后关闭连接，客户端按游标重连。
        事件类型：
        - `run.event`：Run 执行事件，data = RunStreamEvent。只推送当前用户能看到的对话里的 Run。
        - `task.changed`、`inbox.changed`、`run.state`、`conversation.updated`、`conversation.message`：组织事件，data = OrganizationEvent。
          组织事件是失效通知，客户端据此刷新对应查询，事件本身不保证携带完整数据。
        组织事件可见性：inbox.changed 只推给收件人本人；带空间的事件要求空间可读；带对话的事件要求对话可见
        （所有者，或 SHARED 对话的成员，且空间可读）；两者都没有的对组织成员可见。
        游标：`v2.<run_txid>.<run_seq>.<org_txid>.<org_id>`，客户端原样保存最后收到的 id。
        推送只包含快照时刻已结束事务写入的事件，按（事务号, 序号）严格递增，不漏发、不重发；长事务结束前其后提交的事件会延迟推送。
        兼容：纯数字游标 n 视为 Run 游标 `0.n`，组织事件从连接时刻开始推送。不带游标时 Run 事件从头、组织事件从连接时刻开始。
        每秒轮询一次，每次每类最多 100 条。组织事件保留 7 天，游标早于保留期的事件不会补发。
      parameters:
        - { name: after, in: query, description: 游标（v2 或旧的纯数字），优先于 Last-Event-ID, schema: { type: string, maxLength: 200 } }
        - { name: Last-Event-ID, in: header, description: EventSource 重连时自动带上的最后一个 id, schema: { type: string, maxLength: 200 } }
      responses:
        '200':
          description: 事件流
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE 帧；各类型 data 的结构见 RunStreamEvent / OrganizationEvent
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  # ===== /电脑与事件 =====

  # ===== 对话与执行 =====
  # --- 对话（BE-conv） ---
  /v1/organizations/{organizationID}/conversations:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listConversations
      summary: 对话列表（updated_at desc, id desc；本人的会话与共享给本人的会话，空间按协作策略可读）
      description: 摘要字段在一次批量查询里取齐（= ANY），不做逐行查询。
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - name: cursor
          in: query
          description: 上一页的 next_cursor（不透明字符串，(updated_at, id) 复合游标）。旧版纯数字游标（updated_at 纳秒）仍接受，只按 updated_at 严格小于翻页
          schema: { type: string }
        - { name: agent_id, in: query, schema: { type: string, format: uuid } }
        - { name: task_id, in: query, schema: { type: string, format: uuid } }
        - { name: archived, in: query, schema: { type: string, enum: [exclude, include, only], default: exclude } }
        - { name: pinned, in: query, description: only = 只返回本人置顶的会话, schema: { type: string, enum: [only] } }
        - { name: q, in: query, description: 标题包含（不区分大小写，按字面匹配；无标题的会话不命中）, schema: { type: string, maxLength: 200 } }
      responses:
        '200':
          description: 会话
          content:
            application/json:
              schema:
                type: object
                required: [conversations, next_cursor]
                properties:
                  conversations:
                    type: array
                    items: { $ref: '#/components/schemas/ConversationSummary' }
                  task_stats: { $ref: '#/components/schemas/TaskConversationStats' }
                  next_cursor: { type: [string, 'null'], description: null 表示没有下一页 }
        '400': { $ref: '#/components/responses/Error' }
    post:
      operationId: createConversation
      summary: 新建会话
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationCreateRequest' }
      responses:
        '201':
          description: 会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/conversations/{conversationID}/offer-candidates:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { in: path, name: conversationID, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: conversationOfferCandidates
      description: 任务会话支持邀请和转让；未绑定任务的内置小助手仅支持转让。小助手候选人未配置可用的本人助手或电脑授权时，返回 unavailable_reason。
      parameters:
        - { in: query, name: kind, required: true, schema: { type: string, enum: [INVITE, TRANSFER] } }
        - { in: query, name: q, schema: { type: string, maxLength: 256 } }
      responses:
        '200':
          description: 列表
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ConversationOfferPeer' } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/conversations/{conversationID}/offers:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { in: path, name: conversationID, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: sendConversationOffer
      description: 只发送请求，不提前转移所有权或授予接收人权限。小助手转让需接收人已配置本人助手及覆盖会话空间的有效电脑授权。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationOfferInput' }
      responses:
        '204': { description: 成功，可安全重放 }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/conversation-offers:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listPendingConversationOffers
      responses:
        '200':
          description: 列表
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PendingConversationOffer' } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/conversation-offers/{offerID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { in: path, name: offerID, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: decideConversationOffer
      description: 接受小助手转让时，在锁内复核权限和执行状态，改用接收人自己的小助手，清除旧工作目录与运行覆盖，保留原空间、任务、消息及历史 Run。原所有者成为普通参与者。准备条件不足返回 409 ASSISTANT_TRANSFER_NOT_READY；有待执行消息、活动运行或待核对状态返回 409 ASSISTANT_TRANSFER_BUSY。仅适用于升级后的后端，旧版不支持无任务会话转让。
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [accept], properties: { accept: { type: boolean } } }
      responses:
        '204': { description: 成功，可安全重放 }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/conversations/{conversationID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - &conversationIDParam { name: conversationID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getConversation
      summary: 会话详情（摘要格式；已归档的也可读）
      responses:
        '200':
          description: 会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationSummary' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateConversation
      summary: 重命名 / 归档 / 恢复（仅所有者；不改 version 与 updated_at）
      description: 旧接口 PATCH …/session（updateAssistantSession）是同一实现的别名，返回 AssistantSession。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationUpdateRequest' }
      responses:
        '200':
          description: 会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationSummary' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/conversations/{conversationID}/overrides:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *conversationIDParam
    patch:
      operationId: updateConversationOverrides
      summary: 修改对话的 Runtime / 模型 / 权限模式 / 思考深度覆盖（下一次运行生效）
      description: |
        能在该对话里发消息的人都可以修改（鉴权与发消息相同：对话所有者，或共享对话里的 COMMENTER；只读访客 403，非成员 / 跨组织 404，对话已关闭 409 CONVERSATION_CLOSED）。
        - 字段缺省 = 不改；null = 清除该项覆盖、恢复 Agent 配置的值；请求体不接受 computer_id / grant_id 等字段（未知字段 400）——
          只能换「Agent 当前配置绑定的那台电脑」上的其他 Runtime，电脑与授权不变，Agent 的环境变量不会到别的机器上。
        - 修改只影响**下一次运行**：派发在创建 Run 时把有效配置写进 Run 的快照，进行中和已排队的 Run 不受影响。
        - 有效 Runtime = 覆盖值，否则 Agent 配置；有效模型 = 模型覆盖，否则（只覆盖了与 Agent 配置不同的 Runtime 时）default，否则 Agent 配置；
          有效权限模式 = 覆盖值，否则 Agent 配置的 approval_mode；有效思考深度 = 覆盖值，否则 DEFAULT。
        - 校验：runtime 必须是 codex / claude-code / opencode / pi，且出现在 Agent 绑定电脑最近一次心跳的 runtimes 里（不要求 runnable）；
          model 必须是 default，或出现在该 Runtime 上报的模型列表里（列表为空或带 models_error 时只校验格式：1..128 字符、无控制字符）；
          approval_mode 必须是 ApprovalMode 四档之一；reasoning_effort 必须是 ReasoningEffort 六档之一。只校验本次请求触碰的字段及其依赖：改了 runtime 而保留的模型或思考深度覆盖在新 Runtime 上不可用时整体拒绝。
          设备是否支持某个权限档位**不在这里拒绝**，而在派发前核对：不支持时 Run 失败（failure_code = RUNTIME_UNAVAILABLE，对话里有说明），绝不退回更宽的行为执行。
        - expected_version 必填，与当前 overrides.version 不一致 409 VERSION_CONFLICT；成功后 version + 1。最终状态与当前相同时不改版本、不留记录，直接返回当前摘要（重试幂等）。
        - 成功后写 conversation.updated 事件、一条系统消息（说明改了什么、下一条消息起生效）与审计 conversation.overrides_changed。
        - 小队对话 409 CREW_CONVERSATION_UNSUPPORTED（小队消息按 @ 分派给不同成员，会话级覆盖没有明确含义）；Agent 已归档或没有配置 409 AGENT_UNAVAILABLE。
        - runtime 不在心跳里 422 RUNTIME_NOT_AVAILABLE；模型不可用 422 MODEL_NOT_AVAILABLE；思考深度不可用 422 REASONING_EFFORT_NOT_AVAILABLE。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationOverridesRequest' }
      responses:
        '200':
          description: 最新的会话摘要（overrides / effective 已更新）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationSummary' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/conversations/{conversationID}/override-options:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *conversationIDParam
    get:
      operationId: getConversationOverrideOptions
      summary: 对话输入框里 Runtime / 模型 / 权限模式 / 思考深度的可选项（只读）
      description: |
        返回 Agent 当前配置绑定的那台电脑最近一次心跳里的 Runtime 列表（含模型与适配器支持的权限档位），以及电脑当前是否在线。
        鉴权与 PATCH …/overrides 相同（能在该对话里发消息的人；只读访客 403，非成员 / 跨组织 404）：能聊天、但看不到 Agent 绑定电脑的成员也能拿到可选项。
        不返回电脑名称、环境变量与授权信息；小队对话 409 CREW_CONVERSATION_UNSUPPORTED，Agent 已归档或没有配置 409 AGENT_UNAVAILABLE。
        数据来自最近一次心跳（最长约 10 分钟刷新一次），可能略微过期：以 PATCH 与派发前的核对为准。
      responses:
        '200':
          description: 可选项
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationOverrideOptions' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/conversations/{conversationID}/pin:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *conversationIDParam
    put:
      operationId: pinConversation
      summary: 置顶（个人状态，能读会话即可；幂等，重复置顶保留首次时间；不改 version）
      responses:
        '204': { description: 已置顶 }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: unpinConversation
      summary: 取消置顶（幂等）
      responses:
        '204': { description: 已取消 }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/conversations/{conversationID}/read:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *conversationIDParam
    post:
      operationId: markConversationRead
      summary: 推进本人已读位置（只增不减；超过当前最大 seq 时按最大 seq 记；不改 version）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seq]
              properties:
                seq: { type: integer, minimum: 0 }
      responses:
        '204': { description: 已记录 }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/conversations/{conversationID}/task:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *conversationIDParam
    post:
      operationId: bindConversationTask
      summary: 绑定已有任务（仅所有者；version + 1）
      description: |
        任务须未删除、所在空间可读，且与会话同空间（否则 400 TASK_SPACE_MISMATCH）；
        会话已有任务 409 CONVERSATION_TASK_BOUND；有活动 Run 409 RUN_ACTIVE；任务不存在或不可读 404。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id]
              properties:
                task_id: { type: string, format: uuid }
      responses:
        '200':
          description: 会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationSummary' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/conversations/{conversationID}/convert-to-task:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *conversationIDParam
    post:
      operationId: convertConversationToTask
      summary: 转为任务：在会话空间创建任务并绑定（仅所有者，需空间创建权限）
      description: |
        title 省略时取会话标题，再取首条用户消息的首个非空行（前 120 个字符）；都没有时 400。
        前置条件与绑定相同（409 CONVERSATION_TASK_BOUND / RUN_ACTIVE）。
        幂等操作名 conversation.convert_task：同键同请求重放返回会话当前摘要（200 + Idempotent-Replayed: true）。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 500 }
                type_id: { type: string, format: uuid, description: 省略时用空间默认类型 }
      responses:
        '201':
          description: 会话（task 为新任务）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationSummary' }
        '200':
          description: 幂等重放
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationSummary' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/conversations/{conversationID}/messages:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *conversationIDParam
    get:
      operationId: listConversationMessages
      summary: 消息列表（页内按 seq 升序）
      description: |
        order=asc（默认）：返回 seq > after 的前 limit 条，next_cursor 为页内最大 seq（还有更多时），作为下一次的 after。
        order=desc：返回 seq < before（before 省略或 0 表示从最新一条起）的最新 limit 条，页内仍按 seq 升序，
        next_cursor 为页内最小 seq（还有更早消息时），作为下一次的 before。用于对话页先取最新一页、向上滚动加载更早消息。
        next_cursor 为 0 表示没有下一页。
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - { name: after, in: query, description: 仅 order=asc, schema: { type: integer, minimum: 0 } }
        - { name: before, in: query, description: 仅 order=desc, schema: { type: integer, minimum: 0 } }
        - { name: around, in: query, description: 直接读取本会话内指定消息及相邻消息，不与 before 或 after 同时使用；目标不存在返回 404, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 消息
          content:
            application/json:
              schema:
                type: object
                required: [messages, next_cursor]
                properties:
                  messages:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
                  next_cursor: { type: integer, minimum: 0 }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: postConversationMessage
      summary: 发消息（所有者或共享会话的 COMMENTER；@ 会话 Agent 触发执行，本人的小助手会话免 @）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageCreateRequest' }
      responses:
        '201':
          description: 消息（同 client_message_id 重放返回原消息）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/conversations/{conversationID}/members/{userID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *conversationIDParam
      - { name: userID, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: putConversationMember
      summary: 设置会话成员权限（仅所有者；任务会话仅可调整已有成员）
      description: 非任务会话可直接添加成员。任务会话的新成员必须通过 sendConversationOffer 邀请并接受；未加入或已移除时返回 409 CONVERSATION_INVITE_REQUIRED，不自动发邀请。成功时会话变为 SHARED，version + 1。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access_level]
              properties:
                access_level: { type: string, enum: [VIEWER, COMMENTER] }
      responses:
        '204': { description: 已共享或更新已有成员权限 }
        '409': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteConversationMember
      summary: 取消共享（仅所有者；version + 1）
      responses:
        '204': { description: 已移除 }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/conversations/{conversationID}/complete:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *conversationIDParam
    post:
      operationId: completeConversation
      summary: 完成会话（仅所有者；有活动 Run 409 RUN_ACTIVE；complete_task 同时把绑定任务改为 DONE 分类的第一个状态）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
                complete_task: { type: boolean, default: false }
      responses:
        '200':
          description: 会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/conversations/{conversationID}/reopen:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *conversationIDParam
    post:
      operationId: reopenConversation
      summary: 重新打开已完成的会话（仅所有者）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/conversations/{conversationID}/handoff:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *conversationIDParam
    post:
      operationId: handoffConversation
      summary: 交接：等你回复 / 等你审阅（仅所有者、OPEN 会话；通知其他会话成员）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, handoff]
              properties:
                version: { type: integer, minimum: 1 }
                handoff: { type: string, enum: [WAITING_REPLY, WAITING_REVIEW] }
      responses:
        '200':
          description: 会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/conversations/{conversationID}/artifacts:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *conversationIDParam
    get:
      operationId: listConversationArtifacts
      summary: 会话的全部产物（Agent 用发布工具交付的文件；created_at 倒序，最多 200 个）
      description: |
        能读会话即可读（与 getConversation 相同；读不到或跨组织 404）。一次查询取齐会话内所有 Run 的产物，
        包括已过保留期或已清理的（state 不是 AVAILABLE，前端显示「产物已失效」）。每项带 run_id；
        回复消息与 Run 的对应由前端按消息顺序推算（消息表没有 run_id）。
      responses:
        '200':
          description: 产物
          content:
            application/json:
              schema:
                type: object
                required: [artifacts]
                properties:
                  artifacts:
                    type: array
                    maxItems: 200
                    items: { $ref: '#/components/schemas/RunArtifact' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/conversations/{conversationID}/runtime-session-exports:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *conversationIDParam
    post:
      operationId: createRuntimeSessionExport
      summary: 为最近一次已结束的 Runtime 运行创建设备端原生会话导出
      description: |
        只接受浏览器临时生成的 RSA-OAEP 公钥。运行设备将创建原生会话 ZIP，以 AES-GCM 加密后上传；中心仅保存密文、被 RSA 包装的 AES 密钥及请求元数据，最长一小时。
        Codex rollout 只在运行设备本地暂存，最长 24 小时。导出不包括登录凭据或 Runtime 设置。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuntimeSessionExportRequest' }
      responses:
        '202':
          description: 导出命令已排队
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeSessionExport' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/conversations/{conversationID}/runtime-session-exports/{exportID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *conversationIDParam
      - { name: exportID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getRuntimeSessionExport
      summary: 查询 Runtime 原生会话导出状态
      responses:
        '200':
          description: 导出状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeSessionExport' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/conversations/{conversationID}/runtime-session-exports/{exportID}/content:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *conversationIDParam
      - { name: exportID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: downloadRuntimeSessionExport
      summary: 下载 AES-GCM 加密的 Runtime 原生会话包密文
      responses:
        '200':
          description: 加密包密文；客户端使用状态接口的 wrapped_key 在本地解密
          headers:
            X-Content-SHA256: { schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/conversations/{conversationID}/runs:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *conversationIDParam
    get:
      operationId: listConversationRuns
      summary: 会话的 Run 列表（created_at 升序）
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: after, in: query, description: 上一页的 next_cursor（created_at 纳秒）, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: Run
          content:
            application/json:
              schema:
                type: object
                required: [runs, next_cursor]
                properties:
                  runs:
                    type: array
                    items: { $ref: '#/components/schemas/RunResponse' }
                  next_cursor: { type: integer, minimum: 0, description: 0 表示没有下一页 }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/runs/{runID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - &runIDParam { name: runID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getRun
      summary: Run 详情（能读所属会话即可读）
      responses:
        '200':
          description: Run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunResponse' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/runs/{runID}/events:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *runIDParam
    get:
      operationId: listRunEvents
      summary: Run 事件（stream_seq 升序）
      description: 返回 stream_seq > after 的前 limit 条；next_cursor 为页内最大 stream_seq（还有更多时），省略或 0 表示没有更多。前端应循环拉完，再接 /events 的 run.event 实时追加。
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: after, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: 事件
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunEventPage' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/runs/{runID}/result:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *runIDParam
    get:
      operationId: getRunResult
      summary: Run 结果（设备尚未上报结果时 404）
      responses:
        '200':
          description: 结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunResult' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/runs/{runID}/artifacts:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *runIDParam
    get:
      operationId: listRunArtifacts
      summary: Run 产物列表（created_at 升序）
      responses:
        '200':
          description: 产物
          content:
            application/json:
              schema:
                type: object
                required: [artifacts]
                properties:
                  artifacts:
                    type: array
                    items: { $ref: '#/components/schemas/RunArtifact' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/runs/{runID}/artifacts/{artifactID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *runIDParam
      - { name: artifactID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: downloadRunArtifact
      summary: 下载产物（Content-Type 为产物 mime_type，Content-Disposition attachment; filename=产物名）
      description: |
        响应头一律带 X-Content-Type-Options: nosniff、Content-Security-Policy: sandbox、Cache-Control: private, no-store，
        Content-Disposition 一律 attachment（任何类型都不在浏览器里内联执行）。已过保留期、已清理或不存在 404。
      responses:
        '200':
          description: 文件内容
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/runs/{runID}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *runIDParam
    post:
      operationId: cancelRun
      summary: 取消 Run（Run 发起人、会话所有者或组织 OWNER/ADMIN；需能看到会话）
      description: |
        QUEUED 直接结束为 CANCELED；PREPARING / RUNNING 置为 CANCEL_REQUESTED 并通知设备；
        已是 CANCEL_REQUESTED 或终态时返回当前 Run（幂等）。
        Idempotency-Key 必填（缺省 400 IDEMPOTENCY_KEY_REQUIRED，格式不符 400 INVALID_REQUEST）；
        作用域为组织，保留 24 小时；同键用于不同 Run 或不同主体 409 IDEMPOTENCY_CONFLICT；同键重放 replayed=true。
        无请求体。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 取消后的 Run
          content:
            application/json:
              schema:
                type: object
                required: [run, replayed]
                properties:
                  run: { $ref: '#/components/schemas/RunResponse' }
                  replayed: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  # --- /对话（BE-conv） ---
  # --- 执行（BE-exec）：设备上报，Bearer 设备令牌 ---
  /v1/device/organizations/{organizationID}/runs/{runID}/events:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *runIDParam
    post:
      operationId: appendDeviceRunEvents
      summary: 设备批量上报 Run 事件（≤ 100 条、合计 ≤ 256 KiB、单条 safe_payload ≤ 64 KiB）
      description: |
        只有该 Run 的执行电脑可上报；generation 必须等于当前代次。按 (generation, sequence) 幂等：
        同一位置重复上报相同 id / type / payload 返回已有事件，不同则 409 DELIVERY_CONFLICT。
        type = step 时 safe_payload.data 必须是 StepEventData（schema = 1、step.id 非空且 ≤ 64 字节、
        step.kind / step.state 在枚举内），否则整批 400 INVALID_REQUEST。其他 type 不做结构校验。
        请求体严格解码，未知字段 400。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: '#/components/schemas/RunEventInput' }
      responses:
        '200':
          description: 已接受的事件
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunEventBatchResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/device/organizations/{organizationID}/runs/{runID}/result:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *runIDParam
    post:
      operationId: appendDeviceRunResult
      summary: 设备上报 Run 终态结果（同一 id 与相同载荷幂等；不同结果 409 DELIVERY_CONFLICT）
      description: |
        同一事务内把 Run 置为终态、写入 run.result 事件并把回复写回会话。
        usage 可省略（旧 daemon），各字段须为非负整数，否则 400；写入 run_results.usage。
        payload_hash 只在省略 usage 时与旧版本一致（usage 参与规范化哈希）。
        需要核对的 Run 返回 409 RECONCILIATION_REQUIRED。请求体严格解码，未知字段 400。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunResultInput' }
      responses:
        '200':
          description: 结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/device/organizations/{organizationID}/runs/{runID}/artifacts:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *runIDParam
    post:
      operationId: uploadDeviceRunArtifact
      summary: 执行设备上传一个 Run 产物（openfox_publish_artifact 发布工具；请求体为文件原始字节）
      description: |
        只有该 Run 的执行电脑可上传；Run 必须未结束，X-Run-Generation 必须等于当前代次（否则 409 DELIVERY_CONFLICT）。
        X-Artifact-Name 只取最后一个路径成分并清理控制字符；X-Artifact-MIME 只接受可预览白名单
        （text/plain、text/markdown、text/csv、image/png、image/jpeg、image/gif、image/webp），其余一律存为 application/octet-stream。
        单个文件不超过 min(组织策略 artifact_file_max_bytes, 20 MB)，每次 Run 合计不超过 artifact_run_max_bytes、最多 10 个
        （超出 413 RESOURCE_LIMIT）。同一 Run 内 sha256 相同的内容不重复登记：返回已有产物（200），新写入的对象被删除。
        新登记的产物发组织事件 run.artifact。保留期沿用组织策略（artifact_retention_days，从创建时刻起算；随结果的 artifact_ids 关联后才会被清理）。
      parameters:
        - { name: X-Run-Generation, in: header, required: true, schema: { type: integer, minimum: 1 } }
        - { name: X-Artifact-ID, in: header, required: false, description: 省略时服务端生成, schema: { type: string, format: uuid } }
        - { name: X-Artifact-Name, in: header, required: false, description: 文件名（URL 编码不解码，原样作为文本）；省略为 artifact.bin, schema: { type: string, maxLength: 1024 } }
        - { name: X-Artifact-MIME, in: header, required: false, schema: { type: string } }
        - { name: X-Artifact-Retention-Until, in: header, required: false, description: RFC 3339，必须晚于当前时刻, schema: { type: string, format: date-time } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: 内容与本 Run 已有产物相同，返回已有产物
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunArtifact' }
        '201':
          description: 已登记
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunArtifact' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/device/organizations/{organizationID}/runtime-session-exports/{exportID}/content:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: exportID, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: X-Runtime-Session-Wrapped-Key, in: header, required: true, description: RSA-OAEP 包装的 AES-GCM 内容密钥（base64url）, schema: { type: string, minLength: 300, maxLength: 700 } }
    post:
      operationId: uploadRuntimeSessionExportContent
      summary: 设备上传加密后的 Runtime 原生会话包
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, maxLength: 20971520 }
      responses:
        '201': { description: 密文已保存 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  # --- /执行（BE-exec） ---
  # ===== /对话与执行 =====

  # ===== 连接电脑与 Runtime =====
  # 用户侧：签发注册令牌（含 v2 安装令牌）、远程命令。设备侧（设备会话令牌 Bearer）：注册、认证、心跳、
  # Run 上下文、远程命令拉取 / 领取 / 回执。所有路径实际挂在中心的 /api 前缀下（如 /api/v1/device/register）。
  /v1/organizations/{organizationID}/devices/registration-tokens:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    post:
      operationId: issueDeviceRegistrationToken
      summary: 签发电脑注册令牌（10 分钟有效，一次性）
      description: |
        权限：scope = ORGANIZATION 仅 OWNER / ADMIN；scope = PERSONAL 任何非 GUEST 的 ACTIVE 成员；否则 403 FORBIDDEN。
        scope 省略时：OWNER / ADMIN = ORGANIZATION（与旧行为一致），其他成员 = PERSONAL。
        兑换时按签发人当前角色复核（签发后降级会导致兑换 409 REGISTRATION_CONFLICT）。
        PERSONAL 兑换后电脑授权给签发人本人（grant_scope = PERSONAL，grant_user_id = 签发人）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceRegistrationTokenRequest' }
      responses:
        '201':
          description: 已签发；token / install_token / command 只在此返回一次
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceRegistrationToken' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/conversations/{conversationID}/work-directory:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - name: conversationID
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getConversationWorkDirectoryTarget
      summary: 查询实际运行目录所属电脑与运行标识，不返回物理路径
      description: |
        要求当前会话可读且为实际执行电脑所有者；跨组织、非所有者与无会话访问权返回不可见。
        优先当前活动 Run，否则最近的 Run。没有 Run 时 target=null，不根据 Agent 当前绑定电脑推测。
        响应禁止缓存。桌面端在复制前再次读取并比较完整 target。
      responses:
        '200':
          description: 已授权的执行目标
          content:
            application/json:
              schema:
                type: object
                required: [target, supported, online]
                properties:
                  target:
                    oneOf:
                      - {$ref: '#/components/schemas/WorkspacePathScope'}
                      - {type: 'null'}
                  supported: {type: boolean}
                  online: {type: boolean}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /v1/organizations/{organizationID}/devices/{deviceID}/commands:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *deviceIDParam
    post:
      operationId: createDeviceCommand
      summary: 向电脑下发远程命令（仅电脑所有者）
      description: |
        仅电脑所有者（owner_user_id = 当前用户）且当前组织对该电脑有 ACTIVE 授权；否则 404（含跨租户）。
        同一台电脑同一种 kind 已有未完成（PENDING / DELIVERED 且未过期）命令时返回 200 与该命令，不新建。
        电脑离线也允许创建：上线后执行，PENDING 超过 expires_at（创建后 2 分钟）未领取则变为 EXPIRED。
        创建后经设备 WSS 推送 device.command 唤醒（只是提示，设备以 HTTPS 拉取为准）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceCommandCreateRequest' }
      responses:
        '200':
          description: 已有同 kind 未完成命令，返回该命令
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceCommandEnvelope' }
        '202':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceCommandEnvelope' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/devices/{deviceID}/commands/{commandID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *deviceIDParam
      - &commandIDParam { name: commandID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getDeviceCommand
      summary: 读取远程命令（仅电脑所有者；轮询用）
      description: 读取时把已过 expires_at 的未完成命令标记为 EXPIRED（completed_at = 当前时间）。权限同创建，否则 404。
      responses:
        '200':
          description: 命令
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceCommandEnvelope' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/device/register:
    post:
      operationId: registerDeviceWithToken
      summary: 设备用注册令牌兑换身份（无需认证；令牌一次性）
      description: |
        token 同时接受 v2 安装令牌（ofx_v2_…，中心解出其中的注册令牌明文再算哈希）与旧的纯注册令牌。
        令牌已用 / 已过期 / 已吊销 / 签发人已无签发资格：409 REGISTRATION_CONFLICT；并发兑换同一令牌只有 1 次成功。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceRegisterRequest' }
      responses:
        '201':
          description: 已注册
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceRegisterResult' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/device/auth/challenge:
    post:
      operationId: issueDeviceAuthChallenge
      summary: 申请设备认证挑战（无需认证）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, key_id]
              properties:
                device_id: { type: string, format: uuid }
                key_id: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '201':
          description: 挑战；设备用私钥对 deviceauth.CanonicalPayload(challenge_id, device_id, key_id, nonce, challenge) 签名（nonce / challenge 为 base64url 解码后的字节）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceAuthChallenge' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /v1/device/auth/token:
    post:
      operationId: issueDeviceAuthToken
      summary: 用挑战签名换设备会话令牌（无需认证；挑战一次性）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, device_id, key_id, signature]
              properties:
                challenge_id: { type: string, format: uuid }
                device_id: { type: string, format: uuid }
                key_id: { type: string }
                signature: { type: string, description: ed25519 签名的 base64url（无填充） }
      responses:
        '201':
          description: 会话令牌（Bearer）
          content:
            application/json:
              schema:
                type: object
                required: [device_id, token, expires_at]
                properties:
                  device_id: { type: string, format: uuid }
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/device/heartbeat:
    post:
      operationId: recordDeviceHeartbeat
      summary: 设备心跳（设备会话令牌；也可经 WSS /v1/device/connect 发送）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceHeartbeatRequest' }
      responses:
        '200':
          description: 已记录
          content:
            application/json:
              schema:
                type: object
                required: [device_id, center_epoch, version, received_at]
                properties:
                  device_id: { type: string, format: uuid }
                  center_epoch: { type: integer }
                  version: { type: integer }
                  received_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/integrations/connections/{connectionID}/shortcut-webhook:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: connectionID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getShortcutHookSettings
      summary: 管理员查看 Shortcut 回调地址及接收状态
      responses:
        '200': { description: 配置, content: { application/json: { schema: { $ref: '#/components/schemas/ShortcutHook' } } } }
        '403': { $ref: '#/components/responses/Error' }
    put:
      operationId: saveShortcutHookSettings
      summary: 管理员保存手动配置的签名密钥，空串解除实时接收
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, secret]
              properties:
                version: { type: integer, minimum: 1 }
                secret: { type: string, maxLength: 256, writeOnly: true }
      responses:
        '200': { description: 配置, content: { application/json: { schema: { $ref: '#/components/schemas/ShortcutHook' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/hooks/shortcut/{organizationID}/{connectionID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: connectionID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: receiveShortcutHook
      summary: 验签、按事件 ID 去重并调度已启用的同步
      parameters:
        - { name: Payload-Signature, in: header, required: true, schema: { type: string, minLength: 64, maxLength: 64 } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses:
        '204': { description: 已接收或重复事件 }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /v1/device/organizations/{organizationID}/gitlab-proxy/{streamID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: streamID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: claimGitLabProxyStream
      summary: 已登记的在线设备领取其专属的一次性 WebSocket 转发连接
      description: 使用设备会话令牌。首个文本帧限定目标主机和端口，后续为 TLS 二进制帧；每个通道最长 30 秒。
      responses:
        '101': { description: 已升级到 WebSocket }
        '401': { $ref: '#/components/responses/Error' }
        '404': { description: 通道不存在、无权领取或已过期 }
  /v1/device/organizations/{organizationID}/mcp-inventory:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    put:
      operationId: reportDeviceMCPInventory
      summary: 设备认证后单独上报本人 Runtime 清单
      description: 仅允许四种已知 Runtime，每个最多 32 项。只接受名称、启用状态、来源和传输方式。设备清单不可放入普通心跳。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runtimes]
              additionalProperties: false
              properties:
                runtimes:
                  type: object
                  maxProperties: 4
                  propertyNames: { enum: [codex, claude-code, opencode, pi] }
                  additionalProperties:
                    type: object
                    required: [status, servers]
                    additionalProperties: false
                    properties:
                      status: { type: string, enum: [ok, missing, invalid, unavailable, too_large] }
                      servers:
                        type: array
                        maxItems: 32
                        items:
                          type: object
                          required: [name, transport, source, enabled]
                          additionalProperties: false
                          properties:
                            name: { type: string }
                            source: { type: string, enum: [USER_CONFIG] }
                            transport: { type: string, enum: [HTTP, STDIO, SSE] }
                            enabled: { type: boolean }
      responses:
        '204': { description: 清单已按组织和设备所有者保存 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/device/organizations/{organizationID}/runs/{runID}/context:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *runIDParam
      - { name: generation, in: query, required: true, schema: { type: integer, minimum: 1 } }
      - { name: X-OpenFox-Agent-MCP, in: header, schema: { type: string, enum: ['1'] }, description: 对支持已绑定 MCP 的设备必需，缺少或心跳能力不支持返回 409 MCP_UNSUPPORTED }
      - { name: X-OpenFox-Conversation-Workdir, in: header, schema: { type: string, enum: ['1'] }, description: 设备能执行指定工作目录时传 1；要求指定目录的运行缺此头返回 409 WORKSPACE_SELECTION_UNSUPPORTED }
      - { name: shared_task_dir, in: query, schema: { type: integer, enum: [1] }, description: 设备支持小队任务共用目录时传 1；缺少时若该 Run 要求共用目录则返回 409 WORKSPACE_SHARING_UNSUPPORTED }
    get:
      operationId: getDeviceRunContext
      summary: 执行设备读取 Run 上下文（需持有有效租约）
      description: |
        只有持有该 Run 有效租约（PREPARING / RUNNING）且授权仍有效的执行设备可读；别的设备 / 别的组织 404。
        environment 为请求时解密的 Agent 当前环境变量（明文，只经设备认证的 HTTPS 下发，不进日志 / 审计 / 事件）。
        该 Agent 有环境变量但中心未配置主密钥或解密失败：409 SECRETS_UNAVAILABLE（设备应走 prepare-failed，failure_code = PREPARE_FAILED）。
      responses:
        '200':
          description: Run 上下文
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceRunContext' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/device/organizations/{organizationID}/runs/{runID}/tools/{tool}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *runIDParam
      - { name: tool, in: path, required: true, schema: { type: string, enum: [task_view, task_comment, task_start, conversation_state, task_reaction, conversation_mention, space_task_create, space_task_search, space_task_update] } }
    post:
      operationId: callDeviceRunTool
      summary: 执行设备代 Agent 调用任务工具（只作用于本次 Run 绑定的任务）
      description: |
        授权与 getDeviceRunContext 相同，另外要求 Run 为 RUNNING；任务工具要求已绑定任务，conversation_mention 只使用本会话（状态不符 409 RUN_STATE_CONFLICT）。
        task_view：读任务与最近 20 条评论；task_comment：以 Agent 身份写评论（body 1–10000 字符；可传 reply_to_id 和 mention），task_reaction 给当前任务或评论加表态，conversation_mention 在本会话提及已有成员；
        task_start：待办任务改到工作流开始状态（不能改成完成 / 取消）；conversation_state：把本次 Run 所在会话设为
        waiting_reply / waiting_review 并通知会话所有者。业务拒绝返回 200 + ok=false 与原因文本。请求体 ≤ 64 KiB。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceToolCallRequest' }
      responses:
        '200':
          description: 工具结果（text 给模型阅读，≤ 32 KiB）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceToolCallResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/device/organizations/{organizationID}/runs/{runID}/skills/{skillID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *runIDParam
      - { name: skillID, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: generation, in: query, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getDeviceRunSkill
      summary: 执行设备下载本次 Run 的一个技能（需持有有效租约，且技能仍装配在该 Run 的 Agent 上）
      responses:
        '200':
          description: 技能包
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceSkillBundle' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/device/organizations/{organizationID}/commands/{commandID}/skills:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *commandIDParam
    post:
      operationId: uploadDeviceImportedSkill
      summary: 设备为已领取的 skill_import 命令上传一个技能（名称必须在命令的 names 里）
      description: |
        中心以发起导入的用户身份重新检查空间写权限后建立技能，并把该项记为 imported / skipped（SKILL_NAME_TAKEN）/ failed（原因码）。
        命令不属于本设备 / 不是 DELIVERED 的 skill_import 404 / 409；导入已取消 409 IMPORT_CANCELED（设备应停止上传，照常回执结果）。
        请求体 ≤ 8 MB（文件内容 base64）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceSkillBundle' }
      responses:
        '200':
          description: 该项结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillImportItem' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /v1/device/organizations/{organizationID}/commands:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listDevicePendingCommands
      summary: 设备拉取待执行命令（只返回本设备、未过期的 PENDING，按创建时间正序）
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [PENDING], default: PENDING } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: 待执行命令
          content:
            application/json:
              schema:
                type: object
                required: [commands]
                properties:
                  commands:
                    type: array
                    items: { $ref: '#/components/schemas/DeviceCommand' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/device/organizations/{organizationID}/commands/{commandID}/claim:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *commandIDParam
    post:
      operationId: claimDeviceCommand
      summary: 设备领取命令（CAS PENDING → DELIVERED）
      description: |
        并发领取只有 1 次成功；已被领取 / 已终态 409 COMMAND_CLAIMED；已过期 409 COMMAND_EXPIRED（并标记 EXPIRED）；
        不属于本设备或别的组织 404。领取成功后 expires_at 改为执行截止时间：
        runtime_probe / runtime_test = 领取时间 + 60 秒，storage_cleanup = 领取时间 + 330 秒（执行超时 + 30 秒余量）。
        请求体可省略。
      responses:
        '200':
          description: 已领取
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceCommandEnvelope' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/device/organizations/{organizationID}/commands/{commandID}/result:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *commandIDParam
    post:
      operationId: reportDeviceCommandResult
      summary: 设备回执命令结果（DELIVERED → SUCCEEDED / FAILED）
      description: |
        只接受 DELIVERED → 终态；重复提交相同 status 与 error_code 幂等 200（返回已存结果）；与已存终态不同、
        命令仍为 PENDING：409 COMMAND_CONFLICT；已 EXPIRED 或超过执行截止时间：409 COMMAND_EXPIRED（后者同时标记 EXPIRED）。
        result 必须是 JSON 对象（≤ 16 KiB，SUCCEEDED 必填，FAILED 可为 null）；error_code 匹配 ^[A-Z0-9_]{0,64}$，FAILED 必填。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceCommandResultRequest' }
      responses:
        '200':
          description: 已记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceCommandEnvelope' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  # ===== /连接电脑与 Runtime =====

  # ===== 空间设置 =====
  # 权限：空间管理（资料、开关、标识符、估时、仓库、成员、停用 / 恢复 / 删除）= 空间 OWNER / EDITOR（policy 映射为空间管理员），
  # 或组织 OWNER / ADMIN；其他可读成员只读。不可读、跨租户、已删除的空间一律 404 NOT_FOUND。
  # 停用（status = retired）空间只读：任务、评论、会话消息、建 Agent 等写入返回 409 SPACE_RETIRED。
  # 错误码：IDENTIFIER_TAKEN(409，details.space_name 仅在冲突空间可读时给出)、INVALID_IDENTIFIER(400)、SPACE_RETIRED(409)、
  # SPACE_NOT_RETIRED(409)、NO_CANCELED_STATUS(400)、INVALID_TARGET_SPACE(400)、CONFIRM_MISMATCH(400)、LAST_SPACE(409)、
  # LAST_OWNER(409)、ONLY_SPACE(409)、TYPE_IN_USE(409)、DEFAULT_TYPE_REQUIRED(409)、ESTIMATION_DISABLED(400)、INVALID_ESTIMATE(400)、
  # LIMIT_REACHED(409)、REPO_EXISTS(409)、VERSION_CONFLICT(409)。
  /v1/organizations/{organizationID}/spaces/{spaceID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
    get:
      operationId: getSpace
      summary: 空间详情（需空间可读；已停用空间可读）
      responses:
        '200':
          description: 空间详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceDetail' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateSpace
      summary: 修改空间资料与功能开关（乐观锁；需空间管理权限）
      description: 标识符改用 POST …/identifier；估时改用 PATCH …/estimation。已停用空间也可以修改资料。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpaceUpdateRequest' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceDetail' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteSpace
      summary: 软删除空间（需空间管理权限；不可恢复）
      description: |
        同一事务内：deleted_at/by、status = ARCHIVED；取消该空间 QUEUED / PREPARING / RUNNING 的 Run；归档该空间未归档的 Agent；
        吊销 scope = SPACE 且指向该空间的电脑授权（REVOKED，权限版本 + 1）。任一步失败整体回滚。
        confirm_name 必须与空间名完全一致（400 CONFIRM_MISMATCH）；组织里最后一个未删除空间不能删（409 LAST_SPACE）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpaceDeleteRequest' }
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceDeleteResult' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/identifier:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
    post:
      operationId: changeSpaceIdentifier
      summary: 修改空间标识符（乐观锁；需空间管理权限）
      description: |
        prefix 为 2–7 位字母数字，服务端转大写（400 INVALID_IDENTIFIER）。旧值写入历史表，旧编号仍可通过 by-display-id 跳转；
        新值是本空间自己的历史值时可以直接改回。与其他空间的现值或历史值冲突（不区分大小写）→ 409 IDENTIFIER_TAKEN。
        新旧值相同（不区分大小写且大写形式一致）时直接返回当前空间，不写历史。任务编号由前缀实时拼接，无需改写任务。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, prefix]
              additionalProperties: false
              properties:
                version: { type: integer, minimum: 1 }
                prefix: { type: string, minLength: 2, maxLength: 7 }
      responses:
        '200':
          description: 已修改
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceDetail' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/space-identifiers/{prefix}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: prefix, in: path, required: true, schema: { type: string, maxLength: 32 } }
    get:
      operationId: checkSpaceIdentifier
      summary: 标识符可用性预检（需组织成员身份）；最终以创建 / 修改时的校验为准
      parameters:
        - { name: space_id, in: query, required: false, description: 修改标识符时传入，本空间的现值与历史值视为可用, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 预检结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceIdentifierCheck' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/impact:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
    get:
      operationId: getSpaceImpact
      summary: 停用 / 删除前的影响预估（需空间管理权限）
      responses:
        '200':
          description: 影响预估
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceImpact' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/retire:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
    post:
      operationId: retireSpace
      summary: 停用空间（乐观锁；需空间管理权限；已停用 → 409 SPACE_RETIRED）
      description: |
        open_tasks 处理未完成任务（状态分类不是 DONE / CANCELLED / DUPLICATE、未删除）：
        - cancel：改为该任务类型工作流里的取消类状态（CANCELLED 分类中 position 最小的）；任一类型没有取消状态 → 400 NO_CANCELED_STATUS，整体不生效；
        - keep：保持原状；
        - move：移到 target_space_id（须可写、未停用、不是本空间，否则 400 INVALID_TARGET_SPACE）。任务类型按名称（不区分大小写）映射，
          映射不到用目标默认类型；状态按分类映射到目标类型工作流里同分类 position 最小的状态，没有同分类时用工作流默认状态；
          编号在目标空间重新分配，旧编号不跳转；父任务未一起移动时解除父子关系；本空间标签、Agent / 小队处理人被移除（人员处理人保留）。
        同一事务内取消该空间 QUEUED / PREPARING / RUNNING 的 Run（会话保留），并设 status = ARCHIVED、retired_at/by。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpaceRetireRequest' }
      responses:
        '200':
          description: 已停用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceRetireResult' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/restore:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
    post:
      operationId: restoreSpace
      summary: 恢复已停用空间为 ACTIVE（乐观锁；需空间管理权限；不恢复被取消的任务；未停用 → 409 SPACE_NOT_RETIRED）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              additionalProperties: false
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 已恢复
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceDetail' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/space-order:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    put:
      operationId: putSpaceOrder
      summary: 保存当前用户的侧栏空间顺序（整体替换）
      description: space_ids 为当前用户的完整顺序（最多 500 个，不能重复）；不可读或已删除的 ID → 400 INVALID_REQUEST。只影响本人。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [space_ids]
              additionalProperties: false
              properties:
                space_ids:
                  type: array
                  maxItems: 500
                  items: { type: string, format: uuid }
      responses:
        '204': { description: 已保存 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/repos:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
    get:
      operationId: listSpaceRepos
      summary: 空间 Git 仓库（需空间可读），按 position, created_at, id
      responses:
        '200':
          description: 仓库列表
          content:
            application/json:
              schema:
                type: object
                required: [repos]
                properties:
                  repos:
                    type: array
                    items: { $ref: '#/components/schemas/SpaceRepo' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createSpaceRepo
      summary: 添加仓库（需空间管理权限；最多 20 个 → 409 LIMIT_REACHED；URL 重复 → 409 REPO_EXISTS）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpaceRepoCreateRequest' }
      responses:
        '201':
          description: 已添加
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceRepo' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/repos/{repoID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - { name: repoID, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateSpaceRepo
      summary: 修改仓库（乐观锁；需空间管理权限）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpaceRepoPatch' }
      responses:
        '200':
          description: 已修改
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceRepo' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteSpaceRepo
      summary: 删除仓库（需空间管理权限；version 不一致 → 409 VERSION_CONFLICT）
      parameters:
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '204': { description: 已删除 }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/members/{userID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - { name: userID, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: upsertSpaceMember
      summary: 添加成员或修改角色
      description: |
        需空间成员管理权限；只有组织 OWNER / ADMIN 能授予 OWNER。目标必须是本组织 ACTIVE 成员（否则 404）。
        自助加入：操作人对自己、空间为 SHARED、操作人不是 GUEST 且没有被撤销的显式成员关系时，可以 role = MEMBER 加入（无需管理权限）。
        把最后一个 ACTIVE OWNER 降级或设为 REVOKED → 409 LAST_OWNER。status 默认 ACTIVE。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              additionalProperties: false
              properties:
                role: { type: string, enum: [OWNER, EDITOR, MEMBER, VIEWER], description: 兼容旧值 ADMINISTRATOR / ADMIN（= EDITOR）、VISITOR（= VIEWER） }
                status: { type: string, enum: [ACTIVE, REVOKED] }
      responses:
        '200':
          description: 成员
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceMember' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: removeSpaceMember
      summary: 移出成员 / 离开空间
      description: |
        需空间成员管理权限；对自己调用即「离开空间」（无需管理权限）。删除显式成员行（SHARED 空间的非成员仍可读，与未加入时一致）。
        最后一个 ACTIVE OWNER → 409 LAST_OWNER；离开后自己没有任何可读的活跃空间 → 409 ONLY_SPACE。目标不是成员 → 404。
      responses:
        '204': { description: 已移出 }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/task-type-templates:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listTaskTypeTemplates
      summary: 推荐任务类型模板（后端常量；需组织成员身份）
      description: 名称与描述为英文默认值，界面按 key 翻译。purposes 为适用的空间用途；用 POST task-types 按模板创建（name / description / icon 由前端按模板填写）。
      parameters:
        - { name: purpose, in: query, required: false, description: 只返回适用于该用途的模板, schema: { $ref: '#/components/schemas/SpacePurpose' } }
      responses:
        '200':
          description: 模板列表
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items: { $ref: '#/components/schemas/TaskTypeTemplate' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/estimation:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
    patch:
      operationId: updateSpaceEstimation
      summary: 修改估时设置（乐观锁；需空间管理权限）
      description: |
        convert 在同一事务内把已有估时按映射批量改写（只改本空间未删除任务；to = null 表示清空；from 不能重复；
        to 必须符合新刻度，否则 400 INVALID_ESTIMATE）。映射同时生效（不会链式转换）。converted_tasks 为实际改写的任务数。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpaceEstimationUpdateRequest' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                type: object
                required: [space, converted_tasks]
                properties:
                  space: { $ref: '#/components/schemas/SpaceDetail' }
                  converted_tasks: { type: integer, minimum: 0 }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/estimation/preview:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
    get:
      operationId: previewSpaceEstimation
      summary: 估时转换预览：本空间未删除任务当前用到的估时值及计数（需空间可读）
      parameters:
        - { name: scale, in: query, required: true, schema: { $ref: '#/components/schemas/EstimationScale' } }
        - { name: extended, in: query, required: false, schema: { type: boolean, default: false } }
        - { name: allow_zero, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: 预览
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceEstimationPreview' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  # ===== /空间设置 =====

  # ===== 迭代 =====
  /v1/organizations/{organizationID}/spaces/{spaceID}/iteration-settings:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/SpaceID'
    get:
      operationId: getIterationSettings
      summary: 获取空间迭代设置
      responses:
        '200':
          description: 迭代设置与当前迭代
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IterationSettings' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateIterationSettings
      summary: 修改空间迭代设置（乐观锁）
      description: 启用自动模式时会在同一事务内补齐未来迭代；已停用空间返回 SPACE_RETIRED。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IterationSettingsPatch' }
      responses:
        '200':
          description: 修改后的迭代设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IterationSettings' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/iterations:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/SpaceID'
    get:
      operationId: listIterations
      summary: 迭代列表
      parameters:
        - { name: status, in: query, description: planned / active / completed / canceled / current；可用逗号组合已归档状态, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: 按开始时间排序的迭代列表
          content:
            application/json:
              schema:
                type: object
                required: [iterations, next_cursor]
                properties:
                  iterations:
                    type: array
                    items: { $ref: '#/components/schemas/Iteration' }
                  next_cursor: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createIteration
      summary: 手动创建迭代
      description: 自动模式下返回 ITERATION_AUTOMATIC；日期与其他非取消迭代重叠时返回 ITERATION_OVERLAP。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IterationCreateRequest' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Iteration' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/iterations/{iterationID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/SpaceID'
      - $ref: '#/components/parameters/IterationID'
    get:
      operationId: getIteration
      summary: 迭代详情
      responses:
        '200':
          description: 迭代详情与链接
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Iteration' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateIteration
      summary: 修改迭代名称与描述
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IterationPatchRequest' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Iteration' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteIteration
      summary: 删除计划中或已取消的迭代
      parameters:
        - name: version
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '400': { $ref: '#/components/responses/Error' }
        '204': { description: 已删除，任务移出迭代 }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/iterations/{iterationID}/dates:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/SpaceID'
      - $ref: '#/components/parameters/IterationID'
    post:
      operationId: updateIterationDates
      summary: 修改迭代日期
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IterationDatesRequest' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Iteration' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/iterations/{iterationID}/start:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/SpaceID'
      - $ref: '#/components/parameters/IterationID'
    post:
      operationId: startIteration
      summary: 手动开始迭代
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IterationVersionRequest' }
      responses:
        '200':
          description: 已开始
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Iteration' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/iterations/{iterationID}/complete:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/SpaceID'
      - $ref: '#/components/parameters/IterationID'
    post:
      operationId: completeIteration
      summary: 手动完成迭代
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IterationCompleteRequest' }
      responses:
        '200':
          description: 已完成
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Iteration' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/iterations/{iterationID}/tasks:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/SpaceID'
      - $ref: '#/components/parameters/IterationID'
    post:
      operationId: updateIterationTasks
      summary: 批量加入或移出迭代
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IterationTaskBatchRequest' }
      responses:
        '200':
          description: 批量操作结果
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: integer, minimum: 0 }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/iterations/{iterationID}/links:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/SpaceID'
      - $ref: '#/components/parameters/IterationID'
    post:
      operationId: createIterationLink
      summary: 添加迭代文档或链接
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IterationLinkCreateRequest' }
      responses:
        '201':
          description: 已添加
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IterationLink' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/iterations/{iterationID}/links/{linkID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/SpaceID'
      - $ref: '#/components/parameters/IterationID'
      - $ref: '#/components/parameters/IterationLinkID'
    delete:
      operationId: deleteIterationLink
      summary: 删除迭代链接
      responses:
        '204': { description: 已删除 }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  # ===== /迭代 =====

  # ===== 专项与视图 =====
  /v1/organizations/{organizationID}/projects:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listProjects
      summary: 空间的专项列表（按创建时间倒序）
      description: 空间未启用专项 → 400 PROJECTS_DISABLED；只返回当前用户可读的关联空间。
      parameters:
        - { name: space_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ProjectStatus' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: 专项列表
          content:
            application/json:
              schema:
                type: object
                required: [projects, next_cursor]
                properties:
                  projects: { type: array, items: { $ref: '#/components/schemas/Project' } }
                  next_cursor: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createProject
      summary: 新建专项（space_id 即主空间）
      description: 需要该空间的任务写权限；空间停用 409 SPACE_RETIRED；未启用专项 400 PROJECTS_DISABLED。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreateRequest' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/projects/{projectID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/ProjectID'
    get:
      operationId: getProject
      summary: 专项详情（含进度分布）
      responses:
        '200':
          description: 专项
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateProject
      summary: 修改专项属性（乐观锁）
      description: 写权限 = 主空间管理权限，或任一关联空间的任务写权限；主空间停用 409 SPACE_RETIRED。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectPatchRequest' }
      responses:
        '200':
          description: 修改后的专项
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteProject
      summary: 删除专项（硬删除，仅主空间管理者）
      description: 同一事务内清空任务的 project_id（每个任务写 task.project_changed 动态）后删除。
      parameters:
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '204': { description: 已删除 }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/projects/{projectID}/delete-impact:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/ProjectID'
    get:
      operationId: getProjectDeleteImpact
      summary: 删除专项的影响（受影响任务数）
      responses:
        '200':
          description: 影响
          content:
            application/json:
              schema:
                type: object
                required: [task_count]
                properties:
                  task_count: { type: integer }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/projects/{projectID}/spaces:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/ProjectID'
    get:
      operationId: listProjectSpaces
      summary: 专项的关联空间（只含可读空间）
      responses:
        '200':
          description: 关联空间
          content:
            application/json:
              schema:
                type: object
                required: [spaces]
                properties:
                  spaces: { type: array, items: { $ref: '#/components/schemas/ProjectSpace' } }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: addProjectSpace
      summary: 添加关联空间
      description: 需要对专项的写权限与目标空间的任务写权限；目标空间未启用专项 400 PROJECTS_DISABLED。已关联时幂等。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [space_id]
              additionalProperties: false
              properties:
                space_id: { type: string, format: uuid }
      responses:
        '204': { description: 已添加 }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/projects/{projectID}/spaces/{spaceID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/SpaceID'
    delete:
      operationId: removeProjectSpace
      summary: 移除关联空间
      description: 主空间不能移除（409 PRIMARY_SPACE，也保证了不会移除最后一个空间）；该空间里属于此专项的任务清空 project_id。
      responses:
        '204': { description: 已移除 }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/projects/{projectID}/spaces/{spaceID}/primary:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/SpaceID'
    put:
      operationId: setProjectPrimarySpace
      summary: 设为主空间
      description: 需要专项的写权限；已是主空间时幂等。
      responses:
        '204': { description: 已设置 }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/projects/{projectID}/labels:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/ProjectID'
    put:
      operationId: setProjectLabels
      summary: 整体替换专项标签
      description: 标签必须未归档，且是组织级标签或属于已关联的空间，否则 400。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label_ids]
              additionalProperties: false
              properties:
                label_ids: { type: array, maxItems: 50, items: { type: string, format: uuid } }
      responses:
        '204': { description: 已设置 }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/views:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/SpaceID'
    get:
      operationId: listViews
      summary: 本人可见的视图（personal 本人 + space），按本人 position、created_at 排序
      responses:
        '200':
          description: 视图列表
          content:
            application/json:
              schema:
                type: object
                required: [views]
                properties:
                  views: { type: array, items: { $ref: '#/components/schemas/View' } }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createView
      summary: 新建视图
      description: 需要空间任务写权限；未启用视图 400 VIEWS_DISABLED；filters 非法 400 INVALID_VIEW_FILTERS。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ViewCreateRequest' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/View' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/views/reorder-mine:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/SpaceID'
    put:
      operationId: reorderMyViews
      summary: 写本人的视图排序（按给定顺序写 position）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [view_ids]
              additionalProperties: false
              properties:
                view_ids: { type: array, maxItems: 200, items: { type: string, format: uuid } }
      responses:
        '204': { description: 已保存 }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/views/{viewID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/ViewID'
    get:
      operationId: getView
      summary: 视图详情（他人的 personal 视图 404）
      responses:
        '200':
          description: 视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/View' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateView
      summary: 修改视图（乐观锁）
      description: personal 视图只有创建者能改；space 视图创建者或空间管理者能改；可见性只有创建者能改（否则 403）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ViewPatchRequest' }
      responses:
        '200':
          description: 修改后的视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/View' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteView
      summary: 删除视图
      parameters:
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '204': { description: 已删除 }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/views/{viewID}/pin-mine:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/ViewID'
    put:
      operationId: pinMyView
      summary: 本人置顶 / 取消置顶视图
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pinned]
              additionalProperties: false
              properties:
                pinned: { type: boolean }
      responses:
        '204': { description: 已保存 }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/views/{viewID}/view-mode-mine:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/ViewID'
    put:
      operationId: setMyViewMode
      summary: 本人对该视图的展示方式（null = 跟随视图）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [view_mode]
              additionalProperties: false
              properties:
                view_mode: { type: [string, 'null'], enum: [list, board, table, null] }
      responses:
        '204': { description: 已保存 }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/icons:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    post:
      operationId: uploadIcon
      summary: 上传图标（multipart，字段 file）
      description: 只接受 png / jpeg / webp / gif（按文件头判断，不接受 SVG），不超过 1 MiB（400 INVALID_ICON / 413 ICON_TOO_LARGE）。未配置存储返回 503 STORAGE_UNAVAILABLE，前端据此禁用上传页签（没有单独的能力字段）。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: 已上传
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadedIcon' }
        '400': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/icons/{iconID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - name: iconID
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getIcon
      summary: 图标原始字节（同组织成员）
      description: 带 X-Content-Type-Options nosniff、Cache-Control private max-age=86400、Content-Security-Policy default-src 'none'。
      responses:
        '200':
          description: 图片
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  # ===== /专项与视图 =====

  # ===== 分拣台 =====
  /v1/organizations/{organizationID}/spaces/{spaceID}/triage:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/SpaceID'
    get:
      operationId: listTriageTasks
      summary: 分拣队列
      description: 自定义字段按 cf_{字段UUID} 或 cf_{字段UUID}_not 重复传值（每字段最多 20 个值，每值最多 100 个字符），只匹配当前任务类型绑定的有效字段。只返回在分拣台里的任务；默认隐藏尚未到期的稍后处理任务，按进入分拣台时间倒序。筛选参数与任务列表相同（同一个解析器）。
      parameters:
        - *typeIDParam
        - *typeIDNotParam
        - *priorityParam
        - *priorityNotParam
        - *assigneeParam
        - *assigneeNotParam
        - *labelIDParam
        - *labelIDNotParam
        - *creatorIDParam
        - *creatorIDNotParam
        - *createdViaAgentParam
        - *projectIDParam
        - *projectIDNotParam
        - *iterationIDParam
        - *iterationIDNotParam
        - *qParam
        - *qNotParam
        - *dueFromParam
        - *dueToParam
        - *dueNotParam
        - { name: subscriber, in: query, schema: { type: array, items: { type: string, format: uuid } } }
        - { name: subscriber_not, in: query, schema: { type: array, items: { type: string, format: uuid } } }
        - { name: relation, in: query, schema: { type: array, items: { type: string, enum: [parent, subtask, blocked, blocking, duplicate] } } }
        - { name: relation_not, in: query, schema: { type: array, items: { type: string, enum: [parent, subtask, blocked, blocking, duplicate] } } }
        - { name: sort_mode, in: query, description: 分拣台按编号 UUID 升序打破并列；优先级顺序为无、紧急、高、中、低、最低。省略时沿用旧排序和游标。, schema: { type: string, enum: [workbench] } }
        - { name: sort, in: query, schema: { type: string, enum: [entered, priority, created, due], default: entered } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: include_snoozed, in: query, schema: { type: boolean, default: false } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: 分拣任务页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriageTaskPage' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/organizations/{organizationID}/spaces/{spaceID}/triage/candidates:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
    get:
      operationId: getTriageCandidates
      summary: 当前空间分拣筛选菜单的选项计数
      description: 使用与分拣列表相同的筛选参数；客户端省略正在编辑的字段。按字段聚合，最多返回 4096 个非零选项，超限时 complete 为 false。
      parameters:
        - { name: field, in: query, required: true, schema: { type: string }, description: "priority, type, assignee, crew, subscriber, label, creator, project, iteration 或 cf_{UUID} 的可选值字段" }
        - { name: include_snoozed, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: 当前筛选和权限下的候选数
          content:
            application/json:
              schema:
                type: object
                required: [counts, complete]
                properties:
                  counts: { type: object, additionalProperties: { type: integer } }
                  complete: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/organizations/{organizationID}/spaces/{spaceID}/triage/favorite:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/SpaceID'
    put:
      operationId: favoriteTriage
      summary: 收藏当前用户可读空间的分拣台（幂等）
      responses:
        '204': { description: 已收藏 }
    delete:
      operationId: unfavoriteTriage
      summary: 取消本人对分拣台的收藏（幂等）
      responses:
        '204': { description: 已取消 }
  /v1/organizations/{organizationID}/spaces/{spaceID}/triage/count:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/SpaceID'
    get:
      operationId: getTriageCount
      summary: 分拣任务数
      responses:
        '200':
          description: 分拣任务数
          content:
            application/json:
              schema:
                type: object
                required: [total, snoozed]
                properties:
                  total: { type: integer, minimum: 0 }
                  snoozed: { type: integer, minimum: 0 }
                  next_snooze_at: { type: [string, "null"], format: date-time }
        '404': { $ref: '#/components/responses/Error' }

  /v1/organizations/{organizationID}/spaces/{spaceID}/automations:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
    get:
      operationId: listAutomations
      summary: 空间的自动化（需空间读权限），按 position、created_at 排序
      responses:
        '200':
          description: 自动化
          content:
            application/json:
              schema:
                type: object
                required: [automations]
                properties:
                  automations: { type: array, items: { $ref: '#/components/schemas/Automation' } }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createAutomation
      summary: 新建自动化（空间可写成员；停用空间 409）；指派的 Agent / 小队必须是本空间可指派的，通知人员必须能读该空间；每个空间最多 100 个
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AutomationInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutomationSaveResult' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/automations/reorder:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
    put:
      operationId: reorderAutomations
      summary: 调整顺序（automation_ids 必须恰好是空间的全部自动化）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [automation_ids]
              properties:
                automation_ids: { type: array, maxItems: 100, items: { type: string, format: uuid } }
      responses:
        '204': { description: 已保存 }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/automations/{automationID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - &automationIDParam { name: automationID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAutomation
      responses:
        '200':
          description: 自动化
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Automation' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateAutomation
      summary: 修改自动化（乐观锁 version）。triggers 出现时整体替换：带 id 的保留（webhook 的 URL 与密钥不变），不带 id 的新建，缺少的删除
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              additionalProperties: false
              properties:
                version: { type: integer, minimum: 1 }
                title: { type: string, minLength: 1, maxLength: 120 }
                prompt: { type: string, minLength: 1, maxLength: 20000 }
                assignee:
                  type: object
                  required: [kind, id]
                  properties:
                    kind: { type: string, enum: [AGENT, CREW] }
                    id: { type: string, format: uuid }
                notify_user_ids: { type: array, maxItems: 20, items: { type: string, format: uuid } }
                enabled: { type: boolean }
                triggers: { type: array, minItems: 1, maxItems: 10, items: { $ref: '#/components/schemas/AutomationTriggerInput' } }
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutomationSaveResult' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteAutomation
      summary: 删除自动化（连同触发器、运行记录与投递记录；已创建的会话保留）
      parameters:
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '204': { description: 已删除 }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/automations/{automationID}/run:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *automationIDParam
    post:
      operationId: runAutomation
      summary: 立即运行（停用的自动化也可以手动运行一次；上一次还在运行时返回 status = skipped 的记录）
      description: |
        停用（enabled = false）只阻止自动触发（定时、任务状态、评论、Webhook 及其重放），
        手动「立即运行」照常执行，记录的 trigger_kind = manual，不会恢复规则的启用状态。
        更早的服务端对停用的自动化返回 409 AUTOMATION_DISABLED，客户端应保留该错误的提示。
      responses:
        '201':
          description: 运行记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutomationRun' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/automations/{automationID}/runs:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *automationIDParam
    get:
      operationId: listAutomationRuns
      summary: 运行记录（新的在前，每页 50）
      parameters:
        - *cursorParam
      responses:
        '200':
          description: 运行记录
          content:
            application/json:
              schema:
                type: object
                required: [runs, next_cursor]
                properties:
                  runs: { type: array, items: { $ref: '#/components/schemas/AutomationRun' } }
                  next_cursor: { type: string }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/automations/{automationID}/runs/{runID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *automationIDParam
      - { name: runID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAutomationRun
      responses:
        '200':
          description: 运行详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutomationRunDetail' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/automations/{automationID}/triggers/{triggerID}/webhook-url:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *automationIDParam
      - &triggerIDParam { name: triggerID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: regenerateWebhookURL
      summary: 重新生成 Webhook URL（旧 URL 立即失效；新 URL 只返回这一次）
      responses:
        '200':
          description: 新 URL
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/automations/{automationID}/triggers/{triggerID}/signing-secret:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *automationIDParam
      - *triggerIDParam
    get:
      operationId: getWebhookSigningSecret
      summary: 显示签名密钥（空间可写成员；没有密钥配置时 503 SECRETS_UNAVAILABLE；还没有密钥时 404）
      responses:
        '200':
          description: 密钥
          content:
            application/json:
              schema:
                type: object
                required: [secret]
                properties:
                  secret: { type: string, description: 'whsec_ 开头' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      operationId: resetWebhookSigningSecret
      summary: 生成或重置签名密钥（旧密钥立即失效）
      responses:
        '200':
          description: 新密钥
          content:
            application/json:
              schema:
                type: object
                required: [secret]
                properties:
                  secret: { type: string }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/automations/{automationID}/deliveries:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *automationIDParam
    get:
      operationId: listWebhookDeliveries
      summary: Webhook 投递记录（新的在前，每页 50）
      parameters:
        - *cursorParam
      responses:
        '200':
          description: 投递
          content:
            application/json:
              schema:
                type: object
                required: [deliveries, next_cursor]
                properties:
                  deliveries: { type: array, items: { $ref: '#/components/schemas/WebhookDelivery' } }
                  next_cursor: { type: string }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/automations/{automationID}/deliveries/{deliveryID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *automationIDParam
      - &deliveryIDParam { name: deliveryID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getWebhookDelivery
      responses:
        '200':
          description: 投递详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDeliveryDetail' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/automations/{automationID}/deliveries/{deliveryID}/replay:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *automationIDParam
      - *deliveryIDParam
    post:
      operationId: replayWebhookDelivery
      summary: 重放一次投递（新建一条 replay_of 指向原投递的记录，跳过签名与去重检查；不可重放时 409 NOT_REPLAYABLE）
      responses:
        '201':
          description: 新投递
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDelivery' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/hooks/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string, maxLength: 128 } }
    post:
      operationId: receiveWebhook
      summary: Webhook 接收端（公开，不需要登录）。请求体 ≤ 256 KB（超出 413），每个 URL 每分钟最多 60 次（超出 429）
      description: |
        签名（开启签名校验时必需）：请求头 X-OpenFox-Timestamp（Unix 秒，与服务器时间相差不超过 300 秒）与
        X-OpenFox-Signature = "v1=" + hex(HMAC-SHA256(secret, timestamp + "." + body))；也接受 GitHub 的
        X-Hub-Signature-256 = "sha256=" + hex(HMAC-SHA256(secret, body))（此时不检查时间戳）。
        去重：优先用 X-OpenFox-Delivery / X-GitHub-Delivery / X-Request-Id 请求头，否则用 body 的 SHA-256；
        10 分钟内相同去重键只处理一次（返回 200 status = ignored）。
        IP 白名单开启时，来源 IP 不在白名单内返回 403。URL 不存在 404；自动化或触发器停用时记为 ignored。
      requestBody:
        content:
          '*/*':
            schema: { type: string, format: binary }
      responses:
        '202':
          description: 已接收并派发
          content:
            application/json:
              schema:
                type: object
                required: [delivery_id, status]
                properties:
                  delivery_id: { type: string, format: uuid }
                  status: { type: string }
        '200': { description: 重复或已忽略 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/doc-sets:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
    get:
      operationId: listDocSets
      summary: 空间的文档集（空间可读），按 position、created_at
      responses:
        '200':
          description: 文档集
          content:
            application/json:
              schema:
                type: object
                required: [doc_sets]
                properties:
                  doc_sets: { type: array, items: { $ref: '#/components/schemas/DocSet' } }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createDocSet
      summary: 新建文档集（空间可写成员；停用空间 409；每个空间最多 200 个）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocSetInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocSet' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/doc-sets/{docSetID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - { name: docSetID, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateDocSet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/DocSetInput'
                - type: object
                  required: [version]
                  properties:
                    version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocSet' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteDocSet
      summary: 删除文档集与其中全部文档（不可恢复）
      parameters:
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '204': { description: 已删除 }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/docs:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
    get:
      operationId: listDocNodes
      summary: 列出某个容器内某个父节点下的子节点（按 position、title；每次最多 500）
      parameters:
        - { name: container, in: query, required: true, schema: { type: string, enum: [personal, set] } }
        - { name: set_id, in: query, schema: { type: string, format: uuid } }
        - { name: parent_id, in: query, schema: { type: string, format: uuid }, description: 缺省 = 容器根 }
      responses:
        '200':
          description: 节点
          content:
            application/json:
              schema:
                type: object
                required: [nodes]
                properties:
                  nodes: { type: array, items: { $ref: '#/components/schemas/DocNode' } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createDocNode
      summary: 新建文件夹 / 文档 / 表格（文档集要求空间可写；我的文档只要空间可读）。每个容器最多 5000 个节点、树深最多 10 层
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [container, kind, title]
              additionalProperties: false
              properties:
                container: { $ref: '#/components/schemas/DocContainer' }
                parent_id: { type: string, format: uuid, description: 必须是同一容器里的文件夹 }
                kind: { type: string, enum: [folder, doc, sheet] }
                title: { type: string, maxLength: 200 }
                body: { type: string, description: doc / sheet 的初始正文（≤ 2 MB）；缺省为空 }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocNodeDetail' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/docs/upload:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
    post:
      operationId: uploadDocFile
      summary: 上传一个文件（multipart：container、set_id、parent_id、file）。.md 变为 doc、.csv 变为 sheet（必须是 UTF-8 且 ≤ 2 MB，否则按 file），其余为 file；文件 ≤ 20 MB（超出 413）；存储未配置 503
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [container, file]
              properties:
                container: { type: string, enum: [personal, set] }
                set_id: { type: string, format: uuid }
                parent_id: { type: string, format: uuid }
                file: { type: string, format: binary }
      responses:
        '201':
          description: 已上传
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocNode' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/docs/search:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
    get:
      operationId: searchDocs
      summary: 按名称搜索（不区分大小写；范围 = 我的文档 + 当前用户能读到的文档集；最多 50 条）
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
      responses:
        '200':
          description: 结果
          content:
            application/json:
              schema:
                type: object
                required: [nodes]
                properties:
                  nodes: { type: array, items: { $ref: '#/components/schemas/DocNode' } }
        '400': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/docs/{nodeID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - &docNodeIDParam { name: nodeID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getDocNode
      responses:
        '200':
          description: 节点
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocNodeDetail' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateDocNode
      summary: 重命名或保存正文（乐观锁 version；正文只对 doc / sheet）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              additionalProperties: false
              properties:
                version: { type: integer, minimum: 1 }
                title: { type: string, maxLength: 200 }
                body: { type: string }
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocNodeDetail' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteDocNode
      summary: 删除节点与其子树（不可恢复）
      parameters:
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '204': { description: 已删除 }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/docs/{nodeID}/revisions:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *docNodeIDParam
    get:
      operationId: listDocRevisions
      summary: 文档历史元数据，按版本倒序，每页最多 50 条；权限跟随当前文档
      parameters:
        - { name: before, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: 历史记录（不包含正文）；next_before 为 0 表示最后一页
          content:
            application/json:
              schema:
                type: object
                required: [revisions, next_before]
                properties:
                  revisions: { type: array, items: { $ref: '#/components/schemas/DocRevision' } }
                  next_before: { type: integer, minimum: 0 }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/docs/{nodeID}/revisions/{revision}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *docNodeIDParam
      - &docRevisionParam { name: revision, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getDocRevision
      responses:
        '200':
          description: 单个历史版本（含 Markdown 或 CSV 正文）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocRevision' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/docs/{nodeID}/revisions/{revision}/restore:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *docNodeIDParam
      - *docRevisionParam
    post:
      operationId: restoreDocRevision
      summary: 恢复标题与正文；生成新版本，保留历史，版本过期返回 409
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 恢复后的当前文档
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocNodeDetail' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/docs/{nodeID}/move:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *docNodeIDParam
    post:
      operationId: moveDocNode
      summary: 移动节点（连同子树），可以跨容器、跨空间；不能移入自身或子孙（400 DOC_MOVE_INTO_SELF）；源与目标都要求可写
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, target_space_id, container]
              additionalProperties: false
              properties:
                version: { type: integer, minimum: 1 }
                target_space_id: { type: string, format: uuid }
                container: { $ref: '#/components/schemas/DocContainer' }
                parent_id: { type: [string, 'null'], format: uuid, description: 目标文件夹；null = 容器根 }
                before_id: { type: [string, 'null'], format: uuid, description: 放在这个兄弟节点之前；null = 放到最后 }
      responses:
        '200':
          description: 已移动
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocNode' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/docs/{nodeID}/download:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *docNodeIDParam
    get:
      operationId: downloadDocNode
      summary: 下载（doc 为 .md、sheet 为 .csv、file 为原文件；Content-Disposition attachment）；文件夹 400
      responses:
        '200':
          description: 文件
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/docs/{nodeID}/attachments:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *docNodeIDParam
    post:
      operationId: uploadDocAttachment
      summary: 上传文档附件（编辑器的插入图片 / 上传附件；multipart file；≤ 20 MB（超出 413）；需要该文档可写）
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: 已上传
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocAttachment' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/doc-attachments/{attachmentID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - { name: attachmentID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getDocAttachment
      summary: 读取附件（与所属文档同样的读权限；图片 inline，其余 attachment；nosniff）
      responses:
        '200':
          description: 文件
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Error' }
  # ===== 任务附件与对话附件 =====
  /v1/organizations/{organizationID}/spaces/{spaceID}/tasks/{taskID}/attachments:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *taskIDParam
    get:
      operationId: listTaskAttachments
      summary: 任务附件列表（任务可读；按上传时间正序，最多 100 个）
      responses:
        '200':
          description: 附件
          content:
            application/json:
              schema:
                type: object
                required: [attachments]
                properties:
                  attachments:
                    type: array
                    items: { $ref: '#/components/schemas/Attachment' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: uploadTaskAttachment
      summary: 上传任务附件（multipart file；需要任务可编辑）
      description: |
        单文件 ≤ 20 MB（413 ATTACHMENT_TOO_LARGE）；每个任务最多 100 个（409 ATTACHMENT_LIMIT）。
        类型按扩展名白名单加文件头嗅探判断（415 ATTACHMENT_TYPE_NOT_ALLOWED）：图片（png / jpg / gif / webp）、pdf、
        文本（txt / md / csv / json / log / yaml 等）、Office（docx / xlsx / pptx / doc / xls / ppt）、zip、svg / html / xml。
        svg / html / xml 以纯文本保存，只能下载不能预览。文件名只保留最后一个路径成分，拒绝空名与控制字符。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: 已上传
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/conversations/{conversationID}/attachments:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: conversationID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: uploadConversationAttachment
      summary: 上传对话附件（multipart file；需要可以在该会话发消息）
      description: |
        先上传、再在 postMessage 的 attachment_ids 里引用；未发送的附件只有上传人自己能看到和删除。
        同一人在同一会话最多 20 个待发送附件（409 ATTACHMENT_PENDING_LIMIT）。其余限制与 uploadTaskAttachment 相同。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: 已上传（message_id 为空）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/attachments/{attachmentID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: attachmentID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAttachment
      summary: 下载附件（任务附件按任务读权限；对话附件按会话读权限，未发送的只有上传人）
      description: |
        默认 Content-Disposition: attachment。带 ?disposition=inline 且是图片（png / jpeg / gif / webp）时 inline；
        其余类型忽略该参数。所有响应带 X-Content-Type-Options: nosniff 与 Content-Security-Policy: sandbox。
      parameters:
        - { name: disposition, in: query, required: false, schema: { type: string, enum: [inline, attachment] } }
      responses:
        '200':
          description: 文件
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteAttachment
      summary: 删除附件并清理存储对象
      description: |
        任务附件：上传人（仍需任务可编辑）或空间管理员。对话附件：只有上传人能删除尚未发送的附件（已随消息发送的 403）。
        读不到该附件的人得到 404。
      responses:
        '204': { description: 已删除 }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/device/organizations/{organizationID}/runs/{runID}/attachments/{attachmentID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *runIDParam
      - { name: attachmentID, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: generation, in: query, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getDeviceRunAttachment
      summary: 执行设备下载本次 Run 输入消息携带的一个附件（授权与 getDeviceRunContext 相同，附件必须属于该 Run 的输入消息）
      responses:
        '200':
          description: '文件（Content-Disposition: attachment）'
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  # ===== 快捷回复 =====
  /v1/organizations/{organizationID}/quick-replies:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listQuickReplies
      summary: 本人的个人快捷回复 + 组织快捷回复（各自按 position 排序）
      responses:
        '200':
          description: 列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuickReplyList' }
    post:
      operationId: createQuickReply
      summary: 新建快捷回复（ORG 级只有组织所有者 / 管理员；每级最多 50 条，超出 409 QUICK_REPLY_LIMIT）
      description: 同一个 id 重复提交且内容相同返回已有记录，内容不同 409 IDEMPOTENCY_CONFLICT。组织级写审计。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuickReplyCreateRequest' }
      responses:
        '201':
          description: 快捷回复
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuickReply' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/quick-replies/order:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    put:
      operationId: reorderQuickReplies
      summary: 按 ids 顺序重排一个级别（ids 必须恰好是该级别当前全部条目，否则 409 VERSION_CONFLICT，刷新后重试）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, ids]
              properties:
                scope: { type: string, enum: [PERSONAL, ORG] }
                ids: { type: array, maxItems: 50, items: { type: string, format: uuid } }
      responses:
        '200':
          description: 重排后的该级别列表
          content:
            application/json:
              schema:
                type: object
                required: [quick_replies]
                properties:
                  quick_replies:
                    type: array
                    items: { $ref: '#/components/schemas/QuickReply' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/quick-replies/{quickReplyID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: quickReplyID, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateQuickReply
      summary: 编辑标题 / 正文（乐观锁 version，过期 409 VERSION_CONFLICT）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuickReplyUpdateRequest' }
      responses:
        '200':
          description: 快捷回复
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuickReply' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteQuickReply
      summary: 删除（软删除）；他人的个人级与已删除的 404，组织级非管理员 403
      responses:
        '204': { description: 已删除 }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  # ===== 任务快捷指令 =====
  /v1/organizations/{organizationID}/spaces/{spaceID}/quick-commands:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
    get:
      operationId: listQuickCommands
      summary: 空间里本人的私有指令 + 共享指令（各按 position, created_at, id 排序；需要空间可读）
      description: 目标已失效（归档、换空间、改成他人私有、小队没有可用成员）时 target.available = false 并给出原因，不报错。
      responses:
        '200':
          description: 列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuickCommandList' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createQuickCommand
      summary: 新建快捷指令（需要空间写权限；每人每空间私有 50、每空间共享 50，超出 409 QUICK_COMMAND_LIMIT）
      description: >-
        目标不在本空间、已归档、他人私有、内置 Agent 时 400 INVALID_QUICK_COMMAND_TARGET。只读成员 403，
        停用空间 409 SPACE_RETIRED。同一个 id 重复提交且内容相同返回已有记录，内容不同 409 IDEMPOTENCY_CONFLICT。共享指令写审计。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuickCommandCreateRequest' }
      responses:
        '201':
          description: 快捷指令
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuickCommand' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/quick-commands/order:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
    put:
      operationId: reorderQuickCommands
      summary: 按 ids 顺序重排一个分组里本人可编辑的条目
      description: >-
        ids 必须恰好是该分组里当前成员可编辑的全部条目（私有 = 本人全部；共享 = 空间管理员全部、其他人自己创建的），
        否则 409 VERSION_CONFLICT（刷新后重试）。共享分组里不可编辑的条目位置不变。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visibility, ids]
              properties:
                visibility: { type: string, enum: [PRIVATE, SHARED] }
                ids: { type: array, maxItems: 50, items: { type: string, format: uuid } }
      responses:
        '200':
          description: 重排后的该分组列表
          content:
            application/json:
              schema:
                type: object
                required: [quick_commands]
                properties:
                  quick_commands:
                    type: array
                    items: { $ref: '#/components/schemas/QuickCommand' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/quick-commands/{quickCommandID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - { name: quickCommandID, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateQuickCommand
      summary: 修改快捷指令（乐观锁 version，过期 409 VERSION_CONFLICT）
      description: >-
        可改全部字段，包括可见性（移到另一分组末尾，受该分组上限约束）。私有只有本人，共享只有创建人与空间管理员，否则 403；
        他人私有与已删除 404。只有目标变化时才重新校验目标（400 INVALID_QUICK_COMMAND_TARGET）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuickCommandUpdateRequest' }
      responses:
        '200':
          description: 快捷指令
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuickCommand' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteQuickCommand
      summary: 删除（软删除）；他人私有与已删除 404，无权维护的共享指令 403
      responses:
        '204': { description: 已删除 }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  # ===== 技能 =====
  /v1/organizations/{organizationID}/spaces/{spaceID}/skills:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
    get:
      operationId: listSkills
      summary: 空间的技能（空间可读），最多 500 个
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 }, description: 按名称和描述搜索（不区分大小写） }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [usage, updated, created], default: updated } }
        - { name: created_by, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 技能
          content:
            application/json:
              schema:
                type: object
                required: [skills, can_create]
                properties:
                  skills: { type: array, items: { $ref: '#/components/schemas/Skill' } }
                  can_create: { type: boolean, description: 空间可写且未停用 }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createSkill
      summary: 手动创建技能（空间可写成员；停用空间 409；每个空间最多 500 个）。服务端拼出 SKILL.md（frontmatter name、description + 指令）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkillCreateInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillDetail' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error', description: 'SKILL_NAME_TAKEN：同名技能已存在；SPACE_RETIRED；SKILL_LIMIT' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/skills/upload:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
    post:
      operationId: uploadSkill
      summary: 上传技能文件（multipart）：一个 .md（带 frontmatter）、一个含 SKILL.md 的 .zip，或一个文件夹的多个文件（每个 file 之后跟一个 file_path 字段写相对路径）
      description: |
        合计 ≤ 5 MB、≤ 100 个文件；zip 解压后同样受限（超限 413 SKILL_TOO_LARGE）；路径非法或缺少 SKILL.md 400 SKILL_INVALID；
        名称取 SKILL.md frontmatter 的 name，不合规则 400 SKILL_NAME_INVALID；同名 409 SKILL_NAME_TAKEN；存储未配置 503。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: array, items: { type: string, format: binary } }
                file_path: { type: array, items: { type: string } }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillDetail' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/skills/url-imports:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
    post:
      operationId: importSkillFromURL
      summary: 通过 URL 安装技能（只允许 https）
      description: |
        支持：直接指向 SKILL.md 或 .md 的地址、.zip 地址；GitHub blob 地址（转 raw.githubusercontent.com）、
        GitHub tree 地址（走 GitHub contents 公开接口逐个下载该目录）。
        服务端 SSRF 防护：只允许 https 与 443 端口；解析后拒绝回环、内网、链路本地、CGNAT、组播与保留地址，连接绑定已校验的 IP；
        重定向 ≤ 3 次且逐跳校验；整体 15 秒；下载合计 ≤ 5 MB。
        地址不合法 400 SKILL_URL_INVALID；目标被拒绝 400 SKILL_URL_FORBIDDEN；下载失败 / 超时 / 内容不是技能 422 SKILL_URL_FETCH_FAILED（message 为可展示原因）；
        其余同 uploadSkill。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              additionalProperties: false
              properties:
                url: { type: string, maxLength: 2048 }
      responses:
        '201':
          description: 已安装
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillDetail' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/skills/runtime-imports:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
    post:
      operationId: createSkillRuntimeImport
      summary: 从本地电脑导入技能：给自己的电脑下发 skill_import 命令（空间可写；一次 1–20 个，名称来自 skill_scan 结果）
      description: |
        电脑不是本人的 404；同一台电脑已有未完成的导入 409 COMMAND_BUSY；电脑离线时命令 2 分钟内未领取会过期，导入项记为 failed（COMMAND_EXPIRED）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, names]
              additionalProperties: false
              properties:
                device_id: { type: string, format: uuid }
                names: { type: array, minItems: 1, maxItems: 20, items: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$' } }
      responses:
        '202':
          description: 已下发
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillRuntimeImport' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/skills/runtime-imports/{commandID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *commandIDParam
    get:
      operationId: getSkillRuntimeImport
      summary: 导入进度（只有发起人可读）
      responses:
        '200':
          description: 进度
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillRuntimeImport' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/skills/runtime-imports/{commandID}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *commandIDParam
    post:
      operationId: cancelSkillRuntimeImport
      summary: 取消导入：还没完成的项记为 canceled，电脑之后上传的技能被拒绝（幂等）
      responses:
        '200':
          description: 已取消
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillRuntimeImport' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/skills/{skillID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - &skillIDParam { name: skillID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getSkill
      summary: 技能详情（文件清单与使用它的 Agent）
      responses:
        '200':
          description: 技能
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillDetail' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteSkill
      summary: 删除技能（创建者或组织管理员；停用空间 409）；同时从所有 Agent 卸下
      parameters:
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '204': { description: 已删除 }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/skills/{skillID}/files:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *skillIDParam
    get:
      operationId: getSkillFile
      summary: 读取一个文件。UTF-8 文本返回 content；其他返回 binary = true（content 为空）
      parameters:
        - { name: path, in: query, required: true, schema: { type: string, maxLength: 256 } }
      responses:
        '200':
          description: 文件
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillFileContent' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    put:
      operationId: saveSkillFiles
      summary: 保存修改（创建者或组织管理员）：覆盖 / 新增 / 删除文件，带 version。SKILL.md 改动后重新解析 name 与 description
      description: |
        SKILL.md 不能删除；改名后与空间内其他技能重名 409 SKILL_NAME_TAKEN；frontmatter 解析失败 400 SKILL_INVALID；
        合计超过 5 MB 或 100 个文件 413 SKILL_TOO_LARGE；版本不符 409 VERSION_CONFLICT。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, changes]
              additionalProperties: false
              properties:
                version: { type: integer, minimum: 1 }
                changes:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [path]
                    additionalProperties: false
                    properties:
                      path: { type: string, maxLength: 256 }
                      content: { type: string, description: UTF-8 文本内容；省略且 delete 为 true 表示删除 }
                      delete: { type: boolean }
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillDetail' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/agents/{agentID}/skills:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *agentIDParam
    get:
      operationId: listAgentSkills
      summary: Agent 装配的技能（按 position）
      responses:
        '200':
          description: 技能
          content:
            application/json:
              schema:
                type: object
                required: [skills]
                properties:
                  skills: { type: array, items: { $ref: '#/components/schemas/Skill' } }
        '404': { $ref: '#/components/responses/Error' }
    put:
      operationId: setAgentSkills
      summary: 整体替换 Agent 装配的技能（需能编辑该 Agent；最多 20 个；技能必须属于同一空间）。下一次 Run 生效
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skill_ids]
              additionalProperties: false
              properties:
                skill_ids: { type: array, maxItems: 20, items: { type: string, format: uuid } }
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema:
                type: object
                required: [skills]
                properties:
                  skills: { type: array, items: { $ref: '#/components/schemas/Skill' } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  # ===== /技能 =====
  # ===== 市场 =====
  /v1/organizations/{organizationID}/market/catalog:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: getMarketCatalog
      summary: 市场目录（分类、精选包、数量）。组织成员可读；目录为空（还没导入）时 categories / packs 为空数组
      responses:
        '200':
          description: 目录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketCatalog' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/market/skills:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listMarketSkills
      summary: 市场技能（分页）。按分类、关键词（名称与描述，不区分大小写）筛选；ids 按 ID 批量取（≤ 100，忽略其他筛选）
      parameters:
        - { name: category, in: query, required: false, schema: { type: string, maxLength: 64 } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [default, downloads, newest, name], default: default }, description: 'default：精选在前，其余按下载量' }
        - { name: ids, in: query, required: false, schema: { type: string, maxLength: 20000 }, description: 逗号分隔 }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 512 } }
      responses:
        '200':
          description: 技能
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, total]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/MarketSkill' } }
                  next_cursor: { type: [string, 'null'] }
                  total: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/market/skills/{marketSkillID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - &marketSkillIDParam { name: marketSkillID, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,199}$' } }
    get:
      operationId: getMarketSkill
      summary: 市场技能详情与文件清单（SKILL.md 置顶，其余按路径排序）
      responses:
        '200':
          description: 技能
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketSkillDetail' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/market/skills/{marketSkillID}/file:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *marketSkillIDParam
    get:
      operationId: getMarketSkillFile
      summary: 读取市场技能的一个文件（预览用）。UTF-8 文本返回 content，超过 1 MB 只返回前 1 MB 并 truncated = true；二进制 binary = true、content 为空
      parameters:
        - { name: path, in: query, required: true, schema: { type: string, maxLength: 256 } }
      responses:
        '200':
          description: 文件
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketSkillFileContent' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/market/skills/{marketSkillID}/download:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *marketSkillIDParam
    get:
      operationId: downloadMarketSkillFile
      summary: 下载市场技能的一个文件原文（Content-Disposition attachment，nosniff）
      parameters:
        - { name: path, in: query, required: true, schema: { type: string, maxLength: 256 } }
      responses:
        '200':
          description: 文件内容
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/market/templates:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listMarketTemplates
      summary: 市场 Agent 模板（分页，按 position）。按分类、关键词筛选
      parameters:
        - { name: category, in: query, required: false, schema: { type: string, maxLength: 64 } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 512 } }
      responses:
        '200':
          description: 模板
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, total]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/MarketTemplate' } }
                  next_cursor: { type: [string, 'null'] }
                  total: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/market/templates/{marketTemplateID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: marketTemplateID, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,199}$' } }
    get:
      operationId: getMarketTemplate
      summary: 模板详情：指令（各语言）与引用的技能（标出本平台目录里有没有）
      responses:
        '200':
          description: 模板
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketTemplateDetail' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/skills/market:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
    post:
      operationId: addMarketSkill
      summary: 把市场技能添加到空间（空间可写；复制文件成为空间技能，source_kind = market，记住来源版本）
      description: |
        空间里已有来自同一市场技能的技能 409 SKILL_MARKET_EXISTS（error.details.skill_id 为已有技能）；
        名称（取 SKILL.md frontmatter，不合规则时由市场 ID 末段规范化）与他人重名 409 SKILL_NAME_TAKEN；
        市场里没有该技能 404；其余同 createSkill。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [market_skill_id]
              additionalProperties: false
              properties:
                market_skill_id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,199}$' }
      responses:
        '201':
          description: 已添加
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillDetail' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/skills/{skillID}/market-update:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *skillIDParam
    post:
      operationId: updateMarketSkill
      summary: 把来自市场的空间技能更新到市场当前版本（创建者或组织管理员；覆盖文件，名称保持不变，描述取新版本）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              additionalProperties: false
              properties:
                version: { type: integer, minimum: 1, description: 空间技能的乐观锁版本 }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillDetail' }
        '400': { $ref: '#/components/responses/Error', description: 'SKILL_NOT_FROM_MARKET：不是市场技能' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error', description: 'VERSION_CONFLICT；SKILL_UP_TO_DATE：已是最新版本' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/agents/{agentID}/market-template:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *agentIDParam
    post:
      operationId: applyMarketTemplateSkills
      summary: 把模板引用的技能装进空间并装配给 Agent（需能编辑该 Agent，空间可写）。前端在用模板创建 Agent 之后调用
      description: |
        对每个引用：市场里没有 → missing；空间里已有同一市场技能 → 直接装配（reused）；否则添加到空间再装配（added）；
        名称与空间里其他技能冲突 → skipped（SKILL_NAME_TAKEN）；Agent 装配满 20 个后其余 → skipped（AGENT_SKILL_LIMIT）。
        已装配的不重复装配。整体在一个事务里完成（文件写入在事务外，失败时清理）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [market_template_id]
              additionalProperties: false
              properties:
                market_template_id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,199}$' }
      responses:
        '200':
          description: 结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketTemplateApplyResult' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/market/agent-targets:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listMarketAgentTargets
      summary: 当前成员能从市场安装技能的 Agent，按 Agent ID 每页最多 100 个
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: Agent 名或空间名的子串 }
        - { name: after, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 可写空间内自己的 Agent，以及组织管理员可管理的共享 Agent
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/MarketAgentTarget' } }
                  next_cursor: { type: string, description: 末页为空字符串 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/agents/{agentID}/market-skills/{marketSkillID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *agentIDParam
      - *marketSkillIDParam
    put:
      operationId: installMarketSkillOnAgent
      summary: 为指定 Agent 独立安装市场技能（固定版本及文件）
      description: 需组织成员身份、空间可写、Agent 可编辑且为自己的 Agent 或组织管理员可见的共享 Agent。同组织、Agent、市场技能 ID 重试不改变已经安装的版本、文件或顺序。安装不会创建空间技能或改写历史绑定。与已装配技能同名返回 409 AGENT_SKILL_NAME_TAKEN。移除后重新安装使用市场当时的版本。
      responses:
        '204': { description: 已装配（含重复请求） }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  # ===== /市场 =====
  /v1/organizations/{organizationID}/spaces/{spaceID}/triage-settings:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/SpaceID'
    get:
      operationId: getTriageSettings
      summary: 分拣台设置
      responses:
        '200':
          description: 分拣台设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriageSettings' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateTriageSettings
      summary: 修改分拣台设置
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TriageSettingsPatch' }
      responses:
        '200':
          description: 修改后的设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriageSettings' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/organizations/{organizationID}/spaces/{spaceID}/triage-members:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/SpaceID'
    put:
      operationId: replaceTriageMembers
      summary: 替换分拣台责任成员
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              additionalProperties: false
              properties:
                user_ids: { type: array, maxItems: 20, items: { type: string, format: uuid } }
      responses:
        '200':
          description: 责任成员
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members: { type: array, items: { $ref: '#/components/schemas/TriageMember' } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/organizations/{organizationID}/spaces/{spaceID}/triage-rules:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/SpaceID'
    get:
      operationId: listTriageRules
      summary: 分拣规则列表
      responses:
        '200':
          description: 规则列表
          content:
            application/json:
              schema:
                type: object
                required: [rules]
                properties:
                  rules: { type: array, items: { $ref: '#/components/schemas/TriageRule' } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createTriageRule
      summary: 新建分拣规则
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TriageRuleCreateRequest' }
      responses:
        '201':
          description: 分拣规则
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriageRule' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/organizations/{organizationID}/spaces/{spaceID}/triage-rules/{ruleID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/SpaceID'
      - name: ruleID
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: updateTriageRule
      summary: 修改分拣规则
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TriageRulePatchRequest' }
      responses:
        '200':
          description: 分拣规则
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriageRule' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteTriageRule
      summary: 删除分拣规则
      parameters:
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '204': { description: 已删除 }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/organizations/{organizationID}/spaces/{spaceID}/triage-rules/{ruleID}/enabled:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/SpaceID'
      - name: ruleID
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: setTriageRuleEnabled
      summary: 启用或停用分拣规则
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, enabled]
              additionalProperties: false
              properties:
                version: { type: integer, minimum: 1 }
                enabled: { type: boolean }
      responses:
        '200':
          description: 分拣规则
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriageRule' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/organizations/{organizationID}/spaces/{spaceID}/triage-rules/reorder:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/SpaceID'
    put:
      operationId: reorderTriageRules
      summary: 重排分拣规则
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rule_ids]
              additionalProperties: false
              properties:
                rule_ids: { type: array, maxItems: 50, items: { type: string, format: uuid }, description: 必须恰好是该空间的全部规则；位置不属于规则内容，不改变规则 version }
      responses:
        '200':
          description: 规则列表
          content:
            application/json:
              schema:
                type: object
                required: [rules]
                properties:
                  rules: { type: array, items: { $ref: '#/components/schemas/TriageRule' } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/organizations/{organizationID}/spaces/{spaceID}/tasks/{taskID}/triage/accept:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/SpaceID'
      - $ref: '#/components/parameters/TaskID'
    post:
      operationId: acceptTriageTask
      summary: 接受分拣任务
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TriageAcceptRequest' }
      responses:
        '200':
          description: 任务
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/organizations/{organizationID}/spaces/{spaceID}/tasks/{taskID}/triage/decline:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/SpaceID'
      - $ref: '#/components/parameters/TaskID'
    post:
      operationId: declineTriageTask
      summary: 拒绝分拣任务
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TriageDecisionRequest' }
      responses:
        '200':
          description: 任务
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/organizations/{organizationID}/spaces/{spaceID}/tasks/{taskID}/triage/duplicate:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/SpaceID'
      - $ref: '#/components/parameters/TaskID'
    post:
      operationId: markTriageDuplicate
      summary: 标记分拣任务重复
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TriageDuplicateRequest' }
      responses:
        '200':
          description: 任务
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/organizations/{organizationID}/spaces/{spaceID}/tasks/{taskID}/triage-snooze:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/SpaceID'
      - $ref: '#/components/parameters/TaskID'
    put:
      operationId: snoozeTriageTask
      summary: 稍后处理分拣任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [until]
              additionalProperties: false
              properties:
                until: { type: [string, 'null'], format: date-time }
      responses:
        '200':
          description: 任务
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  # ===== /分拣台 =====

  /v1/organizations/{organizationID}/direct-chats:
    parameters: [{"$ref": "#/components/parameters/OrganizationID"}]
    get:
      operationId: "listDirectChats"
      tags: ["DirectChat"]
      description: "Private human chat. Only active participants have access; administrators have no implicit access. Invalid input 400, inaccessible resources 404, revoked organization membership denied. Cookie mutations require CSRF."
      responses:
        "200":
          description: "Success"
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/DirectChatPage"}
        default: {"$ref": "#/components/responses/Error"}
      parameters: [{"name": "before", "in": "query", "schema": {"type": "string"}}, {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}}]
    post:
      operationId: "ensureDirectChat"
      tags: ["DirectChat"]
      description: "Private human chat. Only active participants have access; administrators have no implicit access. Invalid input 400, inaccessible resources 404, revoked organization membership denied. Cookie mutations require CSRF."
      responses:
        "200":
          description: "Success"
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/DirectChat"}
        default: {"$ref": "#/components/responses/Error"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required: ["user_id"]
              properties:
                user_id: {"type": "string", "format": "uuid"}
  /v1/organizations/{organizationID}/direct-chats/{chatID}:
    parameters: [{"$ref": "#/components/parameters/OrganizationID"}, {"name": "chatID", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}]
    get:
      operationId: "getDirectChat"
      tags: ["DirectChat"]
      description: "Private human chat. Only active participants have access; administrators have no implicit access. Invalid input 400, inaccessible resources 404, revoked organization membership denied. Cookie mutations require CSRF."
      responses:
        "200":
          description: "Success"
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/DirectChat"}
        default: {"$ref": "#/components/responses/Error"}
  /v1/organizations/{organizationID}/direct-chats/{chatID}/messages:
    parameters: [{"$ref": "#/components/parameters/OrganizationID"}, {"name": "chatID", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}]
    get:
      operationId: "listDirectMessages"
      tags: ["DirectChat"]
      description: "Private human chat. Only active participants have access; administrators have no implicit access. Invalid input 400, inaccessible resources 404, revoked organization membership denied. Cookie mutations require CSRF."
      responses:
        "200":
          description: "Success"
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/DirectChatMessages"}
        default: {"$ref": "#/components/responses/Error"}
      parameters: [{"name": "around", "in": "query", "schema": {"type": "string", "format": "uuid"}}, {"name": "after", "in": "query", "schema": {"type": "integer", "minimum": 1}}, {"name": "before", "in": "query", "schema": {"type": "integer", "format": "int64", "minimum": 0}}, {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}}]
    post:
      operationId: "sendDirectMessage"
      tags: ["DirectChat"]
      description: "Private human chat. Only active participants have access; administrators have no implicit access. Invalid input 400, inaccessible resources 404, revoked organization membership denied. Cookie mutations require CSRF. Same author/chat/client_message_id and content returns original message for the lifetime of that message; different body or attachment IDs returns 409 IDEMPOTENCY_CONFLICT. Atomic send; at most 10 attachments, nonempty body or attachments required. No Agent runs are dispatched."
      responses:
        "200":
          description: "Success"
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/DirectChatMessage"}
        default: {"$ref": "#/components/responses/Error"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/DirectChatSend"}
  /v1/organizations/{organizationID}/direct-chats/{chatID}/read:
    parameters: [{"$ref": "#/components/parameters/OrganizationID"}, {"name": "chatID", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}]
    post:
      operationId: "readDirectChat"
      tags: ["DirectChat"]
      description: "Private human chat. Only active participants have access; administrators have no implicit access. Invalid input 400, inaccessible resources 404, revoked organization membership denied. Cookie mutations require CSRF."
      responses:
        "204": {"description": "Success"}
        default: {"$ref": "#/components/responses/Error"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required: ["seq"]
              properties:
                seq: {"type": "integer", "format": "int64", "minimum": 0}
  /v1/organizations/{organizationID}/direct-chats/{chatID}/attachments:
    parameters: [{"$ref": "#/components/parameters/OrganizationID"}, {"name": "chatID", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}]
    post:
      operationId: "uploadDirectAttachment"
      tags: ["DirectChat"]
      description: "Private human chat. Only active participants have access; administrators have no implicit access. Invalid input 400, inaccessible resources 404, revoked organization membership denied. Cookie mutations require CSRF."
      responses:
        "201":
          description: "Success"
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/DirectChatFile"}
        default: {"$ref": "#/components/responses/Error"}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: "object"
              required: ["file"]
              properties:
                file: {"type": "string", "format": "binary", "description": "20 MiB maximum; existing attachment extension and content-sniffing rules apply. Maximum 20 pending files per sender per chat."}
  /v1/organizations/{organizationID}/direct-chats/{chatID}/attachments/{fileID}:
    parameters: [{"$ref": "#/components/parameters/OrganizationID"}, {"name": "chatID", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}, {"name": "fileID", "in": "path", "required": true, "schema": {"type": "string", "format": "uuid"}}]
    get:
      operationId: "downloadDirectAttachment"
      tags: ["DirectChat"]
      description: "Private human chat. Only active participants have access; administrators have no implicit access. Invalid input 400, inaccessible resources 404, revoked organization membership denied. Cookie mutations require CSRF."
      responses:
        "200":
          description: "Success"
          content:
            application/octet-stream:
              schema: {"type": "string", "format": "binary"}
        default: {"$ref": "#/components/responses/Error"}
      parameters: [{"name": "disposition", "in": "query", "schema": {"type": "string", "enum": ["attachment", "inline"]}}]
    delete:
      operationId: "removeDirectAttachment"
      tags: ["DirectChat"]
      description: "Private human chat. Only active participants have access; administrators have no implicit access. Invalid input 400, inaccessible resources 404, revoked organization membership denied. Cookie mutations require CSRF. Only the uploader can remove a pending file. Sent attachments cannot be deleted."
      responses:
        "204": {"description": "Success"}
        default: {"$ref": "#/components/responses/Error"}

components:
  parameters:
    IMProvider:
      name: imProvider
      in: path
      required: true
      description: |
        IM 服务商（飞书、Lark、钉钉共用同一套应用 / 个人绑定 / 机器人列表接口，路径里的服务商决定使用哪家的开放平台与连接）。
        未知值 404。扫码创建接口（registrations）只有飞书和 Lark 有；钉钉官方没有扫码创建应用的接口，机器人用 POST .../dingtalk/bots 直接填 AppKey / AppSecret 连接。
      schema: { type: string, enum: [feishu, lark, dingtalk] }
    OrganizationID:
      name: organizationID
      in: path
      required: true
      schema: { type: string, format: uuid }
    SpaceID:
      name: spaceID
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskID:
      name: taskID
      in: path
      required: true
      schema: { type: string, format: uuid }
    IterationID:
      name: iterationID
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectID:
      name: projectID
      in: path
      required: true
      schema: { type: string, format: uuid }
    ViewID:
      name: viewID
      in: path
      required: true
      schema: { type: string, format: uuid }
    IterationLinkID:
      name: linkID
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,128}$' }
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: 可选；带上时 24 小时内同键同请求返回首次创建的资源（响应头 Idempotent-Replayed=true），同键不同请求返回 409 IDEMPOTENCY_CONFLICT。
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,128}$' }
  responses:
    Error:
      description: 错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    DirectChat:
      type: "object"
      required: ["id", "peer", "last_seq", "read_seq", "unread_count", "last_body", "updated_at"]
      properties:
        id: {"type": "string", "format": "uuid"}
        peer:
          type: "object"
          required: ["id", "name"]
          properties:
            id: {"type": "string", "format": "uuid"}
            name: {"type": "string"}
        last_seq: {"type": "integer", "format": "int64", "minimum": 0}
        read_seq: {"type": "integer", "format": "int64", "minimum": 0}
        unread_count: {"type": "integer", "format": "int64", "minimum": 0}
        last_body: {"type": "string"}
        last_offer_kind: { type: string, enum: [INVITE, TRANSFER] }
        updated_at: {"type": "string", "format": "date-time"}
    DirectChatFile:
      type: "object"
      required: ["id", "name", "content_type", "size_bytes", "previewable"]
      properties:
        id: {"type": "string", "format": "uuid"}
        name: {"type": "string"}
        content_type: {"type": "string"}
        size_bytes: {"type": "integer", "format": "int64", "minimum": 0}
        previewable: {"type": "boolean"}
    DirectChatMessage:
      type: "object"
      required: ["id", "seq", "author_id", "body", "created_at", "attachments"]
      properties:
        id: {"type": "string", "format": "uuid"}
        offer:
          type: object
          required: [id, kind, status, title, note, transfer_assignee, conversation_id, task_display_id, can_open]
          properties:
            id: { type: string, format: uuid }
            kind: { type: string, enum: [INVITE, TRANSFER] }
            status: { type: string, enum: [PENDING, ACCEPTED, DECLINED, UNAVAILABLE] }
            title: { type: string }
            note: { type: string }
            transfer_assignee: { type: boolean }
            conversation_id: { type: string, format: uuid }
            task_display_id: { type: string }
            assistant: { type: boolean, description: 内置小助手会话；未绑定任务时 task_display_id 为空串 }
            can_open: { type: boolean }
        seq: {"type": "integer", "format": "int64", "minimum": 0}
        author_id: {"type": "string", "format": "uuid"}
        body: {"type": "string"}
        created_at: {"type": "string", "format": "date-time"}
        attachments:
          type: "array"
          items: {"$ref": "#/components/schemas/DirectChatFile"}
    DirectChatSend:
      type: "object"
      required: ["body", "client_message_id", "attachment_ids"]
      properties:
        body: {"type": "string", "maxLength": 65536}
        client_message_id: {"type": "string", "format": "uuid"}
        attachment_ids:
          type: "array"
          maxItems: 10
          uniqueItems: true
          items: {"type": "string", "format": "uuid"}
    DirectChatPage:
      type: "object"
      required: ["chats", "next_before"]
      properties:
        chats:
          type: "array"
          items: {"$ref": "#/components/schemas/DirectChat"}
        next_before: {"type": "string"}
    DirectChatMessages:
      type: "object"
      required: ["messages", "next_before"]
      properties:
        messages:
          type: "array"
          items: {"$ref": "#/components/schemas/DirectChatMessage"}
        next_after: { type: integer, minimum: 0 }
        next_before: {"type": "integer", "format": "int64", "minimum": 0}
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
    LoginSession:
      type: object
      required: [user_id, expires_at, new_user]
      properties:
        user_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        new_user: { type: boolean, description: 本次验证新注册了账号 }
    Me:
      type: object
      required: [id, email, full_name, bio, avatar_url, access_tier]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        full_name: { type: string, description: 空串表示没有设置，界面回退到邮箱 }
        bio: { type: string }
        avatar_url: { type: [string, 'null'], description: '头像地址（含 /api 前缀与 ?v= 版本参数），没有头像时为 null' }
        access_tier: { type: string, enum: [standard, beta, internal], description: beta / internal 才显示内测功能开关 }
    # ===== 个人资料与偏好 schemas =====
    CommandShortcuts:
      type: object
      additionalProperties: false
      description: 只存自定义过的命令；缺省 = 默认按键。值形如 mod+k、mod+shift+m（mod = macOS 的 ⌘ / 其他平台的 Ctrl）
      properties:
        command_menu: { type: string, maxLength: 40 }
        move_to_space: { type: string, maxLength: 40 }
        find_in_view: { type: string, maxLength: 40 }
    UserPreferences:
      type: object
      required: [theme, density, locale, outline_color, open_session_on_assign, open_session_on_quick_command, send_shortcut, command_shortcuts, version]
      properties:
        density: { type: string, enum: [comfortable, compact], default: comfortable, description: 账号级界面密度；comfortable 保持标准布局，compact 缩小列表与卡片间距 }
        theme: { type: string, enum: [system, light, dark, magic-blue, classic-dark] }
        locale: { type: [string, 'null'], enum: [zh-CN, en-US, null], description: null = 没有同步过，跟随设备 }
        outline_color: { type: integer, minimum: 0, maximum: 12, description: 0 = 不设置，1–12 = 内置外边框色 }
        open_session_on_assign: { type: boolean }
        open_session_on_quick_command: { type: boolean }
        send_shortcut: { type: string, enum: [enter, shift_enter] }
        command_shortcuts: { $ref: '#/components/schemas/CommandShortcuts' }
        version: { type: integer, minimum: 0, description: 0 = 还没有保存过（返回的是默认值） }
    UserPreferencesPatch:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 0 }
        density: { type: [string, 'null'], enum: [comfortable, compact, null], description: 缺省或 null 不改密度；与其他偏好共用 version 乐观锁 }
        theme: { type: string, enum: [system, light, dark, magic-blue, classic-dark] }
        locale: { type: string, enum: [zh-CN, en-US] }
        outline_color: { type: integer, minimum: 0, maximum: 12 }
        open_session_on_assign: { type: boolean }
        open_session_on_quick_command: { type: boolean }
        send_shortcut: { type: string, enum: [enter, shift_enter] }
        command_shortcuts: { $ref: '#/components/schemas/CommandShortcuts' }
    EmailChallenge:
      type: object
      required: [challenge_id, expires_at, resend_after]
      properties:
        challenge_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        resend_after: { type: string, format: date-time, description: 在此之前再次请求返回 429 EMAIL_RATE_LIMITED }
    # ===== /个人资料与偏好 schemas =====
    # ===== 令牌、通知渠道、内测开关、开始使用 schemas =====
    PersonalAccessToken:
      type: object
      required: [id, name, prefix, created_at, expires_at, last_used_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, description: 形如 ofx_pat_7f3a，界面显示为「ofx_pat_7f3a...」 }
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, 'null'], format: date-time, description: null = 永不过期 }
        last_used_at: { type: [string, 'null'], format: date-time, description: null = 从未使用；按分钟节流更新 }
    NotificationEvent:
      type: string
      enum: [assign, status, comment, mention, agent, automation]
      description: assign = 指派（含新任务进入分拣台）；status = 状态变更；comment = 评论与回复；mention = 提及；agent = Agent 活动（运行失败、交接）；automation = 执行自动化
    IntegrationCategory:
      type: string
      enum: [task, git, collaboration]
    IntegrationProvider:
      type: object
      required: [id, name, category, availability, template, capabilities, configured, summary]
      properties:
        id: { type: string, description: 服务商 ID（jira、github、feishu…），同一服务商的多个能力入口共用一个 ID }
        name: { type: string, description: 展示名称（品牌名，不翻译） }
        category: { $ref: '#/components/schemas/IntegrationCategory' }
        availability: { type: string, enum: [available, coming_soon] }
        template: { type: string, enum: [A, B, C1, C2, C3, C4], description: 详情页模板：A 任务管理、B 代码托管、C1 企业应用、C2 机器人凭证、C3 仅 Agent、C4 工作区 }
        capabilities:
          type: array
          items: { type: string, enum: [sync, import, pr_link, im_notify, task_assistant, agent_binding, personal_account] }
        configured: { type: boolean, description: 服务端是否已配置该服务商需要的应用凭据；不需要服务端应用的服务商恒为 true }
        bindable: { type: boolean, description: 当前版本是否已经开放绑定（false 时详情页的绑定按钮显示「即将开放」） }
        oauth_redirect_uri: { type: string, description: Git 服务商 OAuth 应用需要登记的回调地址（其他服务商为空串） }
        default_instance_url: { type: string, description: GitLab 系服务商的默认实例地址（极狐为 https://jihulab.com；其他为空串） }
        summary:
          type: object
          required: [connections, status]
          properties:
            connections: { type: integer, minimum: 0, description: 未断开的组织连接数 }
            status: { type: string, enum: [none, ok, attention], description: 有连接需要处理（NEEDS_ATTENTION）时为 attention }
    IntegrationOverview:
      type: object
      required: [providers, can_manage]
      properties:
        providers: { type: array, items: { $ref: '#/components/schemas/IntegrationProvider' } }
        can_manage: { type: boolean }
    IntegrationConnection:
      type: object
      required: [id, provider, scope, external_id, display_name, account_kind, status, status_reason, credentials_hint,
                 created_by, created_by_email, created_at, updated_at, disconnected_at, version]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        scope: { type: string, enum: [ORGANIZATION, PERSONAL] }
        parent_connection_id: { type: string, format: uuid, description: 个人连接所属的组织连接（可空） }
        owner_user_id: { type: string, format: uuid, description: 个人连接的所有者 }
        external_id: { type: string, description: 外部账号标识（Jira 主机名、GitHub 组织 login、飞书 App ID 等） }
        display_name: { type: string }
        account_kind: { type: string, description: 账号类型（organization / user / instance 等，由服务商决定），可为空 }
        status: { type: string, enum: [ACTIVE, NEEDS_ATTENTION, DISCONNECTED] }
        status_reason: { type: string }
        credentials_hint: { type: string, description: 凭据提示（例如末四位）；凭据本身从不返回 }
        created_by: { type: string, format: uuid }
        created_by_email: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        disconnected_at: { type: [string, 'null'], format: date-time }
        avatar_url: { type: string, description: 外部账号头像（GitHub 组织 / 账号），可为空 }
        webhook_last_delivery_at: { type: [string, 'null'], format: date-time, description: 最近一次收到有效 Webhook 事件的时间（为空表示尚未接通） }
        instance_url:
          type: string
          description: "GitLab 与极狐连接所属实例的规范化地址（scheme://host 加可选端口与路径，不含查询串与凭据；个人连接取所属组织连接的）。其他服务商为空串"
        version: { type: integer, minimum: 1 }
    AccountBinding:
      type: object
      required: [connection_id, display_name, detail, avatar_url, created_at, version]
      description: 当前成员的一个个人绑定（解绑用 disconnectIntegrationConnection，不需要确认短语）
      properties:
        connection_id: { type: string, format: uuid }
        display_name: { type: string, description: 外部账号名称（GitHub login、飞书姓名、Jira 显示名） }
        detail: { type: string, description: 补充信息（Jira 站点、GitHub 账号类型等），可为空 }
        avatar_url: { type: string }
        created_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    AccountBindingProvider:
      type: object
      required: [id, name, availability, method, organization_ready, binding]
      properties:
        id: { type: string, enum: [wechat, github, gitlab_cn, gitlab, gitee, jira, tapd, zentao, pingcode, teambition, slack, feishu, lark, dingtalk] }
        name: { type: string }
        availability: { type: string, enum: [available, coming_soon] }
        method: { type: string, enum: [oauth, form, link, none], description: oauth = 弹窗授权（GitHub / 飞书）；form = 填写凭证（Jira）；link = 在集成详情页管理（微信：只汇总本人的 Agent ↔ 微信绑定，不做微信登录；禅道与 PingCode：汇总本人的评论同步连接）；none = 暂无操作 }
        organization_ready: { type: boolean, description: 管理员是否已完成组织侧的准备（见 listMyAccountBindings 说明） }
        binding:
          oneOf:
            - { $ref: '#/components/schemas/AccountBinding' }
            - { type: 'null' }
        instances:
          type: array
          description: 只有 GitLab 系（gitlab、gitlab_cn）返回：本组织该服务商的实例（状态正常的组织连接）与本人在该实例的个人绑定。行的 binding 取第一个已绑定实例（多个已绑定时 detail 为「N 个实例」）；personal 授权要带实例的 connection_id
          items: { $ref: '#/components/schemas/AccountBindingInstance' }
    AccountBindingInstance:
      type: object
      required: [connection_id, host, display_name, binding]
      properties:
        connection_id: { type: string, format: uuid, description: 实例对应的组织连接 ID }
        host: { type: string, description: 实例主机（去掉协议，含端口与路径前缀） }
        display_name: { type: string, description: 组织连接绑定的群组 / 账号名 }
        binding:
          oneOf:
            - { $ref: '#/components/schemas/AccountBinding' }
            - { type: 'null' }
    AccountBindingsView:
      type: object
      required: [providers, jira_sites, email]
      properties:
        providers: { type: array, items: { $ref: '#/components/schemas/AccountBindingProvider' } }
        jira_sites:
          type: array
          description: 本组织导入过的 Jira 站点（按最近一次导入时间倒序，去重，最多 20 个）
          items:
            type: object
            required: [site_url, deployment, host]
            properties:
              site_url: { type: string }
              deployment: { type: string, enum: [cloud, server] }
              host: { type: string }
        email: { type: string, description: 当前成员的 OpenFox 邮箱（Jira Cloud 绑定时要求一致） }
    FeishuAssistantRuntime:
      type: object
      additionalProperties: false
      required: [computer_id, grant_id]
      description: 运行任务助手的电脑与 Runtime（与小助手的选择相同，必须是本人可用的电脑授权）
      properties:
        computer_id: { type: string, format: uuid }
        grant_id: { type: string, format: uuid }
        runtime: { type: string, description: 缺省 codex }
        model: { type: string, description: 缺省 default }
    WeChatQRSession:
      type: object
      additionalProperties: false
      required: [id, agent_id, status, qr_content, error_code, binding_id, expires_at, created_at, finished_at]
      properties:
        id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, SCANNED, NEED_VERIFY, CONFIRMED, EXPIRED, BLOCKED, FAILED, CANCELLED] }
        qr_content: { type: string, description: 二维码内容（通常是一个 URL），前端只把它当作二维码文本渲染 }
        error_code: { type: string }
        binding_id: { type: [string, 'null'], format: uuid }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
    WeChatBinding:
      type: object
      additionalProperties: false
      required: [id, agent, wechat_user, initiator, status, status_reason, connected, can_manage, created_at, version]
      properties:
        id: { type: string, format: uuid }
        agent:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        wechat_user: { type: string, description: 脱敏后的微信标识（前 2 位 + 后 4 位） }
        initiator:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string, description: 发起人邮箱 }
        status: { type: string, enum: [ACTIVE, EXPIRED], description: EXPIRED = 微信登录已失效，需要重新扫码 }
        status_reason: { type: string }
        connected: { type: boolean, description: 当前是否在正常长轮询 }
        can_manage: { type: boolean }
        created_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    WeChatView:
      type: object
      additionalProperties: false
      required: [configured, can_bind, max_bindings, bindings]
      properties:
        configured: { type: boolean }
        can_bind: { type: boolean }
        max_bindings: { type: integer }
        bindings:
          type: array
          items: { $ref: '#/components/schemas/WeChatBinding' }
    WeComBotInput:
      type: object
      additionalProperties: false
      required: [purpose, bot_id, secret]
      properties:
        purpose: { type: string, enum: [task_assistant, agent] }
        space_id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid }
        runtime: { $ref: '#/components/schemas/FeishuAssistantRuntime' }
        extra_prompt: { type: string, maxLength: 4000 }
        bot_id: { type: string, minLength: 1, maxLength: 128, description: 企业微信智能机器人 BotID }
        secret: { type: string, minLength: 8, maxLength: 512, description: 企业微信智能机器人 Secret；仅创建时传入且加密存储 }
    WeComPersonalBinding:
      type: object
      additionalProperties: false
      required: [bot_id, bot_name, connection_id, external_id, notification_target]
      properties:
        bot_id: { type: string, format: uuid, description: OpenFox 机器人 UUID }
        bot_name: { type: string }
        connection_id: { type: string, format: uuid, description: 本人企业微信绑定连接 UUID }
        external_id: { type: string, description: 本人在企业微信的 userid }
        notification_target: { type: boolean, description: 是否为本人当前通知目标 }
    WeComPersonalView:
      type: object
      additionalProperties: false
      required: [bindings]
      properties:
        bindings: { type: array, items: { $ref: '#/components/schemas/WeComPersonalBinding' } }
    WeComBindingCode:
      type: object
      additionalProperties: false
      required: [bot_id, code, expires_at]
      properties:
        bot_id: { type: string, format: uuid, description: OpenFox 机器人 UUID }
        code: { type: string, description: 在企业微信私聊该机器人发送的 32 字符一次性验证码 }
        expires_at: { type: string, format: date-time }
    FeishuRegistration:
      type: object
      required: [id, purpose, status, error_code, verification_url, expires_at, poll_interval, bot_id]
      properties:
        id: { type: string, format: uuid }
        purpose: { type: string, enum: [task_assistant, agent] }
        space_id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, COMPLETED, DENIED, EXPIRED, FAILED, CANCELLED] }
        error_code:
          type: string
          description: |
            终态原因：expired 链接在授权前已过期；access_denied 已在飞书中取消授权；rejected 飞书拒绝了该请求；
            agent_connected 此 Agent 已经连接飞书；assistant_exists 该空间已经有任务助手；session_expired 会话已过期；
            superseded 被新的扫码会话取代；save_failed 保存失败。其余为空。
        verification_url: { type: string, description: 二维码内容 / 「打开链接」地址；终态时为空 }
        expires_at: { type: string, format: date-time }
        poll_interval: { type: integer, description: 建议的前端轮询间隔（秒） }
        bot_id: { type: [string, 'null'], format: uuid, description: COMPLETED 后的机器人 }
    FeishuBot:
      type: object
      required: [id, kind, connection_id, app_id, bot_name, bot_avatar_url, status, status_reason, agent, space, extra_prompt,
                 runtime, can_manage, created_at, version]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [TASK_ASSISTANT, AGENT] }
        connection_id: { type: string, format: uuid }
        app_id: { type: string }
        bot_name: { type: string }
        bot_avatar_url: { type: string }
        status:
          type: string
          enum: [CONNECTING, CONNECTED, FAILED]
          description: 连接中（等待 / 正在建立长连接）/ 已连接 / 连接失败（凭证失效等，需要重试）
        status_reason: { type: string }
        agent:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        space:
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
            - { type: 'null' }
        extra_prompt: { type: string, description: 任务助手的附加提示词（只对能管理的人返回，否则为空） }
        runtime:
          description: 任务助手当前使用的电脑与 Runtime（只对能管理的人返回）
          oneOf:
            - type: object
              required: [computer_id, computer_name, grant_id, runtime, model]
              properties:
                computer_id: { type: string, format: uuid }
                computer_name: { type: string }
                grant_id: { type: string, format: uuid }
                runtime: { type: string }
                model: { type: string }
            - { type: 'null' }
        can_manage: { type: boolean }
        created_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    FeishuBotsView:
      type: object
      required: [app_connected, assistants, agents, can_bind_agent, builtin_prompt]
      properties:
        app_connected: { type: boolean, description: 组织飞书应用是否可用（不可用时不能发起扫码） }
        assistants:
          type: array
          items:
            type: object
            required: [space_id, space_name, can_manage, bot, pending_registration_id]
            properties:
              space_id: { type: string, format: uuid }
              space_name: { type: string }
              can_manage: { type: boolean }
              bot:
                oneOf:
                  - { $ref: '#/components/schemas/FeishuBot' }
                  - { type: 'null' }
              pending_registration_id: { type: [string, 'null'], format: uuid, description: 当前成员发起、仍在等待的扫码会话 }
              bound_provider:
                type: string
                enum: [feishu, lark, dingtalk]
                description: |
                  该空间的任务助手已经绑定在这个服务商（只在 bot 为空、且绑定在别的服务商时出现，否则整个字段不出现）。
                  每个空间只能有一个任务助手（不分服务商），所以当前服务商不能再绑定，要先在那个服务商移除。
        agents: { type: array, items: { $ref: '#/components/schemas/FeishuBot' } }
        can_bind_agent: { type: boolean, description: 当前成员能否绑定 Agent（所有者 / 管理员，或拥有至少一个可绑定的 Agent） }
        builtin_prompt: { type: string, description: 任务助手的内置提示词（只读） }
    FeishuAppView:
      type: object
      required: [can_manage, app, personal, guide]
      properties:
        can_manage: { type: boolean, description: 当前成员能否绑定 / 更新 / 断开（所有者、管理员） }
        app:
          description: 组织绑定的飞书应用；尚未绑定或已断开时为空
          oneOf:
            - { $ref: '#/components/schemas/FeishuApp' }
            - { type: 'null' }
        personal:
          description: 当前成员的个人飞书绑定（我的飞书账号）；没有绑定时为空
          oneOf:
            - { $ref: '#/components/schemas/FeishuPersonalBinding' }
            - { type: 'null' }
        guide: { $ref: '#/components/schemas/FeishuGuide' }
    FeishuApp:
      type: object
      required: [connection_id, app_id, bot_name, bot_avatar_url, status, status_reason, last_connected_at, last_event_at,
                 last_error, link_preview_enabled, credentials_hint, created_at, updated_at, version]
      properties:
        connection_id: { type: string, format: uuid, description: 组织连接 ID（断开时用 disconnectIntegrationConnection，确认短语「断开 飞书」） }
        app_id: { type: string }
        bot_name: { type: string, description: 机器人名称（保存 / 验证时从飞书读取） }
        bot_avatar_url: { type: string }
        status: { type: string, enum: [PENDING, CONNECTED, NEEDS_ATTENTION] }
        status_reason:
          type: string
          description: |
            NEEDS_ATTENTION 的原因：credentials_invalid 凭证失效；bot_unavailable 读不到机器人信息；connection_limit 长连接数超过飞书上限；
            其余为空。
        last_connected_at: { type: [string, 'null'], format: date-time, description: 最近一次建立长连接的时间 }
        last_event_at: { type: [string, 'null'], format: date-time, description: 最近一次收到飞书事件的时间 }
        last_error: { type: string, description: 最近一次长连接错误（诊断条显示，不含凭据） }
        link_preview_enabled: { type: boolean, description: 任务链接预览开关（默认开启） }
        credentials_hint: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    FeishuPersonalBinding:
      type: object
      required: [connection_id, display_name, avatar_url, created_at, version]
      properties:
        connection_id: { type: string, format: uuid, description: 个人连接 ID（解绑用 disconnectIntegrationConnection，不需要确认短语） }
        display_name: { type: string, description: 飞书用户姓名 }
        avatar_url: { type: string }
        created_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    FeishuGuide:
      type: object
      description: 配置指引需要的值
      required: [open_platform_url, redirect_uri, link_preview_pattern, scopes_json, events, callbacks]
      properties:
        open_platform_url: { type: string, description: 飞书开放平台开发者后台地址 }
        redirect_uri: { type: string, description: 「安全设置 → 重定向 URL」要填的地址（我的飞书账号授权用） }
        link_preview_pattern: { type: string, description: 「链接预览」的 URL 规则（仅链接预览需要） }
        scopes_json: { type: string, description: 「权限管理 → 批量导入」用的 JSON 文本 }
        events: { type: array, items: { type: string }, description: 需要订阅的事件（im.message.receive_v1） }
        callbacks: { type: array, items: { type: string }, description: 需要订阅的回调（url.preview.get，仅链接预览需要） }
    IntegrationOAuthSession:
      type: object
      required: [id, provider, purpose, status, error_code, accounts, expires_at]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        purpose: { type: string, enum: [organization, personal, reauthorize] }
        status: { type: string, enum: [PENDING, SELECTING, COMPLETED, FAILED, EXPIRED] }
        error_code: { type: string }
        accounts:
          type: array
          description: SELECTING 时可绑定的 GitHub 组织与授权者本人账号
          items:
            type: object
            required: [login, kind, avatar_url, connection_id]
            properties:
              login: { type: string }
              kind: { type: string, enum: [organization, user] }
              avatar_url: { type: string }
              connection_id: { type: [string, 'null'], format: uuid, description: 已有未断开的连接时为该连接（再次绑定只更新令牌） }
        connection_id: { type: [string, 'null'], format: uuid, description: personal / reauthorize 完成后对应的连接 }
        expires_at: { type: string, format: date-time }
    IntegrationWebhook:
      type: object
      required: [connection_id, payload_url, content_type, secret, events, last_delivery_at, recent, version]
      properties:
        connection_id: { type: string, format: uuid }
        payload_url: { type: string, description: '{PUBLIC_URL}/api/v1/hooks/git/github/<令牌>' }
        content_type: { type: string, enum: [application/json] }
        secret: { type: string, description: 签名密钥明文（只有所有者 / 管理员可读） }
        events: { type: array, items: { type: string }, description: 需要勾选的事件（pull_request、push、issues、issue_comment） }
        last_delivery_at: { type: [string, 'null'], format: date-time }
        recent:
          type: array
          maxItems: 10
          items:
            type: object
            required: [event, action, status, detail, linked_count, received_at]
            properties:
              event: { type: string }
              action: { type: string }
              status: { type: string, enum: [PROCESSED, IGNORED, REJECTED, FAILED] }
              detail: { type: string }
              linked_count: { type: integer, minimum: 0 }
              received_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1, description: 连接的 version（重新生成时作为 CAS） }
    IntegrationSettingsValues:
      type: object
      additionalProperties: false
      required: [link_pull_requests, link_commits, pr_backlink_private, pr_backlink_public, issue_backlink_private, issue_backlink_public, branch_format]
      properties:
        issue_backlink_private: { type: boolean, description: 私有仓库里同步成任务的 Issue 下回链评论（默认开，6b-2） }
        issue_backlink_public: { type: boolean, description: 公开仓库里同步成任务的 Issue 下回链评论（默认关，6b-2） }
        link_pull_requests: { type: boolean, description: 关联 Pull Request（默认开） }
        link_commits: { type: boolean, description: 关联 Git Commit（默认关） }
        pr_backlink_private: { type: boolean, description: 私有仓库的 PR 下回链评论（默认开） }
        pr_backlink_public: { type: boolean, description: 公开仓库的 PR 下回链评论（默认关） }
        branch_format:
          type: string
          enum: [username/identifier-title, identifier-title, username/identifier, identifier]
          description: 从任务复制 git 分支名时的格式（默认 username/identifier-title）
    IntegrationSettings:
      type: object
      required: [provider, settings, can_manage, version, updated_at]
      properties:
        provider: { type: string }
        settings: { $ref: '#/components/schemas/IntegrationSettingsValues' }
        can_manage: { type: boolean }
        version: { type: integer, minimum: 0, description: 0 = 尚未保存（默认值） }
        updated_at: { type: [string, 'null'], format: date-time }
    TaskGitLink:
      type: object
      required: [id, kind, provider, repository, number, sha, title, url, state, author_login, author_user_id, head_branch,
        matched_in, created_at, updated_at, merged_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [PULL_REQUEST, COMMIT, ISSUE], description: ISSUE = 同步关联的 GitHub Issue（6b-2） }
        provider: { type: string }
        repository: { type: string, description: owner/name }
        number: { type: [integer, 'null'] }
        sha: { type: string }
        title: { type: string, description: PR 标题或提交信息首行 }
        url: { type: string }
        state: { type: string, enum: [OPEN, DRAFT, CLOSED, MERGED, COMMITTED] }
        author_login: { type: string }
        author_user_id: { type: [string, 'null'], format: uuid, description: 作者绑定了个人 GitHub 账号时对应的成员 }
        head_branch: { type: string }
        matched_in: { type: string, enum: ['', title, body, branch, message] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        merged_at: { type: [string, 'null'], format: date-time }
    IntegrationSyncLink:
      type: object
      required: [id, connection_id, space_id, space_name, external_project_id, external_project_name, direction, status, status_reason, created_at, version,
        repository_url, repository_private, last_synced_at, backfill, outbound]
      properties:
        id: { type: string, format: uuid }
        repository_url: { type: string, description: 仓库网页地址（6b-2；旧关联为空串） }
        repository_private: { type: boolean }
        last_synced_at: { type: [string, 'null'], format: date-time, description: 最近一次成功同步（入站或出站）的时间 }
        backfill:
          type: object
          required: [status, imported, error]
          description: 导入已有 Issue 的进度；未勾选导入时 status = none
          properties:
            status: { type: string, enum: [none, running, done, failed] }
            imported: { type: integer, minimum: 0 }
            error: { type: string }
        outbound:
          type: object
          required: [pending, failed]
          description: 出站队列（OpenFox → GitHub）待发送与发送失败的数量
          properties:
            pending: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0 }
        connection_id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        space_name: { type: string }
        external_project_id: { type: string }
        external_project_name: { type: string }
        direction: { type: string, enum: [INBOUND, BIDIRECTIONAL], description: INBOUND = 外部 → OpenFox；BIDIRECTIONAL = 双向 }
        status: { type: string, enum: [ACTIVE, PAUSED, NEEDS_ATTENTION] }
        status_reason: { type: string }
        created_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    IntegrationDetail:
      type: object
      required: [provider, can_manage, connections, personal_connections, sync_links]
      properties:
        provider: { $ref: '#/components/schemas/IntegrationProvider' }
        can_manage: { type: boolean }
        connections:
          type: array
          description: 组织连接（含已断开，按创建时间）
          items: { $ref: '#/components/schemas/IntegrationConnection' }
        personal_connections:
          type: array
          description: 当前成员自己的个人连接
          items: { $ref: '#/components/schemas/IntegrationConnection' }
        sync_links:
          type: array
          description: 未删除的同步关联（只包含当前成员可读的空间）
          items: { $ref: '#/components/schemas/IntegrationSyncLink' }
    ImportNewSpace:
      type: object
      additionalProperties: false
      required: [name]
      description: 导入到新空间（开始导入时创建）。prefix 为空时 API 导入取项目 Key、CSV 导入取首个源票号的前缀（不合法时由服务端生成）
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        prefix: { type: string, pattern: '^[A-Z0-9]{2,7}$' }
        visibility: { type: string, enum: [PRIVATE, SHARED], default: PRIVATE }
    ImportConnectionErrorReason:
      type: string
      description: |
        Jira 连接校验失败的原因：auth_failed 凭证验证失败；site_not_found 实例找不到（404 或不是 Jira）；project_not_found 项目不存在或无权访问；
        jql_invalid JQL 无效；unreachable 无法连接（超时 / 拒绝连接）；dns_failed 域名无法解析；tls_failed HTTPS 证书未通过；
        blocked_address 地址指向内网或保留地址（已拦截）；invalid_url 地址格式不对（非 https、带用户名密码等）；rate_limited 被限流；too_many_issues 条目超过 5000
      enum: [auth_failed, site_not_found, project_not_found, jql_invalid, unreachable, dns_failed, tls_failed, blocked_address, invalid_url, rate_limited, too_many_issues]
    ExternalAccount:
      type: object
      required: [id, provider, external_user_id, display_name, email, source_label, linked_user, link_method, suggested_user_id,
        pending_invitation, task_count, created_at, version]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, description: 平台（jira 等） }
        external_user_id: { type: string, description: 来源平台上的账号标识 }
        display_name: { type: string }
        email: { type: string }
        source_label: { type: string, description: 来源实例（例如 acme.atlassian.net、Jira CSV） }
        linked_user:
          oneOf:
            - type: object
              required: [id, email, name]
              properties:
                id: { type: string, format: uuid }
                email: { type: string }
                name: { type: string }
            - type: 'null'
        link_method: { type: string, enum: ['', email, invite, manual, verified], description: 关联方式；未关联为空串；verified = 成员本人验证了 Jira 身份后由系统关联 }
        suggested_user_id: { type: [string, 'null'], format: uuid }
        pending_invitation: { type: boolean }
        task_count: { type: integer, minimum: 0, description: 处理人仍是该外部账号的未删除任务数 }
        created_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    TAPDImportCredentials:
      type: object
      additionalProperties: false
      required: [method, secret]
      properties:
        method: {type: string, enum: [basic, token]}
        account: {type: string, maxLength: 200}
        secret: {type: string, writeOnly: true, minLength: 1, maxLength: 4096}
        company_id: {type: string, pattern: '^[0-9]{1,32}$'}
    ZenTaoCredentials:
      type: object
      additionalProperties: false
      required: [site, account, password]
      properties:
        site: {type: string, format: uri}
        account: {type: string, maxLength: 200}
        password: {type: string, maxLength: 2048, writeOnly: true}
        basic_user: {type: string, maxLength: 200}
        basic_password: {type: string, maxLength: 2048, writeOnly: true}
    ImportSource:
      type: string
      enum: [jira_csv, jira_cloud, jira_server, teambition_csv, pingcode_csv, tapd_excel, tapd_api, pingcode_api, shortcut_api, zentao_api, teambition_api]
      description: jira_cloud = Jira Cloud API；jira_server = Jira Data Center / Server API
    ImportStatus:
      type: string
      enum: [DRAFT, QUEUED, RUNNING, CANCEL_REQUESTED, SUCCEEDED, FAILED, CANCELLED, ROLLED_BACK, DISCARDED]
    ImportField:
      type: string
      description: |
        文件列导入为的任务字段。source_id 是来源的稳定编号（Jira「Issue id」），source_key 是展示用票号（「Issue key」）。
        labels / comment / custom 可映射多列；自定义字段名称必须唯一。source_container 是任务所属专项。relations、attachment、sprint、resolution、watchers、original_estimate 暂不导入（导入时记一条告警）。
      enum: [ignore, source_id, source_key, title, type, status, priority, assignee, reporter, creator, description, parent,
        labels, comment, created_at, updated_at, start_date, due_date, story_points, source_url,
        relations, attachment, sprint, resolution, watchers, original_estimate, source_container, custom]
    ImportColumn:
      type: object
      required: [index, header, samples, suggested_field]
      properties:
        index: { type: integer, minimum: 0 }
        header: { type: string }
        samples: { type: array, maxItems: 3, items: { type: string }, description: 前 3 个非空值（每个截断到 200 字） }
        suggested_field: { $ref: '#/components/schemas/ImportField' }
    ImportPreview:
      type: object
      required: [columns, total_rows, importable_rows, skipped_rows, failed_rows, row_errors]
      properties:
        columns: { type: array, items: { $ref: '#/components/schemas/ImportColumn' } }
        total_rows: { type: integer, minimum: 0 }
        importable_rows: { type: integer, minimum: 0, description: 按当前列映射有标题与源 ID 的行 }
        skipped_rows: { type: integer, minimum: 0, description: 空行 }
        failed_rows: { type: integer, minimum: 0, description: 缺标题或源 ID、源 ID 重复等 }
        row_errors:
          type: array
          maxItems: 20
          items:
            type: object
            required: [row, message]
            properties:
              row: { type: integer, minimum: 1, description: 文件中的行号（表头为第 1 行） }
              message: { type: string }
    ImportColumnMapping:
      type: object
      additionalProperties: false
      required: [index, field]
      properties:
        index: { type: integer, minimum: 0, maximum: 299 }
        field: { $ref: '#/components/schemas/ImportField' }
        custom_name: { type: string, maxLength: 100, description: field = custom 时的自定义字段名 }
    ImportStatusMapping:
      type: object
      additionalProperties: false
      required: [source]
      description: 二选一：status_id = 映射到已有状态；new_name + new_category = 新建状态（导入时创建并加入空间所有任务类型的工作流）
      properties:
        source: { type: string, minLength: 1, maxLength: 200 }
        status_id: { type: string, format: uuid }
        new_name: { type: string, minLength: 1, maxLength: 100 }
        new_category: { $ref: '#/components/schemas/TaskStatusCategory' }
    ImportUserMapping:
      type: object
      additionalProperties: false
      required: [source_id, mode]
      description: |
        member = 映射到现有成员（user_id 必填）；invite = 通过邮箱邀请（email 必填，开始导入时发邀请，对方入组前任务处理人显示为外部账号）；
        external = 创建外部账号（保留原平台姓名，不占成员名额）；skip = 不导入（任务无处理人）。
      properties:
        source_id: { type: string, minLength: 1, maxLength: 255 }
        mode: { type: string, enum: [member, invite, external, skip] }
        user_id: { type: string, format: uuid }
        email: { type: string, maxLength: 320 }
    ShortcutHook:
      type: object
      required: [url, enabled, version]
      properties:
        url: { type: string, description: 部署未配置 HTTPS 公网地址时为空 }
        enabled: { type: boolean }
        version: { type: integer, minimum: 1 }
        last_delivery: { type: string, format: date-time }
    ImportProjectSync:
      type: object
      required: [state, version]
      properties:
        checking: { type: boolean }
        last_checked: { type: [string, 'null'], format: date-time }
        status_mappings: { type: object, additionalProperties: { type: string } }
        state: { type: string, enum: [ACTIVE, PAUSED, DISCONNECTED] }
        direction: { type: string, enum: [INBOUND, BIDIRECTIONAL] }
        version: { type: integer, minimum: 1 }
        last_success: { type: [string, 'null'], format: date-time }
        error_code: { type: string }
    ImportOptions:
      type: object
      additionalProperties: false
      properties:
        file_projects: { type: boolean, description: Jira 文件中的 Epic 作为专项导入 }
        continuous_sync: { type: boolean, description: 持续同步来源支持的任务变化，默认关闭 }
        import_open: { type: boolean, default: true, description: 导入未完成的任务 }
        import_done: { type: boolean, default: true, description: 导入已完成 / 已取消的任务 }
        migrated_label: { type: boolean, default: false, description: 给导入的任务加「Migrated」标签 }
        overwrite: { type: boolean, default: false, description: 覆盖导入：已导入过的条目用来源数据覆盖（标题、描述、状态、优先级、处理人、日期、估点），并补充新标签与新评论 }
        import_sprints: { type: boolean, default: false, description: 导入迭代（Sprint → 迭代）。只有 API 导入、且目标空间已开启迭代或为新空间时可用（analysis.capabilities.sprints） }
        keep_numbers: { type: boolean, default: false, description: 保留票号（PROJ-123 → PROJ-123）。只有导入到新空间时可用（analysis.capabilities.keep_numbers） }
    ImportConfig:
      type: object
      additionalProperties: false
      required: [columns, statuses, users, options]
      properties:
        columns: { type: array, maxItems: 300, items: { $ref: '#/components/schemas/ImportColumnMapping' } }
        statuses: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/ImportStatusMapping' } }
        users: { type: array, maxItems: 2000, items: { $ref: '#/components/schemas/ImportUserMapping' } }
        options: { $ref: '#/components/schemas/ImportOptions' }
    ImportAnalysis:
      type: object
      description: 按当前已保存的列映射计算的统计，用于映射状态 / 映射用户 / 确认步骤
      required: [statuses, users, types, counts, overwrite, members, issues, capabilities]
      properties:
        capabilities:
          type: object
          required: [sprints, keep_numbers, sprint_count]
          properties:
            sprints: { type: boolean, description: 可以开启 import_sprints }
            keep_numbers: { type: boolean, description: 可以开启 keep_numbers }
            project_sync: { type: boolean }
            sprint_count: { type: integer, minimum: 0, description: 有起止日期、可建为迭代的 Sprint 数 }
        statuses:
          type: array
          items:
            type: object
            required: [source, count, done, suggested_status_id]
            properties:
              source: { type: string }
              count: { type: integer, minimum: 0 }
              done: { type: boolean, description: 按名称推断是否为已完成类（Done / Closed / Resolved / 已完成 等），决定计入已完成任务 }
              suggested_status_id: { type: [string, 'null'], format: uuid, description: 同名已有状态 }
        users:
          type: array
          items:
            type: object
            required: [source_id, name, count, suggested_user_id]
            properties:
              source_id: { type: string, description: 来源用户标识（有 Assignee Id 列时为 accountId，否则为姓名） }
              name: { type: string }
              email: { type: string, description: 来源邮箱（API 导入且来源可见时；CSV 一般为空） }
              suggest_reason: { type: string, enum: ['', email, name, verified], description: suggested_user_id 的依据：email = 邮箱一致，name = 姓名匹配，verified = 成员已在「第三方账号绑定」页验证过这个 Jira 身份 }
              count: { type: integer, minimum: 0, description: 作为处理人 / 报告人 / 创建者 / 评论作者出现的次数 }
              suggested_user_id: { type: [string, 'null'], format: uuid, description: 姓名或邮箱前缀匹配到的成员 }
        types:
          type: array
          items:
            type: object
            required: [source, count, type_id]
            properties:
              source: { type: string }
              count: { type: integer, minimum: 0 }
              type_id: { type: [string, 'null'], format: uuid, description: 同名任务类型；null 时用空间默认类型 }
        counts:
          type: object
          required: [total, open, done, invalid]
          properties:
            total: { type: integer, minimum: 0 }
            open: { type: integer, minimum: 0 }
            done: { type: integer, minimum: 0 }
            invalid: { type: integer, minimum: 0 }
            projects: { type: integer, minimum: 0 }
        overwrite:
          type: object
          required: [existing, modified]
          properties:
            existing: { type: integer, minimum: 0, description: 已导入过（映射仍有效、任务未删除）的条目数 }
            modified: { type: integer, minimum: 0, description: 其中导入后被本地修改过的任务数（覆盖导入会丢失这些修改） }
        members:
          type: object
          required: [member, invite, external, skip]
          properties:
            member: { type: integer, minimum: 0 }
            invite: { type: integer, minimum: 0 }
            external: { type: integer, minimum: 0 }
            skip: { type: integer, minimum: 0 }
        issues:
          type: array
          description: |
            开始导入前必须解决的问题；空数组表示可以开始。没有映射的来源状态：有同名已有状态（suggested_status_id）时自动使用，否则记 status_unmapped；
            没有映射的来源用户按 external（创建外部账号）处理，不算问题。
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string, enum: [title_column_missing, source_id_column_missing, duplicate_column_field, status_unmapped, nothing_to_import] }
              message: { type: string }
              value: { type: string, description: 相关的来源值（状态名 / 用户标识 / 字段名） }
    ImportWarning:
      type: object
      required: [code, message, count]
      properties:
        code: { type: string }
        message: { type: string }
        count: { type: integer, minimum: 1 }
    ImportInvitationResult:
      type: object
      required: [source_id, email, result]
      properties:
        source_id: { type: string }
        email: { type: string }
        result: { type: string, enum: [sent, failed, already_member, already_invited] }
    ImportJob:
      type: object
      required: [id, space_id, space_name, new_space, space_created, source, source_label, file_name, status, phase, operation_id, total_count, processed_count,
        created_count, updated_count, skipped_count, failed_count, warnings, error_code, error_message, created_by, created_by_email,
        created_at, started_at, finished_at, rolled_back_at, retry_at, version, config_version, rollback, fetch]
      properties:
        sync_ticket: { type: string, description: 仅在创建站点导入草稿时返回给本人，绑定该草稿并随其过期 }
        id: { type: string, format: uuid }
        sync: { $ref: '#/components/schemas/ImportProjectSync' }
        space_id: { type: [string, 'null'], format: uuid, description: 选择新建空间的草稿在开始导入前为 null }
        space_name: { type: string, description: 目标空间名称；新建空间的草稿为 new_space.name }
        new_space:
          oneOf:
            - $ref: '#/components/schemas/ImportNewSpace'
            - type: 'null'
        space_created: { type: boolean, description: 目标空间由本次导入创建 }
        api:
          description: API 导入的连接设置（不含凭证；文件导入为 null），供「重新导入」预填
          oneOf:
            - type: object
              required: [deployment, site_url, project_key, jql]
              properties:
                deployment: { type: string, enum: [cloud, server] }
                site_url: { type: string }
                project_key: { type: string }
                jql: { type: string }
                auth_kind: { type: string, enum: [api_token, pat, password] }
                auth_user: { type: string, description: 认证用的邮箱或用户名（不是凭证） }
            - type: 'null'
        fetch:
          description: API 导入拉取进度（拉取中或已拉完时返回；文件导入为 null）
          oneOf:
            - type: object
              required: [fetched, total]
              properties:
                fetched: { type: integer, minimum: 0 }
                total: { type: [integer, 'null'], minimum: 0, description: 来源报告的总数（Cloud 不报告时为 null） }
            - type: 'null'
        source: { $ref: '#/components/schemas/ImportSource' }
        source_label: { type: string, description: 来源展示名（文件导入为「Jira CSV」，API 导入为主机名） }
        file_name: { type: string }
        status: { $ref: '#/components/schemas/ImportStatus' }
        phase: { type: string, enum: ['', validating, fetching, importing, linking, finishing], description: 执行中的阶段（进行中页的步骤） }
        operation_id: { type: string, description: 操作编号 op_xxx（失败时供排查复制） }
        total_count: { type: integer, minimum: 0 }
        processed_count: { type: integer, minimum: 0 }
        created_count: { type: integer, minimum: 0 }
        updated_count: { type: integer, minimum: 0 }
        skipped_count: { type: integer, minimum: 0 }
        failed_count: { type: integer, minimum: 0 }
        warnings: { type: array, items: { $ref: '#/components/schemas/ImportWarning' } }
        error_code: { type: string }
        error_message: { type: string }
        created_by: { type: string, format: uuid }
        created_by_email: { type: string }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        rolled_back_at: { type: [string, 'null'], format: date-time }
        retry_at: { type: [string, 'null'], format: date-time, description: 限流等待时系统继续的时间 }
        version: { type: integer, minimum: 1 }
        config_version: { type: integer, minimum: 1 }
        rollback:
          type: object
          required: [eligible, reason, deadline]
          properties:
            eligible: { type: boolean }
            reason: { type: string, enum: ['', not_finished, expired, rolled_back, nothing_created], description: 不可回滚的原因（行菜单底部灰字） }
            deadline: { type: [string, 'null'], format: date-time, description: 结束时间 + 7 天 }
        preview: { $ref: '#/components/schemas/ImportPreview', description: 只在详情与草稿接口返回 }
        config: { $ref: '#/components/schemas/ImportConfig', description: 只在详情与草稿接口返回 }
        analysis: { $ref: '#/components/schemas/ImportAnalysis', description: 只在 DRAFT 的详情与草稿接口返回 }
        invitations: { type: array, items: { $ref: '#/components/schemas/ImportInvitationResult' }, description: 开始导入时的邀请结果（只在详情返回） }
        failures:
          type: array
          maxItems: 20
          description: 失败条目样例（只在详情返回）
          items:
            type: object
            required: [ordinal, external_key, error]
            properties:
              ordinal: { type: integer, minimum: 0 }
              external_key: { type: string }
              error: { type: string }
    CloneTarget:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    CloneTargetList:
      type: object
      required: [targets]
      properties:
        targets:
          type: array
          items: { $ref: '#/components/schemas/CloneTarget' }
    CloneRequest:
      type: object
      additionalProperties: false
      required: [target_organization_id]
      properties:
        target_organization_id: { type: string, format: uuid }
        name: { type: string, maxLength: 100, description: 副本名称；空表示沿用源空间名称 }
        prefix: { type: string, maxLength: 16, description: 副本标识符；空表示沿用源空间标识符 }
    CloneIssue:
      type: object
      required: [code, message, count]
      properties:
        code: { type: string, description: 'agents_need_reconfigure / actor_history_kept / attachments / git_links / issue_links / automations / documents / skills / repos / iterations / task_limit / comment_limit / bundle_limit / name_taken / identifier_taken 等' }
        message: { type: string, description: 中文文案（服务端生成） }
        count: { type: integer, minimum: 0, description: 涉及的条目数；无计数的项为 0 }
    ClonePreview:
      type: object
      required: [source_name, source_prefix, target_organization_id, target_organization_name, target_name, target_prefix, name_conflict, counts, blockers, warnings, accepted_risks, skipped, can_start]
      properties:
        source_name: { type: string }
        source_prefix: { type: string }
        target_organization_id: { type: string, format: uuid }
        target_organization_name: { type: string }
        target_name: { type: string, description: 副本将使用的名称 }
        target_prefix: { type: string, description: 副本将使用的标识符 }
        name_conflict: { type: boolean, description: 目标组织已有同名或同标识符空间，需要确认副本名称 }
        counts:
          type: object
          additionalProperties: false
          required: [spaces, tasks, projects, comments, activities, task_types, task_statuses, labels, agents, custom_fields]
          properties:
            spaces: { type: integer, minimum: 0 }
            tasks: { type: integer, minimum: 0 }
            projects: { type: integer, minimum: 0 }
            comments: { type: integer, minimum: 0 }
            activities: { type: integer, minimum: 0 }
            task_types: { type: integer, minimum: 0 }
            task_statuses: { type: integer, minimum: 0 }
            labels: { type: integer, minimum: 0 }
            agents: { type: integer, minimum: 0, description: 源空间的 Agent 数（只计入已跳过的 Agent） }
            custom_fields: { type: integer, minimum: 0 }
        blockers:
          type: array
          items: { $ref: '#/components/schemas/CloneIssue' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/CloneIssue' }
        accepted_risks:
          type: array
          items: { $ref: '#/components/schemas/CloneIssue' }
        skipped:
          type: array
          items: { $ref: '#/components/schemas/CloneIssue' }
        can_start: { type: boolean }
    ExportSpace:
      type: object
      required: [id, name, prefix, task_count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        task_count: { type: integer }
    ExportSpaceList:
      type: object
      required: [spaces]
      properties:
        spaces:
          type: array
          items: { $ref: '#/components/schemas/ExportSpace' }
    ExportRequest:
      type: object
      required: [space_ids, format]
      properties:
        space_ids:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, format: uuid }
        format: { type: string, enum: [csv, json] }
    ExportJob:
      type: object
      required: [id, format, status, space_ids, space_count, task_count, file_name, size_bytes, error_code, error_message,
        operation_id, created_by, created_at, finished_at, expires_at, downloadable]
      properties:
        id: { type: string, format: uuid }
        format: { type: string, enum: [csv, json] }
        status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, EXPIRED] }
        space_ids:
          type: array
          items: { type: string, format: uuid }
        space_count: { type: integer }
        task_count: { type: integer }
        file_name: { type: string }
        size_bytes: { type: integer, format: int64 }
        error_code: { type: string }
        error_message: { type: string }
        operation_id: { type: string }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        downloadable: { type: boolean }
    ExportJobList:
      type: object
      required: [exports]
      properties:
        exports:
          type: array
          items: { $ref: '#/components/schemas/ExportJob' }
    CloneJob:
      type: object
      required: [id, status, phase, source_organization_id, source_space_id, source_space_name, target_organization_id, target_space_id, target_space_name,
        total_count, created_count, skipped_count, failed_count, failures, error_code, error_message, cancellable, operation_id, created_at, started_at, finished_at, version]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [QUEUED, RUNNING, CANCEL_REQUESTED, CLEANING, SUCCEEDED, CLEANED, FAILED, CLEANUP_FAILED, CANCELLED]
          description: 等待中 QUEUED / 运行中 RUNNING（含 CANCEL_REQUESTED）/ 清理中 CLEANING / 已完成 SUCCEEDED / 已清理 CLEANED / 失败 FAILED / 清理失败 CLEANUP_FAILED / 已取消 CANCELLED
        phase: { type: string, enum: ['', validating, creating_space, importing, linking, comments, cleaning] }
        source_organization_id: { type: string, format: uuid }
        source_space_id: { type: string, format: uuid }
        source_space_name: { type: string }
        target_organization_id: { type: string, format: uuid }
        target_space_id: { type: [string, 'null'], format: uuid, description: worker 建好空间之前为 null }
        target_space_name: { type: string }
        total_count: { type: integer, minimum: 0, description: 需要迁移的任务数 }
        created_count: { type: integer, minimum: 0 }
        skipped_count: { type: integer, minimum: 0 }
        failed_count: { type: integer, minimum: 0 }
        failures:
          type: array
          description: 失败项目（最多 20 条）
          items:
            type: object
            required: [ref, error]
            properties:
              ref: { type: string, description: 来源任务标识（如 ENG-12） }
              error: { type: string }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/ImportWarning' }
        error_code: { type: string }
        error_message: { type: string }
        cancellable: { type: boolean }
        operation_id: { type: string }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        version: { type: integer, minimum: 1 }
    ImportRollbackPreview:
      type: object
      required: [eligible, reason, deadline, created_count, modified_total, modified, cleanup, space_created]
      properties:
        eligible: { type: boolean }
        reason: { type: string, enum: ['', not_finished, expired, rolled_back, nothing_created] }
        deadline: { type: [string, 'null'], format: date-time }
        project_count: { type: integer, minimum: 0 }
        created_count: { type: integer, minimum: 0, description: 将被删除的、本次导入创建且未删除的任务数 }
        modified_total: { type: integer, minimum: 0 }
        modified:
          type: array
          maxItems: 50
          description: 导入后被改过的任务（当前版本大于导入完成时的版本），最多 50 条
          items:
            type: object
            required: [task_id, display_id, title, updated_at]
            properties:
              task_id: { type: string, format: uuid }
              display_id: { type: string }
              title: { type: string }
              updated_at: { type: string, format: date-time }
        cleanup:
          type: object
          required: [statuses, labels, iterations]
          properties:
            statuses: { type: integer, minimum: 0, description: 将归档的本次新建状态数（回滚后已无任务使用） }
            labels: { type: integer, minimum: 0 }
            iterations: { type: integer, minimum: 0, description: 将删除的本次新建且回滚后无任务使用的迭代数 }
        space_created: { type: boolean, description: 目标空间由本次导入创建；回滚只删除任务，空间保留 }
    TaskExternalAssignee:
      type: object
      required: [id, provider, name, email, pending_invitation]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        name: { type: string, description: 来源平台上的姓名 }
        email: { type: string }
        pending_invitation: { type: boolean, description: 已发邀请、尚未入组 }
    NotificationChannel:
      type: object
      required: [channel, enabled, available, disabled_events, customized]
      properties:
        channel: { type: string, enum: [desktop, browser, feishu, email, wecom], description: 飞书渠道只在本人绑定飞书账号后发送；邮件与企业微信渠道仅在显式开启后发送 }
        direct_messages: { type: boolean, description: 真人消息横幅默认为开，IM 与邮件默认为关 }
        enabled: { type: boolean, description: 邮件与企业微信渠道默认关闭 }
        available: { type: boolean, description: 服务端是否具备该渠道能力；邮件渠道需要 SMTP 配置，未配置时不可开启 }
        disabled_events: { type: array, items: { $ref: '#/components/schemas/NotificationEvent' } }
        customized: { type: boolean, description: false = 默认设置（邮件与企业微信关闭、其他渠道开启；全部事件） }
    BetaFeature:
      type: object
      required: [key, enabled]
      properties:
        key: { type: string, description: 功能标识；名称与说明由前端按 key 显示 }
        enabled: { type: boolean }
    GetStartedStep:
      type: object
      required: [key, points, completed, available]
      properties:
        key: { type: string }
        points: { type: integer }
        completed: { type: boolean }
        available: { type: boolean, description: false = 依赖的功能还没上线（显示即将开放，不计分） }
    GetStartedCategory:
      type: object
      required: [key, steps]
      properties:
        key: { type: string, enum: [get_started, collaboration, agents, tasks, space_management, automations] }
        steps: { type: array, items: { $ref: '#/components/schemas/GetStartedStep' } }
    GetStartedProgress:
      type: object
      required: [score, total, categories]
      properties:
        score: { type: integer, description: 已完成且可用步骤的分值和 }
        total: { type: integer, description: 可用步骤的分值和 }
        categories: { type: array, items: { $ref: '#/components/schemas/GetStartedCategory' } }
    # ===== / schemas =====
    # ===== 自动化 schemas =====
    AutomationTriggerKind:
      type: string
      enum: [schedule, task_status, comment, webhook]
    AutomationScheduleConfig:
      type: object
      required: [frequency, timezone]
      additionalProperties: false
      description: 'hourly = 每小时的 minute 分；daily = 每天 time；weekdays = 周一到周五 time；weekly = weekdays 列出的星期 time；custom = cron（分 时 日 月 周，5 段，分钟必须是单个数字，即最短 1 小时一次）'
      properties:
        frequency: { type: string, enum: [hourly, daily, weekdays, weekly, custom] }
        time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: daily / weekdays / weekly 必填 }
        minute: { type: integer, minimum: 0, maximum: 59, description: hourly 必填 }
        weekdays: { type: array, items: { type: integer, minimum: 0, maximum: 6 }, description: weekly 必填，0 = 周日 }
        cron: { type: string, maxLength: 100, description: custom 必填 }
        timezone: { type: string, description: IANA 时区名 }
    AutomationTaskFilter:
      type: object
      required: [field, op, value]
      additionalProperties: false
      properties:
        field: { type: string, enum: [project, task_type, assignee, agent, priority, label] }
        op: { type: string, enum: [is, is_not, includes, excludes], description: label 用 includes / excludes，其余用 is / is_not }
        value: { type: string }
    AutomationTriggerConfig:
      type: object
      additionalProperties: false
      description: 'schedule 用 schedule；task_status 用 status_ids（≥ 1）与 filters（≤ 10，全部满足才触发）；comment 用 contains（1–200，不区分大小写）；webhook 没有配置'
      properties:
        schedule: { $ref: '#/components/schemas/AutomationScheduleConfig' }
        status_ids: { type: array, maxItems: 20, items: { type: string, format: uuid } }
        filters: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/AutomationTaskFilter' } }
        contains: { type: string, maxLength: 200 }
    AutomationWebhook:
      type: object
      required: [signature_required, has_secret, ip_allowlist, last_source_ip]
      properties:
        signature_required: { type: boolean }
        has_secret: { type: boolean }
        ip_allowlist: { type: array, items: { type: string } }
        last_source_ip: { type: [string, 'null'] }
    AutomationTrigger:
      type: object
      required: [id, kind, enabled, config, next_run_at, webhook]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/AutomationTriggerKind' }
        enabled: { type: boolean }
        config: { $ref: '#/components/schemas/AutomationTriggerConfig' }
        next_run_at: { type: [string, 'null'], format: date-time, description: 只有定时触发器有值 }
        webhook:
          description: 只有 webhook 触发器有值；URL 只在创建 / 重新生成时返回一次
          oneOf: [{ $ref: '#/components/schemas/AutomationWebhook' }, { type: 'null' }]
    AutomationTriggerInput:
      type: object
      required: [kind, enabled, config]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid, description: 编辑时保留已有触发器传 id；不传 = 新建 }
        kind: { $ref: '#/components/schemas/AutomationTriggerKind' }
        enabled: { type: boolean }
        config: { $ref: '#/components/schemas/AutomationTriggerConfig' }
        signature_required: { type: boolean, description: 只对已有 webhook 触发器有效；开启前必须先生成签名密钥 }
        ip_allowlist: { type: array, maxItems: 20, items: { type: string }, description: IPv4 / IPv6 地址或 CIDR }
    AutomationRunStatus:
      type: string
      enum: [queued, running, completed, failed, canceled, skipped]
      description: started 的记录按关联 Run 的状态显示（QUEUED / PREPARING → queued，RUNNING / CANCEL_REQUESTED → running，SUCCEEDED → completed，FAILED → failed，CANCELED → canceled）
    AutomationRun:
      type: object
      required: [id, automation_id, trigger_id, trigger_kind, status, reason, trigger_title, created_at, finished_at, conversation_id, run_id]
      properties:
        id: { type: string, format: uuid }
        automation_id: { type: string, format: uuid }
        trigger_id: { type: [string, 'null'], format: uuid }
        trigger_kind: { type: string, enum: [manual, schedule, task_status, comment, webhook] }
        status: { $ref: '#/components/schemas/AutomationRunStatus' }
        reason: { type: string, description: 跳过 / 失败原因（如上一次还在运行） }
        trigger_title: { type: string, description: 触发原因的一句话（如「任务 OPEN-12 变为 已完成」） }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        conversation_id: { type: [string, 'null'], format: uuid }
        run_id: { type: [string, 'null'], format: uuid }
    AutomationRunDetail:
      allOf:
        - $ref: '#/components/schemas/AutomationRun'
        - type: object
          required: [trigger_payload, result, failure_code, failure_message]
          properties:
            trigger_payload: { type: object, additionalProperties: true }
            result: { type: [string, 'null'], description: Agent 最后一条回复（截断到 4000 字） }
            failure_code: { type: string }
            failure_message: { type: string }
    Automation:
      type: object
      required: [id, space_id, title, prompt, assignee, notify_user_ids, enabled, position, triggers, last_run, created_by, created_at, updated_at, version, can_edit]
      properties:
        id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        title: { type: string }
        prompt: { type: string }
        assignee:
          type: object
          required: [kind, id, name]
          properties:
            kind: { type: string, enum: [AGENT, CREW] }
            id: { type: string, format: uuid }
            name: { type: string }
        notify_user_ids: { type: array, items: { type: string, format: uuid } }
        enabled: { type: boolean }
        position: { type: integer }
        triggers: { type: array, items: { $ref: '#/components/schemas/AutomationTrigger' } }
        last_run: { oneOf: [{ $ref: '#/components/schemas/AutomationRun' }, { type: 'null' }] }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
        can_edit: { type: boolean }
    AutomationInput:
      type: object
      required: [title, prompt, assignee, notify_user_ids, triggers]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        prompt: { type: string, minLength: 1, maxLength: 20000 }
        assignee:
          type: object
          required: [kind, id]
          properties:
            kind: { type: string, enum: [AGENT, CREW] }
            id: { type: string, format: uuid }
        notify_user_ids: { type: array, maxItems: 20, items: { type: string, format: uuid } }
        triggers: { type: array, minItems: 1, maxItems: 10, items: { $ref: '#/components/schemas/AutomationTriggerInput' } }
    AutomationSaveResult:
      type: object
      required: [automation, webhook_urls]
      properties:
        automation: { $ref: '#/components/schemas/Automation' }
        webhook_urls:
          type: array
          description: 本次新建的 webhook 触发器的完整 URL（只出现这一次）
          items:
            type: object
            required: [trigger_id, url]
            properties:
              trigger_id: { type: string, format: uuid }
              url: { type: string }
    WebhookDelivery:
      type: object
      required: [id, trigger_id, status, signature_status, provider, event, received_at, attempts, replay_of, automation_run_id]
      properties:
        id: { type: string, format: uuid }
        trigger_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, dispatched, rejected, ignored, failed] }
        signature_status: { type: string, enum: [valid, invalid, missing, not_required, expired, ip_blocked] }
        provider: { type: string, description: 按请求头识别（github / gitlab / generic …） }
        event: { type: string }
        received_at: { type: string, format: date-time }
        attempts: { type: integer }
        replay_of: { type: [string, 'null'], format: uuid }
        automation_run_id: { type: [string, 'null'], format: uuid }
    WebhookDeliveryDetail:
      allOf:
        - $ref: '#/components/schemas/WebhookDelivery'
        - type: object
          required: [last_attempt_at, response_status, response_body, source_ip, dedupe_key, dedupe_source, content_type, headers, body, body_truncated, error, replayable, not_replayable_reason]
          properties:
            last_attempt_at: { type: string, format: date-time }
            response_status: { type: integer }
            response_body: { type: string }
            source_ip: { type: string }
            dedupe_key: { type: string }
            dedupe_source: { type: string, enum: [header, body_hash] }
            content_type: { type: string }
            headers: { type: object, additionalProperties: { type: string }, description: 签名相关请求头的值已遮挡 }
            body: { type: string, description: UTF-8 文本；非文本时为 base64 }
            body_truncated: { type: boolean }
            error: { type: string }
            replayable: { type: boolean }
            not_replayable_reason: { type: [string, 'null'], enum: [queued, rejected, signature, null] }
    # ===== /自动化 schemas =====
    # ===== 文档库 schemas =====
    DocNodeKind:
      type: string
      enum: [folder, doc, sheet, file]
      description: doc = Markdown 文档（.md）；sheet = CSV 表格（.csv）；file = 上传的其他文件（只能下载）
    DocContainer:
      type: object
      required: [kind]
      description: personal = 当前用户在该空间的「我的文档」；set = 文档集
      properties:
        kind: { type: string, enum: [personal, set] }
        set_id: { type: string, format: uuid, description: kind = set 时必填 }
    DocSet:
      type: object
      required: [id, space_id, name, icon_kind, icon, icon_url, position, created_by, created_at, updated_at, version, can_edit]
      properties:
        id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        name: { type: string }
        icon_kind: { oneOf: [{ $ref: '#/components/schemas/ViewIconKind' }, { type: 'null' }], description: 为空时界面显示 library-big }
        icon: { type: [string, 'null'] }
        icon_url: { type: [string, 'null'] }
        position: { type: integer }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
        can_edit: { type: boolean }
    DocSetInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        icon:
          oneOf:
            - type: 'null'
            - type: object
              required: [kind, value]
              properties:
                kind: { $ref: '#/components/schemas/ViewIconKind' }
                value: { type: string }
    DocNode:
      type: object
      required: [id, space_id, container, parent_id, kind, title, position, size_bytes, content_type, created_by, updated_by, updated_by_name, created_at, updated_at, version, has_children, can_edit]
      properties:
        id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        container: { $ref: '#/components/schemas/DocContainer' }
        parent_id: { type: [string, 'null'], format: uuid }
        kind: { $ref: '#/components/schemas/DocNodeKind' }
        title: { type: string, description: 不含扩展名；空串界面显示「未命名文档」 }
        position: { type: integer }
        size_bytes: { type: [integer, 'null'], description: file 的文件大小 }
        content_type: { type: [string, 'null'] }
        created_by: { type: string, format: uuid }
        updated_by: { type: string, format: uuid }
        updated_by_name: { type: string, description: 更新人显示名（全名，没有则邮箱） }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
        has_children: { type: boolean }
        can_edit: { type: boolean, description: 我的文档在空间未停用时为 true；文档集按空间写权限；停用空间一律为 false }
    DocNodeDetail:
      allOf:
        - $ref: '#/components/schemas/DocNode'
        - type: object
          required: [body, breadcrumb]
          properties:
            body: { type: [string, 'null'], description: doc 为 Markdown，sheet 为 CSV，folder / file 为 null }
            breadcrumb:
              type: array
              description: 从容器根到父节点（不含自己）
              items:
                type: object
                required: [id, title]
                properties:
                  id: { type: string, format: uuid }
                  title: { type: string }
    DocRevision:
      type: object
      required: [revision, node_version, title, created_by, created_by_name, created_at]
      properties:
        revision: { type: integer, minimum: 1 }
        node_version: { type: integer, minimum: 1 }
        title: { type: string }
        created_by: { type: string, format: uuid }
        created_by_name: { type: string }
        created_at: { type: string, format: date-time }
        body: { type: string, description: 仅单个版本接口包含正文 }
    DocAttachment:
      type: object
      required: [id, node_id, name, content_type, size_bytes, url]
      properties:
        id: { type: string, format: uuid }
        node_id: { type: string, format: uuid }
        name: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer }
        url: { type: string, description: '浏览器可直接使用的地址（含 /api 前缀），写进 Markdown 正文' }
    # ===== /文档库 schemas =====
    # ===== 技能 schemas =====
    SkillSourceKind:
      type: string
      enum: [manual, upload, url, runtime, market]
    SkillUser:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: 全名，没有时为邮箱 }
    SkillAgentRef:
      type: object
      required: [id, name, avatar]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        avatar: { description: 与 Agent 的 avatar 相同结构 }
    Skill:
      type: object
      required: [id, space_id, name, description, source_kind, source_label, source_url, file_count, total_bytes,
                 created_by, used_by, used_count, can_edit, version, created_at, updated_at,
                 market_skill_id, market_version, market_latest_version]
      properties:
        id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        name: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
        description: { type: string, maxLength: 1024 }
        source_kind: { $ref: '#/components/schemas/SkillSourceKind' }
        source_label: { type: string, description: 来源说明：URL 的主机名、电脑名等；手动创建与上传为空串 }
        source_url: { type: [string, 'null'] }
        market_skill_id: { type: [string, 'null'], description: 来自市场时为市场技能 ID }
        market_version: { type: [string, 'null'], description: 添加 / 上次更新时的市场版本 }
        market_latest_version: { type: [string, 'null'], description: '市场当前版本；与 market_version 不同即「可更新」；市场里已没有该技能时为 null' }
        file_count: { type: integer }
        total_bytes: { type: integer }
        created_by: { $ref: '#/components/schemas/SkillUser' }
        used_by: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/SkillAgentRef' }, description: 装配了它的 Agent（最多 3 个，用于头像堆叠） }
        used_count: { type: integer }
        can_edit: { type: boolean, description: 创建者或组织管理员，且空间未停用 }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SkillFileEntry:
      type: object
      required: [path, size_bytes]
      properties:
        path: { type: string }
        size_bytes: { type: integer }
    SkillDetail:
      allOf:
        - $ref: '#/components/schemas/Skill'
        - type: object
          required: [files, agents]
          properties:
            files: { type: array, items: { $ref: '#/components/schemas/SkillFileEntry' }, description: SKILL.md 置顶，其余按路径排序 }
            agents: { type: array, items: { $ref: '#/components/schemas/SkillAgentRef' }, description: 使用它的全部 Agent }
    SkillCreateInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
        description: { type: string, maxLength: 1024 }
        instructions: { type: string, maxLength: 262144 }
    SkillFileContent:
      type: object
      required: [path, size_bytes, binary, content]
      properties:
        path: { type: string }
        size_bytes: { type: integer }
        binary: { type: boolean }
        content: { type: string, description: binary 为 true 时为空串 }
    SkillImportItem:
      type: object
      required: [name, status, reason, skill_id]
      properties:
        name: { type: string }
        status: { type: string, enum: [pending, imported, skipped, failed, canceled] }
        reason: { type: string, description: '原因码：SKILL_NAME_TAKEN、SKILL_INVALID、SKILL_TOO_LARGE、NOT_FOUND、COMMAND_EXPIRED 等；成功为空串' }
        skill_id: { type: [string, 'null'], format: uuid }
    SkillRuntimeImport:
      type: object
      required: [command_id, device_id, status, items]
      properties:
        command_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        status: { type: string, enum: [running, done, canceled], description: 'running：还有 pending 项；done：全部结束；canceled：用户取消' }
        items: { type: array, items: { $ref: '#/components/schemas/SkillImportItem' } }
    Attachment:
      type: object
      required: [id, owner_kind, name, content_type, size_bytes, uploaded_by, uploader_name, created_at, previewable, can_delete]
      properties:
        id: { type: string, format: uuid }
        owner_kind: { type: string, enum: [TASK, CONVERSATION] }
        task_id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        message_id: { type: string, format: uuid, description: 对话附件随消息发送后才有 }
        name: { type: string, maxLength: 255 }
        content_type: { type: string, description: 嗅探后的类型；svg / html / xml 为 text/plain }
        size_bytes: { type: integer, minimum: 0, maximum: 20971520 }
        uploaded_by: { type: string, format: uuid }
        uploader_name: { type: string }
        created_at: { type: string, format: date-time }
        previewable: { type: boolean, description: 可以用 ?disposition=inline 预览（png / jpeg / gif / webp） }
        can_delete: { type: boolean, description: 仅上传响应与任务附件列表按调用者计算；消息里的附件为 false }
    DeviceRunAttachment:
      type: object
      required: [id, name, content_type, size_bytes]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer, minimum: 0, maximum: 20971520 }
    DeviceRunSkill:
      type: object
      required: [id, name, version, file_count, total_bytes]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        version: { type: integer }
        file_count: { type: integer }
        total_bytes: { type: integer }
    DeviceSkillFile:
      type: object
      required: [path, content_base64]
      properties:
        path: { type: string, maxLength: 256 }
        content_base64: { type: string }
    DeviceSkillBundle:
      type: object
      required: [name, files]
      properties:
        name: { type: string }
        files: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/DeviceSkillFile' } }
        error_code:
          type: string
          pattern: '^[A-Z0-9_]{0,64}$'
          description: 只用于设备上传：本机无法打包该技能时的原因码（NOT_FOUND、SKILL_INVALID、SKILL_TOO_LARGE），此时 files 为空；中心把该项记为 failed
    DeviceSkillScanResult:
      type: object
      description: skill_scan 命令的 result（≤ 64 KB）
      required: [supported, skills]
      properties:
        supported: { type: boolean, description: 该电脑的 Runtime 是否支持技能目录（目前只有 Codex） }
        runtime: { type: string }
        skills:
          type: array
          maxItems: 100
          items:
            type: object
            required: [name, description, file_count, total_bytes, importable]
            properties:
              name: { type: string, description: 本机技能目录名 }
              description: { type: string, maxLength: 160 }
              file_count: { type: integer }
              total_bytes: { type: integer }
              importable: { type: boolean, description: 超过 100 个文件 / 5 MB、含符号链接或缺少 SKILL.md 时为 false }
    DeviceSkillImportResult:
      type: object
      description: skill_import 命令的 result
      required: [imported, skipped, failed]
      properties:
        imported: { type: integer }
        skipped: { type: integer }
        failed: { type: integer }
    # ===== /技能 schemas =====
    # ===== 市场 schemas =====
    MarketText:
      type: object
      description: '多语言文本：{"zh-Hans": "…", "en": "…"}，可能只有其中一种；界面按当前语言取，缺失时取另一种'
      additionalProperties: { type: string }
    MarketCategory:
      type: object
      required: [id, name, order, skill_count, template_count]
      properties:
        id: { type: string }
        name: { $ref: '#/components/schemas/MarketText' }
        order: { type: integer }
        skill_count: { type: integer, description: 本平台目录里该分类的技能数 }
        template_count: { type: integer }
    MarketPack:
      type: object
      required: [id, name, tint, members]
      properties:
        id: { type: string }
        name: { $ref: '#/components/schemas/MarketText' }
        tint: { type: string, description: '主题色，如 #33bbff' }
        members:
          type: array
          items:
            type: object
            required: [market_skill_id, name, icon, available]
            properties:
              market_skill_id: { type: string }
              name: { $ref: '#/components/schemas/MarketText' }
              icon: { type: [string, 'null'] }
              available: { type: boolean, description: 本平台目录里有这个技能 }
    MarketCatalog:
      type: object
      required: [source, catalog_version, imported_at, categories, packs, counts]
      properties:
        source: { type: string, description: 数据来源标识；还没导入时为空串 }
        catalog_version: { type: string }
        imported_at: { type: [string, 'null'], format: date-time }
        categories: { type: array, items: { $ref: '#/components/schemas/MarketCategory' } }
        packs: { type: array, items: { $ref: '#/components/schemas/MarketPack' } }
        counts:
          type: object
          required: [skills, templates]
          properties:
            skills: { type: integer }
            templates: { type: integer }
    MarketSkill:
      type: object
      required: [market_skill_id, version, name, description, icon, category_ids, tags, publisher, origin, featured, downloads, stars, file_count, total_bytes]
      properties:
        market_skill_id: { type: string }
        version: { type: string }
        name: { $ref: '#/components/schemas/MarketText' }
        description: { $ref: '#/components/schemas/MarketText' }
        icon: { type: [string, 'null'], description: https 地址；为空时界面显示首字母 }
        category_ids: { type: array, items: { type: string } }
        tags: { type: array, items: { $ref: '#/components/schemas/MarketText' } }
        publisher:
          type: object
          required: [name, verified]
          properties:
            name: { type: string }
            verified: { type: boolean }
        origin: { type: string, description: '原始来源，如 skillhub' }
        featured: { type: boolean }
        downloads: { type: integer }
        stars: { type: integer }
        file_count: { type: integer }
        total_bytes: { type: integer }
    MarketSkillFileEntry:
      type: object
      required: [path, size_bytes, mime]
      properties:
        path: { type: string }
        size_bytes: { type: integer }
        mime: { type: string }
    MarketSkillDetail:
      allOf:
        - $ref: '#/components/schemas/MarketSkill'
        - type: object
          required: [files]
          properties:
            files: { type: array, items: { $ref: '#/components/schemas/MarketSkillFileEntry' } }
    MarketSkillFileContent:
      type: object
      required: [path, size_bytes, mime, binary, truncated, content]
      properties:
        path: { type: string }
        size_bytes: { type: integer }
        mime: { type: string }
        binary: { type: boolean }
        truncated: { type: boolean, description: 文本超过 1 MB 时只返回前 1 MB }
        content: { type: string }
    MarketTemplate:
      type: object
      required: [market_template_id, version, name, job_title, tagline, description, category_ids, keywords, avatar, skill_count, origin]
      properties:
        market_template_id: { type: string }
        version: { type: string }
        name: { $ref: '#/components/schemas/MarketText' }
        job_title: { $ref: '#/components/schemas/MarketText' }
        tagline: { $ref: '#/components/schemas/MarketText' }
        description: { $ref: '#/components/schemas/MarketText' }
        category_ids: { type: array, items: { type: string } }
        keywords: { type: array, items: { type: string } }
        avatar:
          type: object
          description: '{type: image, url} 或 {}'
          properties:
            type: { type: string }
            url: { type: string }
        skill_count: { type: integer }
        origin: { type: string }
    MarketTemplateSkillRef:
      type: object
      required: [market_skill_id, version, available, skill]
      properties:
        market_skill_id: { type: string }
        version: { type: string }
        available: { type: boolean }
        skill: { oneOf: [ { $ref: '#/components/schemas/MarketSkill' }, { type: 'null' } ], description: 本平台目录里没有时为 null }
    MarketTemplateDetail:
      allOf:
        - $ref: '#/components/schemas/MarketTemplate'
        - type: object
          required: [instructions, quick_prompts, skills]
          properties:
            instructions: { $ref: '#/components/schemas/MarketText', description: 'Agent 指令（Markdown），按语言' }
            quick_prompts: { type: array, items: { $ref: '#/components/schemas/MarketText' } }
            skills: { type: array, items: { $ref: '#/components/schemas/MarketTemplateSkillRef' } }
    MarketAgentTarget:
      type: object
      required: [id, name, avatar, space_id, space_name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        avatar: { $ref: '#/components/schemas/AgentAvatar' }
        space_id: { type: string, format: uuid }
        space_name: { type: string }
    MarketTemplateApplyResult:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [market_skill_id, status, reason, skill_id]
            properties:
              market_skill_id: { type: string }
              status: { type: string, enum: [added, reused, attached, missing, skipped] }
              reason: { type: string, description: 'skipped 的原因码：SKILL_NAME_TAKEN、AGENT_SKILL_LIMIT、SKILL_LIMIT；其他为空串' }
              skill_id: { type: [string, 'null'], format: uuid }
    # ===== /市场 schemas =====
    OrganizationRole:
      type: string
      enum: [OWNER, ADMIN, MEMBER, GUEST]
    Organization:
      type: object
      required: [id, slug, name, role, created_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/OrganizationRole' }
        created_at: { type: string, format: date-time }
        icon_kind: { oneOf: [{ $ref: '#/components/schemas/ViewIconKind' }, { type: 'null' }], description: 为空时显示名称首字母 }
        icon: { type: [string, 'null'], description: '内置图标名（可带 :#RRGGBB 背景色）/ 表情 / 上传图标 ID' }
        icon_url: { type: [string, 'null'], description: icon_kind = upload 时的图片地址 }
    # ===== 组织设置 schemas =====
    GitDefaults:
      type: object
      required: [author_name, author_email, co_author_enabled]
      properties:
        author_name_mode:
          type: string
          enum: [INHERIT, USER_AND_AGENT, USER, OWNER_AND_AGENT, OWNER, MACHINE, MANUAL]
          description: Organization cannot inherit. Omitted legacy input preserves the source if the text is unchanged; changed text becomes MANUAL, cleared text restores the legacy default or space inheritance.
        author_email_mode:
          type: string
          enum: [INHERIT, USER, OWNER, MACHINE, MANUAL]
          description: Organization cannot inherit. Omitted legacy input follows the same compatibility rule as author_name_mode. MACHINE does not inject an email.
        author_name: { type: string, maxLength: 128 }
        author_email: { type: string, maxLength: 254 }
        co_author_enabled: { type: [boolean, 'null'] }
    GitSettingsInput:
      allOf:
        - { $ref: '#/components/schemas/GitDefaults' }
        - type: object
          required: [version]
          properties:
            version: { type: integer, minimum: 1 }
    GitSettings:
      allOf:
        - { $ref: '#/components/schemas/GitSettingsInput' }
        - type: object
          required: [effective, can_manage]
          properties:
            effective: { $ref: '#/components/schemas/GitDefaults' }
            can_manage: { type: boolean }
    OrganizationSettings:
      type: object
      required: [id, name, slug, description, icon_kind, icon, icon_url, default_locale, priority_levels, version, my_role, can_manage, can_delete, leave_blocked]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        icon_kind: { oneOf: [{ $ref: '#/components/schemas/ViewIconKind' }, { type: 'null' }] }
        icon: { type: [string, 'null'] }
        icon_url: { type: [string, 'null'] }
        default_locale: { type: string, enum: [zh-CN, en-US] }
        priority_levels: { type: integer, enum: [4, 5] }
        version: { type: integer, minimum: 1 }
        my_role: { $ref: '#/components/schemas/OrganizationRole' }
        can_manage: { type: boolean, description: OWNER / ADMIN 可修改组织设置 }
        can_delete: { type: boolean, description: 只有 OWNER 可删除组织 }
        leave_blocked: { type: [string, 'null'], enum: [sole_owner, sole_member, null], description: sole_owner = 唯一所有者且还有其他成员；sole_member = 只剩自己（只能删除组织） }
    OrganizationSettingsPatch:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 100 }
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$', description: 只改显示与链接文案，路由仍用组织 ID }
        description: { type: string, maxLength: 500 }
        icon:
          description: null = 清除（回到首字母头像）
          oneOf:
            - type: 'null'
            - type: object
              required: [kind, value]
              properties:
                kind: { $ref: '#/components/schemas/ViewIconKind' }
                value: { type: string, description: 内置图标名 / 表情 / 上传图标 ID }
        default_locale: { type: string, enum: [zh-CN, en-US] }
        priority_levels: { type: integer, enum: [4, 5], description: 5 → 4 时把所有 LOWEST 任务与专项改为 LOW（界面先确认） }
    InviteLink:
      type: object
      required: [enabled, role, space_ids, token, version, updated_at]
      properties:
        enabled: { type: boolean }
        role: { type: string, enum: [MEMBER, GUEST] }
        space_ids: { type: array, items: { type: string, format: uuid } }
        token: { type: [string, 'null'], description: '链接令牌（拼成 /invite/{token}）；null = 还没有生成过链接' }
        version: { type: integer, minimum: 0, description: 0 = 还不存在 }
        updated_at: { type: [string, 'null'], format: date-time }
    InviteLinkPreview:
      type: object
      required: [organization_id, name, icon_kind, icon, role, inviter_email, member_count, agent_count, already_member]
      properties:
        organization_id: { type: string, format: uuid }
        name: { type: string }
        icon_kind: { type: [string, 'null'], enum: [icon, emoji, null], description: 上传图标在加入前不返回 }
        icon: { type: [string, 'null'] }
        role: { type: string, enum: [MEMBER, GUEST] }
        inviter_email: { type: [string, 'null'], description: 最近一次保存链接的管理员 }
        member_count: { type: integer }
        agent_count: { type: integer }
        already_member: { type: boolean }
    MemberSpace:
      type: object
      required: [id, name, prefix, icon, visibility]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        icon: { type: [string, 'null'] }
        visibility: { type: string, enum: [shared, private] }
    # ===== /组织设置 schemas =====
    Space:
      type: object
      required: [id, prefix, name, visibility, version, created_at]
      properties:
        id: { type: string, format: uuid }
        prefix: { type: string }
        name: { type: string }
        visibility: { type: string, enum: [shared, private] }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }

    # ===== 全局配置 schemas =====
    HexColor:
      type: string
      pattern: '^#[0-9a-fA-F]{6}$'
    LabelGroup:
      type: object
      required: [id, name, description, color, label_count, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        space_id: { type: [string, 'null'], format: uuid, description: null = 组织级分组 }
        name: { type: string }
        description: { type: string }
        color: { $ref: '#/components/schemas/HexColor' }
        label_count: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Label:
      type: object
      required: [id, space_id, name, description, color, group_id, archived_at, task_count, last_applied_at,
        version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        space_id: { type: [string, 'null'], format: uuid, description: null = 组织级标签 }
        name: { type: string }
        description: { type: string }
        color: { type: [string, 'null'], pattern: '^#[0-9a-fA-F]{6}$' }
        group_id: { type: [string, 'null'], format: uuid }
        archived_at: { type: [string, 'null'], format: date-time }
        task_count: { type: integer, minimum: 0, description: 只统计未删除任务 }
        last_applied_at: { type: [string, 'null'], format: date-time, description: 最近一次加到未删除任务上的时间 }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TaskStatusCategory:
      type: string
      enum: [TRIAGE, BACKLOG, TODO, IN_PROGRESS, DONE, CANCELLED, DUPLICATE]
    StatusTypeUsage:
      type: object
      required: [space_id, space_name, type_ids, type_names]
      properties:
        space_id: { type: string, format: uuid }
        space_name: { type: string }
        type_ids:
          type: array
          items: { type: string, format: uuid }
        type_names:
          type: array
          items: { type: string }
    TaskStatus:
      type: object
      description: color / icon / archived_at 为空时不输出（保持旧接口兼容）。
      required: [id, name, description, category, position, version, created_at, is_default,
        collapsed_by_default, task_count, type_usage, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        category: { $ref: '#/components/schemas/TaskStatusCategory' }
        position: { type: integer, minimum: 0 }
        color: { type: string }
        icon: { type: string }
        archived_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        is_default:
          type: boolean
          description: 组织默认状态（显式默认，或没有显式默认时 TODO 类别 position 最小的未归档状态）；列表中恰好一个为 true
        collapsed_by_default: { type: boolean }
        task_count: { type: integer, minimum: 0, description: 未删除任务数 }
        type_usage:
          type: array
          description: 工作流包含该状态的未归档任务类型，仅调用者可读的 ACTIVE 空间
          items: { $ref: '#/components/schemas/StatusTypeUsage' }
        updated_at: { type: string, format: date-time }
    WorkflowStatus:
      type: object
      required: [status_id, name, category, position, default]
      properties:
        status_id: { type: string, format: uuid }
        name: { type: string }
        category: { $ref: '#/components/schemas/TaskStatusCategory' }
        position: { type: integer, minimum: 0 }
        default: { type: boolean, description: 该类型新建任务的默认状态 }
    TaskType:
      type: object
      description: icon / archived_at 为空时不输出（保持旧接口兼容）。field_count / task_count 也会返回。
      required: [organization_id, space_id, id, name, description, enabled, is_default, version, created_at, statuses]
      properties:
        organization_id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        icon: { type: string }
        enabled: { type: boolean }
        is_default: { type: boolean }
        archived_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        statuses:
          type: array
          items: { $ref: '#/components/schemas/WorkflowStatus' }
        field_count: { type: integer, minimum: 0, description: 绑定的未归档自定义字段数 }
        task_count: { type: integer, minimum: 0, description: 该类型的未删除任务数（> 0 时删除会 409 TYPE_IN_USE） }
    RelationTypeKey:
      type: string
      enum: [BLOCKS, CLONES, DUPLICATES, RELATES]
    RelationType:
      type: object
      description: 内置类型 id 为 "builtin:<KEY>"，name / outward_label / inward_label 为空串（前端按 key 做多语言），version / created_at 为 null。
      required: [id, builtin, key, name, outward_label, inward_label, symmetric, version, created_at]
      properties:
        id: { type: string }
        builtin: { type: boolean }
        key:
          oneOf:
            - $ref: '#/components/schemas/RelationTypeKey'
            - type: 'null'
        name: { type: string }
        outward_label: { type: string }
        inward_label: { type: string }
        symmetric: { type: boolean, description: 仅 RELATES 为 true }
        version: { type: [integer, 'null'], minimum: 1 }
        created_at: { type: [string, 'null'], format: date-time }
    CustomFieldKind:
      type: string
      enum: [TEXT, NUMBER, SELECT, MULTI_SELECT, BOOLEAN, DATE, MEMBER, URL, RICH_TEXT]
    CustomFieldMemberScope:
      type: string
      enum: [ALL, HUMANS, AGENTS]
    CustomFieldOptionInput:
      type: object
      required: [label]
      additionalProperties: false
      properties:
        label: { type: string, minLength: 1, maxLength: 100 }
        color: { $ref: '#/components/schemas/HexColor', description: '不传默认 #6B7280' }
    CustomFieldOption:
      type: object
      required: [id, label, color, position, archived_at, version]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        color: { $ref: '#/components/schemas/HexColor' }
        position: { type: integer, minimum: 0 }
        archived_at: { type: [string, 'null'], format: date-time }
        version: { type: integer, minimum: 1 }
    CustomFieldCreator:
      type: object
      required: [user_id, email]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string }
    CustomField:
      type: object
      required: [id, name, kind, description, default_value, member_scope, options, used_by_type_count,
        created_by, archived_at, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: '#/components/schemas/CustomFieldKind' }
        description: { type: string }
        default_value:
          description: |
            null = 无默认值。TEXT / RICH_TEXT / URL / DATE → 字符串；NUMBER → 数字；BOOLEAN → 布尔；
            SELECT → 选项 id；MULTI_SELECT → 选项 id 数组；MEMBER → {kind: HUMAN|AGENT, id}。
        member_scope:
          oneOf:
            - $ref: '#/components/schemas/CustomFieldMemberScope'
            - type: 'null'
        options:
          type: array
          description: 未归档选项，按 position
          items: { $ref: '#/components/schemas/CustomFieldOption' }
        used_by_type_count: { type: integer, minimum: 0 }
        created_by:
          description: null = 系统创建
          oneOf:
            - $ref: '#/components/schemas/CustomFieldCreator'
            - type: 'null'
        archived_at: { type: [string, 'null'], format: date-time }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OrganizationTaskType:
      type: object
      required: [id, name, icon, field_ids]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        icon: { type: [string, 'null'] }
        field_ids:
          type: array
          description: 绑定的未归档字段，按绑定 position
          items: { type: string, format: uuid }
    OrganizationTaskTypeSpace:
      type: object
      required: [space_id, space_name, space_prefix, task_types]
      properties:
        space_id: { type: string, format: uuid }
        space_name: { type: string }
        space_prefix: { type: string }
        task_types:
          type: array
          items: { $ref: '#/components/schemas/OrganizationTaskType' }
    # ===== /全局配置 schemas =====

    # ===== 任务 schemas =====
    TaskPriority:
      type: string
      description: 界面 无/最低/低/中/高/紧急；新建任务默认 NONE。LOWEST 只在组织为 5 级（priority_levels = 5）时可写，否则 400 PRIORITY_LEVEL_UNAVAILABLE
      enum: [NONE, LOWEST, LOW, NORMAL, HIGH, URGENT]
    TaskAssigneeKind:
      type: string
      description: INVITATION 是待接受的组织邀请，引用 invitation.id；只有可读邀请名单的所有者/管理员能读写这种指派，仍须具有任务写权限。
      enum: [HUMAN, AGENT, CREW, INVITATION]
    TaskAssigneeRef:
      type: object
      required: [kind, id]
      additionalProperties: false
      properties:
        kind: { $ref: '#/components/schemas/TaskAssigneeKind' }
        id: { type: string, format: uuid }
    TaskAssignee:
      type: object
      required: [kind, id, name]
      properties:
        kind: { $ref: '#/components/schemas/TaskAssigneeKind' }
        id: { type: string, format: uuid }
        name: { type: string, description: 人员和待接受邀请为邮箱，Agent / 小队为名称；普通成员的响应不返回 INVITATION 项 }
    TaskLabelItem:
      type: object
      required: [id, name, color, group_id, space_id]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: [string, 'null'] }
        group_id: { type: [string, 'null'], format: uuid }
        space_id: { type: [string, 'null'], format: uuid, description: null = 组织级标签 }
    TaskParent:
      type: object
      required: [id, display_id, title]
      properties:
        id: { type: string, format: uuid }
        display_id: { type: string }
        title: { type: string }
    Task:
      type: object
      description: |
        assignee_user_id / executor_agent_id 是旧字段（第一位人员 / 第一个 Agent 的投影），为空时不输出。
        labels 是旧字段（标签名称），新代码用 label_items。
      required: [organization_id, space_id, id, display_id, sequence, type_id, type_name, status_id, status_name,
        status_category, title, description, acceptance, priority, version, created_at, updated_at, labels,
        start_date, due_date, parent_task_id, parent, rank, assignees, label_items, subtask_count,
        subtask_done_count, created_by, type_icon, status_color, deleted, iteration_id, project_id, triage, duplicate_of]
      properties:
        organization_id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        id: { type: string, format: uuid }
        display_id: { type: string, description: '<空间前缀>-<序号>' }
        sequence: { type: integer, minimum: 1 }
        type_id: { type: string, format: uuid }
        type_name: { type: string }
        status_id: { type: string, format: uuid }
        status_name: { type: string }
        status_category: { $ref: '#/components/schemas/TaskStatusCategory' }
        title: { type: string }
        description: { type: string }
        acceptance: { type: string }
        assignee_user_id: { type: string, format: uuid, deprecated: true }
        executor_agent_id: { type: string, format: uuid, deprecated: true }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        labels:
          type: array
          deprecated: true
          items: { type: string }
        start_date: { type: [string, 'null'], format: date }
        due_date: { type: [string, 'null'], format: date }
        parent_task_id: { type: [string, 'null'], format: uuid }
        parent:
          description: 父任务未删除时返回
          oneOf:
            - $ref: '#/components/schemas/TaskParent'
            - type: 'null'
        rank: { type: string, description: 有效手动排序键（旧任务按序号推导），按 C 排序比较 }
        assignees:
          type: array
          description: 人员在前、Agent 次之、小队最后
          items: { $ref: '#/components/schemas/TaskAssignee' }
        label_items:
          type: array
          items: { $ref: '#/components/schemas/TaskLabelItem' }
        subtask_count: { type: integer, minimum: 0, description: 未删除的直接子任务数 }
        subtask_done_count: { type: integer, minimum: 0, description: 其中 DONE 类别的数量 }
        created_by: { type: [string, 'null'], format: uuid, description: task.created 动态的操作人 }
        type_icon: { type: [string, 'null'] }
        status_color: { type: [string, 'null'] }
        deleted: { type: boolean, description: 恒为 false（已删除任务不会返回） }
        estimate: { type: [number, 'null'], description: 估时（点数刻度为点数，time 刻度为秒）；null = 未估时 }
        iteration_id: { type: [string, 'null'], format: uuid, description: 所属迭代；未加入迭代时为 null }
        project_id: { type: [string, 'null'], format: uuid, description: 所属专项；无专项为 null }
        favorited: { type: boolean, description: 当前用户是否收藏了该任务（个人偏好；其他人看不到） }
        external_assignee:
          description: 处理人是导入时创建的外部账号；没有时不输出或为 null
          oneOf:
            - $ref: '#/components/schemas/TaskExternalAssignee'
            - type: 'null'
        triage:
          type: [object, 'null']
          required: [entered_at, source, snoozed_until]
          properties:
            entered_at: { type: string, format: date-time }
            source: { type: string, enum: [member, guest, agent, integration] }
            snoozed_until: { type: [string, 'null'], format: date-time }
        duplicate_of:
          oneOf:
            - $ref: '#/components/schemas/TaskParent'
            - type: 'null'
    DeletedTask:
      type: object
      description: 「最近删除」列表项。类型、状态取删除时的值（类型可能已归档）。
      required: [id, space_id, display_id, title, type_id, type_name, type_icon, status_id, status_name, status_category,
        status_color, deleted_at, deleted_by, version]
      properties:
        id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        display_id: { type: string, description: '<空间前缀>-<序号>，恢复后不变' }
        title: { type: string }
        type_id: { type: string, format: uuid }
        type_name: { type: string }
        type_icon: { type: [string, 'null'] }
        status_id: { type: string, format: uuid }
        status_name: { type: string }
        status_category: { $ref: '#/components/schemas/TaskStatusCategory' }
        status_color: { type: [string, 'null'] }
        deleted_at: { type: string, format: date-time }
        deleted_by:
          description: 删除人；账号已不存在时为 null
          oneOf:
            - $ref: '#/components/schemas/DeletedTaskActor'
            - type: 'null'
        version: { type: integer, minimum: 1, description: restoreTask 需要的版本 }
    DeletedTaskActor:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: 姓名，未填写时为邮箱 }
    ReactionSummary:
      type: object
      required: [emoji, count, reacted]
      properties:
        emoji: { type: string }
        count: { type: integer, minimum: 1 }
        reacted: { type: boolean, description: 当前成员是否回应过 }
    TaskDetail:
      allOf:
        - $ref: '#/components/schemas/Task'
        - type: object
          required: [description_reactions]
          properties:
            description_reactions:
              type: array
              items: { $ref: '#/components/schemas/ReactionSummary' }
    MyTask:
      allOf:
        - $ref: '#/components/schemas/Task'
        - type: object
          required: [space_name, assigned_to_me, created_by_me]
          properties:
            space_name: { type: string }
            executor_agent_name: { type: string, description: 第一个 Agent 处理人的名称；没有时不输出 }
            assigned_to_me: { type: boolean }
            created_by_me: { type: boolean }
    TaskPositionInput:
      type: object
      additionalProperties: false
      description: 两个都为空 = 移到空间末尾
      properties:
        before_task_id: { type: [string, 'null'], format: uuid, description: 放到该任务之前 }
        after_task_id: { type: [string, 'null'], format: uuid, description: 放到该任务之后 }
    TaskCreateRequest:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        submit_to_triage: { type: boolean, description: 显式创建待分拣任务；只在启用分拣台的空间生效 }
        source_comment:
          type: object
          description: 从有写权限的任务评论创建，在同一事务内记录来源并建立相关或父子关系
          required: [space_id, task_id, id]
          properties:
            space_id: { type: string, format: uuid }
            task_id: { type: string, format: uuid }
            id: { type: string, format: uuid }
        type_id: { type: string, format: uuid, description: 不传用空间默认类型 }
        status_id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: string, maxLength: 10000 }
        acceptance: { type: string, maxLength: 10000 }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        start_date: { type: string, format: date }
        due_date: { type: string, format: date, description: 不早于 start_date（400 INVALID_DATE_RANGE） }
        parent_task_id: { type: string, format: uuid }
        assignees:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/TaskAssigneeRef' }
        label_ids:
          type: array
          maxItems: 20
          description: 组织级未归档标签或本空间标签；同一单选分组最多一个（400 LABEL_GROUP_EXCLUSIVE）
          items: { type: string, format: uuid }
        field_values:
          type: object
          description: 字段 id → 取值；字段必须绑定到该任务类型
          additionalProperties: true
        after_task_id: { type: string, format: uuid, description: 放在该任务之后 }
        estimate: { type: [number, 'null'], minimum: 0, maximum: 1000000000, description: 空间未启用估时 → 400 ESTIMATION_DISABLED；不符合刻度 → 400 INVALID_ESTIMATE }
        iteration_id: { type: [string, 'null'], format: uuid, description: 所属迭代；只能指定同空间 planned 或 active 迭代 }
        project_id: { type: [string, 'null'], format: uuid, description: 所属专项；专项必须关联任务所在空间（400 INVALID_PROJECT），空间未启用专项 → 400 PROJECTS_DISABLED }
        assignee_user_id: { type: string, format: uuid, deprecated: true }
        executor_agent_id: { type: string, format: uuid, deprecated: true }
        labels:
          type: array
          deprecated: true
          description: 旧接口：按名称匹配组织级标签，否则取或建空间标签
          items: { type: string }
    TaskUpdateRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        type_id: { type: string, format: uuid }
        status_id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: string, maxLength: 10000 }
        acceptance: { type: string, maxLength: 10000 }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        start_date: { type: [string, 'null'], format: date }
        due_date: { type: [string, 'null'], format: date }
        parent_task_id: { type: [string, 'null'], format: uuid }
        assignees:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/TaskAssigneeRef' }
        label_ids:
          type: array
          maxItems: 20
          items: { type: string, format: uuid }
        position: { $ref: '#/components/schemas/TaskPositionInput' }
        estimate: { type: [number, 'null'], minimum: 0, maximum: 1000000000, description: null = 清空；规则同创建 }
        iteration_id: { type: [string, 'null'], format: uuid, description: 所属迭代；null = 移出迭代，只能指定同空间 planned 或 active 迭代 }
        project_id: { type: [string, 'null'], format: uuid, description: 所属专项；null = 移出专项；规则同创建 }
        version: { type: integer, minimum: 1 }
        assignee_user_id: { type: string, deprecated: true, description: 替换第一位人员处理人；空串表示移除 }
        executor_agent_id: { type: string, deprecated: true, description: 替换第一个 Agent 处理人；空串表示移除 }
        labels:
          type: array
          deprecated: true
          items: { type: string }
        assignment_conversation:
          type: string
          enum: [reuse, new]
          description: |
            只在本次请求新增了 Agent 处理人时有意义，其它情况忽略；缺省等于 reuse。
            - reuse：沿用该任务 + Agent 现有的打开状态指派会话（没有时由服务端新建），即原有行为；
            - new：在同一事务里把现有的打开状态指派会话降级为普通会话（origin 改为 USER，可见性、成员、消息都不变），
              服务端随后新建一个指派会话，之后的运行都在新会话里进行。
    TaskAgentRunRequest:
      type: object
      required: [agent_id]
      additionalProperties: false
      properties:
        agent_id: { type: string, format: uuid, description: 必须已经是该任务的 Agent 处理人 }
        assignment_conversation:
          type: string
          enum: [reuse, new]
          description: 缺省等于 reuse；取值含义同 TaskUpdateRequest.assignment_conversation
    TaskAgentRunAccepted:
      type: object
      required: [task_id, agent_id, assignment_conversation]
      properties:
        task_id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid }
        assignment_conversation: { type: string, enum: [reuse, new] }
    TaskBatchUpdateRequest:
      type: object
      required: [tasks, patch]
      additionalProperties: false
      properties:
        tasks:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [id, version]
            additionalProperties: false
            properties:
              id: { type: string, format: uuid }
              version: { type: integer, minimum: 1 }
        patch: { $ref: '#/components/schemas/TaskBatchPatch' }
    TaskBatchPatch:
      type: object
      description: 恰好给出一个字段
      minProperties: 1
      maxProperties: 1
      additionalProperties: false
      properties:
        status_id: { type: string, format: uuid }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        assignee:
          type: object
          required: [kind, id]
          additionalProperties: false
          properties:
            kind: { type: string, enum: [HUMAN, AGENT, CREW] }
            id: { type: [string, 'null'], format: uuid, description: null = 清空该类处理人 }
        labels:
          type: object
          additionalProperties: false
          properties:
            add:
              type: array
              maxItems: 20
              items: { type: string, format: uuid }
            remove:
              type: array
              maxItems: 20
              items: { type: string, format: uuid }
    TaskStatusCount:
      type: object
      required: [status_id, count]
      properties:
        status_id: { type: string, format: uuid }
        count: { type: integer, minimum: 1 }
    SearchType:
      type: string
      enum: [task, project, view, agent, person, space, doc, conversation, message]
    SearchItem:
      type: object
      required: [id, title, subtitle]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, description: 任务标题 / 专项、视图、空间、Agent、文档名称 / 人员姓名（无姓名时为邮箱） }
        subtitle: { type: string, description: 任务 / 专项 / 视图 / Agent / 文档为所在空间名称；空间为标识符；人员为邮箱 }
        space_id: { type: string, format: uuid, description: 所在空间（人员没有；空间类等于自身 id） }
        display_id: { type: string, description: 仅任务：当前编号，如 OPEN-12 }
        conversation_kind: { type: string, enum: [agent, direct] }
        conversation_id: { type: string, format: uuid }
        message_id: { type: string, format: uuid }
        message_seq: { type: integer, minimum: 1 }
        occurred_at: { type: string, format: date-time, description: 匹配消息时间或会话的最近消息时间 }
        sender_kind: { type: string, enum: [user, agent, system], description: 消息作者或会话对象；小队使用 agent }
        sender_id: { type: string, format: uuid }
        sender_name: { type: string }
        task_display_id: { type: string, description: 任务会话的任务编号 }
    SearchGroup:
      type: object
      required: [type, items]
      properties:
        type: { $ref: '#/components/schemas/SearchType' }
        total: { type: integer, minimum: 0, description: 当前条件下可读的命中总数（分页模式） }
        items:
          type: array
          items: { $ref: '#/components/schemas/SearchItem' }
    SearchResponse:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items: { $ref: '#/components/schemas/SearchGroup' }
    TaskCounts:
      type: object
      required: [total, by_status]
      properties:
        total: { type: integer, minimum: 0 }
        by_status:
          type: array
          description: 只列出计数大于 0 的状态，按 status_id 排序
          items: { $ref: '#/components/schemas/TaskStatusCount' }
    StatsGroup:
      type: object
      required: [key, count]
      properties:
        key: { type: string, description: 分组键（状态 / 类型 id，或优先级取值） }
        count: { type: integer, minimum: 1 }
    AssigneeStatsGroup:
      type: object
      required: [kind, id, count]
      properties:
        kind: { type: string, enum: [HUMAN, AGENT, CREW, NONE], description: NONE = 没有任何处理人（id 为空串） }
        id: { type: string }
        count: { type: integer, minimum: 1, description: 一个任务有多个处理人时每人各计一次 }
    TaskStats:
      type: object
      required: [total, completed, open, overdue, by_status, by_type, by_priority, by_assignee, trend]
      properties:
        total: { type: integer, minimum: 0 }
        completed: { type: integer, minimum: 0 }
        open: { type: integer, minimum: 0, description: 未完成（不含已取消 / 重复） }
        overdue: { type: integer, minimum: 0 }
        by_status: { type: array, items: { $ref: '#/components/schemas/StatsGroup' } }
        by_type: { type: array, items: { $ref: '#/components/schemas/StatsGroup' } }
        by_priority: { type: array, items: { $ref: '#/components/schemas/StatsGroup' } }
        by_assignee: { type: array, items: { $ref: '#/components/schemas/AssigneeStatsGroup' } }
        trend:
          type: array
          description: 最近 trend_days 天（含今天）逐日完成数，按日期升序
          items:
            type: object
            required: [date, completed]
            properties:
              date: { type: string, format: date }
              completed: { type: integer, minimum: 0 }
    TaskActivityKind:
      type: string
      description: |
        字段级动态。旧数据中还可能出现 task.updated 等历史取值，前端应按未知类型兜底显示。
        task.created / task.title_changed / task.description_changed / task.status_changed {from_status_id,to_status_id} /
        task.priority_changed {from,to} / task.type_changed {from,to} / task.assignee_added {kind,id} / task.assignee_removed {kind,id} /
        task.label_added {label_id} / task.label_removed {label_id} / task.start_date_changed {from,to} / task.due_date_changed {from,to} /
        task.parent_changed {from,to} / task.relation_added {relation_id,type_id,target_task_id} / task.relation_removed /
        task.link_added {link_id} / task.link_removed {link_id} / task.field_changed {field_id, field_name} / task.deleted /
        task.estimate_changed {from,to}（数值或 null）/
        task.restored {detached_parent_id?, type_reset?}（从「最近删除」恢复；原父任务已删除时记 detached_parent_id，
        类型已归档改用默认类型时 type_reset = true，并另写 task.type_changed / task.status_changed）。
    TaskActivity:
      type: object
      required: [id, task_id, actor_id, kind, safe_diff, source_id, created_at]
      properties:
        id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/TaskActivityKind' }
        safe_diff: { type: object, additionalProperties: true }
        source_id: { type: string }
        created_at: { type: string, format: date-time }
    TimelineActivity:
      type: object
      required: [id, task_id, kind, safe_diff, actor_id, actor_name, created_at]
      properties:
        id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/TaskActivityKind' }
        safe_diff: { type: object, additionalProperties: true }
        actor_id: { type: string, format: uuid }
        actor_name: { type: string, description: 操作人 email }
        created_at: { type: string, format: date-time }
    CommentMention:
      type: object
      description: user_id 与 agent_id 恰好一个
      properties:
        user_id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid }
    TaskComment:
      type: object
      required: [organization_id, space_id, task_id, id, author_kind, body, created_at]
      properties:
        edit_version: { type: integer, minimum: 1 }
        edited_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, description: 仅已解决的根评论返回 }
        resolved_comment_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        id: { type: string, format: uuid }
        author_kind: { type: string, enum: [USER, AGENT], description: AGENT = Agent 任务工具写的评论 }
        author_user_id: { type: string, format: uuid, description: author_kind = USER 时出现 }
        author_agent_id: { type: string, format: uuid, description: author_kind = AGENT 时出现 }
        body: { type: string }
        client_comment_id: { type: string }
        reply_to_id: { type: string, format: uuid }
        mentions:
          type: array
          description: 没有提及时不输出
          items: { $ref: '#/components/schemas/CommentMention' }
        created_at: { type: string, format: date-time }
    TimelineComment:
      type: object
      required: [organization_id, space_id, task_id, id, author_kind, author_name, body, mentions, reactions, created_at]
      properties:
        edit_version: { type: integer, minimum: 1 }
        edited_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, description: 仅已解决的根评论返回 }
        resolved_comment_id: { type: string, format: uuid }
        can_edit: { type: boolean, description: 当前成员是否有任务写权限且可编辑这条真人评论 }
        can_delete: { type: boolean, description: 当前成员是否有权删除这条评论及其回复 }
        has_replies: { type: boolean }
        organization_id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        id: { type: string, format: uuid }
        author_kind: { type: string, enum: [USER, AGENT] }
        author_user_id: { type: string, format: uuid, description: author_kind = USER 时出现 }
        author_agent_id: { type: string, format: uuid, description: author_kind = AGENT 时出现 }
        author_name: { type: string, description: 用户作者为 email，Agent 作者为 Agent 名称 }
        body: { type: string }
        client_comment_id: { type: string }
        reply_to_id: { type: string, format: uuid }
        reply_count: { type: integer, description: roots 模式下该主评论的回复总数，省略代表 0 }
        recent_replies:
          type: array
          description: 最近至多五条回复，按时间升序，每条正文最多 180 字符
          items:
            type: object
            required: [id, author_name, body]
            properties:
              id: { type: string, format: uuid }
              author_name: { type: string }
              author_user_id: { type: string, format: uuid }
              author_agent_id: { type: string, format: uuid }
              body: { type: string }
        mentions:
          type: array
          items: { $ref: '#/components/schemas/CommentMention' }
        reactions:
          type: array
          items: { $ref: '#/components/schemas/ReactionSummary' }
        created_at: { type: string, format: date-time }
    TimelineItem:
      type: object
      description: type=activity 时只有 activity；type=comment 时只有 comment
      required: [type]
      properties:
        type: { type: string, enum: [activity, comment] }
        activity: { $ref: '#/components/schemas/TimelineActivity' }
        comment: { $ref: '#/components/schemas/TimelineComment' }
    TaskFollower:
      type: object
      required: [kind, id, name]
      properties:
        kind: { type: string, enum: [HUMAN, AGENT] }
        id: { type: string, format: uuid }
        name: { type: string }
    TaskRelationTask:
      type: object
      required: [id, space_id, display_id, title, status_category, status_name]
      properties:
        id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        display_id: { type: string }
        title: { type: string }
        status_category: { $ref: '#/components/schemas/TaskStatusCategory' }
        status_name: { type: string }
    TaskRelation:
      type: object
      required: [id, type_id, key, direction, task, created_at]
      properties:
        id: { type: string, format: uuid }
        type_id: { type: string, description: '"builtin:<KEY>" 或自定义类型 uuid（见 RelationType）' }
        key:
          description: 内置类型的 key；自定义类型为 null
          oneOf:
            - $ref: '#/components/schemas/RelationTypeKey'
            - type: 'null'
        direction: { type: string, enum: [OUTWARD, INWARD], description: OUTWARD = 当前任务是源（显示 outward_label） }
        task: { $ref: '#/components/schemas/TaskRelationTask' }
        created_at: { type: string, format: date-time }
    TaskLink:
      type: object
      required: [id, url, title, version, created_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        title: { type: string }
        version: { type: integer, minimum: 1 }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TaskFieldValue:
      type: object
      required: [field, value, bound]
      properties:
        field: { $ref: '#/components/schemas/CustomField' }
        value: { description: 取值形状见 CustomField.default_value；未设置为 null }
        bound: { type: boolean, description: false = 字段已解绑或归档，仅展示残留取值 }
    InboxPreferenceLevel:
      type: string
      enum: [off, important, normal]
    InboxPreference:
      type: object
      required: [key, group, level]
      properties:
        key: { type: string }
        group: { type: string, description: Empty for group switches }
        level: { $ref: '#/components/schemas/InboxPreferenceLevel' }
    InboxSection:
      type: string
      enum: [inbox, later, cleared]
      default: inbox
    InboxNotificationKind:
      type: string
      enum: [MENTION, HANDOFF, HANDOFF_REVIEW, REPLY, TASK_COMMENT, RUN_FAILED, TASK_ASSIGNED, TRIAGE_NEW, AUTOMATION_RESULT, TASK_UPDATED, TASK_REACTION, RUN_COMPLETED, RUN_BLOCKED, DIRECT_MESSAGE]
      description: AUTOMATION_RESULT 可能不含会话；DIRECT_MESSAGE 带私聊和消息 id。
    InboxGroup:
      type: object
      description: 按任务、对话、自动化或真人私聊聚合。可选字段为空时不输出。
      required: [id, notification_id, kind, task_type_icon, safe_summary, count, unread, latest_at]
      properties:
        id: { type: string, format: uuid }
        notification_id: { type: string, format: uuid, description: 组内最新一条通知 }
        direct_chat_id: { type: string, format: uuid }
        direct_message_id: { type: string, format: uuid }
        automation_id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/InboxNotificationKind' }
        task_id: { type: string, format: uuid }
        task_display_id: { type: string }
        task_title: { type: string }
        task_status_category: { $ref: '#/components/schemas/TaskStatusCategory' }
        task_type_icon: { type: [string, 'null'] }
        conversation_id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        space_name: { type: string }
        agent_id: { type: string, format: uuid }
        actor_kind: { type: string, enum: [USER, AGENT] }
        actor_name: { type: string }
        safe_summary: { type: string }
        count: { type: integer, minimum: 1 }
        unread: { type: boolean }
        snoozed_until: { type: string, format: date-time }
        cleared_at: { type: string, format: date-time }
        latest_at: { type: string, format: date-time }
    InboxCounts:
      type: object
      required: [inbox, inbox_unread, inbox_important_unread, inbox_other_unread, later, cleared]
      properties:
        inbox: { type: integer, minimum: 0 }
        inbox_unread: { type: integer, minimum: 0 }
        inbox_important_unread: { type: integer, minimum: 0, description: 收件箱里含「重要」未读通知的组数 }
        inbox_other_unread: { type: integer, minimum: 0, description: 收件箱里含「其他」未读通知的组数；同一组可能两类都有，重要 + 其他 可大于 inbox_unread }
        later: { type: integer, minimum: 0 }
        cleared: { type: integer, minimum: 0 }
    InboxPage:
      type: object
      required: [groups, counts]
      properties:
        groups:
          type: array
          items: { $ref: '#/components/schemas/InboxGroup' }
        counts: { $ref: '#/components/schemas/InboxCounts' }
        next_cursor: { type: string, description: 没有下一页时不输出 }
    InboxAffected:
      type: object
      required: [affected]
      properties:
        affected: { type: integer, minimum: 0 }
    OrganizationMember:
      type: object
      required: [user_id, email, role, status, authorization_version, created_at, full_name, avatar_url]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: '#/components/schemas/OrganizationRole' }
        status: { type: string, enum: [ACTIVE, INVITED, REVOKED] }
        authorization_version: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        full_name: { type: string, description: 空串表示没有设置 }
        avatar_url: { type: [string, 'null'] }
        spaces:
          type: array
          description: 只在列表接口返回：该成员显式加入、仍活跃且当前用户能读到的空间，按名称排序
          items: { $ref: '#/components/schemas/MemberSpace' }
    SpaceMember:
      type: object
      required: [user_id, email, role, status, created_at]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string }
        role: { type: string, enum: [OWNER, EDITOR, MEMBER, VIEWER] }
        status: { type: string, enum: [ACTIVE, REVOKED] }
        created_at: { type: string, format: date-time }
    # ===== /任务 schemas =====

    # ===== Agent 与小队 schemas =====
    AgentKind:
      type: string
      description: DESIGN 已在数据库放开，界面暂不可选，接口暂不接受
      enum: [CODE, OFFICE]
    AgentVisibility:
      type: string
      enum: [PRIVATE, SHARED]
    AgentAvatar:
      type: [object, 'null']
      description: 头像描述（例如 {"kind":"emoji","value":"🦊","color":"#F97316"}），序列化后不超过 1 KiB；null 表示默认头像
      additionalProperties: true
    SpaceAgent:
      type: object
      description: Agent。archived_at 为空时不输出；builtin_kind 只对内置小助手输出；config 为当前配置版本（尚无配置时不输出）。
      required: [organization_id, space_id, id, owner_user_id, name, description, kind, visibility,
        current_config_version, version, created_at, updated_at, title, avatar, allow_assign, allow_direct_chat,
        trigger_crew, trigger_mention, trigger_workflow, profile_version, online, computer_name, favorite]
      properties:
        organization_id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        id: { type: string, format: uuid }
        owner_user_id: { type: string, format: uuid }
        name: { type: string }
        title: { type: string, maxLength: 64, description: 头衔（例如「前端工程师」），可为空串 }
        description: { type: string }
        avatar: { $ref: '#/components/schemas/AgentAvatar' }
        kind: { $ref: '#/components/schemas/AgentKind' }
        visibility: { $ref: '#/components/schemas/AgentVisibility' }
        builtin_kind: { type: string, enum: [ASSISTANT] }
        allow_assign: { type: boolean, description: false 时不能被单独指派为任务处理人 }
        allow_direct_chat: { type: boolean, description: false 时不能单聊（新建非任务会话 403） }
        trigger_crew: { type: boolean }
        trigger_mention: { type: boolean }
        trigger_workflow: { type: boolean }
        profile_version: { type: integer, minimum: 1, description: 资料类修改的乐观锁 }
        online: { type: boolean, description: 当前配置的电脑 90 秒内有心跳且授权 ACTIVE }
        computer_name: { type: [string, 'null'] }
        favorite: { type: boolean, description: 当前成员已收藏到侧栏 }
        archived_at: { type: string, format: date-time }
        current_config_version: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1, description: 配置版本链与旧 PATCH 的乐观锁 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        config: { $ref: '#/components/schemas/AgentConfigVersion' }
    AgentDirectoryMode:
      type: string
      enum: [NONE, WORKSPACE, EXPLICIT]
    AgentConfigInput:
      type: object
      description: 配置版本的可写字段。新字段缺省时取默认值（与旧版本行为一致）。
      required: [computer_id, grant_id, runtime, model]
      properties:
        instructions: { type: string, maxLength: 100000 }
        computer_id: { type: string, format: uuid }
        grant_id: { type: string, format: uuid }
        runtime: { type: string, maxLength: 64 }
        model: { type: string, maxLength: 128 }
        max_concurrency: { type: integer, minimum: 1, maximum: 16, default: 1 }
        queue_timeout_seconds: { type: integer, minimum: 1, maximum: 604800, default: 3600 }
        run_timeout_seconds: { type: integer, minimum: 60, maximum: 28800, default: 3600 }
        directory_mode: { $ref: '#/components/schemas/AgentDirectoryMode' }
        directory_roots: { type: array, maxItems: 32, items: { type: string, maxLength: 256 } }
        chat_concurrency: { type: string, enum: [DEFAULT, SHARE_TASK, MANUAL], default: DEFAULT }
        chat_concurrency_value: { type: [integer, 'null'], minimum: 1, maximum: 64, description: 仅 MANUAL 时必填，其余必须为 null }
        workdir_isolation: { type: string, enum: [WORKTREE, DIRECT], default: WORKTREE }
        approval_mode: { $ref: '#/components/schemas/ApprovalMode', default: FOLLOW_RUNTIME, description: Agent 的默认权限模式；对话可以覆盖，四档含义见 ApprovalMode }
        collaboration_mode:
          $ref: '#/components/schemas/CollaborationMode'
          default: FOLLOW_RUNTIME
          description: |
            Agent 的协作模式（没有对话级覆盖），三个取值的含义见 CollaborationMode。
            为兼容旧客户端，服务端还接受历史值 FOLLOW_AGENT，保存时规范化为 FOLLOW_RUNTIME；其他值返回 400 INVALID_REQUEST（与其他非法配置相同）。
        custom_args: { type: array, maxItems: 64, items: { type: string, maxLength: 1024 }, description: 追加给 Runtime 的命令行参数 }
        git_author_name_mode: { type: string, enum: [INHERIT, USER_AND_AGENT, USER, OWNER_AND_AGENT, OWNER, MACHINE, MANUAL], default: USER_AND_AGENT }
        git_author_name: { type: string, maxLength: 128, description: 仅 MANUAL 时必填 }
        git_author_email_mode: { type: string, enum: [INHERIT, USER, OWNER, MACHINE, MANUAL], default: USER }
        git_co_author_enabled: { type: [boolean, 'null'], description: 'null 继承空间/组织；true 在运行指令中要求添加 Agent 名称和所有者邮箱的 Co-authored-by；false 不注入' }
        git_author_email: { type: string, maxLength: 254, description: 仅 MANUAL 时必填 }
    AgentConfigCreateRequest:
      allOf:
        - { $ref: '#/components/schemas/AgentConfigInput' }
        - type: object
          required: [expected_agent_version]
          properties:
            expected_agent_version: { type: integer, minimum: 1 }
    AgentConfigVersion:
      type: object
      required: [organization_id, agent_id, config_version, instructions, computer_id, grant_id, runtime, model,
        max_concurrency, queue_timeout_seconds, run_timeout_seconds, directory_mode, directory_roots,
        chat_concurrency, chat_concurrency_value, workdir_isolation, approval_mode, collaboration_mode, custom_args,
        git_author_name_mode, git_author_name, git_author_email_mode, git_author_email, env_digest, created_by, created_at]
      properties:
        organization_id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid }
        config_version: { type: integer, minimum: 1 }
        instructions: { type: string }
        computer_id: { type: string, format: uuid }
        grant_id: { type: string, format: uuid }
        runtime: { type: string }
        model: { type: string }
        max_concurrency: { type: integer }
        queue_timeout_seconds: { type: integer }
        run_timeout_seconds: { type: integer }
        directory_mode: { $ref: '#/components/schemas/AgentDirectoryMode' }
        directory_roots: { type: array, items: { type: string } }
        chat_concurrency: { type: string, enum: [DEFAULT, SHARE_TASK, MANUAL] }
        chat_concurrency_value: { type: [integer, 'null'] }
        workdir_isolation: { type: string, enum: [WORKTREE, DIRECT] }
        approval_mode: { $ref: '#/components/schemas/ApprovalMode' }
        collaboration_mode:
          type: string
          description: |
            协作模式，通常是 CollaborationMode 的三个取值之一。历史值 FOLLOW_AGENT 读取时返回 FOLLOW_RUNTIME（不改写数据）；
            历史上经接口写入的其他值原样返回，派发时按「设备不支持」使 Run 失败，客户端应提示用户重新选择。
        custom_args: { type: array, items: { type: string } }
        git_author_name_mode: { type: string, enum: [INHERIT, USER_AND_AGENT, USER, OWNER_AND_AGENT, OWNER, MACHINE, MANUAL] }
        git_author_name: { type: string }
        git_author_email_mode: { type: string, enum: [INHERIT, USER, OWNER, MACHINE, MANUAL] }
        git_co_author_enabled: { type: [boolean, 'null'] }
        git_author_email: { type: string }
        env_digest: { type: string, description: 创建该版本时环境变量的摘要（64 位十六进制），空串表示没有环境变量或无法计算；仅用于审计 }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    AgentCreateRequest:
      type: object
      required: [name, kind, visibility, config]
      properties:
        name: { type: string, maxLength: 255 }
        description: { type: string, maxLength: 10000 }
        kind: { $ref: '#/components/schemas/AgentKind' }
        visibility: { $ref: '#/components/schemas/AgentVisibility' }
        config: { $ref: '#/components/schemas/AgentConfigInput' }
        title: { type: string, maxLength: 64 }
        avatar: { $ref: '#/components/schemas/AgentAvatar' }
        allow_assign: { type: boolean, default: true }
        allow_direct_chat: { type: boolean, default: true }
    AgentUpdateRequest:
      type: object
      required: [version]
      properties:
        name: { type: string, maxLength: 255 }
        description: { type: string, maxLength: 10000 }
        kind: { $ref: '#/components/schemas/AgentKind' }
        visibility: { $ref: '#/components/schemas/AgentVisibility' }
        archived: { type: boolean }
        version: { type: integer, minimum: 1 }
    AgentProfilePatch:
      type: object
      required: [profile_version]
      properties:
        name: { type: string, maxLength: 255 }
        title: { type: string, maxLength: 64 }
        description: { type: string, maxLength: 10000 }
        avatar: { $ref: '#/components/schemas/AgentAvatar' }
        allow_assign: { type: boolean }
        allow_direct_chat: { type: boolean }
        trigger_crew: { type: boolean }
        trigger_mention: { type: boolean }
        trigger_workflow: { type: boolean }
        space_id: { type: string, format: uuid }
        visibility: { $ref: '#/components/schemas/AgentVisibility' }
        owner_user_id: { type: string, format: uuid }
        profile_version: { type: integer, minimum: 1 }
    AgentEnvVar:
      type: object
      required: [name, value, has_value, version, updated_at]
      properties:
        name: { type: string }
        value: { type: [string, 'null'], description: 无权查看原值、未配置主密钥或无法解密时为 null }
        has_value: { type: boolean }
        version: { type: integer, minimum: 1 }
        updated_at: { type: string, format: date-time }
    AgentEnvVarList:
      type: object
      required: [env_vars, can_view_values, secrets_available]
      properties:
        env_vars:
          type: array
          items: { $ref: '#/components/schemas/AgentEnvVar' }
        can_view_values: { type: boolean, description: 当前成员是否有权查看原值（Agent 所有者或组织 OWNER / ADMIN） }
        secrets_available: { type: boolean, description: 服务端是否配置了主密钥；false 时不能写入 }
    AgentRepo:
      type: object
      required: [id, agent_id, url, base_branch, position, version, created_by, created_at, updated_at]
      properties:
        connection_id: { type: string, description: '显式绑定 GitHub/GitLab 组织连接；空串表示匿名访问。仅组织 OWNER/ADMIN 可新增或变更授权及其仓库地址。' }
        id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid }
        url: { type: string, description: 'https://… 或 git@host:path / ssh://…' }
        base_branch: { type: string, description: 空串表示使用仓库默认分支 }
        position: { type: integer, minimum: 0, maximum: 63 }
        version: { type: integer, minimum: 1 }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AgentRepoCreateRequest:
      type: object
      required: [url]
      properties:
        connection_id: { type: string, description: '显式绑定 GitHub/GitLab 组织连接；空串表示匿名访问。仅组织 OWNER/ADMIN 可新增或变更授权及其仓库地址。' }
        url: { type: string, maxLength: 2048 }
        base_branch: { type: string, maxLength: 255 }
        position: { type: integer, minimum: 0, maximum: 63, description: 缺省追加到末尾 }
    AgentRepoPatch:
      type: object
      required: [version]
      properties:
        connection_id: { type: string, description: '显式绑定 GitHub/GitLab 组织连接；空串表示匿名访问。仅组织 OWNER/ADMIN 可新增或变更授权及其仓库地址。' }
        url: { type: string, maxLength: 2048 }
        base_branch: { type: string, maxLength: 255 }
        position: { type: integer, minimum: 0, maximum: 63 }
        version: { type: integer, minimum: 1 }
    AgentStats:
      type: object
      required: [task_count, run_count, input_tokens, output_tokens, last_run_at]
      properties:
        task_count: { type: integer, minimum: 0 }
        run_count: { type: integer, minimum: 0 }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        last_run_at: { type: [string, 'null'], format: date-time }
    AgentRunSummary:
      type: object
      description: started_at / duration_ms / usage / wait_reason 的语义与 RunResponse 相同
      required: [id, space_id, conversation_id, conversation_title, task_id, task_display_id, agent_id, actor_id,
        state, wait_reason, reason, config_version, created_at, updated_at, finished_at, started_at, duration_ms, usage]
      properties:
        id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        conversation_title: { type: [string, 'null'] }
        task_id: { type: [string, 'null'], format: uuid }
        task_display_id: { type: [string, 'null'], description: 例如 WEB-12 }
        agent_id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid }
        state: { type: string, enum: [QUEUED, PREPARING, RUNNING, CANCEL_REQUESTED, SUCCEEDED, FAILED, CANCELED] }
        wait_reason: { type: string, description: "排队原因，非排队为空串（与 RunResponse 同义；包含 AGENT_CHAT_CONCURRENCY）" }
        reason: { type: string }
        config_version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        started_at: { type: [string, 'null'], format: date-time, description: 设备开始执行的时间；排队中或准备前失败时为 null }
        duration_ms: { type: [integer, 'null'], minimum: 0, description: started_at → finished_at；任一为空时为 null }
        usage:
          description: run_results.usage；没有结果或旧 daemon 未上报时为 null
