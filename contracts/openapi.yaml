  /v1/organizations/{organizationID}/spaces/{spaceID}/tasks/batch-update:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
    post:
      operationId: batchUpdateTasks
      summary: 批量修改同一空间内的任务（单事务，全部成功或全部失败；Idempotency-Key 可选，操作名 task.batch_update）
      description: |
        tasks 为 1–100 个不重复的任务及调用方看到的 version；patch 恰好给出一个字段（一次只做一类修改）。
        每个任务按单条 PATCH 的规则逐条鉴权与校验，并写同样的字段级动态、通知、Agent 指派事件（ASSIGNED / UNASSIGNED）、
        自动化与实时事件；某个任务的该字段已经是目标值时视为成功、不写动态（版本号仍加一，与单条 PATCH 一致）。
        任一任务失败整批回滚，error.details.task_ids 列出问题任务：任务不存在 / 已删除 / 不在该空间 404 NOT_FOUND；
        version 过期 409 VERSION_CONFLICT；status_id 不属于某些任务的类型工作流 400 INVALID_REQUEST；无更新权限 403；
        空间已停用 409 SPACE_RETIRED。请求形状不合法（数量、重复 id、patch 字段个数、标签增删冲突）400 INVALID_REQUEST，
        error.details.reason 为 task_count / task_ref / duplicate_task / patch_fields / status_id / priority / assignee / labels，
        重复 id 时 details.task_ids 列出重复项。
        assignee：同一类（HUMAN / AGENT / CREW）只保留一个，id 为 null 表示清空该类。
        labels：在每个任务现有标签上先移除 remove、再追加 add；add、remove 各 ≤20 且不能有相同 id，至少给一个。
        服务端按任务 id 升序加锁。同键同请求返回这些任务的当前状态（Idempotent-Replayed: true），同键不同请求 409 IDEMPOTENCY_CONFLICT。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskBatchUpdateRequest' }
      responses:
        '200':
          description: 已更新（或幂等重放）；tasks 顺序与请求相同
          headers:
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] } }
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                properties:
                  tasks:
                    type: array
                    items: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/tasks/stats:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
    get:
      operationId: statsTasks
      summary: 统计视图：与列表 / 计数相同筛选下的服务端聚合（总数、完成、逾期、分布、完成趋势）
      description: |
        已完成 = 状态类别 DONE；未完成 = 不在 DONE / CANCELLED / DUPLICATE；逾期 = 未完成且截止日期早于 tz 时区的今天。
        完成趋势按 DONE 任务进入当前状态的时刻（缺失时用 updated_at）在 tz 时区分桶，逐日补零。
        分布类数组最多 50 项，按数量降序。
      parameters:
        - *statusIDParam
        - *statusIDNotParam
        - *typeIDParam
        - *typeIDNotParam
        - *priorityParam
        - *priorityNotParam
        - *assigneeParam
        - *assigneeNotParam
        - *assigneeIDParam
        - *iterationIDParam
        - *iterationIDNotParam
        - *projectIDParam
        - *projectIDNotParam
        - *viewIDParam
        - *labelIDParam
        - *labelIDNotParam
        - *creatorIDParam
        - *creatorIDNotParam
        - *createdViaAgentParam
        - *categoryParam
        - *qParam
        - *startFromParam
        - *startToParam
        - *dueFromParam
        - *dueToParam
        - *qNotParam
        - *startNotParam
        - *dueNotParam
        - *parentTaskIDParam
        - *includeSubtasksParam
        - *completedParam
        - *estimateMinParam
        - *estimateMaxParam
        - *estimateNoneParam
        - *sortParam
        - *orderParam
        - &statsTZParam { name: tz, in: query, description: IANA 时区名（如 Asia/Shanghai），决定今天与完成趋势的按日分桶；默认 UTC, schema: { type: string, maxLength: 64 } }
        - &statsTrendDaysParam { name: trend_days, in: query, description: 完成趋势天数（含今天）, schema: { type: integer, minimum: 1, maximum: 90, default: 30 } }
      responses:
        '200':
          description: 统计
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskStats' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/tasks/{taskID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - &taskIDParam { name: taskID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getTask
      responses:
        '200':
          description: 任务详情（附描述的表情汇总）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateTask
      summary: 更新任务（乐观锁）
      description: |
        start_date / due_date / parent_task_id 传 null 表示清空。assignees、label_ids 为整体替换。
        position 只改被拖动这一行的排序键：before/after 都为空 = 移到空间末尾；邻居必须同空间且未删除。
        父任务必须同空间、未删除；成环 409 TASK_HIERARCHY_CYCLE；层级超过 10 层 400 TASK_HIERARCHY_TOO_DEEP。
        每个变更字段写一条字段级动态；新增的人员处理人收到 TASK_ASSIGNED 通知并自动关注。
        新增 Agent 处理人时可带 assignment_conversation 选择运行对话，见 TaskUpdateRequest。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskUpdateRequest' }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteTask
      summary: 软删除任务（进入空间「最近删除」，可用 restoreTask 恢复）；有进行中的 Run 时 409 RUN_ACTIVE；直接子任务脱离父任务
      description: |
        删除使任务 version 加 1（成功后的版本 = 请求的 version + 1），前端「撤销」据此调用 restoreTask。
        被摘下的直接子任务在恢复父任务时不会自动挂回。
      parameters:
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '204': { description: 已删除 }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/tasks/{taskID}/restore:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *taskIDParam
    post:
      operationId: restoreTask
      summary: 从「最近删除」恢复任务（乐观锁）
      description: |
        权限：对空间有写权限，且是删除人本人或空间管理员（组织所有者 / 管理员、空间管理员）。
        空间读不到、任务不存在、不在本空间、不是自己删除的（非管理员）或是导入回滚删除的，一律 404 NOT_FOUND；
        只读角色 403 ACTION_FORBIDDEN；空间已停用 409 SPACE_RETIRED。
        任务未删除或 version 不符 409 VERSION_CONFLICT。
        恢复后编号不变；原父任务仍在本空间且未删除时挂回，否则变成顶层任务（写进 task.restored 动态的 detached_parent_id）；
        删除时被摘下的子任务不会挂回。任务类型已归档时改用空间默认类型，状态先保留同一状态、再按分类取 position 最小的、
        再用工作流默认状态（与移动任务的映射相同），并写 task.type_changed / task.status_changed 动态。
        不重新触发 Agent 执行（不写 task_agent_events）。写 task.restored 动态，并发 task.changed 实时事件。
        Idempotency-Key 可选（操作名 task.restore，保留 24 小时）：同键同请求返回任务当前状态（Idempotent-Replayed: true）。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              additionalProperties: false
              properties:
                version: { type: integer, minimum: 1, description: 已删除任务的当前版本（删除请求的 version + 1） }
      responses:
        '200':
          description: 已恢复（或幂等重放）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/deleted-tasks:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
    get:
      operationId: listDeletedTasks
      summary: 空间的「最近删除」（按 deleted_at, id 降序游标分页）
      description: |
        空间管理员（组织所有者 / 管理员、空间管理员）看本空间全部已删除任务（scope = all）；其他人只看自己删除的（scope = mine）。
        空间读不到 404。导入回滚删除的任务不在列表里。停用空间可以查看，但不能恢复。
      parameters:
        - *limitParam
        - *cursorParam
      responses:
        '200':
          description: 已删除任务
          content:
            application/json:
              schema:
                type: object
                required: [tasks, next_cursor, scope]
                properties:
                  tasks:
                    type: array
                    items: { $ref: '#/components/schemas/DeletedTask' }
                  next_cursor: { type: string, description: 空串表示没有下一页 }
                  scope: { type: string, enum: [all, mine], description: all = 空间全部；mine = 只含当前用户删除的 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/tasks/by-display-id/{displayID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: displayID, in: path, required: true, description: '<前缀>-<序号>，前缀不区分大小写', schema: { type: string } }
    get:
      operationId: getTaskByDisplayID
      description: |
        先按空间现有标识符查找，查不到再按历史标识符（space_prefix_history）查找；仍查不到时按移动前的旧编号
        （task_display_aliases，源空间的现有或历史标识符 + 旧序号）查找任务现在的位置。
        活任务优先于别名。canonical_display_id 为当前编号；任务已删除时 404。
      responses:
        '200':
          description: 任务详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskByDisplayID' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/tasks/{taskID}/activities:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *taskIDParam
    get:
      operationId: listTaskActivities
      summary: 任务动态（按 created_at, id 升序）
      parameters:
        - *limitParam
        - *cursorParam
      responses:
        '200':
          description: 动态列表
          content:
            application/json:
              schema:
                type: object
                required: [activities, next_cursor]
                properties:
                  activities:
                    type: array
                    items: { $ref: '#/components/schemas/TaskActivity' }
                  next_cursor: { type: string, description: 空串表示没有下一页 }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/tasks/{taskID}/move-preview:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *taskIDParam
    post:
      operationId: previewTaskMove
      summary: 预览把任务（含子任务）移到另一个空间的影响（只读；权限与 moveTask 相同）
      description: |
        移动集合 = 本任务 + 未删除的全部后代（最多 5000，超出 409 TOO_MANY_TASKS）。逐个任务给出类型 / 状态映射、
        估时换档、将清空的字段（cleared：iteration / project / estimate / parent / triage）与丢弃的空间标签；
        另给出将移除的 Agent / 小队处理人、活动运行数（QUEUED / PREPARING / RUNNING）、将解除同步的 Issue 链接，
        以及根任务将脱离的父任务。display_id_hint 只是提示，真正的编号在执行时分配。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_space_id]
              additionalProperties: false
              properties:
                target_space_id: { type: string, format: uuid }
      responses:
        '200':
          description: 预览
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskMovePreview' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/tasks/{taskID}/agent-runs:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *taskIDParam
    post:
      operationId: startTaskAgentRun
      summary: 让已指派的 Agent 再运行一次（不改处理人；权限同修改处理人）
      description: |
        召唤菜单里再次选择已经是处理人的 Agent 时使用：不修改任务，只入队一条指派事件，
        由服务端在指派会话里以发起人身份发「请处理任务 …」并 @Agent（与新增 Agent 处理人的效果相同）。
        assignment_conversation = new 时先在同一事务里把现有的打开状态指派会话降级为普通会话，服务端随后新建一个。
        前置条件：Agent 是该任务的处理人（否则 409 TASK_AGENT_NOT_ASSIGNED）；任务状态分类为待办或进行中
        （否则 409 TASK_AGENT_RUN_NOT_ALLOWED，与自动执行的条件一致）。任务已删除或不可见 404。
        执行是异步的：返回 202 只表示已入队；Agent 不可用等情况由服务端记为跳过，不会产生运行。
        Idempotency-Key 可选，操作名 task.agent_run（指纹含 space_id、task_id、agent_id、assignment_conversation）：
        同键同参数重放不再入队，返回相同的 202 响应并带 Idempotent-Replayed: true；同键不同参数 409 IDEMPOTENCY_CONFLICT。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskAgentRunRequest' }
      responses:
        '202':
          description: 已入队
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskAgentRunAccepted' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/tasks/{taskID}/move:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *taskIDParam
    post:
      operationId: moveTask
      summary: 把任务（含子任务）移到另一个空间（源空间删除权限 + 目标空间创建权限）
      description: |
        每个任务在目标空间取新编号；旧编号写入别名，by-display-id、搜索与 Git 提交 / PR 里的旧编号都解析到新编号。
        映射：类型按名称（不区分大小写），否则目标默认类型；状态先保留同一状态，再按分类取 position 最小的，再用工作流默认状态；
        迭代与分拣台字段清空（不进目标分拣台）；专项在目标空间也关联时保留，否则清空；估时换到目标刻度最近档位，取不到清空；
        空间标签丢弃，组织级标签与自定义字段值保留；根任务与不随之移动的父任务解除关系。
        Git 关联、评论、动态、附件跟随任务；Issue 同步链接解除（远端 Issue 不动）。会话与运行留在源空间，指派会话改为 COMPLETED。
        子树上有 Agent / 小队处理人或活动运行时必须带 cancel_runs: true，否则 409 TASK_HAS_ACTIVE_RUNS
        （error.details：active_runs、agent_assignees、tasks_count）；确认后取消运行、移除 Agent / 小队处理人并写 UNASSIGNED 事件。
        目标看不到、无创建权限、已停用、等于源空间、属于别的组织一律 400 INVALID_TARGET_SPACE；源空间已停用 409 SPACE_RETIRED；
        version 是根任务的版本，过期 409 VERSION_CONFLICT。Idempotency-Key 必填（缺省或格式不符 400 IDEMPOTENCY_KEY_REQUIRED），
        操作名 task.move，保留 24 小时；同键同请求返回首次结果（Idempotent-Replayed: true），同键不同请求 409 IDEMPOTENCY_CONFLICT。
        写审计 task.moved，并给源空间与目标空间各发一条 task.changed。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_space_id, version]
              additionalProperties: false
              properties:
                target_space_id: { type: string, format: uuid }
                version: { type: integer, minimum: 1 }
                cancel_runs: { type: boolean, default: false, description: 确认取消运行并移除 Agent / 小队处理人 }
      responses:
        '200':
          description: 已移动（或幂等重放）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskMoveResult' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/tasks/{taskID}/timeline:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *taskIDParam
    get:
      operationId: listTaskTimeline
      summary: 动态与评论按 (created_at, id) 升序合并
      parameters:
        - *limitParam
        - *cursorParam
        - in: query
          name: thread
          description: 省略时为原有扁平时间线；roots 返回活动与主评论；主评论 UUID 返回本任务该话题的所有层级回复，按时间倒序分页。无对应主评论时为空。
          schema: { type: string }
      responses:
        '200':
          description: 时间线
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  total: { type: integer, description: roots 首页返回活动和全部评论（含话题回复）的总数，不含会话卡 }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TimelineItem' }
                  next_cursor: { type: [string, 'null'], description: null 表示没有下一页 }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/tasks/{taskID}/comments:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *taskIDParam
    get:
      operationId: listTaskComments
      parameters:
        - *limitParam
        - { name: after, in: query, description: 上一页 next_cursor（纳秒时间戳）, schema: { type: integer } }
      responses:
        '200':
          description: 评论列表（按 created_at, id 升序）
          content:
            application/json:
              schema:
                type: object
                required: [comments, next_cursor]
                properties:
                  comments:
                    type: array
                    items: { $ref: '#/components/schemas/TaskComment' }
                  next_cursor: { type: integer, description: 0 表示没有下一页 }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: postTaskComment
      summary: 发表评论（client_comment_id 幂等：同 ID 同内容返回已有评论，内容不同 409 IDEMPOTENCY_CONFLICT）
      description: |
        评论人自动关注任务；被 @ 的成员收到 MENTION；其余成员关注者（排除作者与已收到 MENTION 的人）收到 TASK_COMMENT。
        收件人必须是 ACTIVE 组织成员且能读该空间。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body, client_comment_id]
              additionalProperties: false
              properties:
                id: { type: string, format: uuid, description: 可选，由客户端生成 }
                body: { type: string, minLength: 1, maxLength: 65536 }
                client_comment_id: { type: string, minLength: 1, maxLength: 256 }
                reply_to_id: { type: string, format: uuid }
                mentions:
                  type: array
                  maxItems: 32
                  items: { $ref: '#/components/schemas/CommentMention' }
      responses:
        '201':
          description: 已发表（或按 client_comment_id 命中的已有评论）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskComment' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/tasks/{taskID}/comments/{commentID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *taskIDParam
      - in: path
        name: commentID
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: editTaskComment
      summary: 原地编辑真人评论或回复
      description: 需要任务写权限及作者或组织管理员身份；旧版本返回 VERSION_CONFLICT。支持 24 小时幂等重放，同键不同请求返回 409。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [body, version]
              properties:
                body: { type: string, minLength: 1, maxLength: 65536 }
                version: { type: integer, minimum: 1 }
      responses:
        '204': { description: 成功 }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteTaskComment
      summary: 当前操作者删除评论及所有后代；删除解决依据时重开仍存在的话题
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: 已删除，24 小时内同键可重放 }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/tasks/{taskID}/comments/{commentID}/resolution:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *taskIDParam
      - in: path
        name: commentID
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: setTaskCommentResolution
      summary: 用指定评论解决或重新打开整个话题
      description: 解决时记录当前评论，已解决话题拒绝新回复并返回 THREAD_RESOLVED；重开后恢复。支持 24 小时幂等重放，同键不同请求返回 409。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [resolved]
              properties:
                resolved: { type: boolean }
      responses:
        '204': { description: 成功 }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/tasks/{taskID}/followers:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *taskIDParam
    get:
      operationId: listTaskFollowers
      responses:
        '200':
          description: 关注者
          content:
            application/json:
              schema:
                type: object
                required: [followers, following]
                properties:
                  followers:
                    type: array
                    items: { $ref: '#/components/schemas/TaskFollower' }
                  following: { type: boolean, description: 当前成员是否已关注 }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/tasks/{taskID}/followers/{kind}/{id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *taskIDParam
      - { name: kind, in: path, required: true, schema: { type: string, enum: [human, agent] } }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: addTaskFollower
      summary: 关注（幂等）。操作自己只需读权限；他人或 Agent 需要 UpdateObject；目标须能读该空间（Agent 须同空间且共享或归操作人）
      responses:
        '204': { description: 已关注 }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: removeTaskFollower
      summary: 取消关注（幂等）
      responses:
        '204': { description: 已取消 }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/tasks/{taskID}/relations:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *taskIDParam
    get:
      operationId: listTaskRelations
      summary: 以当前任务为视角的关联；对端不可读或已删除的不返回
      responses:
        '200':
          description: 关联
          content:
            application/json:
              schema:
                type: object
                required: [relations]
                properties:
                  relations:
                    type: array
                    items: { $ref: '#/components/schemas/TaskRelation' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createTaskRelation
      summary: 创建关联（操作名 task_relation.create）；目标需可读，不可读按 404；重复 409 RELATION_EXISTS；RELATES 对称
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type_id, target_task_id]
              additionalProperties: false
              properties:
                type_id: { type: string, description: '"builtin:BLOCKS" 等内置类型，或自定义类型 uuid' }
                target_task_id: { type: string, format: uuid }
                direction: { type: string, enum: [OUTWARD, INWARD], default: OUTWARD }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskRelation' }
        '200':
          description: 幂等重放
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskRelation' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/tasks/{taskID}/relations/{relationID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *taskIDParam
      - { name: relationID, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: deleteTaskRelation
      summary: 删除关联（源或目标任务任一的 UpdateObject 即可）
      responses:
        '204': { description: 已删除 }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/tasks/{taskID}/favorite:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *taskIDParam
    put:
      operationId: favoriteTask
      summary: 收藏任务（个人偏好，幂等）
      description: 需要任务读权限；读不到该任务时 404。重复收藏仍返回 204，不写动态、不改任务 version。
      responses:
        '204': { description: 已收藏 }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: unfavoriteTask
      summary: 取消收藏任务（幂等）
      responses:
        '204': { description: 已取消收藏（本来就没收藏也返回 204） }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/tasks/{taskID}/links:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *taskIDParam
    get:
      operationId: listTaskLinks
      responses:
        '200':
          description: 外部链接（按 created_at, id）
          content:
            application/json:
              schema:
                type: object
                required: [links]
                properties:
                  links:
                    type: array
                    items: { $ref: '#/components/schemas/TaskLink' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createTaskLink
      summary: 添加链接（操作名 task_link.create）；每任务最多 100 条（409 LIMIT_REACHED）；同 URL 409 LINK_EXISTS
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              additionalProperties: false
              properties:
                url: { type: string, maxLength: 2048, description: 'http(s) URL' }
                title: { type: string, maxLength: 200 }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskLink' }
        '200':
          description: 幂等重放
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskLink' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/tasks/{taskID}/links/{linkID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *taskIDParam
      - { name: linkID, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateTaskLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              additionalProperties: false
              properties:
                url: { type: string, maxLength: 2048 }
                title: { type: string, maxLength: 200 }
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskLink' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteTaskLink
      responses:
        '204': { description: 已删除 }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/tasks/{taskID}/fields:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *taskIDParam
    get:
      operationId: listTaskFields
      summary: 任务类型绑定的字段（按绑定 position）及取值；另附已解绑或归档但任务上仍有取值的字段（bound=false）
      responses:
        '200':
          description: 字段取值
          content:
            application/json:
              schema:
                type: object
                required: [fields]
                properties:
                  fields:
                    type: array
                    items: { $ref: '#/components/schemas/TaskFieldValue' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/tasks/{taskID}/fields/{fieldID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *taskIDParam
      - { name: fieldID, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setTaskField
      summary: 写字段取值（字段必须绑定到任务类型且未归档，否则 400 FIELD_NOT_BOUND）；value 为 null 或空数组表示清空
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              additionalProperties: false
              properties:
                value:
                  description: 按字段类型，见 CustomField.default_value 的取值形状；SELECT 为未归档选项 id，MULTI_SELECT ≤ 50 个
      responses:
        '200':
          description: 已写入
          content:
            application/json:
              schema:
                type: object
                required: [field_id, value, updated_at]
                properties:
                  field_id: { type: string, format: uuid }
                  value: { description: 规范化后的取值；清空时为 null }
                  updated_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: clearTaskField
      summary: 清空取值（字段已解绑时也可清理残留值；幂等）
      responses:
        '204': { description: 已清空 }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/tasks/{taskID}/reactions:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
      - *taskIDParam
    put:
      operationId: addTaskReaction
      summary: 给描述（不传 comment_id）或评论加表情（幂等）；同一目标最多 50 种（409 LIMIT_REACHED）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emoji]
              additionalProperties: false
              properties:
                emoji: { type: string, minLength: 1, maxLength: 32 }
                comment_id: { type: string, format: uuid }
      responses:
        '204': { description: 已添加 }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: removeTaskReaction
      parameters:
        - { name: emoji, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 32 } }
        - { name: comment_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '204': { description: 已移除（幂等） }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/organizations/{organizationID}/my-tasks:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listMyTasks
      summary: 首页「我的任务」：跨当前成员可读的 ACTIVE 空间
      description: |
        scope：all = 指派给我 ∪ 我创建的；assigned = task_assignees 中有我（没有 task_assignees 行的旧任务看 assignee_id）；
        created = task.created 动态的操作人是我。默认排序 updated desc。不再硬编码排除任何状态类别（completed=hide 才排除）。
      parameters:
        - &myScopeParam { name: scope, in: query, schema: { type: string, enum: [all, assigned, created, favorited], default: all } }
        - &mySpaceParam { name: space_id, in: query, explode: true, schema: { type: array, maxItems: 50, items: { type: string, format: uuid } } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
        - *cursorParam
        - *statusIDParam
        - *statusIDNotParam
        - *typeIDParam
        - *typeIDNotParam
        - *priorityParam
        - *priorityNotParam
        - *assigneeParam
        - *assigneeNotParam
        - *assigneeIDParam
        - *iterationIDParam
        - *iterationIDNotParam
        - *labelIDParam
        - *labelIDNotParam
        - *creatorIDParam
        - *creatorIDNotParam
        - *createdViaAgentParam
        - *categoryParam
        - *qParam
        - *startFromParam
        - *startToParam
        - *dueFromParam
        - *dueToParam
        - *qNotParam
        - *startNotParam
        - *dueNotParam
        - *parentTaskIDParam
        - *includeSubtasksParam
        - *completedParam
        - &mySortParam { name: sort, in: query, schema: { type: string, enum: [manual, created, updated, priority, due], default: updated } }
        - &myOrderParam { name: order, in: query, description: 未传 sort 时默认 desc；manual 只支持 asc, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200':
          description: 我的任务
          content:
            application/json:
              schema:
                type: object
                required: [tasks, next_cursor]
                properties:
                  tasks:
                    type: array
                    items: { $ref: '#/components/schemas/MyTask' }
                  next_cursor: { type: string, description: 空串表示没有下一页 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/search:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: globalSearch
      summary: 全局搜索（命令面板）
      description: |
        所有查询按当前登录成员的既有读取权限执行。标题和消息正文不区分大小写，通配符按字面量处理。
        任务另支持当前和历史空间编号。conversation 与 message 同时涵盖 Agent 会话和真人私信；
        消息提供原会话、消息 ID、序号和匹配片段。无权访问的结果和计数均不可见。
        旧调用（无 offset）维持原 7 类、每类最多 20 条、最多 100 条结果，space_id 沿用旧语义。
        新客户端显式提供类型和 offset；每类最多 50 条，可单独翻页。专属任务和专项即使没有搜索词也可浏览。
        每组 total 是同一权限和筛选下的全部命中数，越界页返回空 items 和原总数。
        自定义字段用 cf_<字段UUID> 或 cf_<字段UUID>_not 重复传值，每个字段最多 20 值，值长度不超过 100 字符；
        可以用 cf_<字段UUID>_op 指定 is/is_not、contains/not_contains、is_empty、is_true/is_false，以及数值 lt/lte/gt/gte/between
        和日期 before/before_or_on/after/after_or_on/between 及相应的 not_ 形式。最多 20 个自定义字段。
        每个参数均由服务端验证。任务筛选跨字段取交集。space_ids 只影响按空间查询的类别，不缩小对话、私信或组织成员范围。
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - name: types
          in: query
          style: form
          explode: false
          schema: { type: array, items: { $ref: '#/components/schemas/SearchType' } }
        - { name: space_id, in: query, schema: { type: string, format: uuid } }
        - name: space_ids
          in: query
          schema: { type: array, maxItems: 500, items: { type: string, format: uuid } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, default: 5 } }
        - *statusIDParam
        - *statusIDNotParam
        - *typeIDParam
        - *typeIDNotParam
        - *priorityParam
        - *priorityNotParam
        - *labelIDParam
        - *labelIDNotParam
        - *creatorIDParam
        - *creatorIDNotParam
        - *startFromParam
        - *startToParam
        - *dueFromParam
        - *dueToParam
        - *startNotParam
        - *dueNotParam
        - { name: task_q, in: query, description: "与主关键词独立的任务内容条件", schema: { type: string, maxLength: 100 } }
        - { name: task_q_not, in: query, description: "与主关键词独立的任务内容条件", schema: { type: string, maxLength: 100 } }
        - { name: relation, in: query, description: "父任务、子任务、被阻塞、阻塞、重复关系", schema: { type: array, maxItems: 50, items: { type: string, enum: [parent, subtask, blocked, blocking, duplicate] } } }
        - { name: relation_not, in: query, description: "父任务、子任务、被阻塞、阻塞、重复关系", schema: { type: array, maxItems: 50, items: { type: string, enum: [parent, subtask, blocked, blocking, duplicate] } } }
        - { name: due_range, in: query, description: "YYYY-MM-DD 起点/终点；可省略一端或使用 none；左闭右开", schema: { type: array, maxItems: 50, items: { type: string } } }
        - { name: due_range_not, in: query, description: "YYYY-MM-DD 起点/终点；可省略一端或使用 none；左闭右开", schema: { type: array, maxItems: 50, items: { type: string } } }
        - { name: created_range, in: query, description: "RFC3339 起点/终点；可省略一端；左闭右开", schema: { type: array, maxItems: 50, items: { type: string } } }
        - { name: created_range_not, in: query, description: "RFC3339 起点/终点；可省略一端；左闭右开", schema: { type: array, maxItems: 50, items: { type: string } } }
        - { name: crew_id, in: query, description: "指派小队", schema: { type: array, maxItems: 50, items: { type: string, format: uuid } } }
        - { name: crew_id_not, in: query, description: "指派小队", schema: { type: array, maxItems: 50, items: { type: string, format: uuid } } }
        - { name: creator_agent_id, in: query, description: "创建任务的 Agent", schema: { type: array, maxItems: 50, items: { type: string, format: uuid } } }
        - { name: creator_agent_id_not, in: query, description: "创建任务的 Agent", schema: { type: array, maxItems: 50, items: { type: string, format: uuid } } }
        - { name: iteration_id, in: query, description: "UUID、none、current 或 @rel:anyPast/previous/current/cooldown/upcoming/anyFuture", schema: { type: array, maxItems: 50, items: { type: string } } }
        - { name: iteration_id_not, in: query, description: "UUID、none、current 或 @rel:anyPast/previous/current/cooldown/upcoming/anyFuture", schema: { type: array, maxItems: 50, items: { type: string } } }
        - { name: project_id, in: query, description: "UUID 或 none", schema: { type: array, maxItems: 50, items: { type: string } } }
        - { name: project_id_not, in: query, description: "UUID 或 none", schema: { type: array, maxItems: 50, items: { type: string } } }
        - { name: assignee, in: query, description: "user/agent/crew/invitation:<UUID> 或 none；按 invitation 筛选需要现有组织邀请名单权限", schema: { type: array, maxItems: 50, items: { type: string } } }
        - { name: assignee_not, in: query, description: "user/agent/crew/invitation:<UUID> 或 none；按 invitation 筛选需要现有组织邀请名单权限", schema: { type: array, maxItems: 50, items: { type: string } } }
      responses:
        '200':
          description: 按类别分组的搜索结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
