      - $ref: '#/components/parameters/OrganizationID'
      - *spaceIDParam
    get:
      operationId: listSpaceMembers
      summary: 空间显式成员（需空间读权限；含已撤销的成员，按 status 区分），按加入时间 created_at, user_id
      parameters:
        - { name: q, in: query, required: false, description: 邮箱包含（不区分大小写）, schema: { type: string, maxLength: 100 } }
        - { name: role, in: query, required: false, schema: { $ref: '#/components/schemas/SpaceMemberRole' } }
      responses:
        '200':
          description: 成员列表
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
