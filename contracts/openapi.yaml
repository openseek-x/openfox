    get:
      operationId: getIntegrationSettings
      summary: 服务商级设置（PR / Commit 关联开关、PR 回链、分支格式）
      description: 所有非访客成员可读（任务详情「复制分支名」使用分支格式）。从未保存过时返回默认值（version = 0）。目前只有 github。
      responses:
        '200':
          description: 设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationSettings' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      operationId: putIntegrationSettings
      summary: 保存服务商级设置
      description: 只有所有者 / 管理员。version 为当前版本（首次保存为 0），不符 409 VERSION_CONFLICT。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, settings]
              properties:
                version: { type: integer, minimum: 0 }
                settings: { $ref: '#/components/schemas/IntegrationSettingsValues' }
      responses:
        '200':
          description: 保存后的设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationSettings' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/hooks/git/github/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string, maxLength: 128 } }
    post:
      operationId: receiveGitHubWebhook
      summary: 接收 Git 服务商 Webhook（GitHub 组织 / 账号级；GitLab / 极狐按组织连接，事件见各自说明）
      description: |
        令牌属于哪个服务商的连接，就只能在哪个服务商的路径上使用（否则 404）。
        GitLab / 极狐：项目 / 群组 Webhook 的 URL 填 Payload URL，Secret token 填详情里的签名密钥；服务端用常量时间比较 X-Gitlab-Token，缺失或不符 401（不落库）。
        需要勾选的事件：Merge request events、Push events、Issues events、Comments。按 Idempotency-Key 去重（缺失时退到 webhook-id、X-Gitlab-Event-UUID，
        再退到「事件名 + 正文摘要」），重复投递 200 且不再处理。merge request 对应 PR：opened / reopened / update 关联任务并把任务移到进行中，
        merge 时移到已完成，关闭未合并不改；仓库所有者按项目路径的第一段（顶级群组或用户）匹配连接账号。Issue 与评论同步规则同 GitHub。
        以下为 GitHub 的原有说明：
        无需登录。令牌只存 SHA-256；未知令牌或连接已断开 404。请求体 ≤ 5 MiB（413）；按令牌限流（429）。
        必须带 X-Hub-Signature-256（HMAC-SHA256，连接的签名密钥），缺失或不符 401（不落库）。按 X-GitHub-Delivery 去重，重复投递 200 且不再处理。
        仓库所有者必须是该连接绑定的组织 / 账号，否则记为 IGNORED。pull_request：标题、描述或来源分支里出现任务编号（<空间前缀>-<序号>，
        不区分大小写，每个 PR 最多关联 10 个任务）时建立 / 更新关联；PR 打开（含草稿、重新打开）时，待办 / 未开始类状态的任务移到工作流里第一个「进行中」状态，
        合并时移到第一个「已完成」状态；关闭未合并不改；已完成 / 已取消的任务不动。push：开启「关联 Git Commit」时按提交信息关联（每次最多 100 个提交）。
        首次关联 PR 后按设置在 PR 下回链评论（私有 / 公开仓库分别开关，只写任务编号与链接）。
        issues / issue_comment（6b-2）：仓库有有效的同步关联时，opened 新建任务（带 OpenFox 标记的 Issue 是自己建的，只补关联），edited / closed / reopened /
        assigned / unassigned 更新任务（与上次同步内容一致的回声事件忽略）；issue_comment.created 新建评论（带 OpenFox 标记的评论是自己发的，忽略）。
        入站写入设置事务级标记 openfox.sync_source，不会再入队出站。暂停的同步忽略事件。
      responses:
        '200': { description: 已处理、已忽略或重复投递 }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/hooks/git/gitlab/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string, maxLength: 128 } }
    post:
      operationId: receiveGitLabWebhook
      summary: 接收 Git 服务商 Webhook（GitHub 组织 / 账号级；GitLab / 极狐按组织连接，事件见各自说明）
      description: |
        令牌属于哪个服务商的连接，就只能在哪个服务商的路径上使用（否则 404）。
        GitLab / 极狐：项目 / 群组 Webhook 的 URL 填 Payload URL，Secret token 填详情里的签名密钥；服务端用常量时间比较 X-Gitlab-Token，缺失或不符 401（不落库）。
        需要勾选的事件：Merge request events、Push events、Issues events、Comments。按 Idempotency-Key 去重（缺失时退到 webhook-id、X-Gitlab-Event-UUID，
        再退到「事件名 + 正文摘要」），重复投递 200 且不再处理。merge request 对应 PR：opened / reopened / update 关联任务并把任务移到进行中，
        merge 时移到已完成，关闭未合并不改；仓库所有者按项目路径的第一段（顶级群组或用户）匹配连接账号。Issue 与评论同步规则同 GitHub。
        以下为 GitHub 的原有说明：
        无需登录。令牌只存 SHA-256；未知令牌或连接已断开 404。请求体 ≤ 5 MiB（413）；按令牌限流（429）。
        必须带 X-Hub-Signature-256（HMAC-SHA256，连接的签名密钥），缺失或不符 401（不落库）。按 X-GitHub-Delivery 去重，重复投递 200 且不再处理。
        仓库所有者必须是该连接绑定的组织 / 账号，否则记为 IGNORED。pull_request：标题、描述或来源分支里出现任务编号（<空间前缀>-<序号>，
        不区分大小写，每个 PR 最多关联 10 个任务）时建立 / 更新关联；PR 打开（含草稿、重新打开）时，待办 / 未开始类状态的任务移到工作流里第一个「进行中」状态，
        合并时移到第一个「已完成」状态；关闭未合并不改；已完成 / 已取消的任务不动。push：开启「关联 Git Commit」时按提交信息关联（每次最多 100 个提交）。
        首次关联 PR 后按设置在 PR 下回链评论（私有 / 公开仓库分别开关，只写任务编号与链接）。
        issues / issue_comment（6b-2）：仓库有有效的同步关联时，opened 新建任务（带 OpenFox 标记的 Issue 是自己建的，只补关联），edited / closed / reopened /
        assigned / unassigned 更新任务（与上次同步内容一致的回声事件忽略）；issue_comment.created 新建评论（带 OpenFox 标记的评论是自己发的，忽略）。
        入站写入设置事务级标记 openfox.sync_source，不会再入队出站。暂停的同步忽略事件。
      responses:
        '200': { description: 已处理、已忽略或重复投递 }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/hooks/git/gitlab_cn/{token}:
