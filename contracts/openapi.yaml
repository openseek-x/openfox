        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/integrations/gitlab/token:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    post:
      operationId: bindGitLabToken
      summary: 使用个人访问令牌连接自部署 GitLab
      description: |
        GitLab 15.5+，校验令牌有效、包含 api 权限后加密保存，不回显令牌。
        organization 仅管理员可用；personal 为非访客成员绑定自己的账号，connection_id 指定组织连接。
        reauthorize 需要 connection_id 和 version，个人连接仅本人可更新，组织连接仅管理员可更新。
        网络校验在事务外，总时限 20 秒；保存前复查权限及版本。实例沿用严格 SSRF 校验。
        同一账号重复连接更新既有连接；并发冲突返回 409；不同实例的同名账号返回 409，避免覆盖。
        现有 OAuth 接口与连接保持兼容。令牌过期不能自动续期，需要重新输入令牌。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [purpose, access_token]
              properties:
                purpose: { type: string, enum: [organization, personal, reauthorize] }
                access_token: { type: string, minLength: 1, maxLength: 1024, writeOnly: true }
                proxy_device_id: { type: string, format: uuid, description: 仅组织绑定可指定本人在线且获组织授权的内网代理电脑。后续访问沿用此绑定。 }
                instance_url: { type: string, maxLength: 2048 }
                connection_id: { type: string, format: uuid }
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 已连接的账号，不包含令牌
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationConnection' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/integrations/gitlab/authorize:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    post:
      operationId: startGitLabAuthorization
      summary: 发起 GitLab 自部署 OAuth 授权（返回在弹窗里打开的授权地址）
      description: |
        路径里的服务商决定使用哪家（GitHub 字面量路径 /integrations/gitlab/authorize 行为不变；未知值 404；gitee 见 /integrations/gitee/authorize）。
        GitLab / 极狐：organization 授权必须带 instance_url（极狐可省略，默认 https://jihulab.com）、application_id、application_secret（管理员在实例
        「用户设置 → 应用」里创建的 OAuth 应用，回调地址见详情接口的 oauth_redirect_uri，权限勾选 api）。实例地址要过 SSRF 防护：生产环境只允许 https、
        拒绝解析到内网 / 回环 / 链路本地的地址（400 INVALID_INSTANCE_URL）；开发 / 测试环境允许 http 与本机地址。应用凭据加密保存，不会在任何响应里返回。
        reauthorize / personal 沿用该组织连接保存的实例与应用；GitLab 的 personal 必须带 connection_id（选择哪个实例的组织连接）。
        GitLab 访问令牌 2 小时过期，服务端在到期前用刷新令牌自动续期；刷新令牌失效时连接进入 NEEDS_ATTENTION（需要重新授权）。
        以下为 GitHub 的原有说明：
        purpose = organization（绑定 GitHub 组织或账号，只有所有者 / 管理员）/ personal（绑定自己的 GitHub 账号，所有非访客成员）/
        reauthorize（重新授权某个组织连接，connection_id 必填，只有所有者 / 管理员）。服务端未配置 GitHub 应用时 409 INTEGRATION_NOT_CONFIGURED。
        授权申请 repo 与 read:org 权限（用户已确认），使用 state（10 分钟有效、只能用一次，只存 SHA-256）与 PKCE。
        GitHub 回调到 GET /v1/integrations/github/callback，服务端处理后把弹窗重定向到前端 /integrations/oauth/complete。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [purpose]
              properties:
                purpose: { type: string, enum: [organization, personal, reauthorize] }
                connection_id: { type: string, format: uuid }
                instance_url: { type: string, maxLength: 2048, description: GitLab / 极狐实例地址（仅 organization） }
                application_id: { type: string, maxLength: 255, description: GitLab / 极狐 OAuth 应用的 Application ID（仅 organization） }
                application_secret: { type: string, maxLength: 1024, description: GitLab / 极狐 OAuth 应用的 Secret（仅 organization；加密保存，不回显） }
      responses:
        '200':
          description: 授权地址
          content:
            application/json:
              schema:
                type: object
                required: [authorize_url, session_id, expires_at]
                properties:
                  authorize_url: { type: string }
                  session_id: { type: string, format: uuid }
                  expires_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
