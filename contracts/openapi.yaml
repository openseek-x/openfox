      parameters:
        - { name: delivery, in: query, description: banner reads the separate desktop/browser delivery feed, schema: { type: string, enum: [inbox, banner], default: inbox } }
        - { name: section, in: query, schema: { $ref: '#/components/schemas/InboxSection' } }
        - { name: importance, in: query, schema: { type: string, enum: [all, primary, other], default: all } }
        - { name: space_ids, in: query, explode: true, description: 可重复，也可逗号分隔, schema: { type: array, maxItems: 50, items: { type: string, format: uuid } } }
        - { name: space_id, in: query, deprecated: true, schema: { type: string, format: uuid } }
        - { name: space_mode, in: query, schema: { type: string, enum: [is, is_not], default: is } }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - *cursorParam
      responses:
        '200':
