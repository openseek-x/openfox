  /v1/organizations/{organizationID}/integrations/pingcode-personal:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    put:
      operationId: bindPingCodePersonal
      summary: 绑定本人用于 PingCode 工作项评论同步的个人访问令牌
      description: |
        非访客成员仅可绑定自己。connection_id 必须指向本组织 ACTIVE 的 PingCode 组织连接。
        服务端使用个人令牌调用 /v2/myself 核验用户 ID，并调用 /v2/directory/team 核验企业 ID 与组织连接一致；两次请求固定官方域名且不跟随重定向。
        校验后复查成员、组织连接和版本，再加密保存令牌，不向客户端回显。首次 version 为 0，更新传现有个人连接的版本；版本冲突或该 PingCode 用户已被本组织其他成员绑定返回 409。
        令牌需具备 pcp:read:account:personal、pcp:read:global:team 和 pcp:write:pjm:workitem 权限。仅用本人令牌写回其新建的本地评论；无个人绑定时不使用组织令牌代发。
        解绑复用 POST /integrations/connections/{connectionID}/disconnect，本人传个人连接 ID、当前 version 和空 confirm_phrase。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [connection_id, version, token]
              properties:
                connection_id: { type: string, format: uuid }
                version: { type: integer, minimum: 0 }
                token: { type: string, minLength: 1, maxLength: 4096, writeOnly: true }
      responses:
