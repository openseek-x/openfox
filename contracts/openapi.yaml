  /v1/organizations/{organizationID}/inbox/actions:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    post:
      operationId: applyInboxAction
      summary: 按组操作（只作用于该组在 section 内的通知；重复执行幂等，affected 可能为 0）
      description: |
        clear 不能用于 cleared 分区；unclear 只用于 cleared；snooze 只用于 inbox 且需要 snoozed_until（未来 366 天内）；unsnooze 只用于 later。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, section, group_ids]
              additionalProperties: false
              properties:
                action: { type: string, enum: [read, unread, clear, unclear, snooze, unsnooze] }
                section: { $ref: '#/components/schemas/InboxSection' }
                group_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string, format: uuid }
                snoozed_until: { type: [string, 'null'], format: date-time }
      responses:
        '200':
          description: 受影响的通知条数
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxAffected' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/inbox/bulk:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    post:
      operationId: applyInboxBulk
      summary: 分区级批量操作，范围与列表筛选一致
      description: mark_read = 全部标为已读；clear_read = 归档整组都已读的组；clear_all = 全部清理。clear_* 不能用于 cleared 分区。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation, section]
              additionalProperties: false
              properties:
                operation: { type: string, enum: [mark_read, clear_read, clear_all] }
                section: { $ref: '#/components/schemas/InboxSection' }
                importance: { type: string, enum: [all, primary, other] }
                space_id: { type: string, format: uuid, deprecated: true }
                space_ids:
                  type: array
                  maxItems: 50
                  items: { type: string, format: uuid }
                space_mode: { type: string, enum: [is, is_not] }
                q: { type: string, maxLength: 200 }
      responses:
        '200':
          description: 受影响的通知条数
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxAffected' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

