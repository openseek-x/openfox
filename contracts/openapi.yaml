          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/organizations/{organizationID}/spaces:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listSpaces
      summary: 当前用户可读的空间（永远不返回已删除空间）
      description: |
        排序：有 position（当前用户侧栏顺序）的在前、按 position；其余按 created_at, id。
        「可加入的空间」= 本列表中 visibility = shared 且 my_role = null 的项（GUEST 看不到未加入的空间）。
      parameters:
        - { name: status, in: query, required: false, description: active（默认）/ retired（已停用）/ all, schema: { type: string, enum: [active, retired, all], default: active } }
      responses:
        '200':
          description: 空间列表
          content:
            application/json:
              schema:
                type: object
                required: [spaces]
                properties:
                  spaces:
                    type: array
                    items: { $ref: '#/components/schemas/SpaceDetail' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createSpace
      summary: 新建空间（组织 OWNER / ADMIN；创建者成为空间 OWNER；Idempotency-Key 可选，操作名 space.create）
      description: |
        prefix 与其他空间的现值或历史标识符冲突（不区分大小写）→ 409 IDENTIFIER_TAKEN；格式不符 → 400 INVALID_IDENTIFIER。
        copy_from_space_id 指向不可读 / 已删除空间 → 404。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpaceCreateRequest' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceDetail' }
        '200':
          description: 幂等重放
          headers:
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceDetail' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  # ===== 全局配置（标签、分组、状态、关联类型、自定义字段、组织级任务类型）=====
  # 权限：读 = 任意 ACTIVE 组织成员；写 = OWNER / ADMIN（空间标签、字段绑定、空间任务类型走空间级权限）。
  # 创建类接口：首次创建 201；带同一 Idempotency-Key 重放 200 + Idempotent-Replayed: true。
  # 通用错误码：NOT_FOUND(404，含跨租户)、FORBIDDEN 类(403)、INVALID_REQUEST(400)、VERSION_CONFLICT(409)、
  # NAME_TAKEN(409)、LIMIT_REACHED(409)、IDEMPOTENCY_CONFLICT(409)。
  /v1/organizations/{organizationID}/label-groups:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listLabelGroups
      summary: 标签分组（单选分组），按 created_at, id 排序
      description: 不传 space_id = 组织级分组；传 space_id = 该空间的分组（需该空间可读）。
      parameters:
        - { name: space_id, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 分组列表
          content:
            application/json:
              schema:
                type: object
                required: [label_groups]
                properties:
                  label_groups:
                    type: array
                    items: { $ref: '#/components/schemas/LabelGroup' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createLabelGroup
      summary: 创建分组；label_ids 把这些同范围标签移入分组（用于删除后撤销）
      description: space_id 为空 = 组织级分组（需组织管理权限）；否则为空间分组（需空间管理权限），label_ids 须为该空间标签。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, color]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 50 }
                description: { type: string, maxLength: 1000 }
                color: { $ref: '#/components/schemas/HexColor' }
                space_id: { type: string, format: uuid }
                label_ids:
                  type: array
                  maxItems: 2000
                  items: { type: string, format: uuid }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabelGroup' }
        '200':
          description: 幂等重放
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabelGroup' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/label-groups/{groupID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: groupID, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateLabelGroup
      description: 组织级分组需组织管理权限，空间分组需该空间管理权限（删除同理）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 50 }
                description: { type: string, maxLength: 1000 }
                color: { $ref: '#/components/schemas/HexColor' }
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabelGroup' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteLabelGroup
      summary: 删除分组：组内标签移出分组（version + 1），返回被移出的标签 ID
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                type: object
                required: [removed_label_ids]
                properties:
                  removed_label_ids:
                    type: array
                    items: { type: string, format: uuid }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/organizations/{organizationID}/labels:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listLabels
      summary: 标签列表，按 created_at, id 排序
      description: |
        organization（默认）：组织级未归档标签；archived：组织级已归档标签；
        picker：需要 space_id（要求该空间可读），返回组织级未归档标签 + 该空间未归档标签；
        space / space_archived：需要 space_id（要求该空间可读），返回该空间未归档 / 已归档标签。
      parameters:
        - { name: scope, in: query, required: false, schema: { type: string, enum: [organization, archived, picker, space, space_archived] } }
        - { name: space_id, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 标签列表
          content:
            application/json:
              schema:
                type: object
                required: [labels]
                properties:
                  labels:
                    type: array
                    items: { $ref: '#/components/schemas/Label' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createLabel
      summary: 创建标签；space_id 为空 = 组织级（需管理权限），否则为空间标签（需该空间创建对象权限；group_id 须为同一空间的分组）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 50 }
                description: { type: string, maxLength: 1000 }
                color: { $ref: '#/components/schemas/HexColor' }
                group_id: { type: string, format: uuid }
                space_id: { type: string, format: uuid }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Label' }
        '200':
          description: 幂等重放
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Label' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/labels/bulk:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    post:
      operationId: bulkLabels
      summary: 批量处理标签；不传 space_id = 组织级标签（需组织管理权限），传 space_id = 该空间标签（需空间管理权限）；不存在或不在该范围的 ID 被忽略
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, label_ids]
              additionalProperties: false
              properties:
                action: { type: string, enum: [ARCHIVE, UNARCHIVE, DELETE, MERGE] }
                space_id: { type: string, format: uuid }
                label_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string, format: uuid }
                target_label_id: { type: string, format: uuid, description: MERGE 必填；须为同范围的未归档标签 }
      responses:
        '200':
          description: 实际受影响的标签数
          content:
            application/json:
              schema:
                type: object
                required: [affected]
                properties:
                  affected: { type: integer, minimum: 0 }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/labels/{labelID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: labelID, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateLabel
      summary: 组织级标签需管理权限；空间标签需该空间更新对象权限；空间标签可归档、可设同一空间的分组
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 50 }
                description: { type: string, maxLength: 1000 }
                color: { $ref: '#/components/schemas/HexColor' }
                group_id:
                  type: [string, 'null']
                  format: uuid
                  description: 未传 = 不变；null = 移出分组
                archived: { type: boolean }
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Label' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteLabel
      summary: 删除标签及其任务关联（同事务）
      responses:
        '204': { description: 已删除 }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/labels/{labelID}/merge:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: labelID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: mergeLabel
      summary: 把本标签合并进目标标签并删除本标签；两者须同为组织级或同一空间，目标未归档。合并不做单选分组互斥校验
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_label_id]
              additionalProperties: false
              properties:
                target_label_id: { type: string, format: uuid }
      responses:
        '200':
          description: 合并后的目标标签
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Label' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/organizations/{organizationID}/task-statuses:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listTaskStatuses
      summary: 组织状态，按类别固定顺序（TRIAGE, BACKLOG, TODO, IN_PROGRESS, DONE, CANCELLED, DUPLICATE）再 position
      responses:
        '200':
          description: 状态列表（含已归档）
          content:
            application/json:
              schema:
                type: object
                required: [statuses]
                properties:
                  statuses:
                    type: array
                    items: { $ref: '#/components/schemas/TaskStatus' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createTaskStatus
      summary: 创建状态；position 不传则追加到类别末尾；新状态自动追加到所有未归档任务类型的工作流
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                description: { type: string, maxLength: 1000 }
                category: { $ref: '#/components/schemas/TaskStatusCategory' }
                position: { type: integer, minimum: 0 }
                color: { type: string, maxLength: 64 }
                icon: { type: string, maxLength: 64 }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskStatus' }
        '200':
          description: 幂等重放
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskStatus' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/task-statuses/{statusID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: statusID, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateTaskStatus
      summary: 修改状态显示属性 / 归档；类别与顺序用 /move，默认状态用 /default
      description: |
        归档限制：组织默认状态 → 409 STATUS_DEFAULT_CATEGORY；任务类型工作流默认状态 → 409 COLLABORATION_CONFLICT；
        类别内最后一个未归档状态 → 409 COLLABORATION_CONFLICT。归档会把状态移出所有工作流。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                description: { type: string, maxLength: 1000 }
                position: { type: integer, minimum: 0 }
                color: { type: string, maxLength: 64 }
                icon: { type: string, maxLength: 64 }
                archived: { type: boolean }
                collapsed_by_default: { type: boolean }
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskStatus' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteTaskStatus
      summary: 删除状态
      description: |
        有任务（含已删除任务）使用时必须给 replacement_status_id（否则 409 STATUS_REPLACEMENT_REQUIRED），
        同事务把这些任务改到替换状态（version + 1）；替换状态须在这些任务类型的工作流里（否则 409 STATUS_REPLACEMENT_NOT_IN_WORKFLOW）；
        受影响任务超过 5000 → 409 STATUS_MOVE_TOO_LARGE。组织默认状态 → 409 STATUS_DEFAULT_CATEGORY；
        工作流默认状态 → 409 STATUS_IS_WORKFLOW_DEFAULT；类别内最后一个未归档状态 → 409 COLLABORATION_CONFLICT。
      parameters:
        - { name: replacement_status_id, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '204': { description: 已删除 }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/task-statuses/{statusID}/move:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: statusID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: moveTaskStatus
      summary: 把状态移到 category 中 before_status_id 之前（为空 = 末尾），可跨类别；返回整个状态列表
      description: |
        跨类别时同事务更新该状态下全部任务的 tasks.status 投影（>5000 个任务 → 409 STATUS_MOVE_TOO_LARGE）。
        组织默认状态只能留在 BACKLOG / TODO（409 STATUS_DEFAULT_CATEGORY）；工作流默认状态不能移入终态类别
        （409 STATUS_IS_WORKFLOW_DEFAULT）。允许把类别拖空。受影响类别的 position 重编号为 0..n-1。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, version]
              additionalProperties: false
              properties:
                category: { $ref: '#/components/schemas/TaskStatusCategory' }
                before_status_id: { type: [string, 'null'], format: uuid }
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 移动后的完整状态列表
          content:
            application/json:
              schema:
                type: object
                required: [statuses]
                properties:
                  statuses:
                    type: array
                    items: { $ref: '#/components/schemas/TaskStatus' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/task-statuses/{statusID}/default:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: statusID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: setDefaultTaskStatus
      summary: 设为组织默认状态（须为未归档的 BACKLOG / TODO 状态，否则 409 STATUS_DEFAULT_CATEGORY）；返回整个状态列表
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              additionalProperties: false
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 更新后的完整状态列表
          content:
            application/json:
              schema:
                type: object
                required: [statuses]
                properties:
                  statuses:
                    type: array
                    items: { $ref: '#/components/schemas/TaskStatus' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/organizations/{organizationID}/task-relation-types:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listTaskRelationTypes
      summary: 先 4 个内置类型（BLOCKS, CLONES, DUPLICATES, RELATES），再自定义类型按 created_at
      responses:
        '200':
          description: 关联类型列表
          content:
            application/json:
              schema:
                type: object
                required: [relation_types]
                properties:
                  relation_types:
                    type: array
                    items: { $ref: '#/components/schemas/RelationType' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createTaskRelationType
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, outward_label, inward_label]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 50 }
                outward_label: { type: string, minLength: 1, maxLength: 50 }
                inward_label: { type: string, minLength: 1, maxLength: 50 }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RelationType' }
        '200':
          description: 幂等重放
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RelationType' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/task-relation-types/{typeID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - name: typeID
        in: path
        required: true
        description: 自定义类型 uuid；内置类型 id（builtin:BLOCKS 等）调用返回 409 RELATION_TYPE_BUILTIN
        schema: { type: string }
    patch:
      operationId: updateTaskRelationType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 50 }
                outward_label: { type: string, minLength: 1, maxLength: 50 }
                inward_label: { type: string, minLength: 1, maxLength: 50 }
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RelationType' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteTaskRelationType
      summary: 删除自定义类型，同事务删除使用该类型的任务关联
      responses:
