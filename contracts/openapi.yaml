    post:
      operationId: rotateIntegrationWebhook
      summary: 重新生成 Webhook 地址与签名密钥（旧地址立即失效，需在 GitHub 里同步更新）
      description: 只有所有者 / 管理员。version 不符 409 VERSION_CONFLICT。审计 integration.webhook_rotated。
