  /v1/organizations/{organizationID}/custom-fields:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listCustomFields
      summary: 自定义字段库，按 created_at, id 排序
      parameters:
        - { name: space_id, in: query, description: 只返回绑定到此可读空间任务类型的字段, schema: { type: string, format: uuid } }
        - { name: include_archived, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: 字段列表
          content:
            application/json:
              schema:
                type: object
                required: [custom_fields]
                properties:
                  custom_fields:
                    type: array
                    items: { $ref: '#/components/schemas/CustomField' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createCustomField
      summary: 创建字段（可带选项与默认值）
      description: |
        default_value 按 kind 校验：TEXT 字符串 ≤256；RICH_TEXT 字符串 ≤65536；NUMBER 有限数；BOOLEAN 布尔；
        DATE "YYYY-MM-DD"；URL http(s) ≤2048；MEMBER {kind: HUMAN|AGENT, id}（受 member_scope 约束）；
        SELECT 用 {"option_index": n}、MULTI_SELECT 用 {"option_indexes": [..]} 引用本次 options。
        member_scope 只对 MEMBER 有效（默认 ALL）；options 只对 SELECT / MULTI_SELECT 有效。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
                kind: { $ref: '#/components/schemas/CustomFieldKind' }
                description: { type: string, maxLength: 1000 }
                default_value: { description: 见接口说明；null 或不传表示无默认值 }
                member_scope: { $ref: '#/components/schemas/CustomFieldMemberScope' }
                options:
                  type: array
                  maxItems: 200
                  items: { $ref: '#/components/schemas/CustomFieldOptionInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomField' }
        '200':
          description: 幂等重放
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomField' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/custom-fields/{fieldID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: fieldID, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateCustomField
      summary: 修改字段；kind 不可改。default_value 显式 null 清空；SELECT / MULTI_SELECT 默认值用选项 id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
                description: { type: string, maxLength: 1000 }
                default_value: { description: 未传 = 不变；null = 清空；其余按 kind 校验 }
                member_scope: { $ref: '#/components/schemas/CustomFieldMemberScope' }
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomField' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteCustomField
      summary: 归档字段；已绑定任务类型 → 409 CUSTOM_FIELD_IN_USE
      responses:
        '204': { description: 已归档 }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/custom-fields/{fieldID}/options:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: fieldID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: createCustomFieldOption
      summary: 在选项末尾追加（仅 SELECT / MULTI_SELECT；同字段内标签不区分大小写唯一）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomFieldOptionInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomFieldOption' }
        '200':
          description: 幂等重放
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomFieldOption' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/custom-fields/{fieldID}/options/{optionID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: fieldID, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: optionID, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateCustomFieldOption
      summary: 修改选项；position 改动时重编号该字段全部未归档选项（超出范围放到末尾）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              additionalProperties: false
              properties:
                label: { type: string, minLength: 1, maxLength: 100 }
                color: { $ref: '#/components/schemas/HexColor' }
                position: { type: integer, minimum: 0 }
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomFieldOption' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteCustomFieldOption
      summary: 归档选项；若是字段默认值（或其一员）则同步从默认值中移除
      responses:
        '204': { description: 已归档 }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/organizations/{organizationID}/task-types:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listOrganizationTaskTypes
      summary: 调用者可读的 ACTIVE 空间及其启用、未归档的任务类型与绑定字段 ID（字段配置页用）
      responses:
        '200':
          description: 按空间分组的任务类型
          content:
            application/json:
              schema:
                type: object
                required: [spaces]
                properties:
                  spaces:
                    type: array
                    items: { $ref: '#/components/schemas/OrganizationTaskTypeSpace' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/task-types:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: spaceID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listSpaceTaskTypes
      summary: 空间任务类型（含已归档、停用）及工作流状态，按 created_at, id（需空间可读）
      responses:
        '200':
          description: 任务类型列表
          content:
            application/json:
              schema:
                type: object
                required: [task_types]
                properties:
                  task_types:
                    type: array
                    items: { $ref: '#/components/schemas/TaskType' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createSpaceTaskType
      summary: 创建任务类型（需空间管理权限）
      description: status_ids 为空 = 全部未归档状态；default_status_id 为空 = 工作流中第一个 TODO 状态；默认状态不能是终态类别。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                description: { type: string, maxLength: 1000 }
                icon: { type: string, maxLength: 64 }
                enabled: { type: boolean, default: true }
                is_default: { type: boolean, default: false }
                status_ids:
                  type: array
                  items: { type: string, format: uuid }
                default_status_id: { type: string, format: uuid }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskType' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/task-types/{typeID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: spaceID, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: typeID, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateSpaceTaskType
      summary: 修改任务类型（需空间管理权限）
      description: |
        status_ids 传入时整体替换工作流（已有任务使用的状态不能移除 → 409 COLLABORATION_CONFLICT）；
        有任务的类型不能归档；空间至少保留一个启用的默认类型（停用 / 归档默认类型 → 409 DEFAULT_TYPE_REQUIRED）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                description: { type: string, maxLength: 1000 }
                icon: { type: string, maxLength: 64 }
                enabled: { type: boolean }
                is_default: { type: boolean }
                archived: { type: boolean }
                status_ids:
                  type: array
                  items: { type: string, format: uuid }
                default_status_id: { type: string, format: uuid }
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskType' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteSpaceTaskType
      summary: 删除任务类型（需空间管理权限）
      description: |
        有未删除任务 → 409 TYPE_IN_USE；默认类型 → 409 DEFAULT_TYPE_REQUIRED。只被已删除任务引用时改为归档（列表里 archived_at 非空），
        否则连同工作流与字段绑定物理删除。
      parameters:
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '204': { description: 已删除或已归档 }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/task-types/{typeID}/fields:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: spaceID, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: typeID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listTaskTypeFields
      summary: 绑定到任务类型的未归档字段，按绑定 position（需空间可读；任务详情「更多属性」用）
      responses:
        '200':
          description: 字段列表
          content:
            application/json:
              schema:
                type: object
                required: [custom_fields]
                properties:
                  custom_fields:
                    type: array
                    items: { $ref: '#/components/schemas/CustomField' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/task-types/{typeID}/fields/{fieldID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: spaceID, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: typeID, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: fieldID, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: bindTaskTypeField
      summary: 绑定字段到任务类型（幂等，追加到末尾；字段须未归档；需空间管理权限）
      responses:
        '204': { description: 已绑定 }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: unbindTaskTypeField
      summary: 解除绑定（幂等；任务上已有取值保留；需空间管理权限）
      responses:
        '204': { description: 已解除 }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  # ===== /全局配置 =====

  # ===== 任务、我的任务、收件箱、成员与 Agent 选择 =====
  # 权限：读 = 空间 ReadObject（私有空间需有效空间成员；SHARED 空间对非访客组织成员可读，被撤销的空间成员不可读）；
  # 写 = 空间 CreateObject / UpdateObject / DeleteObject。不可见的空间、任务、跨租户资源一律 404 NOT_FOUND。
  # 已删除（软删除）任务：所有读接口与子资源接口返回 404。
  # 创建类接口：首次创建 201；带同一 Idempotency-Key 重放 200 + Idempotent-Replayed: true；同键不同请求 409 IDEMPOTENCY_CONFLICT。
  # 通用错误码：INVALID_REQUEST(400)、INVALID_FILTER(400)、INVALID_CURSOR(400)、VERSION_CONFLICT(409)、
  # AUTHORIZATION_STALE(401)、UNAUTHENTICATED(401)、CSRF_REQUIRED(403)。
  /v1/organizations/{organizationID}/spaces/{spaceID}/tasks:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - &spaceIDParam { name: spaceID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listTasks
      summary: 空间任务列表（筛选、排序、keyset 游标）
      description: |
        同一字段多个取值之间为「任一」；*_not 表示都不匹配。所有条件之间为「且」。
        已删除任务永远不出现。游标与 sort/order 绑定，不匹配返回 400 INVALID_CURSOR。
      parameters:
        - &limitParam { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - &cursorParam { name: cursor, in: query, schema: { type: string } }
        - &statusIDParam { name: status_id, in: query, explode: true, schema: { type: array, maxItems: 50, items: { type: string, format: uuid } } }
        - &statusIDNotParam { name: status_id_not, in: query, explode: true, schema: { type: array, maxItems: 50, items: { type: string, format: uuid } } }
        - &typeIDParam { name: type_id, in: query, explode: true, schema: { type: array, maxItems: 50, items: { type: string, format: uuid } } }
        - &typeIDNotParam { name: type_id_not, in: query, explode: true, schema: { type: array, maxItems: 50, items: { type: string, format: uuid } } }
        - &priorityParam { name: priority, in: query, explode: true, description: 旧接口的单值 priority 继续有效, schema: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/TaskPriority' } } }
        - &priorityNotParam { name: priority_not, in: query, explode: true, schema: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/TaskPriority' } } }
        - &assigneeParam { name: assignee, in: query, explode: true, description: 'user:<uuid> / agent:<uuid> / crew:<uuid> / none（没有任何处理人）', schema: { type: array, maxItems: 50, items: { type: string, pattern: '^(none|(user|agent|crew):[0-9a-fA-F-]{36})$' } } }
        - &assigneeNotParam { name: assignee_not, in: query, explode: true, schema: { type: array, maxItems: 50, items: { type: string, pattern: '^(none|(user|agent|crew):[0-9a-fA-F-]{36})$' } } }
        - &assigneeIDParam { name: assignee_id, in: query, deprecated: true, description: 旧参数，等同 assignee=user:<id>, schema: { type: string, format: uuid } }
        - &iterationIDParam { name: iteration_id, in: query, explode: true, description: 迭代 UUID、none 或 current, schema: { type: array, maxItems: 50, items: { type: string } } }
        - &iterationIDNotParam { name: iteration_id_not, in: query, explode: true, description: 排除指定迭代；支持 none 与 current, schema: { type: array, maxItems: 50, items: { type: string } } }
        - &projectIDParam { name: project_id, in: query, explode: true, description: 专项 UUID 或 none, schema: { type: array, maxItems: 50, items: { type: string } } }
        - &projectIDNotParam { name: project_id_not, in: query, explode: true, description: 排除指定专项；支持 none，包含没有专项的任务, schema: { type: array, maxItems: 50, items: { type: string } } }
        - &viewIDParam { name: view_id, in: query, description: 打开视图：服务端读取视图 filters，与请求里的其他筛选取交集；视图不可见返回 404, schema: { type: string, format: uuid } }
        - &labelIDParam { name: label_id, in: query, explode: true, schema: { type: array, maxItems: 50, items: { type: string, format: uuid } } }
        - &labelIDNotParam { name: label_id_not, in: query, explode: true, schema: { type: array, maxItems: 50, items: { type: string, format: uuid } } }
        - &creatorIDParam { name: creator_id, in: query, explode: true, schema: { type: array, maxItems: 50, items: { type: string, format: uuid } } }
        - &creatorIDNotParam { name: creator_id_not, in: query, explode: true, schema: { type: array, maxItems: 50, items: { type: string, format: uuid } } }
        - &createdViaAgentParam { name: created_via_agent, in: query, explode: true, description: "Agent 通过空间工具创建的任务：匹配 task.via_agent 动态里 tool='space_task_create' 的 agent_id（task.created 的操作人是 Run 发起人，creator_id 查不到 Agent）", schema: { type: array, maxItems: 50, items: { type: string, format: uuid } } }
        - &categoryParam { name: category, in: query, explode: true, schema: { type: array, items: { $ref: '#/components/schemas/TaskStatusCategory' } } }
        - &qParam { name: q, in: query, description: 标题或描述包含（不区分大小写）, schema: { type: string, maxLength: 100 } }
        - &startFromParam { name: start_from, in: query, description: 开始日期下界（含）, schema: { type: string, format: date } }
        - &startToParam { name: start_to, in: query, description: 开始日期上界（含）, schema: { type: string, format: date } }
        - &dueFromParam { name: due_from, in: query, description: 截止日期下界（含）, schema: { type: string, format: date } }
        - &dueToParam { name: due_to, in: query, description: 截止日期上界（含）, schema: { type: string, format: date } }
        - &qNotParam { name: q_not, in: query, description: 标题与描述都不包含（不区分大小写）, schema: { type: string, maxLength: 100 } }
        - &startNotParam { name: start_not, in: query, description: true 时把开始日期区间取反（开始日期为空或在区间外）, schema: { type: boolean, default: false } }
        - &dueNotParam { name: due_not, in: query, description: true 时把截止日期区间取反（截止日期为空或在区间外）, schema: { type: boolean, default: false } }
        - &parentTaskIDParam { name: parent_task_id, in: query, description: 只看该任务的直接子任务, schema: { type: string, format: uuid } }
        - &includeSubtasksParam { name: include_subtasks, in: query, description: false 时只看顶层任务（parent_task_id 为空）, schema: { type: boolean, default: true } }
        - &completedParam { name: completed, in: query, description: hide 排除 DONE / CANCELLED / DUPLICATE 类别, schema: { type: string, enum: [all, hide], default: all } }
        - &estimateMinParam { name: estimate_min, in: query, description: 估时下界（含）, schema: { type: number, minimum: 0 } }
        - &estimateMaxParam { name: estimate_max, in: query, description: 估时上界（含）, schema: { type: number, minimum: 0 } }
        - &estimateNoneParam { name: estimate_none, in: query, description: true 时只看未估时任务（与 estimate_min/max 同时传时取并集）, schema: { type: boolean, default: false } }
        - &sortParam { name: sort, in: query, description: 'manual = 手动排序键；priority 为 URGENT>HIGH>NORMAL>LOW>LOWEST>NONE（desc）；due、estimate 空值排最后；iteration 按迭代编号', schema: { type: string, enum: [manual, created, updated, priority, due, estimate, iteration, project], default: manual } }
        - &orderParam { name: order, in: query, description: manual 只支持 asc, schema: { type: string, enum: [asc, desc], default: asc } }
      responses:
        '200':
          description: 任务列表
          content:
            application/json:
              schema:
                type: object
                required: [tasks, next_cursor]
                properties:
                  tasks:
                    type: array
                    items: { $ref: '#/components/schemas/Task' }
                  next_cursor: { type: string, description: 空串表示没有下一页 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createTask
      summary: 创建任务（Idempotency-Key 可选，操作名 task.create）
      description: |
        未传 status_id 时：组织默认状态在该类型工作流里则用它，否则用工作流默认状态。未传 priority 默认 NONE。
        assignees 与旧字段 assignee_user_id / executor_agent_id 不能同时传；label_ids 与旧字段 labels 不能同时传（400）。
        创建人与人员处理人自动成为关注者；被分配的其他成员收到 TASK_ASSIGNED 通知。
        不传 after_task_id 时追加到空间末尾。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreateRequest' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '200':
          description: 幂等重放
          headers:
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/tasks/counts:
