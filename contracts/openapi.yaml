      responses:
        '200': { description: 已处理、已忽略或重复投递 }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/tasks/{taskID}/git-links:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/SpaceID'
      - $ref: '#/components/parameters/TaskID'
    get:
      operationId: listTaskGitLinks
      summary: 任务关联的 Pull Request 与 Commit
      description: 可读任务的成员可读（与任务详情相同的可见性）。PR 在前（按创建时间倒序），Commit 在后，最多 100 条。
      responses:
        '200':
          description: 关联
          content:
            application/json:
              schema:
                type: object
                required: [links]
                properties:
                  links: { type: array, items: { $ref: '#/components/schemas/TaskGitLink' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/integrations/connections/{connectionID}/repositories:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: connectionID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listIntegrationRepositories
      summary: 连接可访问的仓库（新建同步时选择；实时读取 GitHub）
      description: |
        只有所有者 / 管理员。组织连接读 /orgs/{login}/repos，个人账号类型的组织连接读 /user/repos?affiliation=owner；
        q 按名称过滤（不区分大小写），每页 50 个。已关联的仓库带 linked_space_id / linked_space_name。
        GitHub 令牌失效时 409 INTEGRATION_NEEDS_REAUTH（连接同时标为需要重新授权）；GitHub 不可达 502 UPSTREAM_UNAVAILABLE。
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 20, default: 1 } }
      responses:
        '200':
          description: 仓库
          content:
            application/json:
              schema:
                type: object
                required: [repositories, has_more]
                properties:
                  repositories:
                    type: array
                    items:
                      type: object
                      required: [full_name, name, private, html_url, linked_space_id, linked_space_name]
                      properties:
                        full_name: { type: string }
                        name: { type: string }
                        private: { type: boolean }
                        html_url: { type: string }
                        linked_space_id: { type: [string, 'null'], format: uuid }
                        linked_space_name: { type: [string, 'null'] }
                  has_more: { type: boolean }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/integrations/sync-links:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    post:
      operationId: createIntegrationSyncLink
      summary: 新建仓库 ↔ 空间同步（GitHub Issue）
      description: |
        只有所有者 / 管理员；连接必须是未断开的 GitHub 组织连接，空间必须存在、未停用且当前成员可写。
        同一连接下一个仓库只能关联一个空间（409 SYNC_LINK_EXISTS）；一个空间最多一个双向同步（409 SYNC_BIDIRECTIONAL_EXISTS）。
        仓库必须是该连接能访问、且所有者是连接账号的仓库（创建时实时校验，400 INVALID_REPOSITORY）。
        direction：INBOUND = 只把 GitHub Issue 同步进来；BIDIRECTIONAL = 双向（标题、描述、开关状态、处理人、评论双向同步；
        空间里新建的任务自动在仓库里建 Issue，导入的任务不建）。同步只处理开启之后的变动；import_existing = true 时后台导入仓库里
        未关闭的 Issue（不含 PR，最多 5000 个），进度见 backfill。需要在 GitHub Webhook 里勾选 Issues 与 Issue comments 事件。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [connection_id, repository, space_id, direction]
              properties:
                connection_id: { type: string, format: uuid }
                repository: { type: string, maxLength: 255, description: owner/name }
                space_id: { type: string, format: uuid }
                direction: { type: string, enum: [INBOUND, BIDIRECTIONAL] }
                import_existing: { type: boolean, default: false }
      responses:
        '201':
          description: 新建的同步
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationSyncLink' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/integrations/sync-links/{syncLinkID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: syncLinkID, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateIntegrationSyncLink
      summary: 修改同步方向或暂停 / 恢复
      description: |
        只有所有者 / 管理员。version 不符 409 VERSION_CONFLICT；改为 BIDIRECTIONAL 时同空间已有双向同步 409 SYNC_BIDIRECTIONAL_EXISTS。
        暂停期间入站事件忽略、出站不入队；恢复后只处理之后的变动（暂停期间的变动不补发）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
                direction: { type: string, enum: [INBOUND, BIDIRECTIONAL] }
                status: { type: string, enum: [ACTIVE, PAUSED] }
      responses:
        '200':
          description: 修改后的同步
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationSyncLink' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/integrations/sync-links/{syncLinkID}/remove:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: syncLinkID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: removeIntegrationSyncLink
      summary: 移除同步（任务与 Issue 都保留，只解除关联）
      description: 只有所有者 / 管理员。version 不符 409 VERSION_CONFLICT。软删除同步关联，解除其下的任务 ↔ Issue 关联，未发送的出站项改为 SKIPPED。重新关联同一仓库不会自动恢复旧关联。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        '204': { description: 已移除 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/integrations/sync-links/{syncLinkID}/retry:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: syncLinkID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: retryIntegrationSyncLink
      summary: 重试发送失败的出站项（FAILED → PENDING）
      description: 只有所有者 / 管理员。返回重新排队的数量。
      responses:
        '200':
          description: 已重新排队
          content:
            application/json:
              schema:
                type: object
                required: [requeued]
                properties:
                  requeued: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/integrations/connections/{connectionID}/disconnect:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: connectionID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: disconnectIntegrationConnection
      summary: 断开连接（停用绑定和该连接下的全部同步关联，不删除任何任务与专项）
      description: |
        组织连接只有所有者 / 管理员可断开，且必须带确认短语 confirm_phrase =「断开 {服务商名称}」；
        个人连接只有本人可断开，不需要确认短语。已断开时幂等返回当前状态。版本不符 409 VERSION_CONFLICT；短语不符 400 CONFIRMATION_MISMATCH。
        断开组织连接时，其下的个人连接一并断开、同步关联改为 PAUSED。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
                confirm_phrase: { type: string, maxLength: 100 }
      responses:
        '200':
          description: 断开后的连接
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationConnection' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/organizations/{organizationID}/imports:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listImports
      summary: 导入记录（不含草稿与已丢弃）
      description: |
        按创建时间倒序，limit 默认 5、最大 50，cursor 为上一页的 next_cursor。所有者 / 管理员看到全部记录；普通成员只看到自己可读空间的记录；访客 403。
        has_active 为 true 表示有排队 / 执行中 / 请求取消中的导入（前端据此 4 秒轮询，否则 30 秒）。
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 5 } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 200 } }
        - { name: connection_id, in: query, schema: { type: string, format: uuid }, description: 管理员筛选此集成实例的有效同步链接 }
      responses:
        '200':
          description: 导入记录
          content:
            application/json:
              schema:
                type: object
                required: [imports, next_cursor, has_active, can_manage, total]
                properties:
                  imports: { type: array, items: { $ref: '#/components/schemas/ImportJob' } }
                  next_cursor: { type: string, description: 空串表示没有下一页 }
                  has_active: { type: boolean }
                  can_manage: { type: boolean, description: 组织所有者 / 管理员为 true }
                  total: { type: integer, minimum: 0, description: 当前成员可见的记录总数（「历史记录 · n 次」） }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/imports/jira-csv:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    post:
      operationId: uploadJiraCsvImport
      summary: 上传 Jira CSV，创建导入草稿（multipart，字段 file，加 space_id 或 new_space_*）
      description: |
        只有组织所有者 / 管理员（403）。space_id 与 new_space_name 二选一：目标空间必须存在、未归档且当前成员可写（404 SPACE_NOT_FOUND）；
        new_space_*（6c-2）表示导入到新空间，开始导入时才创建；前缀不合法 400 INVALID_IDENTIFIER、已被占用 409 IDENTIFIER_TAKEN（上传与开始导入时都会校验）。
        文件 ≤ 10 MiB（413 IMPORT_FILE_TOO_LARGE），UTF-8（可带 BOM），逗号分隔，≤ 5000 行数据、≤ 300 列、单元格 ≤ 64 KiB（400 INVALID_IMPORT_FILE，message 说明原因）。
        Jira 导出里同名的列（Labels、Comment、Sprint、Watchers 等）按列序号区分。返回 DRAFT 状态的导入，preview 给出列信息与建议映射，
        config 预填建议的列映射（未保存，config_version = 1）。草稿 24 小时内未开始会被清理为 DISCARDED。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                space_id: { type: string, format: uuid }
                new_space_name: { type: string, maxLength: 100 }
                new_space_prefix: { type: string, pattern: '^[A-Z0-9]{2,7}$' }
                new_space_visibility: { type: string, enum: [PRIVATE, SHARED] }
      responses:
        '201':
          description: 导入草稿
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/imports/csv:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    post:
      operationId: uploadProviderCsvImport
      summary: 上传 Teambition 或 PingCode CSV，创建导入草稿（multipart，字段 file，加 space_id 或 new_space_*）
      description: |
        只有组织所有者 / 管理员（403）。space_id 与 new_space_name 二选一：目标空间必须存在、未归档且当前成员可写（404 SPACE_NOT_FOUND）；
        new_space_*（6c-2）表示导入到新空间，开始导入时才创建；前缀不合法 400 INVALID_IDENTIFIER、已被占用 409 IDENTIFIER_TAKEN（上传与开始导入时都会校验）。
        文件 ≤ 10 MiB（413 IMPORT_FILE_TOO_LARGE），UTF-8（可带 BOM），逗号分隔，≤ 5000 行数据、≤ 300 列、单元格 ≤ 64 KiB（400 INVALID_IMPORT_FILE，message 说明原因）。
        Jira 导出里同名的列（Labels、Comment、Sprint、Watchers 等）按列序号区分。返回 DRAFT 状态的导入，preview 给出列信息与建议映射，
        config 预填建议的列映射（未保存，config_version = 1）。草稿 24 小时内未开始会被清理为 DISCARDED。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, source]
              properties:
                source: { type: string, enum: [teambition_csv, pingcode_csv, tapd_excel] }
                file: { type: string, format: binary }
                space_id: { type: string, format: uuid }
                new_space_name: { type: string, maxLength: 100 }
                new_space_prefix: { type: string, pattern: '^[A-Z0-9]{2,7}$' }
                new_space_visibility: { type: string, enum: [PRIVATE, SHARED] }
      responses:
        '201':
          description: 导入草稿
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/imports/tapd-sources:
