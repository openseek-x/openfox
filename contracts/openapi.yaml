  /v1/hooks/git/gitee/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string, maxLength: 128 } }
    post:
      operationId: receiveGiteeWebhook
      summary: 接收 Gitee Webhook（按组织连接）
      description: |
        令牌属于哪个服务商的连接，就只能在哪个服务商的路径上使用（否则 404）。无需登录；令牌只存 SHA-256；请求体 ≤ 5 MiB（413）；按令牌限流（429）。
        仓库 / 企业 Webhook 的 URL 填 Payload URL。验证有两种模式，二选一，都用详情里的签名密钥：
        「密码」模式：把签名密钥填进 Gitee 的「密码」，X-Gitee-Token 是明文，服务端常量时间比较；
        「签名密钥」模式：X-Gitee-Token = Base64(HmacSHA256(密钥, X-Gitee-Timestamp + "\n" + 密钥))（接受再做过一次 URL 编码的写法），
        X-Gitee-Timestamp 是毫秒时间戳，与服务器时间相差超过 1 小时拒绝。缺失或不符 401（不落库）。
        需要勾选的事件：Push、Pull Request、Issues、评论（Comments）。Gitee 没有投递 ID，按「事件名（X-Gitee-Event）+ 正文摘要」去重，重复投递 200 且不再处理。
        Pull Request：open / reopen / update 关联任务并把任务移到进行中，merge 时移到已完成，关闭未合并不改。仓库所有者按 path_with_namespace 的第一段匹配连接账号。
