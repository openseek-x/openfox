      - { name: sessionID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: completeIntegrationOAuthSession
      summary: 勾选要绑定的 GitHub 组织 / 账号，建立组织连接
      description: |
        只有发起授权的所有者 / 管理员；会话必须是 SELECTING 且未过期（否则 409 OAUTH_SESSION_STATE）。accounts 必须是会话列出的账号（400）。
        每个账号建立一条 ORGANIZATION 连接（account_kind = organization | user），生成 Webhook 地址令牌与签名密钥；
        已有未断开的同一账号连接时更新其令牌（不重复建）。完成后清除暂存令牌。审计 integration.connection_created。
