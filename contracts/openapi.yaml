      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                slug: { type: string, pattern: '^[a-z0-9-]{3,40}$' }
      responses:
        '201':
          description: 已创建
          content:
