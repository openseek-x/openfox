    post:
      operationId: removeWeChatBinding
      summary: 解绑微信
      description: |
        发起人本人或组织所有者 / 管理员；其他成员的绑定对非管理员不可见（404）。绑定改为 REMOVED，令牌作废，停止轮询，待发回复 SKIPPED。
        已有的 OpenFox 会话保留。版本不符 409。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
