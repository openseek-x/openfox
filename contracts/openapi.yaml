  /v1/organizations/{organizationID}/imports/jira-api:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    post:
      operationId: createJiraApiImport
      summary: 用 API 凭证创建 Jira 导入草稿（同步校验后，后台拉取条目）
      description: |
        只有组织所有者 / 管理员（403）。space_id 与 new_space 二选一（new_space 在开始导入时才创建；前缀不合法 400 INVALID_IDENTIFIER、已被占用 409 IDENTIFIER_TAKEN）。
        deployment = cloud 用 /rest/api/2/search/jql（nextPageToken 分页，认证 email + api_token）；server 用 /rest/api/2/search（startAt 分页，
        认证 pat = 个人访问令牌 Bearer，或 password = 用户名 + 密码）。site_url 只允许 https，不带用户名密码、查询串与片段；
        解析到的地址必须是公网地址（拦截回环、内网、链路本地、保留段，防 SSRF），重定向 ≤ 3 次且逐跳校验。
        同步校验（总时长 ≤ 30 秒）：凭证（/myself）、项目（/project/{key}）、JQL（取 1 条）与条目数（> 5000 时拒绝，提示用 JQL 缩小范围）。
        失败 400 JIRA_CONNECTION_FAILED，details.reason 见 ImportConnectionErrorReason；服务端未配置加密密钥 503 SECRETS_UNAVAILABLE。
        成功返回 DRAFT，phase = fetching，后台分页拉取全部条目（fetch 字段给进度），拉完 phase 清空、analysis 可用；
        拉取中途失败时状态改为 DISCARDED 并写 error_code / error_message。凭证加密保存在导入记录里，拉取结束（成功或失败）即清除，接口从不返回。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [deployment, site_url, auth, project_key]
              properties:
                deployment: { type: string, enum: [cloud, server] }
                site_url: { type: string, maxLength: 255, description: '例如 https://acme.atlassian.net 或 https://jira.example.com:8443/jira' }
                auth:
                  type: object
                  additionalProperties: false
                  required: [kind, secret]
                  properties:
                    kind: { type: string, enum: [api_token, pat, password], description: cloud 只能 api_token；server 为 pat 或 password }
                    email: { type: string, maxLength: 320, description: api_token 必填 }
                    username: { type: string, maxLength: 255, description: password 必填 }
                    secret: { type: string, minLength: 1, maxLength: 2048, description: API 令牌 / 个人访问令牌 / 密码 }
                project_key: { type: string, pattern: '^[A-Za-z][A-Za-z0-9_]{0,19}$' }
                jql: { type: string, maxLength: 2000, description: 可选；为空时为 project = <key>。非空时自动加上 project = <key> 限定 }
                space_id: { type: string, format: uuid }
                new_space: { $ref: '#/components/schemas/ImportNewSpace' }
      responses:
        '201':
          description: 导入草稿（拉取中）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/external-accounts:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listExternalAccounts
      summary: 外部账号（成员页「外部账号」页签）
      description: |
        所有成员可读（访客 403）；can_manage 只有所有者 / 管理员为 true。按创建时间倒序，limit 默认 50、最大 200，cursor 分页。
        q 按姓名、邮箱、来源标识模糊匹配；provider / source 精确匹配；link = linked | unlinked。
        suggested_user_id：未关联且邮箱与某个成员一致时给出（界面提示「可自动关联」）。
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: provider, in: query, required: false, schema: { type: string, maxLength: 32 } }
        - { name: source, in: query, required: false, schema: { type: string, maxLength: 255 } }
        - { name: link, in: query, required: false, schema: { type: string, enum: [linked, unlinked] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 200 } }
      responses:
        '200':
          description: 外部账号
          content:
            application/json:
              schema:
                type: object
                required: [accounts, next_cursor, total, unlinked, providers, sources, can_manage]
                properties:
                  accounts: { type: array, items: { $ref: '#/components/schemas/ExternalAccount' } }
                  next_cursor: { type: string, description: 空串表示没有下一页 }
                  total: { type: integer, minimum: 0, description: 符合筛选条件的总数 }
                  unlinked: { type: integer, minimum: 0, description: 其中未关联的数量 }
                  providers: { type: array, items: { type: string }, description: 本组织出现过的平台（筛选下拉） }
                  sources: { type: array, items: { type: string }, description: 本组织出现过的来源（筛选下拉） }
                  can_manage: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/external-accounts/links:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    post:
      operationId: saveExternalAccountLinks
      summary: 批量保存外部账号与成员的关联
      description: |
        只有所有者 / 管理员。一个事务内全部成功或全部失败；任一 version 不符 409 VERSION_CONFLICT（details.ids 为冲突的账号）。
        user_id 为成员 ID = 关联（link_method = manual），并把处理人是该外部账号的未删除任务转给该成员（成员须能读该任务所在空间，否则该任务保持外部处理人）；
        user_id 为 null = 取消关联（已转给成员的任务不还原）。user_id 必须是本组织活跃成员（400 INVALID_REQUEST）。最多 200 项。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [changes]
              properties:
                changes:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, version, user_id]
                    properties:
                      id: { type: string, format: uuid }
                      version: { type: integer, minimum: 1 }
                      user_id: { type: [string, 'null'], format: uuid }
      responses:
        '200':
          description: 保存后的账号
          content:
            application/json:
              schema:
                type: object
                required: [accounts, reassigned_tasks]
                properties:
                  accounts: { type: array, items: { $ref: '#/components/schemas/ExternalAccount' } }
                  reassigned_tasks: { type: integer, minimum: 0 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/imports/{importID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: importID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getImport
      summary: 导入详情（含预览、配置、分析与失败条目样例）
      description: 可见性同 listImports；看不到时 404。草稿只有所有者 / 管理员可见。
      responses:
        '200':
          description: 导入详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/imports/{importID}/sync:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: importID, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: updateImportProjectSync
      summary: 管理员暂停、恢复或断开导入的持续同步
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              description: state、direction、status_mappings 或 check_now=true 四选一
              additionalProperties: false
              properties:
                state: { type: string, enum: [ACTIVE, PAUSED, DISCONNECTED] }
                direction: { type: string, enum: [INBOUND, BIDIRECTIONAL] }
                status_mappings: { type: object, maxProperties: 500, additionalProperties: { type: string } }
                check_now: { type: boolean }
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 操作后的导入记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/imports/{importID}/config:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: importID, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: putImportConfig
      summary: 保存草稿配置（列映射、状态映射、成员映射、选项）并返回最新分析
      description: |
        只有所有者 / 管理员；只有 DRAFT 可改（409 IMPORT_STATE）。config_version 不符 409 VERSION_CONFLICT。
        结构不合法（未知字段、列序号越界、引用不存在的状态 / 成员、邮箱格式错误等）400 INVALID_IMPORT_CONFIG。
        映射不完整（缺标题列、存在未映射的来源状态等）不报错，写进 analysis.issues，开始导入时才拒绝。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [config_version, config]
              properties:
                config_version: { type: integer, minimum: 1 }
                config: { $ref: '#/components/schemas/ImportConfig' }
      responses:
        '200':
          description: 更新后的导入草稿
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/imports/{importID}/start:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: importID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: startImport
      summary: 开始导入（发送邀请邮件后进入 QUEUED，由后台执行）
      description: |
        只有所有者 / 管理员；只有 DRAFT 可开始（已开始时幂等返回当前状态）。config_version 不符 409 VERSION_CONFLICT；
        analysis.issues 非空 400 IMPORT_CONFIG_INCOMPLETE；开启覆盖导入且 analysis.overwrite.modified > 0 时必须 confirm_overwrite = true（400 OVERWRITE_CONFIRMATION_REQUIRED）；
        同一空间已有执行中的导入 409 IMPORT_ACTIVE。成员映射为 invite 的来源用户在开始时创建邀请并发送邮件（已是成员或已有待接受邀请的跳过），
        结果写进 invitations；邀请发送失败不阻止导入（可在成员页重发）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [config_version]
              properties:
                config_version: { type: integer, minimum: 1 }
                sync_ticket: { type: string, maxLength: 32768, writeOnly: true, description: 显式开启站点同步时提交本草稿返回的加密票据 }
                confirm_overwrite: { type: boolean }
      responses:
        '200':
          description: 已开始的导入
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/clone/targets:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/SpaceID'
    get:
      operationId: listSpaceCloneTargets
      summary: 可克隆到的目标组织（当前成员是所有者 / 管理员、且不是当前组织）
      description: 发起人必须是源组织的所有者 / 管理员，并且能管理该空间；否则 403。
      responses:
        '200':
          description: 目标组织列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CloneTargetList' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/clone/preview:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/SpaceID'
    post:
      operationId: previewSpaceClone
      summary: 克隆预览（计数、目标标识符、阻塞项 / 警告 / 已接受风险 / 已跳过）
      description: |
        服务端在源组织与目标组织分别重新校验发起人的所有者 / 管理员权限。只读，不产生任何写入。
        目标组织已有同名空间或同标识符空间时 name_conflict 为 true，需要在请求里填写新的 name / prefix 后再预览。
        blockers 非空（含超出上限、命名冲突未解决）时 can_start 为 false。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloneRequest' }
      responses:
        '200':
          description: 预览
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClonePreview' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/clone:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/SpaceID'
    post:
      operationId: startSpaceClone
      summary: 开始克隆（在源组织事务内生成快照包，后台在目标组织创建副本）
      description: |
        Idempotency-Key 必填，操作名 space.clone，在目标组织内登记；同键同请求返回首次创建的任务（200，Idempotent-Replayed=true）。
        错误：403 无权限（缺任一组织的所有者 / 管理员）；400 目标组织不合法；409 IDENTIFIER_TAKEN / NAME_TAKEN 命名冲突；
        422 CLONE_BLOCKED 存在阻塞项（details 带 blockers）；409 IDEMPOTENCY_CONFLICT；503 STORAGE_UNAVAILABLE 未配置文件存储。
        任务挂在目标组织下，用 getSpaceCloneJob / cancelSpaceCloneJob（路径里的组织 ID 是目标组织）读取与取消。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloneRequest' }
      responses:
        '201':
          description: 已创建克隆任务
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CloneJob' }
        '200':
          description: 幂等重放
          headers:
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CloneJob' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/clone-jobs/{jobID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: jobID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getSpaceCloneJob
      summary: 克隆任务详情（organizationID 是目标组织；只有发起人且仍是该组织所有者 / 管理员可读）
      responses:
        '200':
          description: 克隆任务
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CloneJob' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/clone-jobs/{jobID}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: jobID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: cancelSpaceCloneJob
      summary: 取消克隆（已创建的数据自动清理）
      description: 排队中直接取消；执行中在当前批次结束后停止并进入清理。已结束时幂等返回当前状态。
      responses:
        '200':
          description: 取消后的任务
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CloneJob' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/export-spaces:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listExportSpaces
      summary: 可导出的空间（当前成员能读的空间，含已停用）
      description: 私有空间只有空间成员能读，组织所有者 / 管理员也不例外。访客 403。
      responses:
        '200':
          description: 空间列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportSpaceList' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/exports:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listExports
      summary: 导出记录（成员看自己发起的，所有者 / 管理员看全部，最近 50 条）
      responses:
        '200':
          description: 导出记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportJobList' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createExport
      summary: 发起任务数据导出（后台生成文件）
      description: |
        Idempotency-Key 必填，操作名 task.export；同键同请求返回首次创建的任务（200，Idempotent-Replayed=true）。
        csv：每个任务一行（UTF-8 带 BOM，防公式注入），多个空间打包为 zip；json：快照包（gzip 行文件），多个空间一个 zip。
        导出内容按发起人在生成时的读权限过滤。错误：403 访客；404 SPACE_NOT_FOUND 含读不到的空间；
        422 EXPORT_TOO_LARGE 超过 20 个空间或 100,000 个任务（details 带 spaces / tasks / max_spaces / max_tasks）；503 STORAGE_UNAVAILABLE。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportRequest' }
      responses:
        '201':
          description: 已创建导出任务
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportJob' }
        '200':
          description: 幂等重放
          headers:
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportJob' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/exports/{exportID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: exportID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getExport
      summary: 导出详情（发起人或所有者 / 管理员；他人 403）
      responses:
        '200':
          description: 导出任务
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportJob' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/exports/{exportID}/download:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: exportID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: downloadExport
      summary: 下载导出文件（需要登录；发起人或所有者 / 管理员）
      description: |
        Content-Disposition 为 attachment，文件名由服务端生成。文件完成后保留 7 天。
        409 EXPORT_NOT_READY 还在生成或已失败；410 EXPORT_EXPIRED 已过期。
      responses:
        '200':
          description: 文件内容（csv / zip / gzip）
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            text/csv:
              schema: { type: string, format: binary }
            application/zip:
              schema: { type: string, format: binary }
            application/gzip:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/imports/{importID}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: importID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: cancelImport
      summary: 取消导入（排队中立即取消；执行中在当前批次结束后停止）；DRAFT 丢弃为 DISCARDED
      description: 只有所有者 / 管理员。已结束时幂等返回当前状态。只有 DRAFT 校验 version（不符 409 VERSION_CONFLICT）；排队 / 执行中每批都会递增 version，不校验。取消前已导入的任务保留，可回滚移除。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 取消后的导入
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/imports/{importID}/rollback:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: importID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getImportRollbackPreview
      summary: 回滚预览（可否回滚、将删除的条目数、导入后被改过的任务、将清理的配置）
      description: 只有所有者 / 管理员。
      responses:
        '200':
          description: 回滚预览
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportRollbackPreview' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: rollbackImport
      summary: 回滚导入（软删除本次导入创建的任务，释放来源映射，清理本次新建且已无任务使用的状态与标签）
      description: |
        只有所有者 / 管理员。条件：状态为 SUCCEEDED / FAILED / CANCELLED、结束后 7 天内、本次导入创建过任务（否则 409 IMPORT_ROLLBACK_UNAVAILABLE，message 为原因）；
        有 Agent 正在执行其中任务时 409 RUN_ACTIVE。version 不符 409 VERSION_CONFLICT。覆盖导入对已有任务的修改不会撤销。单事务完成。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 回滚后的导入
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportJob' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/organizations/{organizationID}/me/account-bindings:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listMyAccountBindings
      summary: 第三方账号绑定页（当前成员在本组织的个人绑定）
      description: |
        所有非访客成员；访客 403。providers 固定 14 行、顺序：wechat、github、gitlab_cn、gitlab、gitee、jira、tapd、zentao、pingcode、teambition、slack、feishu、lark、dingtalk（7g-4 在 GitHub 后插入极狐、GitLab 自部署版、Gitee）。
        availability = coming_soon 的服务商没有任何操作。
        微信（7g-W）：method = link，binding 汇总本人在本组织的 Agent ↔ 微信绑定（display_name = 脱敏的第一个微信，detail = "N 个 Agent 绑定"，connection_id = 第一个绑定的 ID），管理在集成详情页；organization_ready = 服务端已配置 iLink 与加密密钥。
        禅道：method = link，binding 为本人未断开的 sync_comments 个人连接，管理在集成详情页；organization_ready = 本组织有 ACTIVE 的禅道组织连接。
        PingCode：method = link，binding 为本人未断开的 sync_comments 个人连接，管理在集成详情页；organization_ready = 本组织有 ACTIVE 的 PingCode 组织连接。
        organization_ready：GitHub = 本组织有 ACTIVE 的 GitHub 组织连接且服务端配置了 GitHub 应用；飞书 = 本组织飞书应用 ACTIVE；
        极狐 / GitLab 自部署版 = 本组织有该服务商的 ACTIVE 组织连接；Gitee = 本组织有 ACTIVE 的 Gitee 组织连接且服务端配置了 Gitee 应用；
        GitLab 系行带 instances（每个实例一项，含本人在该实例的个人绑定），binding 取第一个已绑定实例，detail = 实例主机（多个已绑定实例时为「N 个实例」）。
        Jira = 本组织至少导入过一个 Jira 站点（jira_sites 非空；Jira 没有组织级连接，站点来自 Jira API 导入记录）。
        binding 为当前成员未断开的个人连接（没有则为空）。凭据从不返回。
      responses:
        '200':
          description: 账号绑定
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountBindingsView' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/me/account-bindings/jira:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    put:
      operationId: putMyJiraBinding
      summary: 绑定或更新我的 Jira 账号（只校验身份，不保存凭证）
      description: |
        所有非访客成员。site_url 必须是 listMyAccountBindings.jira_sites 中的一个（否则 400 JIRA_SITE_UNKNOWN，防止向任意地址发请求）；
        请求经过 SSRF 防护（与 Jira API 导入相同）。用凭证调用 /rest/api/2/myself：
        - deployment = cloud：email + api_token（Basic），email 必须与当前成员的 OpenFox 邮箱一致（不一致 422 JIRA_EMAIL_MISMATCH）；
        - deployment = server：api_token 为个人访问令牌（Bearer），不需要 email；/myself 返回的邮箱如果不为空，也必须与 OpenFox 邮箱一致。
        凭证错误 422 JIRA_AUTH_FAILED；站点不可达 / 5xx 502 JIRA_UNAVAILABLE；地址被拦截 400 JIRA_BLOCKED_ADDRESS。
        成功后建立（或替换）本人的 Jira 个人连接（只记 Jira 账号标识、姓名、邮箱），并把本组织里该站点下这个 Jira 身份、尚未关联的外部账号
        关联到本人（link_method = verified，处理人是该外部账号的任务转给本人；本人读不到的任务保持原样）。已经关联到其他成员的外部账号不改动，
        计入 skipped_accounts。这个 Jira 账号已被本组织其他成员绑定 409 JIRA_ACCOUNT_IN_USE。凭证用完即丢弃，不写库、不写日志。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [site_url, deployment, api_token]
              properties:
                site_url: { type: string, maxLength: 2048 }
                deployment: { type: string, enum: [cloud, server] }
                email: { type: string, maxLength: 320 }
                api_token: { type: string, minLength: 1, maxLength: 512 }
      responses:
        '200':
          description: 绑定结果
          content:
            application/json:
              schema:
                type: object
                required: [binding, linked_accounts, reassigned_tasks, skipped_accounts]
                properties:
                  binding: { $ref: '#/components/schemas/AccountBinding' }
                  linked_accounts: { type: integer, description: 本次关联到本人的外部账号数 }
                  reassigned_tasks: { type: integer }
                  skipped_accounts: { type: integer, description: 已关联到其他成员、没有改动的外部账号数 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /v1/me/inbox-preferences:
