      description: |
        Gitee 是单一 SaaS，第三方应用由部署方在服务端配置（OPENFOX_GITEE_CLIENT_ID、OPENFOX_GITEE_CLIENT_SECRET_FILE，可选 OPENFOX_GITEE_BASE_URL、
        OPENFOX_GITEE_API_URL）；未配置时 409 INTEGRATION_NOT_CONFIGURED，所以请求体不含实例地址与应用凭据。
        purpose = organization（绑定 Gitee 组织或个人账号，只有所有者 / 管理员）/ personal（绑定自己的 Gitee 账号，所有非访客成员；
        个人连接不挂在组织连接下，connection_id 不需要）/ reauthorize（重新授权某个组织连接，connection_id 必填，只有所有者 / 管理员）。
        授权申请 user_info projects pull_requests issues notes groups 权限，使用 state（10 分钟有效、只能用一次，只存 SHA-256）。
        Gitee 的文档与 OpenAPI 描述里没有 PKCE，所以授权地址不带 code_challenge。
