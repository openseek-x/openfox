openapi: 3.1.0
info:
  title: OpenFox Center API
  version: 0.2.0
  description: |
    OpenFox 中心服务 HTTP 契约。前端类型由本文件生成（pnpm gen:api）。
    约定：
    - 浏览器写请求必须带 X-CSRF-Token（取自 openfox_csrf cookie）。
    - 创建类接口按需要求 Idempotency-Key（8–128 位字母数字、下划线、连字符）。
    - 错误统一使用 ErrorResponse，code 为稳定的大写标识符。
    - 本文件描述当前接口；未列出的路由行为不变。
servers:
  - url: http://127.0.0.1:8080
paths:
  /v1/organizations/{organizationID}/git-settings:
    parameters:
      - { $ref: '#/components/parameters/OrganizationID' }
    get:
      operationId: getOrganizationGitSettings
      summary: 读取 Git 默认值及继承结果
      responses:
        '200':
          description: Git settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitSettings' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      operationId: putOrganizationGitSettings
      summary: 保存 Git 默认值
      description: 组织仅 OWNER/ADMIN 可写；空间需管理权限且未停用。完整替换，version 必填；空名称/邮箱继承父级。组织 co_author_enabled 不可为 null，空间 null 继承组织。过期版本返回 409，不自动重试。Cookie 写操作需要 CSRF。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitSettingsInput' }
      responses:
        '200':
          description: Saved settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitSettings' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/spaces/{spaceID}/git-settings:
    parameters:
      - { $ref: '#/components/parameters/OrganizationID' }
      - { $ref: '#/components/parameters/SpaceID' }
    get:
      operationId: getSpaceGitSettings
      summary: 读取 Git 默认值及继承结果
      responses:
        '200':
          description: Git settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitSettings' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      operationId: putSpaceGitSettings
      summary: 保存 Git 默认值
      description: 组织仅 OWNER/ADMIN 可写；空间需管理权限且未停用。完整替换，version 必填；空名称/邮箱继承父级。组织 co_author_enabled 不可为 null，空间 null 继承组织。过期版本返回 409，不自动重试。Cookie 写操作需要 CSRF。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitSettingsInput' }
      responses:
        '200':
          description: Saved settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitSettings' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /:
    get:
      operationId: getServiceMetadata
      responses:
        '200':
          description: Service metadata
  /live:
    get:
      operationId: getLiveness
      responses:
        '200':
          description: Process is alive
  /ready:
    get:
      operationId: getReadiness
      responses:
        '200':
          description: Dependencies are ready
        '503':
          description: Dependencies are not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/email/request:
    post:
      operationId: requestEmailCode
      summary: 发送邮箱验证码（新邮箱验证后自动注册）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, maxLength: 320 }
      responses:
        '202':
          description: 验证码已发送
          content:
            application/json:
              schema:
                type: object
                required: [expires_at]
                properties:
                  expires_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Error' }
        '429':
          description: 冷却中（EMAIL_CODE_RATE_LIMITED）或超过每日上限（EMAIL_DAILY_LIMIT），Retry-After 给出秒数
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503': { $ref: '#/components/responses/Error' }

  /v1/auth/email/verify:
    post:
      operationId: verifyEmailCode
      summary: 校验验证码并建立会话（写入 HttpOnly 会话 cookie 与 CSRF cookie）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string }
                code: { type: string, pattern: '^[0-9]{6}$' }
                client_kind: { type: string, enum: [web, desktop] }
      responses:
        '201':
          description: 已登录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginSession' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /v1/auth/logout:
    post:
      operationId: logout
      summary: 注销当前会话并清除 cookie；会话已失效时同样返回 204（幂等）
      responses:
        '204': { description: 已注销 }
        '403': { $ref: '#/components/responses/Error' }

  /v1/me:
    get:
      operationId: getMe
      summary: 当前登录用户
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateMe
      summary: 修改全名或简介
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                full_name: { type: string, minLength: 1, maxLength: 80, description: 去掉首尾空白后不能为空 }
                bio: { type: string, maxLength: 280 }
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/me/avatar:
    put:
      operationId: uploadMyAvatar
      summary: 上传头像（multipart 字段 file；PNG / JPG / WebP，≤ 5 MB，按文件头判断格式；存储未配置时 503 STORAGE_UNAVAILABLE）
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /v1/users/{userID}/avatar:
    parameters:
      - { name: userID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getUserAvatar
      summary: 读取头像图片；只有本人或与对方同在一个活跃组织的用户可读，其余与没有头像一样返回 404
      responses:
        '200':
          description: 图片
          content:
            image/*:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/me/preferences:
    get:
      operationId: getMyPreferences
      summary: 账号偏好；从未保存过时返回默认值（version = 0）
      responses:
        '200':
          description: 偏好
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPreferences' }
        '401': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateMyPreferences
      summary: 修改偏好（只改出现的字段；version 不一致 409 VERSION_CONFLICT；command_shortcuts 整体替换，按键冲突 400 SHORTCUT_CONFLICT）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserPreferencesPatch' }
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPreferences' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/me/email-change/start:
    post:
      operationId: startEmailChange
      summary: 修改邮箱第 1 步：向当前邮箱发送验证码（频率限制同登录验证码，429 EMAIL_RATE_LIMITED）
      responses:
        '200':
          description: 已发送
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailChallenge' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /v1/me/email-change/verify-current:
    post:
      operationId: verifyCurrentEmail
      summary: 修改邮箱第 2 步：校验发到当前邮箱的验证码（错误或过期 400 CODE_INVALID，次数用尽后该验证码作废）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, code]
              properties:
                challenge_id: { type: string, format: uuid }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '204': { description: 已验证 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/me/email-change/request-new:
    post:
      operationId: requestNewEmail
      summary: 修改邮箱第 3 步：向新邮箱发送验证码；challenge_id 是已验证、未过期的第 1 步验证码（否则 400 CODE_INVALID）；新邮箱格式不对或与当前相同 400 INVALID_EMAIL；新邮箱已被占用 409 EMAIL_TAKEN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, email]
              properties:
                challenge_id: { type: string, format: uuid }
                email: { type: string, maxLength: 320 }
      responses:
        '200':
          description: 已发送
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailChallenge' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /v1/me/email-change/confirm:
    post:
      operationId: confirmEmailChange
      summary: 修改邮箱第 4 步：校验发到新邮箱的验证码并改邮箱；成功后吊销本人的其他会话（当前会话保留）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, code]
              properties:
                challenge_id: { type: string, format: uuid }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: 已修改
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/me/tokens:
    get:
      operationId: listMyTokens
      summary: 本人未吊销的个人访问令牌（含已过期），按创建时间倒序；用令牌认证时 403 TOKEN_FORBIDDEN
      responses:
        '200':
          description: 令牌
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens: { type: array, items: { $ref: '#/components/schemas/PersonalAccessToken' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createMyToken
      summary: 创建个人访问令牌；明文 secret 只在这次响应里出现。每人最多 50 个未吊销令牌（409 TOKEN_LIMIT）；用令牌认证时 403 TOKEN_FORBIDDEN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                expires_in_days: { type: [integer, 'null'], enum: [30, 90, 365, null], description: null 或缺省 = 永不过期 }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                required: [token, secret]
                properties:
                  token: { $ref: '#/components/schemas/PersonalAccessToken' }
                  secret: { type: string, description: 'ofx_pat_ 开头的明文令牌，用作 Authorization: Bearer' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/me/tokens/{tokenID}:
    parameters:
      - { name: tokenID, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: revokeMyToken
      summary: 吊销本人的令牌（别人的或已吊销的 404）；用令牌认证时 403 TOKEN_FORBIDDEN
      responses:
        '204': { description: 已吊销 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/organizations/{organizationID}/integrations:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listIntegrations
      summary: 外部应用集成总览（服务商目录 + 本组织的启用概况）
      description: |
        目录由服务端维护（代码内静态清单）：availability 决定卡片是否可点；configured 表示服务端是否已配置该服务商需要的应用凭据
        （例如 GitHub OAuth App），未配置时详情页提示「服务器尚未配置」。所有成员可读；can_manage 只有组织所有者 / 管理员为 true。
      responses:
        '200':
          description: 总览
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationOverview' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/integrations/{provider}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: provider, in: path, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9_]{1,31}$' } }
    get:
      operationId: getIntegration
      summary: 某个服务商的详情（组织连接、我的个人连接、同步关联）
      description: 未知服务商 404。凭据从不返回，只有 credentials_hint（例如末四位）。
      responses:
        '200':
          description: 详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationDetail' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/integrations/github/authorize:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    post:
      operationId: startGitHubAuthorization
      summary: 发起 Git 服务商（GitHub、GitLab、极狐）OAuth 授权（返回在弹窗里打开的授权地址）
      description: |
        路径里的服务商决定使用哪家（GitHub 字面量路径 /integrations/github/authorize 行为不变；未知值 404；gitee 见 /integrations/gitee/authorize）。
        GitLab / 极狐：organization 授权必须带 instance_url（极狐可省略，默认 https://jihulab.com）、application_id、application_secret（管理员在实例
        「用户设置 → 应用」里创建的 OAuth 应用，回调地址见详情接口的 oauth_redirect_uri，权限勾选 api）。实例地址要过 SSRF 防护：生产环境只允许 https、
        拒绝解析到内网 / 回环 / 链路本地的地址（400 INVALID_INSTANCE_URL）；开发 / 测试环境允许 http 与本机地址。应用凭据加密保存，不会在任何响应里返回。
        reauthorize / personal 沿用该组织连接保存的实例与应用；GitLab 的 personal 必须带 connection_id（选择哪个实例的组织连接）。
        GitLab 访问令牌 2 小时过期，服务端在到期前用刷新令牌自动续期；刷新令牌失效时连接进入 NEEDS_ATTENTION（需要重新授权）。
        以下为 GitHub 的原有说明：
        purpose = organization（绑定 GitHub 组织或账号，只有所有者 / 管理员）/ personal（绑定自己的 GitHub 账号，所有非访客成员）/
        reauthorize（重新授权某个组织连接，connection_id 必填，只有所有者 / 管理员）。服务端未配置 GitHub 应用时 409 INTEGRATION_NOT_CONFIGURED。
        授权申请 repo 与 read:org 权限（用户已确认），使用 state（10 分钟有效、只能用一次，只存 SHA-256）与 PKCE。
        GitHub 回调到 GET /v1/integrations/github/callback，服务端处理后把弹窗重定向到前端 /integrations/oauth/complete。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [purpose]
              properties:
                purpose: { type: string, enum: [organization, personal, reauthorize] }
                connection_id: { type: string, format: uuid }
                instance_url: { type: string, maxLength: 2048, description: GitLab / 极狐实例地址（仅 organization） }
                application_id: { type: string, maxLength: 255, description: GitLab / 极狐 OAuth 应用的 Application ID（仅 organization） }
                application_secret: { type: string, maxLength: 1024, description: GitLab / 极狐 OAuth 应用的 Secret（仅 organization；加密保存，不回显） }
      responses:
        '200':
          description: 授权地址
          content:
            application/json:
              schema:
                type: object
                required: [authorize_url, session_id, expires_at]
                properties:
                  authorize_url: { type: string }
                  session_id: { type: string, format: uuid }
                  expires_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/integrations/{provider}/instance-token:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: provider, in: path, required: true, schema: { type: string, enum: [tapd, pingcode, cnb, shortcut, teambition] } }
    post:
      operationId: bindProviderInstanceToken
      summary: 校验并加密保存组织连接
      description: 仅组织管理员和所有者。固定供应商 HTTPS 地址，10 秒超时，不跟随重定向。相同实例已连接时返回 409。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [method, secret]
              properties:
                method: {type: string, enum: [basic, token, app]}
                secret: {type: string, writeOnly: true, minLength: 1, maxLength: 4096}
                account: {type: string, maxLength: 200}
                company_id: {type: string, maxLength: 100}
      responses:
        '200':
          description: 已连接的账号
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationConnection' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/integrations/site-personal:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    put:
      operationId: bindSitePersonal
      summary: 绑定本人用于 Jira 或禅道评论同步的账号
      description: 非访客成员仅可绑定自己；实例和网关授权取自活动组织连接。25 秒外部校验后复查权限和版本，加密保存，不回显密码。只用于本人成员评论。初次 version 为 0，修改传已读版本；重试先读取详情，版本不符返回 409。历史身份验证绑定保持不变。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [connection_id, version]
              properties:
                connection_id: { type: string, format: uuid }
                version: { type: integer, minimum: 0 }
                jira:
                  type: object
                  required: [Kind, Secret]
                  additionalProperties: false
                  properties:
                    Kind: { type: string, enum: [pat, api_token, password] }
                    Email: { type: string, maxLength: 320 }
                    Username: { type: string, maxLength: 200 }
                    Secret: { type: string, maxLength: 2048, writeOnly: true }
                zentao:
