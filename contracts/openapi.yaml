        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/integrations/wechat/agent-bindings/qr:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    post:
      operationId: startWeChatQR
      summary: 发起微信扫码绑定 Agent
      description: |
        权限与飞书「绑定 Agents」相同：Agent 所有者或组织所有者 / 管理员（访客、其他人的私有 Agent 403 / 404，归档或内置 Agent 404 / 400）。
        每个用户最多 20 个有效绑定（409 WECHAT_LIMIT_REACHED）。服务端向 iLink 申请二维码并保存扫码会话（有效期 5 分钟）；
        同一发起人对同一 Agent 之前进行中的会话被取消。qr_content 只当作二维码文本渲染，前端不加载其中的外部图片。
        服务端未配置密钥 503 / 未配置 iLink 409 INTEGRATION_NOT_CONFIGURED；iLink 不可用 502 WECHAT_UNAVAILABLE。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [agent_id]
              properties:
                agent_id: { type: string, format: uuid }
      responses:
        '201':
          description: 扫码会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeChatQRSession' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/integrations/wechat/agent-bindings/qr/{sessionID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: sessionID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getWeChatQR
      summary: 查询扫码会话（前端轮询）
      description: |
        只允许发起人（其他人 404）。每次调用向 iLink 查询一次扫码状态（服务端长轮询，单次最多约 25 秒，超时按仍在等待返回），并按状态推进：
        PENDING 等待扫码、SCANNED 已扫码待确认、NEED_VERIFY 需要输入验证码（POST .../verify）、CONFIRMED 已确认并建立绑定（幂等：重复查询不重复建立）、
        EXPIRED / BLOCKED / FAILED / CANCELLED 为终态（前端显示刷新入口）。终态直接返回，不再访问 iLink。
        iLink 返回的 baseurl / redirect_host 必须是 https 且主机为 weixin.qq.com 或其子域（开发 / 测试环境另允许等于配置的基址），否则会话 FAILED，error_code = untrusted_host。
        error_code：untrusted_host、invalid_response、forbidden（确认时发起人已无权限）、limit_reached、bot_in_use（该微信机器人已被绑定）、already_bound、verify_code_blocked。
      responses:
        '200':
          description: 扫码会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeChatQRSession' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/integrations/wechat/agent-bindings/qr/{sessionID}/verify:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: sessionID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: verifyWeChatQR
      summary: 提交扫码验证码
      description: 会话状态为 NEED_VERIFY 时由发起人提交微信里显示的验证码；服务端带验证码向 iLink 查询并推进，返回值同 getWeChatQR。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, pattern: '^[A-Za-z0-9]{1,16}$' }
      responses:
        '200':
          description: 扫码会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeChatQRSession' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/integrations/wechat/agent-bindings/qr/{sessionID}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: sessionID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: cancelWeChatQR
      summary: 取消扫码会话
      description: 只允许发起人；已是终态的会话原样返回。
      responses:
        '200':
          description: 扫码会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeChatQRSession' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/integrations/{imProvider}/callback:
    parameters:
      - $ref: '#/components/parameters/IMProvider'
    get:
      operationId: feishuOAuthCallback
      summary: 飞书 OAuth 回调（浏览器跳转，不返回 JSON）
      description: |
        飞书应用「安全设置 → 重定向 URL」必须配置为 {OPENFOX_SERVER_PUBLIC_URL}/api/v1/integrations/{imProvider}/callback（配置指引里给出；Lark 为 .../integrations/lark/callback）。
        需要登录会话，且会话用户必须是发起授权的成员。校验 state 后用 code + PKCE 向飞书换取用户令牌、读取用户信息（open_id、姓名、头像），
        建立（或替换）本人的个人飞书连接，并自动开启本人的飞书通知渠道。用户令牌只用于读取身份，不保存。
        处理完成后 302 到 {PUBLIC_URL}/integrations/oauth/complete?provider=feishu&session=<id>&status=ok|error&reason=<code>；
        state 无效或会话用户不符 reason = invalid_state；用户拒绝授权 reason = access_denied；换取令牌失败 reason = exchange_failed；
        这个飞书账号已绑定到本组织的其他成员 reason = account_in_use。
      parameters:
        - { name: code, in: query, required: false, schema: { type: string, maxLength: 512 } }
        - { name: state, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: error, in: query, required: false, schema: { type: string, maxLength: 128 } }
      responses:
        '302': { description: 重定向到前端完成页 }
  /v1/organizations/{organizationID}/integrations/oauth/{sessionID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
