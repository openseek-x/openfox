        本组接口的路径服务商 imProvider 取 feishu 或 lark，Lark 与飞书是同一套开放平台协议，请求 / 响应 / 状态码 / 错误码完全相同
        （错误码仍以 FEISHU_ 开头，文案里的「飞书」在 Lark 页面显示为 Lark）。每个服务商在一个组织里各有自己的应用、机器人与个人绑定，互不影响。
        所有非访客成员可读；访客 403。app 为空表示尚未绑定（或已断开）。凭据从不返回，只有 credentials_hint（App Secret 末四位）。
        status：PENDING 待连接（已保存、长连接尚未建立）/ CONNECTED 已连接 / NEEDS_ATTENTION 需要重新验证（凭证失效、机器人不可用等）/
        DISCONNECTED 已断开（不会出现在 app 里，断开后 app 为空）。
      responses:
        '200':
          description: 飞书详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeishuAppView' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      operationId: putFeishuApp
      summary: 绑定飞书应用或更新凭证（App ID + App Secret，保存时立即校验）
      description: |
        只有所有者 / 管理员。没有有效的飞书应用时为绑定（不带 version）；已绑定时为更新凭证，必须带 version，且 App ID 必须相同
        （换成别的应用请先断开再绑定，因为个人绑定的 open_id 只在同一个应用内有效）。
        校验顺序：用 App ID / Secret 换取 tenant_access_token（失败 422 FEISHU_CREDENTIALS_INVALID）→ 读取机器人信息
        （读不到 422 FEISHU_BOT_UNAVAILABLE，提示开启「机器人」能力）→ 保存（App Secret 加密存储）并交给长连接管理建立长连接（状态先为 PENDING）。
        App ID 已被其他组织绑定 409 FEISHU_APP_IN_USE；更新凭证时 App ID 不同 409 FEISHU_APP_MISMATCH；版本不符 409 VERSION_CONFLICT；
        飞书开放平台不可达或返回 5xx 时 502 FEISHU_UNAVAILABLE（什么都不保存）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [app_id, app_secret]
              properties:
                app_id: { type: string, description: '飞书 / Lark 是 cli_ 开头的 App ID，钉钉是 ding 开头的 AppKey（Client ID）；格式不符 400', pattern: '^(cli|ding)[_A-Za-z0-9]{8,48}$' }
                app_secret: { type: string, minLength: 16, maxLength: 128 }
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 保存后的飞书应用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeishuApp' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/integrations/{imProvider}/app/verify:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/IMProvider'
    post:
      operationId: verifyFeishuApp
      summary: 重新验证（用已保存的凭证重新校验，成功后恢复 ACTIVE 并重建长连接）
      description: |
        只有所有者 / 管理员。没有有效的飞书应用 404。校验规则与 putFeishuApp 相同：失败时连接标为 NEEDS_ATTENTION 并返回对应的 422；
        成功时清除错误、长连接状态改回 PENDING，由长连接管理重新连接。
      responses:
        '200':
          description: 验证后的飞书应用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeishuApp' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/integrations/{imProvider}/app/settings:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/IMProvider'
    patch:
      operationId: patchFeishuAppSettings
      summary: 飞书应用设置（任务链接预览开关）
      description: 只有所有者 / 管理员。没有有效的飞书应用 404；版本不符 409 VERSION_CONFLICT。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [link_preview_enabled, version]
              properties:
                link_preview_enabled: { type: boolean }
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 保存后的飞书应用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeishuApp' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/integrations/{imProvider}/authorize:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/IMProvider'
    post:
      operationId: startFeishuAuthorization
      summary: 发起「我的飞书账号」OAuth 授权（返回在弹窗里打开的飞书授权地址）
      description: |
        所有非访客成员。本组织没有状态为 ACTIVE 的飞书应用时 409 FEISHU_APP_NOT_CONNECTED。
        授权使用组织飞书应用的 App ID，state（10 分钟有效、只能用一次，只存 SHA-256）与 PKCE；授权会话复用 getIntegrationOAuthSession。
        飞书回调到 GET /v1/integrations/{imProvider}/callback（Lark 为 /v1/integrations/lark/callback）。已经绑定过时，授权成功会替换为新的飞书账号。
      responses:
        '200':
          description: 授权地址
          content:
            application/json:
              schema:
                type: object
                required: [authorize_url, session_id, expires_at]
                properties:
                  authorize_url: { type: string }
                  session_id: { type: string, format: uuid }
                  expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/integrations/{imProvider}/bots:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/IMProvider'
    get:
      operationId: listFeishuBots
      summary: 飞书任务助手（我加入的每个空间一行）与已绑定的 Agents
      description: |
        所有非访客成员可读；访客 403。assistants 按空间名称排序，只包含当前成员可读的空间；can_manage = 能管理该空间（空间管理员、组织所有者 / 管理员）。
        agents 列出本组织所有未移除的 Agent 机器人。extra_prompt 与 runtime 只对能管理的人返回（其他人为空）。
        builtin_prompt 是任务助手的内置提示词，只读。
      responses:
        '200':
          description: 飞书机器人
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeishuBotsView' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createDingTalkBot
      summary: 钉钉：用 AppKey + AppSecret 直接连接任务助手或 Agent 机器人（钉钉没有扫码创建接口）
      description: |
        仅 imProvider = dingtalk 可用（feishu / lark 用 registrations 扫码创建，请求这个路径 405）。每个机器人对应一个钉钉企业内部应用（企业在钉钉开发者后台自己创建并开启机器人），
        这里填它的 AppKey（Client ID）与 AppSecret（Client Secret）。校验顺序：成员 / 目标 / Runtime / 冲突检查（同 startFeishuRegistration 的规则）→ 用 AppKey / AppSecret
        换取 accessToken（失败 422 FEISHU_CREDENTIALS_INVALID；钉钉不可达 502 FEISHU_UNAVAILABLE，什么都不保存）→ 保存（AppSecret 加密存储）并交给长连接管理建立 Stream 长连接。
        同一个 AppKey 已被连接 409 FEISHU_APP_IN_USE；该空间已有助手 409 FEISHU_ASSISTANT_EXISTS；Agent 已连接 409 FEISHU_AGENT_CONNECTED。
        本组织需要先绑定钉钉应用（用于成员的钉钉账号绑定），否则 409 FEISHU_APP_NOT_CONNECTED。机器人使用的钉钉应用必须与组织绑定的钉钉应用属于同一个钉钉企业。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [purpose, app_key, app_secret]
              properties:
                purpose: { type: string, enum: [task_assistant, agent] }
                space_id: { type: string, format: uuid }
                agent_id: { type: string, format: uuid }
                runtime: { $ref: '#/components/schemas/FeishuAssistantRuntime' }
                extra_prompt: { type: string, maxLength: 4000 }
                app_key: { type: string, pattern: '^ding[A-Za-z0-9]{8,40}$' }
                app_secret: { type: string, minLength: 16, maxLength: 128 }
      responses:
        '201':
          description: 新建的机器人
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeishuBot' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '405': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/integrations/{imProvider}/registrations:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/IMProvider'
    post:
      operationId: startFeishuRegistration
      summary: 发起扫码创建飞书应用（任务助手或 Agent 机器人）
      description: |
        用飞书「一键创建智能体应用」的设备码流程（RFC 8628，accounts 域名下 /oauth/v1/app/registration）：返回 verification_url，
        前端渲染为二维码并提供「打开链接」。用户在飞书确认后，中心后台轮询拿到新应用的 App ID / Secret（加密保存），建立组织级飞书连接与机器人，
        并交给长连接管理器连接。链接 10 分钟内有效、只能用一次。
        - purpose = task_assistant：space_id 与 runtime 必填，只有能管理该空间的人；该空间已有任务助手 409 FEISHU_ASSISTANT_EXISTS。
          成功后为该空间创建内置任务助手 Agent（共享、不出现在目录），指令 = 内置提示词 + extra_prompt。
        - purpose = agent：agent_id 必填；组织所有者 / 管理员可绑定任意 Agent，其他成员只能绑定自己是所有者的 Agent；
          内置 Agent 不能绑定（400）；已经连接飞书 409 FEISHU_AGENT_CONNECTED。
        同一目标已有等待中的扫码会话时，旧会话改为 CANCELLED。飞书不可达 502 FEISHU_UNAVAILABLE。
        本组织需要先绑定飞书应用（6d-1，用于成员的飞书账号绑定），否则 409 FEISHU_APP_NOT_CONNECTED。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [purpose]
              properties:
                purpose: { type: string, enum: [task_assistant, agent] }
                space_id: { type: string, format: uuid }
                agent_id: { type: string, format: uuid }
                runtime: { $ref: '#/components/schemas/FeishuAssistantRuntime' }
                extra_prompt: { type: string, maxLength: 4000 }
      responses:
        '201':
          description: 扫码会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeishuRegistration' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/integrations/{imProvider}/registrations/{registrationID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/IMProvider'
      - { name: registrationID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getFeishuRegistration
      summary: 扫码会话状态（只有发起人可读；前端每 2 秒轮询）
      responses:
        '200':
          description: 扫码会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeishuRegistration' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/integrations/{imProvider}/registrations/{registrationID}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/IMProvider'
      - { name: registrationID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: cancelFeishuRegistration
      summary: 取消扫码会话（只有发起人；已结束时幂等返回当前状态）
      responses:
        '200':
          description: 扫码会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeishuRegistration' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/integrations/{imProvider}/bots/{botID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/IMProvider'
      - { name: botID, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateFeishuBot
      summary: 编辑任务助手（更换 Runtime、修改附加提示词）
      description: 只适用于任务助手，只有能管理该空间的人；Agent 机器人 400。版本不符 409 VERSION_CONFLICT。修改后为内置 Agent 追加配置版本。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties:
                runtime: { $ref: '#/components/schemas/FeishuAssistantRuntime' }
                extra_prompt: { type: string, maxLength: 4000 }
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 机器人
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeishuBot' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/integrations/{imProvider}/bots/{botID}/remove:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/IMProvider'
      - { name: botID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: removeFeishuBot
      summary: 移除任务助手 / 断开 Agent 机器人
      description: |
        任务助手：能管理该空间的人；Agent：组织所有者 / 管理员或 Agent 所有者。停止长连接、连接改为 DISCONNECTED、待发回复 SKIPPED；
        任务助手的内置 Agent 归档。已有的 OpenFox 会话与任务保留。飞书上的应用不会被删除（需要时在飞书开放平台删除）。版本不符 409。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        '204': { description: 已移除 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/integrations/{imProvider}/bots/{botID}/retry:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - $ref: '#/components/parameters/IMProvider'
      - { name: botID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: retryFeishuBot
      summary: 连接失败后重试（重新校验凭证并重建长连接）
      description: 权限同移除。校验规则与 verifyFeishuApp 相同：失败 422 / 502，成功后状态改为 CONNECTING。
      responses:
        '200':
          description: 机器人
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeishuBot' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/integrations/wecom/bots:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listWeComBots
      summary: 企业微信任务助手与 Agent 机器人
      description: 所有非访客成员可读；机器人 id 是 OpenFox UUID，app_id 是企业微信 BotID。
      responses:
        '200':
          description: 机器人列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeishuBotsView' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createWeComBot
      summary: 用 BotID 和 Secret 连接企业微信智能机器人
      description: |
        先验证成员、目标和 Runtime，再通过官方 WebSocket 订阅校验 BotID 与 Secret；校验成功后加密保存 Secret 并建立长连接。
        失败时不保存凭据。每个 BotID 只能被一个未移除的 OpenFox 机器人使用；跨组织冲突返回 409。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WeComBotInput' }
      responses:
        '201':
          description: 新建机器人
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeishuBot' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/integrations/wecom/bots/{botID}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: botID, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateWeComBot
      summary: 编辑企业微信任务助手配置
      description: 仅空间管理员、组织管理员或所有者可编辑任务助手。版本不符返回 409；Agent 机器人返回 400。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
                runtime: { $ref: '#/components/schemas/FeishuAssistantRuntime' }
                extra_prompt: { type: string, maxLength: 4000 }
      responses:
        '200':
          description: 机器人
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeishuBot' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/integrations/wecom/bots/{botID}/remove:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: botID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: removeWeComBot
      summary: 移除企业微信机器人
      description: 停止长连接，解绑成员并跳过待发回复和通知；保留 OpenFox 会话与任务。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        '204': { description: 已移除 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/organizations/{organizationID}/integrations/wecom/bots/{botID}/retry:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - { name: botID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: retryWeComBot
