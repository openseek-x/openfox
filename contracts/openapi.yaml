  /v1/integrations/github/callback:
    get:
      operationId: gitHubOAuthCallback
      summary: Git 服务商 OAuth 回调（浏览器跳转，不返回 JSON）
      description: |
        GitLab / 极狐的 OAuth 应用回调地址为 {OPENFOX_SERVER_PUBLIC_URL}/api/v1/integrations/{gitlab|gitlab_cn}/callback；
        state 只能在它所属服务商的回调路径上使用（否则 invalid_state）。
        以下为 GitHub 的原有说明：
        GitHub OAuth App 的 Authorization callback URL 必须配置为 {OPENFOX_SERVER_PUBLIC_URL}/api/v1/integrations/github/callback。
        需要登录会话，且会话用户必须是发起授权的成员。校验 state（未过期、未使用）后用 code + PKCE 换取访问令牌，读取 /user 与 /user/orgs：
        organization → 会话进入 SELECTING（令牌加密暂存，等管理员勾选）；personal → 直接建立个人连接；reauthorize → 更新该连接的令牌并恢复 ACTIVE。
        处理完成后 302 到 {PUBLIC_URL}/integrations/oauth/complete?provider=github&session=<id>&status=ok|error&reason=<code>；
        state 无效或会话用户不符时 reason = invalid_state，GitHub 拒绝授权时 reason = access_denied，换取令牌失败时 reason = exchange_failed。
      parameters:
        - { name: code, in: query, required: false, schema: { type: string, maxLength: 512 } }
        - { name: state, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: error, in: query, required: false, schema: { type: string, maxLength: 128 } }
      responses:
        '302': { description: 重定向到前端完成页 }
