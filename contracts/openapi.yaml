        agent_kind 只对 Agent 输出；members 只对小队输出；archived_at 为空时不输出。
        runtime / model / computer_name 对小队为 null；leader 对 Agent 为 null；小队的 online = 任一可见 Agent 成员在线。
      required: [type, id, space_id, space_name, name, description, visibility, owner_user_id, owner_email,
        pinned, mine, version, created_at, title, avatar, favorite, online, runtime, model, computer_name, leader, member_count,
        allow_assign, allow_direct_chat]
      properties:
        type: { type: string, enum: [agent, crew] }
        id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        space_name: { type: string }
        name: { type: string }
        title: { type: string }
        avatar: { $ref: '#/components/schemas/AgentAvatar' }
        description: { type: string }
        agent_kind: { $ref: '#/components/schemas/AgentKind' }
        visibility: { $ref: '#/components/schemas/AgentVisibility' }
        owner_user_id: { type: string, format: uuid }
        owner_email: { type: string }
        runtime: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        computer_name: { type: [string, 'null'] }
        online: { type: boolean }
        pinned: { type: boolean }
        favorite: { type: boolean }
        mine: { type: boolean }
        leader:
          oneOf:
            - { $ref: '#/components/schemas/AgentLeader' }
            - { type: 'null' }
        member_count: { type: integer, minimum: 0, description: 小队的可见 Agent 成员数 + 真人成员数；Agent 为 0 }
        allow_assign: { type: [boolean, 'null'], description: 仅 Agent；小队为 null }
        allow_direct_chat: { type: [boolean, 'null'], description: 仅 Agent；小队为 null }
        members:
          type: array
          items: { $ref: '#/components/schemas/AgentDirectoryMember' }
        archived_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
    AgentDirectory:
      type: object
      required: [entries, archived_count, truncated]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/AgentDirectoryEntry' }
        archived_count: { type: integer, minimum: 0 }
        truncated: { type: boolean }
    CrewMember:
      type: object
      required: [kind, id, name, title, exclusive, active_tasks, online]
      properties:
        kind: { type: string, enum: [AGENT, HUMAN] }
        id: { type: string, format: uuid, description: Agent ID 或用户 ID }
        name: { type: string, description: 真人成员为邮箱 }
        title: { type: [string, 'null'], description: 真人成员为 null }
        exclusive: { type: boolean, description: 专属成员（真人恒为 false） }
        active_tasks: { type: array, maxItems: 3, items: { type: string }, description: 进行中任务的 display_id（Agent = 有活跃运行的任务；真人 = 本空间分配给他的进行中任务） }
        online: { type: [boolean, 'null'], description: 真人成员为 null }
    Crew:
      type: object
      description: 小队。members 先 Agent（队长第一，按 position）后真人；只含当前成员可见、未归档的 Agent。
      required: [type, id, space_id, space_name, name, description, visibility, owner_user_id, owner_email, leader,
        instructions, shared_task_dir, members, member_count, running_task_count, pinned, favorite, mine,
        archived_at, version, created_at, updated_at]
      properties:
        type: { type: string, enum: [crew] }
        id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        space_name: { type: string }
        name: { type: string }
        description: { type: string }
        visibility: { $ref: '#/components/schemas/AgentVisibility' }
        owner_user_id: { type: string, format: uuid }
        owner_email: { type: string }
        leader:
          description: leader_agent_id 为空的旧小队取 position 最小的 Agent；没有可见 Agent 时为 null
          oneOf:
            - { $ref: '#/components/schemas/AgentLeader' }
            - { type: 'null' }
        instructions: { type: string }
        shared_task_dir: { type: boolean }
        members:
          type: array
          items: { $ref: '#/components/schemas/CrewMember' }
        member_count: { type: integer, minimum: 0 }
        running_task_count: { type: integer, minimum: 0, description: 成员 Agent 有活跃运行的任务数（去重） }
        pinned: { type: boolean }
        favorite: { type: boolean }
        mine: { type: boolean }
        archived_at: { type: [string, 'null'], format: date-time }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CrewCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 255 }
        description: { type: string, maxLength: 10000 }
        visibility: { $ref: '#/components/schemas/AgentVisibility' }
        leader_agent_id: { type: string, format: uuid, description: '新前端必填；缺省时取 agent_ids[0]' }
        agent_ids: { type: array, maxItems: 32, items: { type: string, format: uuid } }
        user_ids: { type: array, maxItems: 31, items: { type: string, format: uuid } }
    CrewPatch:
      type: object
      required: [version]
      properties:
        name: { type: string, maxLength: 255 }
        description: { type: string, maxLength: 10000 }
        visibility: { $ref: '#/components/schemas/AgentVisibility' }
        space_id: { type: string, format: uuid }
        owner_user_id: { type: string, format: uuid }
        instructions: { type: string, maxLength: 100000 }
        shared_task_dir: { type: boolean }
        leader_agent_id: { type: string, format: uuid }
        archived: { type: boolean }
        version: { type: integer, minimum: 1 }
    CrewMembersRequest:
      type: object
      properties:
        agent_ids: { type: array, maxItems: 32, items: { type: string, format: uuid } }
        user_ids: { type: array, maxItems: 32, items: { type: string, format: uuid } }
    ContactItem:
      type: object
      required: [kind, id, name, title, description, email, avatar, online, space_id, owner, runtime, allow_assign, allow_direct_chat, created_by_me]
      properties:
        kind: { type: string, enum: [agent, crew, user] }
        id: { type: string, format: uuid }
        name: { type: string, description: 真人为邮箱 }
        title: { type: [string, 'null'] }
        description: { type: string, description: Agent / 小队的说明；真人为空串 }
        email: { type: [string, 'null'], description: 仅真人 }
        avatar: { $ref: '#/components/schemas/AgentAvatar' }
        online: { type: [boolean, 'null'], description: Agent = 电脑在线；小队 = 任一可见成员在线；真人为 null }
        space_id: { type: [string, 'null'], format: uuid }
        owner:
          oneOf:
            - type: object
              required: [id, email]
              properties:
                id: { type: string, format: uuid }
                email: { type: string }
            - { type: 'null' }
        runtime: { type: [string, 'null'] }
        allow_assign: { type: [boolean, 'null'], description: 仅 Agent }
        allow_direct_chat: { type: [boolean, 'null'], description: 仅 Agent }
        created_by_me: { type: boolean, description: Agent / 小队的所有者是我；真人 = 是我本人 }
    ContactGroup:
      type: object
      required: [kind, space_id, space_name, items]
      properties:
        kind: { type: string, enum: [SPACE, UNASSIGNED, HUMANS] }
        space_id: { type: [string, 'null'], format: uuid }
        space_name: { type: [string, 'null'] }
        items:
          type: array
          items: { $ref: '#/components/schemas/ContactItem' }
    Contacts:
      type: object
      required: [groups, truncated]
      properties:
        groups:
          type: array
          items: { $ref: '#/components/schemas/ContactGroup' }
        truncated: { type: boolean }
    AssistantSession:
      type: object
      description: archived_at 为空时不输出
      required: [id, space_id, agent_id, title, lifecycle, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid }
        title: { type: string }
        lifecycle: { type: string }
        version: { type: integer, minimum: 1 }
        archived_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AssistantProposalConfirmRequest:
      type: object
      description: 用户在草稿卡上编辑后的字段；按草稿 action 取用（create_agent / create_task）
      properties:
        space_id: { type: string, format: uuid }
        description: { type: string }
        name: { type: string }
        instructions: { type: string }
        computer_id: { type: string, format: uuid }
        grant_id: { type: string, format: uuid }
        runtime: { type: string }
        model: { type: string }
        visibility: { $ref: '#/components/schemas/AgentVisibility' }
        title: { type: string }
        assignee_user_id: { type: string, format: uuid }
        start_working: { type: boolean, description: 创建任务时是否立即启动所选 Agent；未传时保留原有的指派启动行为。 }
        executor_agent_id: { type: string, format: uuid }
    Invitation:
      type: object
      description: consumed_at 为空时不输出
      required: [id, organization_id, email, role, status, issued_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: '#/components/schemas/OrganizationRole' }
        status: { type: string, enum: [PENDING, ACCEPTED, REVOKED, EXPIRED] }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        consumed_at: { type: string, format: date-time }
        space_ids: { type: array, items: { type: string, format: uuid }, description: 接受后加入的空间 }
        delivery_status: { type: string, enum: [PENDING, SENT, FAILED], description: 邀请邮件发送状态；没有配置 SMTP 时为 FAILED }
        last_sent_at: { type: [string, 'null'], format: date-time }
    # ===== /Agent 与小队 schemas =====

    # ===== 电脑与事件 schemas =====
    DeviceGrantScope:
      type: string
      enum: [PERSONAL, SPACE, ORGANIZATION]
    DeviceRuntimeModel:
      type: object
      required: [id, display_name, is_default]
      properties:
        id: { type: string }
        display_name: { type: string }
        is_default: { type: boolean }
        default_reasoning_effort:
          description: Runtime 明确报告的模型默认深度；仅在该模型的支持列表内才返回，缺省或未知时省略。仅用于显示标记，不改变 DEFAULT 的执行语义。
          $ref: '#/components/schemas/ReasoningEffort'
        reasoning_efforts:
          type: array
          description: 此模型经 Runtime 明确报告的思考档位；缺省时只允许 DEFAULT
          items: { $ref: '#/components/schemas/ReasoningEffort' }
    DeviceRuntime:
      type: object
      description: 从心跳 capabilities.runtimes 解析出的 Runtime：codex、claude-code、opencode、pi（未安装的不上报）
      required: [provider, version, status, runnable, reason, login_status, models, approval_modes]
      properties:
        provider: { type: string, description: 'Runtime 名称：codex、claude-code、opencode、pi' }
        version: { type: [string, 'null'] }
        status:
          type: string
          enum: [READY, NEEDS_LOGIN, UNAVAILABLE]
          description: READY = 可运行；NEEDS_LOGIN = 未登录；UNAVAILABLE = 其他不可运行原因（见 reason）
        runnable: { type: boolean }
        reason: { type: [string, 'null'] }
        login_status: { type: [string, 'null'], description: LOGGED_IN / LOGGED_OUT / UNKNOWN }
        models:
          type: array
          items: { $ref: '#/components/schemas/DeviceRuntimeModel' }
        approval_modes:
          type: array
          description: 该 Runtime 适配器支持的权限档位；一定包含 FOLLOW_RUNTIME，旧版后台服务没有上报时只有它
          items: { $ref: '#/components/schemas/ApprovalMode' }
        reasoning_efforts:
          type: array
          description: 该 Runtime 适配器支持的思考深度；一定包含 DEFAULT，旧版后台服务没有上报时只有它
          items: { $ref: '#/components/schemas/ReasoningEffort' }
        collaboration_modes:
          type: array
          description: |
            该 Runtime 适配器真正实现了的协作模式（心跳 runtimes.<provider>.collaboration_modes）；一定包含 FOLLOW_RUNTIME，
            旧版后台服务没有上报时只有它。服务端总是返回；客户端遇到缺省时按只有 FOLLOW_RUNTIME 处理。
          items: { $ref: '#/components/schemas/CollaborationMode' }
    Device:
      type: object
      required: [id, grant_id, owner_user_id, owner_email, name, install_id, status, grant_status, online,
                 generation, max_slots, reserved_slots, last_seen_at, protocol_major, protocol_minor,
                 daemon_version, operating_system, architecture, capabilities, center_epoch, version,
                 settings_version, grant_scope, grant_user_id, grant_space_id, grant_space_name,
                 permission_version, runtimes, agent_count, active_agent_count, running_tasks,
                 storage, runtimes_checked_at]
      properties:
        id: { type: string, format: uuid }
        grant_id: { type: string, format: uuid }
        owner_user_id: { type: [string, 'null'], format: uuid }
        owner_email: { type: [string, 'null'] }
        name: { type: string }
        install_id: { type: [string, 'null'] }
        status: { type: string, enum: [ACTIVE, REVOKED, OFFLINE], description: 电脑生命周期状态（不是在线状态，在线看 online） }
        grant_status: { type: string, enum: [ACTIVE, REVOKED, EXPIRED] }
        online: { type: boolean }
        generation: { type: integer }
        max_slots: { type: integer, description: 并发上限 }
        reserved_slots: { type: integer, description: 当前已占用的并发 }
        last_seen_at: { type: [string, 'null'], format: date-time }
        protocol_major: { type: integer }
        protocol_minor: { type: integer }
        daemon_version: { type: string }
        operating_system: { type: string }
        architecture: { type: string }
        capabilities: { type: object, additionalProperties: true, description: 心跳上报的原始能力 JSON }
        center_epoch: { type: integer }
        version: { type: integer, description: 电脑记录版本（心跳会递增；密钥轮换用） }
        settings_version: { type: integer, minimum: 1, description: 名称与并发上限的乐观锁版本（PATCH 用） }
        grant_scope: { $ref: '#/components/schemas/DeviceGrantScope' }
        grant_user_id: { type: [string, 'null'], format: uuid }
        grant_space_id: { type: [string, 'null'], format: uuid }
        grant_space_name: { type: [string, 'null'] }
        permission_version: { type: integer, description: 授权版本（修改可见范围用） }
        runtimes:
          type: array
          items: { $ref: '#/components/schemas/DeviceRuntime' }
        agent_count: { type: integer, description: 本组织绑定这台电脑的未归档 Agent 数 }
        active_agent_count: { type: integer, description: 其中有活跃 Run（排队、准备、运行、取消中）的 Agent 数 }
        running_tasks: { type: integer, description: 本组织在这台电脑上活跃 Run 关联的不同任务数 }
        storage:
          description: 心跳 capabilities.storage 解析结果；未上报或格式不符为 null
          oneOf:
            - $ref: '#/components/schemas/DeviceStorage'
            - type: 'null'
        runtimes_checked_at:
          type: [string, 'null']
          format: date-time
          description: capabilities.runtimes 中各 Runtime checked_at 的最大值；未上报为 null
    DeviceBoundAgent:
      type: object
      required: [id, name, title, space_id, online, owner_email, visibility]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        title: { type: [string, 'null'] }
        space_id: { type: string, format: uuid }
        online: { type: boolean, description: 同电脑 online }
        owner_email: { type: [string, 'null'] }
        visibility: { type: string, enum: [PRIVATE, SHARED] }
    DeviceDetail:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          required: [bound_agents, created_at, timezone]
          properties:
            bound_agents:
              type: array
              description: 本组织绑定这台电脑的未归档 Agent（最多 200 个；私有 Agent 只对所有者列出）
              items: { $ref: '#/components/schemas/DeviceBoundAgent' }
            created_at: { type: string, format: date-time }
            timezone: { type: [string, 'null'], description: 心跳 capabilities.timezone，未上报为 null }
    DeviceUpdateRequest:
      type: object
      required: [settings_version]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        max_slots: { type: integer, minimum: 1, maximum: 256 }
        settings_version: { type: integer, minimum: 1 }
    DeviceRemovalBlockers:
      type: object
      required: [agents, count]
      properties:
        agents:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
        count: { type: integer, description: 阻断的 Agent 总数（可能大于 agents 长度） }
    DeviceRemovalResult:
      type: object
      required: [archived_agents, canceled_runs, affected_tasks]
      properties:
        archived_agents: { type: integer }
        canceled_runs: { type: integer, description: 直接结束与请求取消的 Run 总数 }
        affected_tasks: { type: integer, description: 被取消 Run 关联的不同任务数 }
    DeviceReplacementResult:
      type: object
      required: [device_id, replaced_device_id, moved_agents, canceled_runs]
      properties:
        device_id: { type: string, format: uuid, description: 替换后的新电脑记录 }
        replaced_device_id: { type: string, format: uuid }
        moved_agents: { type: integer, description: 迁到新记录的 Agent 数（含内置小助手） }
        canceled_runs: { type: integer, description: 被取消的 Run 总数 }
    RunStreamEvent:
      type: object
      description: event = run.event 的 data
      required: [id, organization_id, run_id, generation, sequence, stream_seq, type, safe_payload, occurred_at, received_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        generation: { type: integer }
        sequence: { type: integer }
        stream_seq: { type: integer }
        type: { type: string }
        safe_payload: { type: object, additionalProperties: true }
        occurred_at: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
    OrganizationEventType:
      type: string
      enum: [direct_chat.changed, task.changed, inbox.changed, run.state, conversation.updated, conversation.message, space.changed, iteration.changed, project.changed, view.changed, triage.changed, organization.changed, member.changed, automation.changed, doc.changed, skill.changed, run.artifact]
    OrganizationEvent:
      type: object
      description: |
        组织事件的 data。payload 按类型：
        task.changed = {task_ids (至多 100 个), count}；inbox.changed = {count}；
        run.state = {state, wait_reason, failure_code, task_id}；conversation.updated = {lifecycle, handoff}；
        conversation.message = {seq, author_kind, kind}；space.changed = {status, deleted}（id = space_id = 空间 ID，version = 空间版本）；iteration.changed = {iteration_ids (至多 100 个), count}（entity = iteration，space_id 为所属空间）；project.changed = {deleted}（entity = project，space_id 为 null）；view.changed = {deleted}（entity = view，space_id 为所属空间；只带 id）；triage.changed = {deleted}（entity = space，space_id 为所属空间）。organization.changed = {}（entity = organization，version = 组织设置版本）；member.changed = {}（成员或邀请变化）；automation.changed = {}（entity = automation，space_id 为所属空间）；doc.changed = {}（entity = doc，space_id 为所属空间；我的文档的变化只发给本人）。run.artifact = {run_id}（entity = artifact，id = 产物 ID，space_id / conversation_id 为 Run 所属空间与会话；Agent 发布产物后发出）。
      required: [type, entity, id, version, space_id, conversation_id, payload, created_at]
      properties:
        type: { $ref: '#/components/schemas/OrganizationEventType' }
        entity: { type: string, description: task / notification / run / conversation / message }
        id: { type: [string, 'null'], format: uuid, description: 实体 ID（task.changed、inbox.changed 为 null） }
        version: { type: [integer, 'null'], description: 实体版本（有则可用于丢弃过期更新） }
        space_id: { type: [string, 'null'], format: uuid, description: 事件所属空间（task.changed、run.state、conversation.* 有值） }
        conversation_id: { type: [string, 'null'], format: uuid, description: 事件所属对话（run.state、conversation.* 有值） }
        payload: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    # ===== /电脑与事件 schemas =====

    # ===== 对话与执行 schemas =====
    # --- 执行（Run / Step，BE-exec） ---
    RunState:
      type: string
      enum: [QUEUED, PREPARING, RUNNING, CANCEL_REQUESTED, SUCCEEDED, FAILED, CANCELED]
    RunFailureCode:
      type: string
      description: 空串表示无失败码
      enum: ['', CREDENTIAL_REJECTED, QUOTA_EXHAUSTED, RATE_LIMITED, PROVIDER_OVERLOADED, MODEL_NOT_FOUND,
        CONTEXT_TOO_LARGE, IMAGE_TOO_LARGE, NETWORK_UNREACHABLE, WORKTREE_PREP_FAILED, REPO_UNAVAILABLE,
        RUNTIME_UNAVAILABLE, QUEUE_TIMEOUT, RUN_TIMEOUT, AUTHORIZATION_REVOKED, UNKNOWN_PROCESS, PREPARE_FAILED, INTERNAL]
    RunUsage:
      type: object
      description: 一次 Run 的 token 用量（Runtime 报告的整轮累计值）；旧 daemon 不上报时整体为 null
      required: [input, cached_input, cache_write_input, output, reasoning_output]
      properties:
        input: { type: integer, minimum: 0 }
        cached_input: { type: integer, minimum: 0, description: input 中命中缓存的部分 }
        cache_write_input: { type: integer, minimum: 0 }
        output: { type: integer, minimum: 0 }
        reasoning_output: { type: integer, minimum: 0, description: output 中推理部分 }
    RunResponse:
      type: object
      description: Run 详情（GET /runs/{run}、对话的 Run 列表、取消接口回显）
      required: [id, organization_id, space_id, conversation_id, agent_id, computer_id, grant_id, config_version,
        grant_version, actor_id, state, generation, reconciliation_required, reason, version, created_at, updated_at,
        failure_code, started_at, usage, duration_ms]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        task_id: { type: string, format: uuid, description: 无任务时省略 }
        agent_id: { type: string, format: uuid }
        computer_id: { type: string, format: uuid }
        grant_id: { type: string, format: uuid }
        config_version: { type: integer }
        grant_version: { type: integer }
        actor_id: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/RunState' }
        generation: { type: integer }
        reconciliation_required: { type: boolean }
        retry_of: { type: string, format: uuid }
        reason: { type: string }
        wait_reason: { type: string, description: "排队原因；非排队时省略。包含 AGENT_CHAT_CONCURRENCY（会话 Run 等待 Agent 聊天并发名额）；也包含 RUNTIME_UNAVAILABLE（电脑在线，但选定的 Runtime 在最近一次心跳里不存在或不可运行）" }
        reservation_id: { type: string, format: uuid }
        offer_id: { type: string, format: uuid }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        cancel_requested_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        failure_code: { $ref: '#/components/schemas/RunFailureCode' }
        started_at: { type: [string, 'null'], format: date-time, description: 设备取得启动许可（进入 RUNNING）的时刻 }
        usage:
          description: 结果里的 token 用量；没有结果或未上报时为 null
          oneOf:
            - { $ref: '#/components/schemas/RunUsage' }
            - { type: 'null' }
        duration_ms: { type: [integer, 'null'], minimum: 0, description: started_at → finished_at；任一为空时为 null }
    RunResult:
      type: object
      description: GET /runs/{run}/result
      required: [id, organization_id, run_id, generation, status, summary, output, checks, unverified, artifact_ids,
        payload_hash, created_at, usage]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        generation: { type: integer }
        status: { type: string, enum: [SUCCEEDED, FAILED, CANCELED, TIMED_OUT] }
        summary: { type: string }
        output: { type: string }
        checks: { type: array, items: {} }
        unverified: { type: boolean }
        artifact_ids: { type: array, items: { type: string, format: uuid } }
        branch_ref: { type: string }
        payload_hash: { type: string }
        created_at: { type: string, format: date-time }
        usage:
          oneOf:
            - { $ref: '#/components/schemas/RunUsage' }
            - { type: 'null' }
    RunArtifact:
      type: object
      required: [organization_id, id, run_id, name, size_bytes, sha256, mime_type, state, pinned, version, created_at]
      properties:
        organization_id: { type: string, format: uuid }
        id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        result_id: { type: string, format: uuid }
        name: { type: string }
        size_bytes: { type: integer, minimum: 0 }
        sha256: { type: string }
        mime_type: { type: string }
        state: { type: string, description: AVAILABLE 可下载；DELETING / DELETED / MISSING 表示已清理或丢失（前端显示「产物已失效」） }
        retention_until: { type: string, format: date-time }
        pinned: { type: boolean }
        version: { type: integer }
        created_at: { type: string, format: date-time }
    RunEventPage:
      type: object
      description: GET /runs/{run}/events；按 stream_seq 升序，next_cursor 为 0 / 省略表示没有更多
      required: [events]
      properties:
        events: { type: array, items: { $ref: '#/components/schemas/RunStreamEvent' } }
        next_cursor: { type: integer, minimum: 0 }
    RunEventType:
      type: string
      description: |
        Run 事件类型（RunStreamEvent.type）。设备上报：started / output / tool / warning / failed / completed / cancelled / unknown /
        step（执行步骤 v1）；中心生成：run.result。旧类型保持不变并继续上报，前端需同时兼容。
      enum: [started, output, tool, warning, failed, completed, cancelled, unknown, step, run.result]
    RunEventPayload:
      type: object
      description: RunStreamEvent.safe_payload 的结构。type = step 时 data 为 StepEventData。单条 ≤ 64 KiB。
      properties:
        text: { type: string, maxLength: 8192 }
        data: { type: object, additionalProperties: true }
    StepEventData:
      type: object
      description: type = step 的事件的 safe_payload.data
      required: [schema, step]
      properties:
        schema: { type: integer, enum: [1] }
        step: { $ref: '#/components/schemas/Step' }
    StepKind:
      type: string
      enum: [prep_env, thinking, agent_text, exec, patch, write_file, read, search, web_search, web_fetch, todo, step_group, turn_end]
    StepState:
      type: string
      enum: [running, done, failed, interrupted, denied]
    Step:
      type: object
      description: |
        执行步骤（schema v1）。同一步骤多次上报使用同一 id，前端按 (generation, sequence) 顺序合并：
        后到的事件覆盖先到的同名字段；`append` / `output_append` 是增量，追加到 `text` / `output` 末尾；
        携带 `text` / `output` 的事件给出完整值（替换已累积的内容）。终态事件（state ≠ running）带完整字段。
        各 kind 只使用下列专有字段，其余字段省略：
        - prep_env（固定 id `prep`）：substeps、progress
        - thinking / agent_text：text、append
        - exec：command、cwd、output_append、output、truncated、exit_code、terminated_before_output
        - patch：files
        - write_file：path、content、truncated、applied、diff_available
        - read：path、line_start、line_end
        - search：query、scope、results、total_files
        - web_search：query、results（StepWebResult）
        - web_fetch：url
        - todo（同一回合固定 id `plan`）：items、explanation
        - step_group：title
        - turn_end（固定 id `turn_end`）：final_state、duration_ms
      required: [id, kind, state]
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        kind: { $ref: '#/components/schemas/StepKind' }
        state: { $ref: '#/components/schemas/StepState' }
        group_id: { type: string, maxLength: 64, description: 归属的 step_group }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        duration_ms: { type: integer, minimum: 0 }
        substeps: { type: array, items: { $ref: '#/components/schemas/StepPrepSubstep' } }
        progress: { type: number, minimum: 0, maximum: 1 }
        text: { type: string, description: thinking / agent_text 的完整（累积）文本 }
        append: { type: string, description: thinking / agent_text 的增量文本 }
        command: { type: string }
        cwd: { type: string }
        output_append: { type: string, maxLength: 8192, description: exec 输出增量（≤ 8 KiB / 条） }
        output: { type: string, description: exec 终态完整输出（截断到 32 KiB，见 truncated） }
        truncated: { type: boolean, description: output / content 被截断 }
        exit_code: { type: integer }
        terminated_before_output: { type: boolean, description: 命令在产生输出前就结束（被拒绝或中断） }
        files: { type: array, items: { $ref: '#/components/schemas/StepPatchFile' } }
        path: { type: string }
        content: { type: string, description: write_file 内容（≤ 24 KiB） }
        applied: { type: boolean }
        diff_available: { type: boolean }
        line_start: { type: integer, minimum: 1 }
        line_end: { type: integer, minimum: 1 }
        query: { type: string }
        scope: { type: string, description: search 的目录范围 }
        results:
          type: array
          description: search 时为 StepSearchResult（≤ 20），web_search 时为 StepWebResult（≤ 10）
          items:
            oneOf:
              - { $ref: '#/components/schemas/StepSearchResult' }
              - { $ref: '#/components/schemas/StepWebResult' }
        total_files: { type: integer, minimum: 0 }
        url: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/StepTodoItem' } }
        explanation: { type: string }
        title: { type: string }
        final_state: { type: string, enum: [done, failed, cancelled] }
    StepPrepSubstep:
      type: object
      required: [kind, state]
      properties:
        kind: { type: string, enum: [workdir, repo, runtime, session] }
        state: { $ref: '#/components/schemas/StepState' }
        label: { type: string }
    StepPatchFile:
      type: object
      required: [path, kind, additions, deletions, diff]
      properties:
        path: { type: string }
        kind: { type: string, enum: [add, delete, update] }
        move_path: { type: string, description: update 且重命名时的新路径 }
        additions: { type: integer, minimum: 0 }
        deletions: { type: integer, minimum: 0 }
        diff: { type: string, description: unified diff，单文件 ≤ 24 KiB }
        truncated: { type: boolean }
    StepSearchResult:
      type: object
      required: [file]
      properties:
        file: { type: string }
        matches: { type: integer, minimum: 0 }
    StepWebResult:
      type: object
      required: [url]
      properties:
        title: { type: string }
        url: { type: string }
    StepTodoItem:
      type: object
      required: [text, status]
      properties:
        text: { type: string }
        status: { type: string, enum: [pending, in_progress, completed] }
    RunEventInput:
      type: object
      description: 设备上报的一条事件；sequence 由设备在同一代次内从 1 起分配
      required: [id, generation, sequence, type, safe_payload]
      properties:
        id: { type: string, format: uuid }
        generation: { type: integer, minimum: 1 }
        sequence: { type: integer, minimum: 1, maximum: 1000000000 }
        type: { type: string, minLength: 1, maxLength: 64 }
        safe_payload: { $ref: '#/components/schemas/RunEventPayload' }
        occurred_at: { type: string, format: date-time, description: 省略时取接收时刻 }
    RunEventBatchResult:
      type: object
      required: [events, highest_contiguous, generation]
      properties:
        events: { type: array, items: { $ref: '#/components/schemas/RunStreamEvent' } }
        highest_contiguous: { type: integer, minimum: 0, description: 当前代次从 1 起连续已接受的最大序号 }
        generation: { type: integer }
    RunResultInput:
      type: object
      required: [id, generation, status]
      properties:
        id: { type: string, format: uuid }
        generation: { type: integer, minimum: 1 }
        status: { type: string, enum: [SUCCEEDED, FAILED, CANCELED, TIMED_OUT] }
        summary: { type: string, maxLength: 16384 }
        output: { type: string, maxLength: 262144 }
        checks: { type: array, items: {} }
        unverified: { type: boolean }
        artifact_ids: { type: array, items: { type: string, format: uuid } }
        branch_ref: { type: string, maxLength: 1024 }
        payload_hash: { type: string, description: 可选；与服务端规范化哈希不一致时 409 }
        usage: { $ref: '#/components/schemas/RunUsage' }
    # --- /执行（Run / Step，BE-exec） ---
    # --- 对话（Conversation / Message，BE-conv） ---
    ConversationWorkspaceSelection:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: { type: string, enum: [DIRECT, WORKTREE, REUSE, BASELINE] }
        directory: { type: string, maxLength: 1024, description: DIRECT / WORKTREE 传设备已登记且 Agent 已获准的逻辑根或子目录 }
        source_conversation_id: { type: string, format: uuid, description: REUSE / BASELINE 的同任务来源会话 }
        base_ref: { type: string, maxLength: 255, description: WORKTREE / BASELINE 的本地 Git 基线，省略时取默认基线 }
    DeviceWorkspaceBinding:
      type: object
      additionalProperties: false
      required: [mode, computer_id]
      description: 中心固定的目录与来源，仅向实际领取运行的已授权设备提供
      properties:
        mode: { type: string, enum: [DIRECT, WORKTREE, REUSE, BASELINE] }
        computer_id: { type: string, format: uuid }
        directory: { type: string, maxLength: 1024 }
        source_conversation_id: { type: string, format: uuid }
        source_agent_id: { type: string, format: uuid }
        source_directory: { type: string, maxLength: 1024 }
        base_ref: { type: string, maxLength: 255 }
    ConversationWorkspaceOptions:
      type: object
      required: [device_id, directories, supported, can_reuse, can_set_baseline, recent_directories, git_directories, can_manage_directory]
      properties:
        device_id: { type: string }
        directories: { type: array, items: { type: string } }
        supported: { type: boolean }
        can_reuse: { type: boolean }
        can_set_baseline: { type: boolean }
        git_directories: { type: array, items: { type: string } }
        can_manage_directory: { type: boolean }
        recent_directories: { type: array, maxItems: 10, items: { type: string } }
    AssistantDirectorySettings:
      type: object
      required: [device_id, version, directories, directory]
      properties:
        device_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        directories: { type: array, items: { type: string } }
        directory: { type: string, description: 小助手获准使用的默认逻辑根；空串为自动临时目录 }
    Conversation:
      type: object
      description: 会话基础字段（新建、完成、重新打开、交接的返回）
      required: [organization_id, id, space_id, agent_id, owner_user_id, visibility, lifecycle, handoff, origin, version,
        created_at, updated_at]
      properties:
        workspace_selection: { $ref: '#/components/schemas/ConversationWorkspaceSelection' }
        organization_id: { type: string, format: uuid }
        id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid }
        task_id: { type: string, format: uuid, description: 未绑定任务时省略 }
        crew_id: { type: string, format: uuid, description: 小队对话才有；agent_id 是创建时的队长，消息按 @ 分派给小队成员 }
        owner_user_id: { type: string, format: uuid }
        visibility: { type: string, enum: [PRIVATE, SHARED] }
        lifecycle: { type: string, enum: [OPEN, COMPLETED, ARCHIVED] }
        handoff: { type: string, enum: [NONE, WAITING_REPLY, WAITING_REVIEW] }
        origin: { type: string, enum: [USER, TASK_ASSIGNMENT], description: TASK_ASSIGNMENT = 任务指派给 Agent 时由服务端自动创建 }
        version: { type: integer, minimum: 1, description: 完成 / 重新打开 / 交接的乐观锁；发消息、绑定任务会递增，置顶 / 已读 / 重命名 / 归档不变 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ConversationStatus:
      type: string
      description: |
        派生状态，按优先级取第一个成立的：
        1. 活动 Run：QUEUED → QUEUED；PREPARING / RUNNING / CANCEL_REQUESTED → WORKING；
        2. lifecycle = COMPLETED → DONE；
        3. handoff = WAITING_REPLY → WAITING；WAITING_REVIEW → REVIEW；
        4. 最近一次 Run FAILED，且其 finished_at 之后没有新的用户消息 → ERROR；
        5. 最近一次 Run CANCELED → ABORTED；
        6. 其他 → IDLE。
      enum: [WORKING, QUEUED, WAITING, REVIEW, ERROR, DONE, ABORTED, IDLE]
    ConversationLastMessage:
      type: object
      required: [seq, author_kind, preview, created_at]
      properties:
        seq: { type: integer, minimum: 1 }
        author_kind: { type: string, enum: [USER, AGENT, SYSTEM] }
        preview: { type: string, maxLength: 120, description: 正文去首尾空白、连续空白折叠为一个空格后的前 120 个字符 }
        created_at: { type: string, format: date-time }
    ConversationRecentMessage:
      allOf:
        - $ref: '#/components/schemas/ConversationLastMessage'
        - type: object
          required: [author_name]
          properties:
            author_name: { type: string, description: 消息作者的 Agent 名称或用户邮箱 }
    ConversationAgent:
      type: object
      required: [id, name, title, avatar, online]
      properties:
        id: { type: string, format: uuid }
        space_id: { type: string, format: uuid, description: Agent 归属空间，小助手转让后可能与会话空间不同 }
        builtin_kind: { type: string, enum: [ASSISTANT] }
        name: { type: string }
        title: { type: string, description: 职位，可为空串 }
        avatar: { type: [object, 'null'], additionalProperties: true }
        online: { type: boolean, description: 配置电脑 ACTIVE、授权 ACTIVE 且 90 秒内有心跳 }
    ConversationTask:
      type: object
      required: [id, display_id, title]
      properties:
        id: { type: string, format: uuid }
        display_id: { type: string, description: 例如 WEB-12 }
        title: { type: string }
    ConversationRun:
      type: object
      description: 当前活动 Run；没有活动 Run 时为最近创建的一次 Run
      required: [id, state, wait_reason, started_at, finished_at]
      properties:
        id: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/RunState' }
        wait_reason: { type: string, description: "排队原因，非排队为空串。包含 AGENT_CHAT_CONCURRENCY（会话 Run 等待 Agent 聊天并发名额）；也包含 RUNTIME_UNAVAILABLE（电脑在线，但对话选择的 Runtime 在最近一次心跳里不存在或不可运行，Run 继续排队，直到可运行或排队超时）" }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
    TaskConversationStats:
      type: object
      description: 无额外筛选的任务会话首页返回。数量为可见的未归档会话数，用量计入可见会话归档前后的任务运行。Token 只累加已上报的结果。
      required: [conversation_count, run_count, reported_runs, input, output, cache_read, cache_write]
      properties:
        conversation_count: { type: integer, minimum: 0 }
        run_count: { type: integer, minimum: 0 }
        reported_runs: { type: integer, minimum: 0 }
        input: { type: integer, minimum: 0 }
        output: { type: integer, minimum: 0 }
        cache_read: { type: integer, minimum: 0 }
        cache_write: { type: integer, minimum: 0 }
    ConversationOfferPeer:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        unavailable_reason: { type: string, enum: [ASSISTANT_TRANSFER_NOT_READY], description: 非空时不能选择；提交和接受时仍重新校验 }
    ConversationOfferInput:
      type: object
      required: [kind, recipient_user_id]
      properties:
        kind: { type: string, enum: [INVITE, TRANSFER] }
        recipient_user_id: { type: string, format: uuid }
        note: { type: string, maxLength: 1000 }
        transfer_assignee: { type: boolean }
    PendingConversationOffer:
      type: object
      required: [id, space_id, conversation_id, kind, title, sender, note, transfer_assignee]
      properties:
        space_id: { type: string, format: uuid }
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        kind: { type: string, enum: [INVITE, TRANSFER] }
        title: { type: string }
        sender: { type: string }
        note: { type: string }
        transfer_assignee: { type: boolean }
        assistant: { type: boolean, description: 小助手转让，接受后改用接收人自己的小助手 }
    ConversationSummary:
      description: 导航用会话摘要（列表、详情、PATCH、绑定 / 转任务的返回）
      allOf:
        - $ref: '#/components/schemas/Conversation'
        - type: object
          required: [title, archived_at, pinned, last_read_seq, unread, last_message, agent, task, run, status,
            overrides, effective, agent_defaults]
          properties:
            offer_participant: { type: boolean, description: 是否为所有者或有发言权的参与者 }
            title: { type: [string, 'null'], maxLength: 200 }
            archived_at: { type: [string, 'null'], format: date-time }
            status_mark: { type: [string, 'null'], enum: [DONE, DISCARDED, null], description: 共享展示标识，独立于生命周期及运行状态。旧服务端可能省略。 }
            pinned: { type: boolean, description: 当前成员的个人置顶 }
            last_read_seq: { type: integer, minimum: 0, description: 当前成员的已读位置 }
            unread: { type: boolean, description: 存在 seq > last_read_seq 且作者不是当前成员的消息 }
            last_message:
              oneOf:
                - $ref: '#/components/schemas/ConversationLastMessage'
                - type: 'null'
            recent_messages:
              type: array
              maxItems: 2
              description: 最近两条 USER/AGENT TEXT 消息，按 seq 升序；没有正文时为空数组。旧服务器可能省略。
              items: { $ref: '#/components/schemas/ConversationRecentMessage' }
            agent: { $ref: '#/components/schemas/ConversationAgent' }
            task:
              description: 已绑定任务被删除时为 null（task_id 仍保留）
              oneOf:
                - $ref: '#/components/schemas/ConversationTask'
                - type: 'null'
            run:
              oneOf:
                - $ref: '#/components/schemas/ConversationRun'
                - type: 'null'
            status: { $ref: '#/components/schemas/ConversationStatus' }
            overrides: { $ref: '#/components/schemas/ConversationOverrides' }
            effective:
              description: 下一次运行会采用的值（Agent 配置叠加对话覆盖）；小队对话为 null
              oneOf:
                - $ref: '#/components/schemas/ConversationEffectiveConfig'
                - type: 'null'
            agent_defaults:
              description: |
                Agent 当前配置的值（不叠加覆盖），即「清除覆盖」后会恢复成的值。随摘要一并返回，前端不需要另外读取 Agent 配置
                （能聊天但没有配置读取权限的成员也能显示）；小队对话为 null。
              oneOf:
                - $ref: '#/components/schemas/ConversationEffectiveConfig'
                - type: 'null'
    ApprovalMode:
      type: string
      description: |
        权限模式：
        - FOLLOW_RUNTIME：跟随 Runtime，等于各适配器现有的写死行为（默认）；
        - READ_ONLY：只读，不能修改文件、不能执行会写入的命令；
        - WORKSPACE_WRITE：可修改工作目录内的文件；
        - FULL_ACCESS：完全访问（不受工作目录限制）。
        各 Runtime 的具体映射见 contracts/shared/runtime-adapter.md；设备按心跳 runtimes.<provider>.approval_modes 声明支持的档位，
        不支持的档位 Run 会失败，不会静默放宽。
      enum: [FOLLOW_RUNTIME, READ_ONLY, WORKSPACE_WRITE, FULL_ACCESS]
    CollaborationMode:
      type: string
      description: |
        Agent 协作模式：
        - FOLLOW_RUNTIME：跟随 Runtime，不向 Runtime 传任何协作模式参数，由 Runtime 自己的默认配置决定（默认）；
        - DEFAULT：默认模式，明确要求 Runtime 用普通的执行模式（对有「计划模式」概念的 Runtime，即不是计划模式）；
        - PLAN：计划模式，Runtime 只做计划、不改动工作区；比任何权限档位都严格，同时设置了权限档位时以 PLAN 为准。
        DEFAULT / FOLLOW_RUNTIME 不改变权限模式的映射（DEFAULT 不会放宽 READ_ONLY）。各 Runtime 的具体参数见
        contracts/shared/runtime-adapter.md；设备按心跳 runtimes.<provider>.collaboration_modes 声明支持的模式，
        不支持的模式 Run 会失败，不会被忽略。
      enum: [FOLLOW_RUNTIME, DEFAULT, PLAN]
    ReasoningEffort:
      type: string
      description: |
        模型思考深度：DEFAULT 使用模型和 Runtime 的默认深度；LOW / MEDIUM / HIGH / EXTRA_HIGH / MAX / ULTRA
        依次提高思考预算。设备按心跳 runtimes.<provider>.reasoning_efforts 声明支持的非默认档位，不支持的档位 Run 会失败。
      enum: [DEFAULT, LOW, MEDIUM, HIGH, EXTRA_HIGH, MAX, ULTRA]
    ConversationOverrides:
      type: object
      description: 对话上的覆盖设置；null 表示沿用 Agent 配置。version 是覆盖设置自己的乐观锁（与会话 version 独立，初始 0）
      required: [runtime, model, approval_mode, version]
      properties:
        runtime: { type: [string, 'null'], enum: [codex, claude-code, opencode, pi, null] }
        model: { type: [string, 'null'], minLength: 1, maxLength: 128 }
        approval_mode:
          oneOf:
            - $ref: '#/components/schemas/ApprovalMode'
            - type: 'null'
        reasoning_effort:
          oneOf:
            - $ref: '#/components/schemas/ReasoningEffort'
            - type: 'null'
        version: { type: integer, minimum: 0 }
    ConversationEffectiveConfig:
      type: object
      required: [runtime, model, approval_mode]
      properties:
        runtime: { type: string }
        model: { type: string }
        approval_mode: { $ref: '#/components/schemas/ApprovalMode' }
        reasoning_effort: { $ref: '#/components/schemas/ReasoningEffort' }
    ConversationOverrideOptions:
      type: object
      description: 对话输入框的可选项（来自 Agent 绑定电脑最近一次心跳）
      required: [computer_online, runtimes]
      properties:
        computer_online: { type: boolean }
        runtimes:
          type: array
          items:
            type: object
            required: [provider, runnable, models, approval_modes]
            properties:
              provider: { type: string, description: 'codex、claude-code、opencode、pi' }
              runnable: { type: boolean }
              models:
                type: array
                items: { $ref: '#/components/schemas/DeviceRuntimeModel' }
              approval_modes:
                type: array
                description: 一定包含 FOLLOW_RUNTIME；旧版后台服务只有它
                items: { $ref: '#/components/schemas/ApprovalMode' }
              reasoning_efforts:
                type: array
                description: 一定包含 DEFAULT；旧版后台服务只有 DEFAULT
                items: { $ref: '#/components/schemas/ReasoningEffort' }
    ConversationOverridesRequest:
      type: object
      description: 至少一个 runtime / model / approval_mode / reasoning_effort 字段；缺省 = 不改，null = 清除覆盖
      required: [expected_version]
      additionalProperties: false
      properties:
        runtime: { type: [string, 'null'], enum: [codex, claude-code, opencode, pi, null] }
        model: { type: [string, 'null'], minLength: 1, maxLength: 128 }
        approval_mode:
          oneOf:
            - $ref: '#/components/schemas/ApprovalMode'
            - type: 'null'
        reasoning_effort:
          oneOf:
            - $ref: '#/components/schemas/ReasoningEffort'
            - type: 'null'
        expected_version: { type: integer, minimum: 0, description: 当前 overrides.version；不一致 409 VERSION_CONFLICT }
    ConversationCreateRequest:
      type: object
      required: [space_id]
      description: agent_id 与 crew_id 二选一（都缺省 400）。
      properties:
        workspace_selection: { $ref: '#/components/schemas/ConversationWorkspaceSelection' }
        id: { type: string, format: uuid, description: 客户端生成；省略时服务端生成 }
        space_id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid, description: 他人的私有 Agent 404；不挂任务时 Agent 须允许单聊且不是小队专属成员，否则 403 }
        crew_id: { type: string, format: uuid, description: 创建小队对话（agent_id 缺省，传了必须等于队长）。小队不可见 / 已归档 404；没有可用成员 403；小队不在该空间 400。也可同时挂 task_id，任务校验与 Agent 会话相同（任务不存在 404、不在该空间 400） }
        task_id: { type: string, format: uuid }
        visibility: { type: string, enum: [PRIVATE, SHARED], default: PRIVATE }
    QuickReply:
      type: object
      description: 快捷回复
      required: [id, scope, owner_user_id, title, body, position, version, can_edit, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        scope: { type: string, enum: [PERSONAL, ORG] }
        owner_user_id: { type: string, format: uuid, description: 创建人 }
        title: { type: string, minLength: 1, maxLength: 40 }
        body: { type: string, minLength: 1, maxLength: 2000 }
        position: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1 }
        can_edit: { type: boolean, description: 当前成员能否编辑 / 删除 / 排序（个人级本人；组织级所有者与管理员） }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    QuickReplyList:
      type: object
      required: [personal, organization]
      properties:
        personal: { type: array, items: { $ref: '#/components/schemas/QuickReply' } }
        organization: { type: array, items: { $ref: '#/components/schemas/QuickReply' } }
    QuickReplyCreateRequest:
      type: object
      required: [scope, title, body]
      properties:
        id: { type: string, format: uuid, description: 客户端生成（重试幂等）；省略时服务端生成 }
        scope: { type: string, enum: [PERSONAL, ORG] }
        title: { type: string, minLength: 1, maxLength: 40 }
        body: { type: string, minLength: 1, maxLength: 2000 }
    QuickReplyUpdateRequest:
      type: object
      required: [version]
      description: title / body 至少一个
      properties:
        version: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 40 }
        body: { type: string, minLength: 1, maxLength: 2000 }
    QuickCommandVisibility:
      type: string
      enum: [PRIVATE, SHARED]
    QuickCommandTarget:
      type: object
      description: 快捷指令的目标（按当前成员视角）。不可用且原因是 NOT_VISIBLE 时 name 为空串、avatar 为 null
      required: [kind, id, name, avatar, available]
      properties:
        kind: { type: string, enum: [AGENT, CREW] }
        id: { type: string, format: uuid }
        name: { type: string }
        avatar: { $ref: '#/components/schemas/AgentAvatar' }
        available: { type: boolean }
        unavailable_reason:
          type: string
          enum: [ARCHIVED, OUTSIDE_SPACE, NOT_VISIBLE, INACTIVE, NO_MEMBERS]
          description: available = false 时才有。ARCHIVED 已归档；OUTSIDE_SPACE 已换到别的空间；NOT_VISIBLE 已不存在或是他人私有；INACTIVE Agent 不可用；NO_MEMBERS 小队没有可用成员
    QuickCommand:
      type: object
      description: 任务快捷指令
      required: [id, space_id, owner_user_id, visibility, name, icon_kind, icon, icon_url, agent_id, crew_id, target, prompt, position, version, can_edit, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        owner_user_id: { type: string, format: uuid, description: 创建人 }
        visibility: { $ref: '#/components/schemas/QuickCommandVisibility' }
        name: { type: string, minLength: 1, maxLength: 100 }
        icon_kind: { oneOf: [{ $ref: '#/components/schemas/ViewIconKind' }, { type: 'null' }], description: 为空时界面显示默认图标 }
        icon: { type: [string, 'null'], description: 内置图标名 / 表情 / 上传图标 ID }
        icon_url: { type: [string, 'null'], description: icon_kind = upload 时的图片地址 }
        agent_id: { type: [string, 'null'], format: uuid }
        crew_id: { type: [string, 'null'], format: uuid }
        target: { $ref: '#/components/schemas/QuickCommandTarget' }
        prompt: { type: string, maxLength: 4000, description: 可为空串（前端发送固定文案） }
        position: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1 }
        can_edit: { type: boolean, description: 当前成员能否编辑 / 删除 / 排序（私有本人；共享创建人与空间管理员；都要求能写空间） }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    QuickCommandList:
      type: object
      required: [private, shared]
      properties:
        private: { type: array, items: { $ref: '#/components/schemas/QuickCommand' } }
        shared: { type: array, items: { $ref: '#/components/schemas/QuickCommand' } }
    QuickCommandCreateRequest:
      type: object
      required: [visibility, name]
      description: agent_id 与 crew_id 恰好一个
      properties:
        id: { type: string, format: uuid, description: 客户端生成（重试幂等）；省略时服务端生成 }
        visibility: { $ref: '#/components/schemas/QuickCommandVisibility' }
        name: { type: string, minLength: 1, maxLength: 100 }
        icon_kind: { type: [string, 'null'], enum: [icon, emoji, upload, null], description: 省略或 null 表示没有图标 }
        icon: { type: string, description: icon_kind 非空时必填；upload 时是本组织上传图标的 ID }
        agent_id: { type: [string, 'null'], format: uuid }
        crew_id: { type: [string, 'null'], format: uuid }
        prompt: { type: string, maxLength: 4000, default: '' }
    QuickCommandUpdateRequest:
      type: object
      required: [version]
      description: 除 version 外至少一个字段。agent_id / crew_id 任一出现即替换目标（两者合起来恰好一个非空）
      properties:
        version: { type: integer, minimum: 1 }
        visibility: { $ref: '#/components/schemas/QuickCommandVisibility' }
        name: { type: string, minLength: 1, maxLength: 100 }
        icon_kind: { type: [string, 'null'], enum: [icon, emoji, upload, null], description: 出现即整体替换图标；null 清除图标 }
        icon: { type: string }
        agent_id: { type: [string, 'null'], format: uuid }
        crew_id: { type: [string, 'null'], format: uuid }
        prompt: { type: string, maxLength: 4000 }
    ConversationUpdateRequest:
      type: object
      description: 至少一个字段
      properties:
        title: { type: [string, 'null'], maxLength: 200, description: null 或空串清除标题 }
        archived: { type: boolean }
        status_mark: { type: string, enum: [DONE, DISCARDED, NONE], description: 仅所有者可设置开放会话的标识，NONE 清除。 }
    MessageMention:
      type: object
      description: user_id 与 agent_id 恰好一个；agent_id 只能是会话绑定的 Agent
      properties:
        user_id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid }
    Message:
      type: object
      required: [organization_id, id, conversation_id, seq, author_kind, body, created_at, kind, run_id]
      properties:
        organization_id: { type: string, format: uuid }
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        seq: { type: integer, minimum: 1 }
        author_kind: { type: string, enum: [USER, AGENT, SYSTEM] }
        author_user_id: { type: string, format: uuid }
        author_agent_id: { type: string, format: uuid }
        body: { type: string }
        client_message_id: { type: string }
        reply_to_id: { type: string, format: uuid }
        mentions:
          type: array
          items: { $ref: '#/components/schemas/MessageMention' }
        created_at: { type: string, format: date-time }
        assistant_action: { type: string, enum: [create_task, create_agent], description: 小助手消息所选操作。正文按用户输入原样显示。 }
        kind: { type: string, enum: [TEXT, ACTION_PROPOSAL, ACTION_EXECUTED] }
        payload: { type: object, additionalProperties: true, description: kind 不是 TEXT 时的草稿 / 执行结果 }
        run_id:
          type: [string, 'null']
          format: uuid
          description: |
            消息对应的 Run，只有消息列表计算（发消息的返回为 null）：
            - USER：该消息的执行输入被分配到的 Run（未触发 Run 或尚未派发时为 null）；
            - AGENT / SYSTEM（ACTION_EXECUTED 除外）：同会话中 finished_at 不晚于消息创建时间的最近一次终态 Run；
            - ACTION_EXECUTED：null。
        attachments:
          type: array
          description: 随消息发送的附件；消息列表与发消息都返回，没有则为空数组
          items: { $ref: '#/components/schemas/Attachment' }
    MessageCreateRequest:
      type: object
      required: [body, client_message_id]
      properties:
        id: { type: string, format: uuid }
        body: { type: string, maxLength: 65536, description: 不能为空；只带附件时可传空串，服务端写入"请查看附件。" }
        assistant_action: { type: string, enum: [create_task, create_agent], description: 仅本人的小助手会话支持。操作随消息保存，重试同一幂等键时须一致。 }
        client_message_id: { type: string, minLength: 1, maxLength: 256, description: 幂等键：同会话同 client_message_id 同内容返回原消息，不同内容 409 IDEMPOTENCY_CONFLICT }
        reply_to_id: { type: string, format: uuid }
        mentions:
          type: array
          maxItems: 32
          items: { $ref: '#/components/schemas/MessageMention' }
        attachment_ids:
          type: array
          maxItems: 10
          description: |
            随消息发送的对话附件（先用 uploadConversationAttachment 上传）。必须是本人在该会话上传、尚未发送的附件，
            否则 400；绑定后附件随消息显示，并作为输入下发给执行电脑。
          items: { type: string, format: uuid }
    # --- /对话（Conversation / Message，BE-conv） ---
    # ===== /对话与执行 schemas =====

    # ===== 连接电脑与 Runtime schemas =====
    DeviceRegistrationScope:
      type: string
      enum: [PERSONAL, ORGANIZATION]
      description: 注册令牌的授权范围；PERSONAL = 只授权给签发人本人，ORGANIZATION = 整个组织
    DeviceRegistrationTokenRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        install_id: { type: string, maxLength: 255 }
        max_slots: { type: integer, minimum: 0, maximum: 1024, description: 0 或缺省 = 1 }
        scope:
          $ref: '#/components/schemas/DeviceRegistrationScope'
          description: 省略时 OWNER / ADMIN = ORGANIZATION，其他成员 = PERSONAL
    DeviceRegistrationToken:
      type: object
      required: [id, token, install_token, command, scope, expires_at]
      properties:
        id: { type: string, format: uuid }
        token: { type: string, description: 旧格式的纯注册令牌（兼容旧 CLI） }
        install_token:
          type: string
          maxLength: 512
          description: v2 安装令牌 ofx_v2_<base64url(JSON {"v":2,"c":"<中心地址>","s":"<token>"})>（无填充）
        command: { type: string, description: 可直接复制运行的命令：openfox computer register --install-token <install_token> }
        scope: { $ref: '#/components/schemas/DeviceRegistrationScope' }
        expires_at: { type: string, format: date-time }
    DeviceRegisterRequest:
      type: object
      required: [token, key_id, public_key]
      properties:
        token: { type: string, maxLength: 512, description: v2 安装令牌或旧的纯注册令牌 }
        key_id: { type: string, minLength: 1, maxLength: 128 }
        public_key: { type: string, description: ed25519 公钥（32 字节）的 base64url（无填充） }
    DeviceRegisterResult:
      type: object
      required: [device_id, organization_id, owner_user_id, key_generation, center_epoch]
      properties:
        device_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        owner_user_id: { type: string, format: uuid }
        key_generation: { type: integer }
        center_epoch: { type: integer }
    DeviceAuthChallenge:
      type: object
      required: [challenge_id, device_id, key_id, nonce, challenge, expires_at]
      properties:
        challenge_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        key_id: { type: string }
        nonce: { type: string, description: base64url }
        challenge: { type: string, description: 待签名字节的 base64url }
        expires_at: { type: string, format: date-time }
    DeviceHeartbeatRequest:
      type: object
      required: [center_epoch, protocol_major, protocol_minor, capabilities]
      properties:
        center_epoch: { type: integer, minimum: 1 }
        protocol_major: { type: integer, minimum: 1 }
        protocol_minor: { type: integer, minimum: 0 }
        daemon_version: { type: string, maxLength: 128 }
        operating_system: { type: string, maxLength: 128 }
        architecture: { type: string, maxLength: 128 }
        capabilities:
          type: object
          additionalProperties: true
          description: |
            不透明 JSON 对象（≤ 64 KiB）。中心解析的键：
            runtimes = {<provider>: {version, login_status, runnable, reason, models, checked_at}}；
            timezone = IANA 时区名；storage = DeviceStorage（只有字节数与数量，不含路径）。
    DeviceStorage:
      type: object
      description: 电脑本地存储统计（每 10 分钟一次；单次遍历上限 20 万条目 / 20 秒，超限 partial = true）
      required: [total_bytes, worktree_bytes, worktree_count, codex_home_bytes, journal_bytes, measured_at, partial, categories]
      properties:
        total_bytes: { type: integer, minimum: 0 }
        worktree_bytes: { type: integer, minimum: 0 }
        worktree_count: { type: integer, minimum: 0 }
        codex_home_bytes: { type: integer, minimum: 0 }
        journal_bytes: { type: integer, minimum: 0 }
        measured_at: { type: string, format: date-time }
        partial: { type: boolean, description: true = 统计因上限提前结束，数值偏小 }
        categories:
          type: array
          maxItems: 8
          description: |
            按类型的占用细分；总和 ≤ total_bytes。设备没有上报或上报不合法
            （条数超限、键非法 / 重复、负数、总和超过 total_bytes）时为空数组，前端退回总量展示。
          items:
            $ref: '#/components/schemas/DeviceStorageCategory'
    DeviceStorageCategory:
      type: object
      required: [key, bytes, count]
      properties:
        key: { type: string, maxLength: 32, description: 'cache（可清理缓存）、task、conversation、automation、workflow、other；未知键前端按「其他」展示' }
        bytes: { type: integer, minimum: 0 }
        count: { type: integer, minimum: 0, description: 条目数（如 worktree 数）；没有统计为 0 }
    DeviceRunEnvironmentVariable:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: string, description: 明文；设备只注入 Runtime 子进程并加入 redact，不得写日志 / journal / 事件 }
    DeviceRunGitAuthor:
      type: object
      description: 空串表示该项沿用电脑上的 Git 配置（对应模式 MACHINE）
      required: [name, email]
      properties:
        name: { type: string }
        email: { type: string }
    DeviceRunHistoryMessage:
      type: object
      required: [seq, author_kind, body]
      properties:
        seq: { type: integer }
        author_kind: { type: string }
        body: { type: string }
    AgentMCPConfig:
      type: object
      required: [name, transport]
      description: 自定义名称允许小写英文、数字与连字符。凭据、环境、参数、请求头中的已保存值用六个黑点表示，修改目标需重新填写。
      properties:
        name: { type: string, maxLength: 64 }
        catalog_id: { type: string, maxLength: 64 }
        transport: { type: string, enum: [http, stdio] }
        scope: { type: string, enum: [PUBLIC, DEVICE_OWNER] }
        auth_mode: { type: string, enum: [none, api_key, oauth] }
        auth_header: { type: string }
        credential: { type: string, maxLength: 4096 }
        url: { type: string, maxLength: 2048 }
        command: { type: string, maxLength: 1024 }
        args: { type: array, maxItems: 64, items: { type: string, maxLength: 1024 } }
        headers: { type: object, maxProperties: 32, additionalProperties: { type: string } }
        env: { type: object, maxProperties: 32, additionalProperties: { type: string } }
    AgentMCPSave:
      allOf:
        - $ref: '#/components/schemas/AgentMCPConfig'
        - type: object
          properties:
            expected_version: { type: integer, minimum: 0, default: 0, description: 新建为 0，编辑需提供列表返回的版本 }
    AgentMCPManifest:
      type: object
      required: [tools, resources]
      properties:
        tools:
          type: array
          maxItems: 256
          items:
            type: object
            required: [name, input_schema]
            properties:
              name: { type: string }
              title: { type: string }
              description: { type: string }
              read_only: { type: boolean, description: 供应方工具的 readOnlyHint }
              input_schema: { type: object, additionalProperties: true }
        resources:
          type: array
          maxItems: 256
          items:
            type: object
            required: [uri, name]
            properties:
              uri: { type: string }
              name: { type: string }
              title: { type: string }
              description: { type: string }
              mime_type: { type: string }
    AgentMCPServer:
      allOf:
        - $ref: '#/components/schemas/AgentMCPManifest'
        - type: object
          required: [id, name, transport, status, version, config]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            catalog_id: { type: string }
            transport: { type: string, enum: [http, stdio] }
            status: { type: string, enum: [connected, authorizing, device] }
            version: { type: integer }
            config: { $ref: '#/components/schemas/AgentMCPConfig' }
    AgentMCPList:
      type: object
      required: [servers, can_edit, can_use_local]
      properties:
        servers: { type: array, maxItems: 64, items: { $ref: '#/components/schemas/AgentMCPServer' } }
        can_edit: { type: boolean }
        can_use_local: { type: boolean }
        oauth_redirect_uri: { type: string, format: uri, description: 来自中心配置的公网 OAuth 回调地址 }
    AgentMCPInventory:
      type: object
      required: [device_id, runtime, status, servers, online]
      properties:
        online: { type: boolean }
        checked_at: { type: string, format: date-time, description: 私有清单最后一次上报的中心时间 }
        last_seen_at: { type: string, format: date-time, description: 最近一次普通设备心跳 }
        device_id: { type: string, format: uuid }
        runtime: { type: string }
        status: { type: string, enum: [ok, missing, invalid, unavailable, too_large] }
        servers:
          type: array
          items:
            type: object
            required: [name, transport, source, enabled, selected]
            properties:
              name: { type: string }
              transport: { type: string, enum: [HTTP, STDIO, SSE, ''] }
              source: { type: string, enum: [USER_CONFIG] }
              enabled: { type: boolean }
              selected: { type: boolean }
    AgentMCPInheritedChange:
      type: object
      required: [device_id, runtime, enabled]
      properties:
        device_id: { type: string, format: uuid }
        runtime: { type: string }
        enabled: { type: boolean }
    DeviceMCPServer:
      type: object
      required: [name, transport, scope]
      properties:
        catalog_id: { type: string }
        server_id: { type: string, format: uuid }
        name: { type: string }
        scope: { type: string, enum: [PUBLIC, DEVICE_OWNER] }
        transport: { type: string, enum: [HTTP, STDIO, INHERITED] }
        url: { type: string }
        headers: { type: object, additionalProperties: { type: string } }
        command: { type: string }
        args: { type: array, items: { type: string } }
        env: { type: object, additionalProperties: { type: string } }
        owner_user_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
    DeviceRunContext:
      type: object
      required: [run_id, generation, organization_id, space_id, conversation_id, agent_id, config_version,
                 runtime, model, approval_mode, reasoning_effort, collaboration_mode, instructions, run_timeout_seconds, directory_mode, directory_roots, prompt,
                 history, environment, custom_args, git_author, workdir_isolation]
      properties:
        repositories:
          type: array
          maxItems: 64
          items:
            type: object
            required: [url, base_branch]
            properties:
              url: {type: string, format: uri}
              base_branch: {type: string}
        actor_id: { type: string, format: uuid, description: 本次授权运行的发起人 }
        automation_origin: { type: boolean, description: 当前运行的输入来自自动化，用于工作区存储分类 }
        social_tools: { type: boolean, description: 当前中心接受运行范围内的回复、提及和表态 }
        run_id: { type: string, format: uuid }
        generation: { type: integer }
        organization_id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        task_id: { type: string, format: uuid, description: 会话 Run 省略 }
        mcp_servers: { type: array, maxItems: 64, items: { $ref: '#/components/schemas/DeviceMCPServer' } }
        mcp_actor_user_id: { type: string, format: uuid }
        mcp_device_owner_id: { type: string, format: uuid }
        workspace_selection: { $ref: '#/components/schemas/DeviceWorkspaceBinding' }
        shared_task_crew_id: { type: string, format: uuid, description: 仅小队开启共用目录且 Run 绑定任务时返回；设备以组织、空间、小队、任务作为目录绑定键，保留本地修改 }
        agent_id: { type: string, format: uuid }
        config_version: { type: integer }
        runtime: { type: string, description: 本次 Run 的 Runtime（创建 Run 时的快照：Agent 配置叠加对话覆盖；旧 Run 回退到配置版本） }
        model: { type: string, description: 同 runtime，取自快照 }
        approval_mode:
          description: |
            本次 Run 要求的权限档位（快照）。旧版 daemon 不认识该字段，因此中心在派发前按设备上报的 approval_modes 核对，
            不支持就不派发；新版 daemon 收到不支持的档位时在准备阶段以 RUNTIME_UNAVAILABLE 失败，不执行。空串按 FOLLOW_RUNTIME。
          $ref: '#/components/schemas/ApprovalMode'
        reasoning_effort:
          description: |
            本次 Run 要求的模型思考深度（快照）。旧版 daemon 不认识非 DEFAULT 档位，因此中心在派发前核对设备上报的 reasoning_efforts。
          $ref: '#/components/schemas/ReasoningEffort'
        collaboration_mode:
          description: |
            本次 Run 要求的协作模式，取自 Run 固定的配置版本（没有对话覆盖；历史值 FOLLOW_AGENT 规范化为 FOLLOW_RUNTIME）。
            旧版 daemon 不认识该字段，因此中心在派发前按设备上报的 collaboration_modes 核对，不支持就让 Run 失败、不派发；
            新版 daemon 收到不支持的模式时在准备阶段以 RUNTIME_UNAVAILABLE 失败，不执行。空串按 FOLLOW_RUNTIME。
          $ref: '#/components/schemas/CollaborationMode'
        instructions: { type: string }
        run_timeout_seconds: { type: integer }
        directory_mode: { type: string }
        directory_roots:
          type: array
          items: { type: string }
        prompt: { type: string }
        history:
          type: array
          items: { $ref: '#/components/schemas/DeviceRunHistoryMessage' }
        environment:
          type: array
          description: |
            Agent 当前环境变量（按名称排序）；没有则为空数组。中心原样下发；电脑丢弃保留名
            （CODEX_HOME、HOME、PATH，前缀 OPENFOX_ / CODEX_ / DYLD_ / LD_）并上报 warning（只写名字）。
          items: { $ref: '#/components/schemas/DeviceRunEnvironmentVariable' }
        custom_args:
          type: array
          description: Agent 自定义参数原样下发；设备按白名单收口
          items: { type: string }
        git_author:
          description: 提交人；名称与邮箱都为 MACHINE 模式时为 null
          oneOf:
            - $ref: '#/components/schemas/DeviceRunGitAuthor'
            - type: 'null'
        workdir_isolation: { type: string, enum: [WORKTREE, DIRECT] }
        skills:
          type: array
          maxItems: 20
          description: |
            Agent 当前装配的技能清单（不固定到配置版本）；没有则为空数组。设备逐个调 getDeviceRunSkill 下载，
            写进本次 Run 独立的 CODEX_HOME/skills/<name>/；旧版设备忽略该字段。
          items: { $ref: '#/components/schemas/DeviceRunSkill' }
        attachments:
          type: array
          maxItems: 30
          description: |
            本次输入消息携带的附件清单（没有则为空数组）。设备逐个调 getDeviceRunAttachment 下载到 daemon 自己的
            每个 Run 临时目录（在工作目录之外，Run 结束后删除），并在 prompt 开头列出绝对路径；旧版设备忽略该字段。
          items: { $ref: '#/components/schemas/DeviceRunAttachment' }
        task:
          description: 绑定任务时的任务快照（会话 Run 省略）；旧版设备忽略该字段
          $ref: '#/components/schemas/DeviceRunTask'
    DeviceRunTask:
      type: object
      required: [id, display_id, title, description, acceptance, status_name, status_category, origin, comments]
      properties:
        id: { type: string, format: uuid }
        display_id: { type: string }
        title: { type: string }
        description: { type: string }
        acceptance: { type: string }
        status_name: { type: string }
        status_category: { type: string }
        origin: { type: string, enum: [USER, TASK_ASSIGNMENT], description: 本次 Run 所在会话的来源 }
        comments:
          type: array
          maxItems: 20
          description: 最近的评论（按时间正序），正文截断到 2000 字符
          items:
            type: object
            required: [author_name, author_kind, created_at, body]
            properties:
              id: { type: string, format: uuid, description: 供设备定位回复或表态 }
              author_user_id: { type: string, format: uuid }
              author_name: { type: string }
              author_kind: { type: string, enum: [USER, AGENT] }
              created_at: { type: string, format: date-time }
              body: { type: string }
    DeviceToolCallRequest:
      type: object
      additionalProperties: false
      required: [generation, call_id]
      properties:
        generation: { type: integer, minimum: 1 }
        call_id: { type: string, minLength: 1, maxLength: 128, description: Runtime 的工具调用 ID，用于幂等 }
        arguments: { type: object, additionalProperties: true }
    DeviceToolCallResult:
      type: object
      required: [ok, text]
      properties:
        ok: { type: boolean }
        text: { type: string }
    DeviceCommandKind:
      type: string
      enum: [runtime_probe, runtime_test, storage_cleanup, skill_scan, skill_import, device_settings, workspace_path, runtime_session_export]
    DeviceCommandStatus:
      type: string
      enum: [PENDING, DELIVERED, SUCCEEDED, FAILED, EXPIRED]
    DeviceCommand:
      type: object
      description: |
        result 按 kind：runtime_probe = DeviceRuntimeProbeResult；runtime_test = DeviceRuntimeTestResult；
        storage_cleanup = DeviceStorageCleanupResult；skill_scan = DeviceSkillScanResult；skill_import = DeviceSkillImportResult。
        workspace_path = WorkspacePathEnvelope，仅密文，不允许明文路径；读取须重新验证请求人、会话及设备所有权，过期后不可读。
      required: [id, device_id, kind, params, status, result, error_code, created_at, delivered_at, completed_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/DeviceCommandKind' }
        params: { type: object, additionalProperties: true }
        status: { $ref: '#/components/schemas/DeviceCommandStatus' }
        result: { type: [object, 'null'], additionalProperties: true }
        error_code: { type: string, description: 失败码（FAILED 时非空）；其他状态为空串 }
        created_at: { type: string, format: date-time }
        delivered_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: string, format: date-time, description: PENDING 时为领取截止（一般创建后 2 分钟）；DELIVERED 后为执行截止。workspace_path 沿用请求绝对期限且领取不延期。 }
    RuntimeSessionExportRequest:
      type: object
      additionalProperties: false
      required: [public_key]
      properties:
        public_key: { type: string, minLength: 300, maxLength: 2048, description: RSA SubjectPublicKeyInfo 的 base64url 编码；仅用于本次导出 }
    RuntimeSessionExport:
      type: object
      required: [id, runtime, status, expires_at]
      properties:
        id: { type: string, format: uuid }
        runtime: { type: string, enum: [codex, claude-code, opencode, pi] }
        status: { type: string, enum: [PENDING, READY, FAILED] }
        expires_at: { type: string, format: date-time }
        wrapped_key: { type: string, description: RSA-OAEP 加密的 AES-GCM 密钥，base64url 编码；仅 READY 时存在 }
        error_code: { type: string, description: 失败码；仅 FAILED 时存在 }
    DeviceCommandEnvelope:
      type: object
      required: [command]
      properties:
        command: { $ref: '#/components/schemas/DeviceCommand' }
    DeviceCommandCreateRequest:
      type: object
      required: [kind]
      properties:
        kind: { $ref: '#/components/schemas/DeviceCommandKind' }
        params:
          type: object
          description: |
            runtime_probe、skill_scan 为 {}。storage_cleanup 传 {} 使用既有保留规则；传 action、days、categories 则按组织和来源预览或清理；按任务状态时另传 statuses。clean 必须带同一条件的 preview_id。旧设备拒绝筛选请求。
            runtime_test = {provider: codex / claude-code / opencode / pi（缺省 codex）, model?: string(≤128)}。
            skill_import 只能通过 createSkillRuntimeImport 下发，这里传 400。
            设备收到的 skill_import params = {space_id, names}。
            workspace_path = WorkspacePathRequest。会话访问权、实际 Run/代次/设备及请求人必须全部匹配。
            同设备存在不同参数的未完成路径请求返回 409；完全相同参数才复用。过期请求不允许重放。
            路径请求领取与执行共用 expires_at，不延期；客户端总期限 30 秒，服务端仅接受未来 60 秒内的期限。
            出现未知键或类型不符：400 INVALID_REQUEST。
          properties:
            provider: { type: string, enum: [codex, claude-code, opencode, pi] }
            model: { type: string, maxLength: 128 }
            version: {type: integer, minimum: 1, description: device_settings 写入须使用读到的版本；传空对象读取。}
            settings: {$ref: '#/components/schemas/DevicePreferences'}
            storage: {type: boolean, description: 读取或保存当前设备与组织的自动清理规则。}
            policy: {$ref: '#/components/schemas/DeviceStoragePolicy'}
            action: {type: string, enum: [preview, clean]}
            days: {type: integer, minimum: 0, maximum: 3650}
            categories: {type: array, minItems: 1, maxItems: 4, uniqueItems: true, items: {type: string, enum: [task, conversation, automation, workflow]}}
            statuses: {type: array, minItems: 1, maxItems: 7, uniqueItems: true, items: {type: string, enum: [TRIAGE, BACKLOG, TODO, IN_PROGRESS, DONE, CANCELLED, DUPLICATE]}}
            preview_id: {type: string, pattern: '^[a-f0-9]{64}$'}
            organization_id: {type: string, format: uuid}
            device_id: {type: string, format: uuid}
            space_id: {type: string, format: uuid}
            conversation_id: {type: string, format: uuid}
            agent_id: {type: string, format: uuid}
            run_id: {type: string, format: uuid}
            generation: {type: integer, minimum: 1, maximum: 9007199254740991}
            user_id: {type: string, format: uuid}
            request_id: {type: string, format: uuid}
            public_key: {type: string, maxLength: 512, description: Base64 DER SPKI RSA-2048 public key, exponent 65537}
            expires_at: {type: integer, description: Unix epoch milliseconds}
          additionalProperties: false
    WorkspacePathScope:
      type: object
      required: [organization_id, device_id, space_id, conversation_id, agent_id, run_id, generation, user_id]
      properties:
        organization_id: {type: string, format: uuid}
        device_id: {type: string, format: uuid}
        space_id: {type: string, format: uuid}
        conversation_id: {type: string, format: uuid}
        agent_id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        generation: {type: integer, minimum: 1, maximum: 9007199254740991}
        user_id: {type: string, format: uuid}
    WorkspacePathRequest:
      allOf:
        - {$ref: '#/components/schemas/WorkspacePathScope'}
        - type: object
          required: [request_id, public_key, expires_at]
          properties:
            request_id: {type: string, format: uuid}
            public_key: {type: string, maxLength: 512}
            expires_at: {type: integer}
    WorkspacePathEnvelope:
      type: object
      additionalProperties: false
      required: [algorithm, wrapped_key, nonce, ciphertext]
      properties:
        algorithm: {type: string, const: RSA-OAEP-256/A256GCM}
        wrapped_key: {type: string, description: Base64 RSA-OAEP-SHA256 encrypted AES-256 key}
        nonce: {type: string, description: Base64 12-byte GCM nonce}
        ciphertext: {type: string, description: Base64 AES-GCM ciphertext followed by 16-byte tag; plaintext limited to 4096 UTF-8 bytes}
    DeviceCommandResultRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [SUCCEEDED, FAILED] }
        result: { type: [object, 'null'], additionalProperties: true }
        error_code: { type: string, pattern: '^[A-Z0-9_]{0,64}$' }
    DeviceStoragePolicy:
      type: object
      additionalProperties: false
      required: [enabled, interval_hours, retain_days, min_free_gib, max_gib]
      properties:
        enabled: {type: boolean}
        interval_hours: {type: integer, minimum: 1, maximum: 720}
        repo_days: {type: integer, minimum: 30, maximum: 3650, default: 37}
        retain_days: {type: integer, minimum: 1, maximum: 3650}
        min_free_gib: {type: integer, minimum: 0, maximum: 1048576}
        max_gib: {type: integer, minimum: 0, maximum: 1048576}
    DevicePreferences:
      type: object
      additionalProperties: false
      required: [codex_path, codex_args, memory_guard, min_memory_mib, load_guard, load_policy]
      properties:
        session_idle_minutes: {type: integer, minimum: 1, maximum: 1440, default: 10}
        session_max_minutes: {type: integer, minimum: 1, maximum: 10080, default: 120}
        codex_path: {type: string, maxLength: 1024}
        codex_args: {type: array, maxItems: 16, items: {type: string, maxLength: 512}}
        memory_guard: {type: boolean}
        min_memory_mib: {type: integer, minimum: 1, maximum: 1048576}
        load_guard: {type: boolean}
        load_policy: {type: string, enum: [balanced, performance, conservative]}
    DeviceRuntimeProbeResult:
      type: object
      required: [runtimes, checked_at]
      properties:
        runtimes: { type: object, additionalProperties: true, description: 与心跳 capabilities.runtimes 相同结构 }
        checked_at: { type: string, format: date-time }
    DeviceRuntimeTestResult:
      type: object
      required: [provider, ok, login_status, model, model_available, latency_ms, message]
      properties:
        provider: { type: string }
        ok: { type: boolean }
        login_status: { type: string }
        model: { type: string }
        model_available: { type: boolean }
        latency_ms: { type: integer, minimum: 0 }
        message: { type: string }
    DeviceStorageCleanupResult:
      type: object
      required: [freed_bytes, removed, skipped_active]
      properties:
        freed_bytes: { type: integer, minimum: 0 }
        removed:
          type: object
          required: [worktrees, codex_homes, journal_rows]
          properties:
            worktrees: { type: integer, minimum: 0 }
            codex_homes: { type: integer, minimum: 0 }
            journal_rows: { type: integer, minimum: 0 }
        skipped_active: { type: integer, minimum: 0 }
        skipped_dirty: { type: integer, minimum: 0, description: 有未提交改动而保留的 worktree 数（daemon 可省略） }
    # ===== /连接电脑与 Runtime schemas =====

    # ===== 空间设置 schemas =====
    SpacePurpose:
      type: string
      enum: [software_development, product_management, marketing, design, project_management, operations, it_support,
        human_resources, customer_service, legal, finance, sales, data_science, other]
    SpaceStatus:
      type: string
      description: active = 正常；retired = 已停用（只读，可恢复）。已删除空间不会返回。
      enum: [active, retired]
    SpaceMemberRole:
      type: string
      enum: [OWNER, EDITOR, MEMBER, VIEWER]
    SpaceFeatures:
      type: object
      required: [views, projects, iterations, triage]
      properties:
        views: { type: boolean }
        projects: { type: boolean }
        iterations: { type: boolean, description: 3b 前只记录开关 }
        triage: { type: boolean, description: 3d 前只记录开关 }
    SpaceFeaturesPatch:
      type: object
      additionalProperties: false
      description: 未传的开关不变
      properties:
        views: { type: boolean }
        projects: { type: boolean }
        iterations: { type: boolean }
        triage: { type: boolean }
    EstimationScale:
      type: string
      description: |
        notUsed = 未启用；storyPoints = 任意非负点数；time = 秒（界面按每天 8 小时、每周 5 天换算）；
        exponential [1,2,4,8,16]（extended 追加 32,64）；fibonacci [1,2,3,5,8]（+13,21）；linear [1,2,3,4,5]（+6,7）；
        tShirt XS=1 S=2 M=3 L=5 XL=8（+XXL=13 XXXL=21）。allow_zero 时 0 也合法。
      enum: [notUsed, storyPoints, time, exponential, fibonacci, linear, tShirt]
    SpaceEstimation:
      type: object
      required: [scale, extended, allow_zero, count_unestimated]
      properties:
        scale: { $ref: '#/components/schemas/EstimationScale' }
        extended: { type: boolean }
        allow_zero: { type: boolean }
        count_unestimated: { type: boolean }
    SpaceDetail:
      description: 空间（列表与详情共用）。position 为当前用户的侧栏排序，未设置时为 null。
      allOf:
        - $ref: '#/components/schemas/Space'
        - type: object
          required: [icon, purpose, features, multi_assignee, estimation, status, retired_at, position, my_role,
            can_manage, member_count, task_type_count, label_count, task_count, updated_at]
          properties:
            icon: { type: [string, 'null'], maxLength: 64 }
            purpose: { $ref: '#/components/schemas/SpacePurpose' }
            features: { $ref: '#/components/schemas/SpaceFeatures' }
            multi_assignee: { type: boolean }
            estimation: { $ref: '#/components/schemas/SpaceEstimation' }
            status: { $ref: '#/components/schemas/SpaceStatus' }
            retired_at: { type: [string, 'null'], format: date-time }
            position: { type: [integer, 'null'], minimum: 0 }
            my_role:
              description: 当前用户的显式 ACTIVE 空间角色；没有时为 null
              oneOf:
                - $ref: '#/components/schemas/SpaceMemberRole'
                - type: 'null'
            triage_favorited: { type: boolean, description: 当前用户是否收藏此空间的分拣台 }
            can_manage: { type: boolean, description: 当前用户能否管理该空间（服务端判断，界面据此禁用） }
            member_count: { type: integer, minimum: 0, description: ACTIVE 显式成员数 }
            task_type_count: { type: integer, minimum: 0, description: 未归档任务类型数 }
            label_count: { type: integer, minimum: 0, description: 本空间未归档标签数 }
            task_count: { type: integer, minimum: 0, description: 本空间未删除的任务数（空间列表「任务」列） }
            updated_at: { type: string, format: date-time }
    SpaceCreateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 32 }
        prefix: { type: string, minLength: 2, maxLength: 7, description: 2–7 位字母数字（转大写）；不传时由名称生成并自动避开占用 }
        visibility: { type: string, enum: [shared, private], description: 兼容旧值 public（等同 shared）；默认 private }
        purpose: { $ref: '#/components/schemas/SpacePurpose' }
        icon: { type: string, maxLength: 64 }
        features: { $ref: '#/components/schemas/SpaceFeaturesPatch' }
        multi_assignee: { type: boolean }
        copy_from_space_id:
          type: string
          format: uuid
          description: 从可读的空间复制任务类型（含工作流与字段绑定）、空间标签与分组、估时设置；不复制任务、成员、仓库
        template_keys:
          type: array
          maxItems: 20
          description: 额外按推荐模板创建的任务类型（与 copy_from_space_id 互斥）；未知 key → 400
          items: { type: string }
    SpaceUpdateRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 32 }
        icon: { type: [string, 'null'], maxLength: 64, description: null = 清除图标 }
        visibility: { type: string, enum: [shared, private] }
        purpose: { $ref: '#/components/schemas/SpacePurpose' }
        features: { $ref: '#/components/schemas/SpaceFeaturesPatch' }
        multi_assignee: { type: boolean }
    SpaceIdentifierCheck:
      type: object
      required: [prefix, valid, available, space_name]
      properties:
        prefix: { type: string, description: 规范化（大写）后的值 }
        valid: { type: boolean }
        available: { type: boolean }
        space_name: { type: [string, 'null'], description: 被可读空间占用时给出空间名 }
    SpaceImpact:
      type: object
      required: [open_tasks, total_tasks, projects, active_runs, agents, space_grants]
      properties:
        open_tasks: { type: integer, minimum: 0, description: 未删除且状态分类不是 DONE / CANCELLED / DUPLICATE }
        total_tasks: { type: integer, minimum: 0, description: 未删除任务 }
        projects: { type: integer, minimum: 0, description: 3c 前恒为 0 }
        active_runs: { type: integer, minimum: 0, description: QUEUED / PREPARING / RUNNING }
        agents: { type: integer, minimum: 0, description: 未归档 Agent }
        space_grants: { type: integer, minimum: 0, description: scope = SPACE 且指向本空间的 ACTIVE 电脑授权 }
    SpaceRetireRequest:
      type: object
      required: [version, open_tasks]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1 }
        open_tasks: { type: string, enum: [cancel, keep, move] }
        target_space_id: { type: string, format: uuid, description: open_tasks = move 时必填 }
    SpaceRetireResult:
      type: object
      required: [space, canceled_tasks, moved_tasks, canceled_runs]
      properties:
        space: { $ref: '#/components/schemas/SpaceDetail' }
        canceled_tasks: { type: integer, minimum: 0 }
        moved_tasks: { type: integer, minimum: 0 }
        canceled_runs: { type: integer, minimum: 0 }
    SpaceDeleteRequest:
      type: object
      required: [confirm_name, version]
      additionalProperties: false
      properties:
        confirm_name: { type: string, maxLength: 255 }
        version: { type: integer, minimum: 1 }
    SpaceDeleteResult:
      type: object
      required: [deleted, archived_agents, canceled_runs, revoked_grants]
      properties:
        deleted: { type: boolean, enum: [true] }
        archived_agents: { type: integer, minimum: 0 }
        canceled_runs: { type: integer, minimum: 0 }
        revoked_grants: { type: integer, minimum: 0 }
    SpaceRepo:
      type: object
      required: [id, space_id, url, description, base_branch, position, version, created_by, created_at, updated_at]
      properties:
        connection_id: { type: string, description: '显式绑定 GitHub/GitLab 组织连接；空串表示匿名访问。仅组织 OWNER/ADMIN 可新增或变更授权及其仓库地址。' }
        id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        url: { type: string, description: https://… 或 git@host:path / ssh://… }
        description: { type: string, maxLength: 500 }
        base_branch: { type: string, maxLength: 255, description: 空串 = 使用仓库默认分支 }
        position: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1 }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SpaceRepoCreateRequest:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        connection_id: { type: string, description: '显式绑定 GitHub/GitLab 组织连接；空串表示匿名访问。仅组织 OWNER/ADMIN 可新增或变更授权及其仓库地址。' }
        url: { type: string, minLength: 1, maxLength: 2048 }
        description: { type: string, maxLength: 500 }
        base_branch: { type: string, maxLength: 255 }
    SpaceRepoPatch:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        connection_id: { type: string, description: '显式绑定 GitHub/GitLab 组织连接；空串表示匿名访问。仅组织 OWNER/ADMIN 可新增或变更授权及其仓库地址。' }
        url: { type: string, minLength: 1, maxLength: 2048 }
        description: { type: string, maxLength: 500 }
        base_branch: { type: string, maxLength: 255 }
        position: { type: integer, minimum: 0, maximum: 63 }
        version: { type: integer, minimum: 1 }
    TaskTypeTemplate:
      type: object
      required: [key, name, description, icon, color, purposes]
      properties:
        key: { type: string }
        name: { type: string, description: 英文默认名称 }
        description: { type: string }
        icon: { type: string, description: 图标名（lucide） }
        color: { $ref: '#/components/schemas/HexColor' }
        purposes:
          type: array
          items: { $ref: '#/components/schemas/SpacePurpose' }
    EstimateConversion:
      type: object
      required: [from, to]
      additionalProperties: false
      properties:
        from: { type: number, minimum: 0 }
        to: { type: [number, 'null'], minimum: 0, description: null = 清空 }
    SpaceEstimationUpdateRequest:
      type: object
      required: [version, scale]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1 }
        scale: { $ref: '#/components/schemas/EstimationScale' }
        extended: { type: boolean, default: false }
        allow_zero: { type: boolean, default: false }
        count_unestimated: { type: boolean, default: false }
        convert:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/EstimateConversion' }
    SpaceEstimationPreview:
      type: object
      required: [scale, allowed_values, values, unestimated_count, total_count]
      properties:
        scale: { $ref: '#/components/schemas/EstimationScale' }
        allowed_values:
          type: [array, 'null']
          description: 目标刻度的合法值（固定档位刻度）；storyPoints / time / notUsed 为 null
          items: { type: number }
        values:
          type: array
          description: 当前用到的估时值，按值升序
          items:
            type: object
            required: [value, count, valid, suggested]
            properties:
              value: { type: number }
              count: { type: integer, minimum: 1 }
              valid: { type: boolean, description: 在目标刻度下是否合法 }
              suggested: { type: [number, 'null'], description: 建议映射到的目标值（合法时为自身；固定档位取最接近的值；notUsed 为 null） }
        unestimated_count: { type: integer, minimum: 0 }
        total_count: { type: integer, minimum: 0, description: 未删除任务总数 }
    SpaceMemberDetail:
      description: 空间成员列表项（用户只有邮箱，没有名称与头像字段）
      allOf:
        - $ref: '#/components/schemas/SpaceMember'
        - type: object
          required: [org_role, only_space]
          properties:
            org_role:
              description: 该用户的组织角色；已不在组织（非 ACTIVE）时为 null
              oneOf:
                - $ref: '#/components/schemas/OrganizationRole'
                - type: 'null'
            only_space: { type: boolean, description: 本空间是该用户唯一可读的活跃空间（移出 / 离开会 409 ONLY_SPACE） }
    TaskByDisplayID:
      allOf:
        - $ref: '#/components/schemas/TaskDetail'
        - type: object
          required: [canonical_display_id]
          properties:
            canonical_display_id: { type: string, description: 当前编号；按旧编号（历史标识符或移动前的编号）命中时与请求值不同，前端据此替换地址 }

    # ===== 任务移动到空间 =====
    TaskMoveNamed:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    TaskMovePreviewTask:
      type: object
      required: [task_id, title, display_id, display_id_hint, type_from, type_to, status_from, status_to,
        estimate_from, estimate_to, cleared, dropped_labels]
      properties:
        task_id: { type: string, format: uuid }
        title: { type: string }
        display_id: { type: string, description: 现在的编号 }
        display_id_hint: { type: string, description: 预计的新编号（只是提示，执行时分配） }
        type_from: { $ref: '#/components/schemas/TaskMoveNamed' }
        type_to: { $ref: '#/components/schemas/TaskMoveNamed' }
        status_from: { $ref: '#/components/schemas/TaskMoveNamed' }
        status_to: { $ref: '#/components/schemas/TaskMoveNamed' }
        estimate_from: { type: [number, 'null'] }
        estimate_to: { type: [number, 'null'], description: 移动后的估时；原来有值而这里为 null 表示清空 }
        cleared:
          type: array
          description: 移动后将清空的字段
          items: { type: string, enum: [iteration, project, estimate, parent, triage] }
        dropped_labels:
          type: array
          description: 将丢弃的本空间标签（组织级标签保留）
          items: { $ref: '#/components/schemas/TaskMoveNamed' }
    TaskMovePreview:
      type: object
      required: [target_space_id, tasks_count, tasks, detached_parent, removed_assignees, active_runs, unlinked_issues,
        requires_confirmation]
      properties:
        target_space_id: { type: string, format: uuid }
        tasks_count: { type: integer, minimum: 1, description: 移动集合的任务数（本任务 + 未删除的后代） }
        tasks:
          type: array
          description: 第一个是本任务，其余按序号
          items: { $ref: '#/components/schemas/TaskMovePreviewTask' }
        detached_parent:
          description: 本任务将脱离的父任务（父任务不随之移动）；没有时为 null
          oneOf:
            - $ref: '#/components/schemas/TaskMoveNamed'
            - type: 'null'
        removed_assignees:
          type: array
          description: 将移除的 Agent / 小队处理人（属于源空间）
          items:
            type: object
            required: [task_id, kind, id, name]
            properties:
              task_id: { type: string, format: uuid }
              kind: { type: string, enum: [AGENT, CREW] }
              id: { type: string, format: uuid }
              name: { type: string }
        active_runs: { type: integer, minimum: 0, description: 将被取消的 QUEUED / PREPARING / RUNNING 运行数 }
        unlinked_issues:
          type: array
          description: 将解除同步的 Issue 链接（GitHub / GitLab / Gitee 上的 Issue 本身不动）
          items:
            type: object
            required: [task_id, repository, number, url]
            properties:
              task_id: { type: string, format: uuid }
              repository: { type: string }
              number: { type: integer }
              url: { type: string }
        requires_confirmation: { type: boolean, description: 为 true 时执行必须带 cancel_runs true }
    TaskMoveResult:
      type: object
      required: [task, display_id, previous_display_id, moved_count, canceled_runs]
      properties:
        task: { $ref: '#/components/schemas/Task' }
        display_id: { type: string, description: 新编号 }
        previous_display_id: { type: string, description: 移动前的编号（仍可通过 by-display-id 解析） }
        moved_count: { type: integer, minimum: 1, description: 一起移动的任务数（含子任务） }
        canceled_runs: { type: integer, minimum: 0 }

    # ===== 迭代 =====
    IterationMode:
      type: string
      enum: [manual, automatic]
    IterationStatus:
      type: string
      enum: [planned, active, completed, canceled]
    IterationLink:
      type: object
      required: [id, iteration_id, title, url, position, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        iteration_id: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        url: { type: string, description: http(s) URL }
        position: { type: integer, minimum: 0, maximum: 19 }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    IterationLive:
      type: object
      required: [scope_count, completed_count, scope_points, completed_points]
      properties:
        scope_count: { type: integer, minimum: 0 }
        completed_count: { type: integer, minimum: 0 }
        scope_points: { type: number, minimum: 0 }
        completed_points: { type: number, minimum: 0 }
    Iteration:
      type: object
      required: [id, space_id, number, name, display_name, description, status, starts_at, ends_at,
        start_date, end_date, started_at, completed_at, scope_count, completed_count, scope_points,
        completed_points, live, capacity_percent, links, version]
      properties:
        id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        number: { type: integer, minimum: 1 }
        name: { type: string, maxLength: 80, description: '空串时由前端使用「迭代 {number}」显示' }
        display_name: { type: string }
        description: { type: string, maxLength: 4000 }
        status: { $ref: '#/components/schemas/IterationStatus' }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        started_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        scope_count: { type: [integer, 'null'], minimum: 0 }
        completed_count: { type: [integer, 'null'], minimum: 0 }
        scope_points: { type: [number, 'null'], minimum: 0 }
        completed_points: { type: [number, 'null'], minimum: 0 }
        live: { $ref: '#/components/schemas/IterationLive' }
        capacity_percent: { type: [number, 'null'], minimum: 0 }
        links:
          type: array
          items: { $ref: '#/components/schemas/IterationLink' }
        version: { type: integer, minimum: 1 }
    IterationCurrent:
      oneOf:
        - $ref: '#/components/schemas/Iteration'
        - type: 'null'
    IterationSettings:
      type: object
      required: [enabled, mode, duration_weeks, cooldown_weeks, start_weekday, timezone, upcoming_count,
        auto_add_started, auto_add_completed, next_start_date, current, version]
      properties:
        enabled: { type: boolean }
        mode: { $ref: '#/components/schemas/IterationMode' }
        duration_weeks: { type: integer, minimum: 1, maximum: 8 }
        cooldown_weeks: { type: integer, minimum: 0, maximum: 3 }
        start_weekday: { type: integer, minimum: 0, maximum: 6, description: 0=周日…6=周六 }
        timezone: { type: string, maxLength: 64 }
        upcoming_count: { type: integer, enum: [1, 2, 3, 4, 6, 8, 10, 12, 15] }
        auto_add_started: { type: boolean }
        auto_add_completed: { type: boolean }
        next_start_date: { type: [string, 'null'], format: date }
        current: { $ref: '#/components/schemas/IterationCurrent' }
        version: { type: integer, minimum: 1 }
    IterationSettingsPatch:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1 }
        enabled: { type: boolean }
        mode: { $ref: '#/components/schemas/IterationMode' }
        duration_weeks: { type: integer, minimum: 1, maximum: 8 }
        cooldown_weeks: { type: integer, minimum: 0, maximum: 3 }
        start_weekday: { type: integer, minimum: 0, maximum: 6 }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        upcoming_count: { type: integer, enum: [1, 2, 3, 4, 6, 8, 10, 12, 15] }
        auto_add_started: { type: boolean }
        auto_add_completed: { type: boolean }
        next_start_date: { type: [string, 'null'], format: date }
    IterationCreateRequest:
      type: object
      required: [start_date, end_date]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 4000 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, description: 包含结束日期；必须不早于 start_date }
    IterationPatchRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1 }
        name: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 4000 }
    IterationDatesRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
    IterationVersionRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1 }
    IterationCompleteRequest:
      type: object
      required: [version, move_unfinished_to]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1 }
        move_unfinished_to: { type: string, enum: [next, backlog] }
        target_iteration_id: { type: string, format: uuid, description: move_unfinished_to = iteration_id 时必填；服务端也接受该值作为去向 }
    IterationTaskBatchRequest:
      type: object
      required: [task_ids, action]
      additionalProperties: false
      properties:
        task_ids: { type: array, minItems: 1, maxItems: 200, items: { type: string, format: uuid } }
        action: { type: string, enum: [add, remove] }
    IterationLinkCreateRequest:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 200 }
        url: { type: string, minLength: 1, maxLength: 2048, description: 必须是 http(s) URL }
        position: { type: integer, minimum: 0, maximum: 19 }
    # ===== /空间设置 schemas =====

    # ===== 专项与视图 schemas =====
    ProjectStatus:
      type: string
      enum: [backlog, planned, in_progress, completed, canceled]
    ProjectSpace:
      type: object
      required: [id, name, prefix, is_primary]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        is_primary: { type: boolean }
    ProjectDistributionItem:
      type: object
      required: [key, label, done, total]
      properties:
        key: { type: string, description: 处理人 / 迭代 ID；没有处理人 / 迭代的任务为空串 }
        label: { type: string, description: 处理人邮箱或名称 / 迭代显示名；key 为空串时为空串 }
        done: { type: integer }
        total: { type: integer }
    ProjectDistribution:
      type: object
      required: [assignees, iterations]
      properties:
        assignees: { type: array, items: { $ref: '#/components/schemas/ProjectDistributionItem' } }
        iterations: { type: array, items: { $ref: '#/components/schemas/ProjectDistributionItem' } }
    Project:
      type: object
      required: [id, name, icon, description, status, priority, lead, progress, spaces, labels, created_at, updated_at, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        icon: { type: [string, 'null'], description: 表情 }
        description: { type: string }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        lead:
          type: [object, 'null']
          required: [id, email]
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
        progress:
          type: object
          required: [done, total]
          properties:
            done: { type: integer, description: DONE 分类的任务数 }
            total: { type: integer, description: 未取消（非取消 / 重复）的任务数 }
        spaces: { type: array, items: { $ref: '#/components/schemas/ProjectSpace' }, description: 只含当前用户可读的空间，主空间在前 }
        labels: { type: array, items: { $ref: '#/components/schemas/TaskLabelItem' } }
        distribution: { $ref: '#/components/schemas/ProjectDistribution', description: 只在详情里返回 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }
    ProjectCreateRequest:
      type: object
      required: [space_id, name]
      additionalProperties: false
      properties:
        space_id: { type: string, format: uuid, description: 所在空间，即主空间 }
        name: { type: string, minLength: 1, maxLength: 80 }
        icon: { type: string, maxLength: 16 }
        description: { type: string, maxLength: 10000 }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        lead_user_id: { type: string, format: uuid }
    ProjectPatchRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 80 }
        icon: { type: [string, 'null'], maxLength: 16 }
        description: { type: string, maxLength: 10000 }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        lead_user_id: { type: [string, 'null'], format: uuid }
    ViewVisibility:
      type: string
      enum: [personal, space]
    ViewIconKind:
      type: string
      enum: [icon, emoji, upload]
    UploadedIcon:
      type: object
      required: [id, url, content_type, size_bytes]
      properties:
        id: { type: string, format: uuid, description: 视图 icon 字段（icon_kind = upload）使用的值 }
        url: { type: string, description: "浏览器可直接使用的地址，形如 /api/v1/organizations/{org}/icons/{id}" }
        content_type: { type: string }
        size_bytes: { type: integer }
    View:
      type: object
      required: [id, space_id, name, description, icon_kind, icon, icon_url, visibility, filters, display, created_by, created_at, updated_at, pinned, position, member_view_mode, can_edit, version]
      properties:
        id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        icon_kind: { oneOf: [{ $ref: '#/components/schemas/ViewIconKind' }, { type: 'null' }] }
        icon: { type: [string, 'null'], description: 内置图标名 / 表情 / 上传图标 ID（随 icon_kind） }
        icon_url: { type: [string, 'null'], description: icon_kind = upload 时的图片地址（含 /api 前缀，浏览器可直接使用） }
        visibility: { $ref: '#/components/schemas/ViewVisibility' }
        filters: { type: object, additionalProperties: true, description: 任务列表的查询参数（同名同义，值为字符串或字符串数组） }
        display: { type: object, additionalProperties: true, description: 显示设置（与任务列表的显示设置结构一致） }
        created_by:
          type: object
          required: [id, email]
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        pinned: { type: boolean, description: 本人偏好 }
        position: { type: [integer, 'null'], description: 本人排序位置 }
        member_view_mode: { type: [string, 'null'], enum: [list, board, table, null], description: 本人展示方式 }
        can_edit: { type: boolean, description: 当前用户能否修改 / 删除 }
        version: { type: integer }
    ViewCreateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        visibility: { $ref: '#/components/schemas/ViewVisibility' }
        icon_kind: { $ref: '#/components/schemas/ViewIconKind' }
        icon: { type: string, description: 内置图标名 / 表情 / 上传图标 ID（随 icon_kind） }
        filters: { type: object, additionalProperties: true }
        display: { type: object, additionalProperties: true }
    ViewPatchRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        visibility: { $ref: '#/components/schemas/ViewVisibility' }
        icon_kind: { type: [string, 'null'], enum: [icon, emoji, upload, null], description: 出现即整体替换图标；null 清除图标 }
        icon: { type: string }
        filters: { type: object, additionalProperties: true }
        display: { type: object, additionalProperties: true }
    # ===== /专项与视图 schemas =====

    # ===== 分拣台 schemas =====
    TriageMember:
      type: object
      required: [id, email]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
    TriageCondition:
      type: object
      required: [field, op, values]
      additionalProperties: false
      properties:
        field: { type: string, enum: [source, priority, type, creator, assignee, crew, label, content, due_date, project, iteration], description: 与任务筛选对齐；新任务进入分拣时还没有关联，因此没有关联条件 }
        op: { type: string, enum: [is, is_not, has_any, has_all, has_none, contains, not_contains, starts_with, ends_with, exactly, before, after, between, none] }
        values: { type: array, maxItems: 20, items: { type: string } }
    TriageConditionGroup:
      type: object
      required: [conditions]
      additionalProperties: false
      properties:
        conditions: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/TriageCondition' } }
    TriageAction:
      type: object
      required: [type, value]
      additionalProperties: false
      properties:
        type: { type: string, enum: [move_space, set_status, assign, add_labels, set_project, set_priority] }
        value:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
    TriageRule:
      type: object
      required: [id, space_id, name, position, enabled, conditions, actions, last_used_at, version]
      properties:
        id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        name: { type: string }
        position: { type: integer, minimum: 0 }
        enabled: { type: boolean }
        conditions: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/TriageConditionGroup' } }
        actions: { type: array, minItems: 1, items: { $ref: '#/components/schemas/TriageAction' } }
        last_used_at: { type: [string, 'null'], format: date-time }
        version: { type: integer, minimum: 1 }
    TriageRuleCreateRequest:
      type: object
      required: [name, conditions, actions]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        enabled: { type: boolean, default: true }
        conditions: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/TriageConditionGroup' } }
        actions: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/TriageAction' } }
    TriageRulePatchRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 80 }
        enabled: { type: boolean }
        conditions: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/TriageConditionGroup' } }
        actions: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/TriageAction' } }
    TriageSettings:
      type: object
      required: [enabled, require_priority, action, members, rules, can_manage, version]
      properties:
        enabled: { type: boolean }
        require_priority: { type: boolean }
        action: { type: string, enum: [none, notify, assign] }
        members: { type: array, items: { $ref: '#/components/schemas/TriageMember' } }
        rules: { type: array, items: { $ref: '#/components/schemas/TriageRule' } }
        can_manage: { type: boolean }
        version: { type: integer, minimum: 1 }
    TriageSettingsPatch:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1 }
        enabled: { type: boolean }
        require_priority: { type: boolean }
        action: { type: string, enum: [none, notify, assign] }
    TriageTask:
      allOf:
        - $ref: '#/components/schemas/Task'
        - type: object
          required: [triage]
          properties:
            triage:
              type: object
              required: [entered_at, source, snoozed_until, creator]
              properties:
                entered_at: { type: string, format: date-time }
                source: { type: string, enum: [member, guest, agent, integration] }
                snoozed_until: { type: [string, 'null'], format: date-time }
                creator:
                  type: object
                  required: [id, email]
                  description: 创建者；来源见 source
                  properties:
                    id: { type: string, format: uuid }
                    email: { type: string }
    TriageTaskPage:
      type: object
      required: [tasks, next_cursor, total]
      properties:
        tasks: { type: array, items: { $ref: '#/components/schemas/TriageTask' } }
        next_cursor: { type: string }
        total: { type: integer, minimum: 0 }
    TriageAcceptRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1 }
        status_id: { type: string, format: uuid }
        field_values: { type: object, maxProperties: 100, additionalProperties: true }
        project_id: { type: [string, 'null'], format: uuid }
        iteration_id: { type: [string, 'null'], format: uuid }
        estimate: { type: [number, 'null'], minimum: 0, maximum: 1000000000 }
        start_date: { type: [string, 'null'], format: date }
        due_date: { type: [string, 'null'], format: date }
        assignees: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/TaskAssigneeRef' } }
        assignee_ids: { type: array, maxItems: 10, items: { type: string, format: uuid } }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        label_ids: { type: array, maxItems: 20, items: { type: string, format: uuid } }
        subscribe: { type: boolean, description: true 时关注；false 不因本次处理或评论新增关注，已有关注不变；未传时保留评论自动关注 }
        comment: { type: string, maxLength: 10000 }
    TriageDecisionRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1 }
        subscribe: { type: boolean, description: true 时关注；false 不因本次处理或评论新增关注，已有关注不变；未传时保留评论自动关注 }
        comment: { type: string, maxLength: 10000 }
    TriageDuplicateRequest:
      type: object
      required: [version, duplicate_of_task_id]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1 }
        duplicate_of_task_id: { type: string, format: uuid }
        subscribe: { type: boolean, description: true 时关注；false 不因本次处理或评论新增关注，已有关注不变；未传时保留评论自动关注 }
        comment: { type: string, maxLength: 10000 }
    # ===== /分拣台 schemas =====
