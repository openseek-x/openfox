  "schemas": {
    "WorkspaceProposal": {
      "type": "object",
      "required": [
        "id",
        "conversation_id",
        "run_id",
        "source",
        "base",
        "size_bytes",
        "sha256",
        "summary",
        "status",
        "version",
        "created_by",
        "created_at"
      ],
      "properties": {
        "id": {
          "type": "string",
          "format": "uuid"
        },
        "conversation_id": {
          "type": "string",
          "format": "uuid"
        },
        "run_id": {
          "type": "string",
          "format": "uuid"
        },
        "context_id": {
          "type": "string",
          "format": "uuid"
        },
        "source": {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "id",
            "sha256",
            "comments"
          ],
          "properties": {
            "id": {
              "type": "string",
              "format": "uuid"
            },
            "artifact_id": {
              "type": "string",
              "format": "uuid"
            },
            "space_id": {
              "type": "string",
              "format": "uuid"
            },
            "node_id": {
              "type": "string",
              "format": "uuid"
            },
            "node_version": {
              "type": "integer",
              "minimum": 1
            },
            "sha256": {
              "type": "string",
              "pattern": "^[a-f0-9]{64}$"
            },
            "comments": {
              "type": "array",
              "minItems": 0,
              "maxItems": 20,
              "items": {
                "$ref": "./artifact-reviews.yaml#/schemas/FileComment"
              }
            }
          }
        },
        "base": {
          "$ref": "./artifact-reviews.yaml#/schemas/ArtifactReviewFile"
        },
        "size_bytes": {
          "type": "integer"
        },
        "sha256": {
          "type": "string"
        },
        "summary": {
          "type": "string"
        },
