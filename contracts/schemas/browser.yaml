                                {
                                  "$ref": "../openapi.yaml#/components/schemas/ErrorResponse",
                                },
                            },
                        },
                    },
                  "403":
                    {
                      "description": "Run authorization revoked or access denied",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "$ref": "../openapi.yaml#/components/schemas/ErrorResponse",
                                },
                            },
                        },
                    },
                  "404":
                    {
                      "description": "Binding or object unavailable; does not distinguish missing, expired or foreign objects",
                      "content":
                        {
                          "application/json":
