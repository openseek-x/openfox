      "authorize":
        {
          "post":
            {
              "operationId": "authorizeBrowserRun",
              "description": "Device bearer authentication. Check on every tool call: RUNNING state, live Run and binding leases, generation, current grants, physical device owner equals actor, conversation identity, and all input messages are authenticated user inputs by that actor. Automation inputs are rejected. Optional client_message_id must belong to this Run. READ_ONLY/PLAN permits observe only. Returns metadata only; local explicit control grant and target checks are still required. No page contents or form values are accepted here. JSON bodies are limited to 512 KiB and unknown fields are rejected. No-store for secrets and authorization results. No automatic mutation retry.",
              "parameters":
                [
                  {
                    "name": "organizationID",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string", "format": "uuid" },
                  },
                  {
                    "name": "runID",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string", "format": "uuid" },
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "Success; browser page traffic never passes through this API.",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
