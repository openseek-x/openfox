  "schemas":
    {
      "BrowserBinding":
        {
          "type": "object",
          "additionalProperties": false,
          "required":
            [
              "id",
              "organization_id",
              "conversation_id",
              "owner_user_id",
              "device_id",
              "host_instance_id",
              "host_epoch",
              "revision",
              "lease_expires_at",
            ],
          "properties":
            {
              "id": { "type": "string", "format": "uuid" },
              "organization_id": { "type": "string", "format": "uuid" },
              "conversation_id": { "type": "string", "format": "uuid" },
              "owner_user_id": { "type": "string", "format": "uuid" },
              "device_id": { "type": "string", "format": "uuid" },
              "host_instance_id": { "type": "string", "format": "uuid" },
              "host_epoch": { "type": "integer", "minimum": 1 },
              "revision": { "type": "integer", "minimum": 1 },
              "lease_expires_at": { "type": "string", "format": "date-time" },
            },
        },
      "BrowserBindingCreate":
        {
          "type": "object",
          "additionalProperties": false,
          "required": ["device_id", "host_instance_id", "host_epoch"],
          "properties":
            {
              "device_id": { "type": "string", "format": "uuid" },
              "host_instance_id": { "type": "string", "format": "uuid" },
              "host_epoch": { "type": "integer", "minimum": 1 },
              "replace": { "type": "boolean", "default": false },
            },
        },
      "BrowserBindingCreated":
        {
          "type": "object",
          "additionalProperties": false,
          "required":
            [
              "id",
              "organization_id",
              "conversation_id",
              "owner_user_id",
              "device_id",
              "host_instance_id",
              "host_epoch",
              "revision",
              "lease_expires_at",
              "claim_secret",
            ],
          "properties":
            {
              "id": { "type": "string", "format": "uuid" },
              "organization_id": { "type": "string", "format": "uuid" },
              "conversation_id": { "type": "string", "format": "uuid" },
              "owner_user_id": { "type": "string", "format": "uuid" },
              "device_id": { "type": "string", "format": "uuid" },
              "host_instance_id": { "type": "string", "format": "uuid" },
              "host_epoch": { "type": "integer", "minimum": 1 },
              "revision": { "type": "integer", "minimum": 1 },
              "lease_expires_at": { "type": "string", "format": "date-time" },
              "claim_secret":
                {
                  "type": "string",
                  "pattern": "^[a-f0-9]{64}$",
                  "description": "One-time secret: trusted desktop main process and private local socket only. Never expose to renderer, URLs or logs. 60 second expiry.",
                },
            },
        },
      "BrowserBindingClaim":
        {
          "type": "object",
          "additionalProperties": false,
          "required":
            ["host_instance_id", "host_epoch", "revision", "claim_secret"],
          "properties":
            {
              "host_instance_id": { "type": "string", "format": "uuid" },
              "host_epoch": { "type": "integer", "minimum": 1 },
              "revision": { "type": "integer", "minimum": 1 },
              "claim_secret": { "type": "string", "pattern": "^[a-f0-9]{64}$" },
            },
        },
      "BrowserBindingIdentity":
        {
          "type": "object",
          "additionalProperties": false,
          "required": ["host_instance_id", "host_epoch", "revision"],
          "properties":
            {
              "host_instance_id": { "type": "string", "format": "uuid" },
              "host_epoch": { "type": "integer", "minimum": 1 },
              "revision": { "type": "integer", "minimum": 1 },
            },
        },
      "BrowserRunAuthorizationInput":
        {
          "type": "object",
          "additionalProperties": false,
          "required":
            [
              "host_instance_id",
              "host_epoch",
              "revision",
              "binding_id",
              "generation",
              "operation",
            ],
          "properties":
            {
              "host_instance_id": { "type": "string", "format": "uuid" },
              "host_epoch": { "type": "integer", "minimum": 1 },
              "revision": { "type": "integer", "minimum": 1 },
              "binding_id": { "type": "string", "format": "uuid" },
              "generation": { "type": "integer", "minimum": 1 },
              "client_message_id": { "type": "string", "format": "uuid" },
              "operation":
                { "type": "string", "enum": ["observe", "act", "files"] },
            },
        },
      "BrowserRunAuthorization":
        {
          "type": "object",
          "additionalProperties": false,
          "required": ["binding", "run_id", "generation", "read_only"],
          "properties":
            {
              "binding": { "$ref": "#/schemas/BrowserBinding" },
              "run_id": { "type": "string", "format": "uuid" },
              "generation": { "type": "integer", "minimum": 1 },
              "read_only": { "type": "boolean" },
            },
        },
    },
}
