  "paths":
    {
      "create":
        {
          "post":
            {
              "operationId": "createBrowserBinding",
              "description": "User session + CSRF. Requires current conversation invocation access and physical device ownership; administrator privileges do not substitute for ownership. One binding per organization/conversation/owner/device. A live binding returns 409 unless replace=true; replacing changes its ID/revision and invalidates the previous host. Pending claim expires in 60 seconds. JSON bodies are limited to 512 KiB and unknown fields are rejected. No-store for secrets and authorization results. No automatic mutation retry.",
              "parameters":
                [
                  {
                    "name": "organizationID",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string", "format": "uuid" },
                  },
                  {
                    "name": "conversationID",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string", "format": "uuid" },
                  },
                ],
              "responses":
                {
                  "201":
                    {
                      "description": "Success; browser page traffic never passes through this API.",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/schemas/BrowserBindingCreated" },
                            },
                        },
                    },
                  "400":
                    {
                      "description": "Invalid request",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "$ref": "../openapi.yaml#/components/schemas/ErrorResponse",
                                },
                            },
                        },
                    },
                  "401":
                    {
                      "description": "Authentication required",
                      "content":
                        {
                          "application/json":
                            {
