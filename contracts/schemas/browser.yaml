      "heartbeat":
        {
          "post":
            {
              "operationId": "heartbeatBrowserBinding",
              "description": "Device bearer authentication. Renew every 10 seconds, extending an unexpired active lease to 30 seconds. Checks host instance, epoch, revision and owner access. Expired or replaced bindings cannot be resurrected. JSON bodies are limited to 512 KiB and unknown fields are rejected. No-store for secrets and authorization results. No automatic mutation retry.",
              "parameters":
                [
                  {
                    "name": "organizationID",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string", "format": "uuid" },
                  },
                  {
                    "name": "bindingID",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string", "format": "uuid" },
                  },
                ],
