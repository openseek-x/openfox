      "claim":
        {
          "post":
            {
              "operationId": "claimBrowserBinding",
              "description": "Device bearer authentication. Atomically consumes the claim hash for this device and host identity; concurrent/replayed/expired claims fail. A lost response is not replayed: reconnect with a new explicit replacement binding. Rechecks owner membership, device ownership and conversation permission. Active lease is 30 seconds. JSON bodies are limited to 512 KiB and unknown fields are rejected. No-store for secrets and authorization results. No automatic mutation retry.",
              "parameters":
                [
                  {
                    "name": "organizationID",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string", "format": "uuid" },
                  },
                  {
                    "name": "bindingID",
